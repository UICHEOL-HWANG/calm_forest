name: calm-forest-bi

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bi
      POSTGRES_PASSWORD: ${BI_DB_PASSWORD:?set BI_DB_PASSWORD in ~/calm_forest/.env}
      POSTGRES_DB: bi
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - bi-db:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bi -d bi"]
      interval: 5s
      retries: 20

  metabase:
    image: metabase/metabase:v0.64.8.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: bi
      MB_DB_PASS: ${BI_DB_PASSWORD}
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      JAVA_OPTS: "-Xmx1g"
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  bi-db:
