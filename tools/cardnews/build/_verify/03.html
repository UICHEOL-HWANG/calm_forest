<meta charset="utf-8"><link rel="stylesheet" href="../../templates/_base.css">
<style>
  .card{background:var(--cream)}
  .shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%}
  .scrim{position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(to top,#fdf6ea 0%,rgba(253,246,234,.93) 36%,rgba(253,246,234,0) 100%)}
  .txt{position:absolute;left:80px;right:180px;bottom:104px;color:#2b352e}
  .txt .headline{color:#2b352e;margin:20px 0 24px;text-shadow:none;font-size:92px}
  .txt .body{color:#6b7a70}
  .txt .eyebrow{color:#d4703c}
  .badge{position:absolute;top:64px;left:80px;display:flex;align-items:center;gap:13px;
    color:#2b352e;font-size:25px;font-weight:700;letter-spacing:.09em;
    background:rgba(253,246,234,.88);padding:12px 22px 12px 18px;border-radius:99px;}
  .dot{width:11px;height:11px;border-radius:99px;background:var(--accent)}
  .num{position:absolute;right:76px;bottom:96px;font-size:34px;font-weight:800;
    color:#2b352e;opacity:.30;letter-spacing:.02em}
</style>
<div class="card">
  <img class="shot" src="../../shots/village_dusk.png">
  <div class="scrim"></div>
  <div class="badge"><span class="dot"></span>캄포레스트</div>
  <div class="txt">
    <div class="eyebrow">설치 없음 · 무료</div>
    <div class="headline">calmforest.cloud</div>
    <div class="body">브라우저에서 바로.</div>
  </div>
  <div class="num">3 / 3</div>
</div>
