<meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  /* 비대칭: 사진은 오른쪽으로 밀어 위쪽, 타이포는 왼쪽 아래. 오른쪽 아래에 큰 여백 */
  .card{padding:76px 0 0 0;background:
    radial-gradient(1200px 700px at 78% 6%, #f3fbf1 0%, var(--cream) 62%)}
  .kicker{position:absolute;top:74px;left:78px;display:flex;align-items:center;gap:16px;
    font-size:26px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
  .dot{width:11px;height:11px;border-radius:99px;background:var(--accent)}
  .shotwrap{position:absolute;top:158px;left:112px;width:900px;height:520px;
    border-radius:34px;overflow:hidden;
    box-shadow:0 30px 60px -22px rgba(60,86,66,.34);
    border:1px solid rgba(43,53,46,.10)}
  .shotwrap img{width:100%;height:100%;object-fit:cover;object-position:52% 48%;display:block}
  .txt{position:absolute;left:78px;right:236px;top:756px}

  .foot{position:absolute;left:78px;bottom:70px}
  .num{position:absolute;right:78px;bottom:64px;font-size:120px;font-weight:800;

</style>
<div class="card">
  <div class="kicker"><span class="dot"></span>캄포레스트</div>
  <div class="shotwrap"><img src="../../../docs/beginner-guide/img/06_farm_water.jpg"></div>
  <div class="txt">
    <div class="eyebrow">퇴근하고 5분</div>
    <div class="headline">오늘 뭐 했는지<br>모르겠는 날</div>
    <div class="rule" style="margin:0 0 26px"></div>
    <div class="body">회사 일은 티가 안 난다.<br>밭은 물 준 만큼 자란다.</div>
  </div>
  <div class="foot">calmforest.cloud</div>
  <div class="num">01</div>
</div>
