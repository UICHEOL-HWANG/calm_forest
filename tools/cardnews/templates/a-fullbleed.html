<meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .card{background:var(--ink)}
  .shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:52% 46%}
  /* 하단 스크림 — 글로우 대신 배경 색조를 띤 그라디언트 */
  .scrim{position:absolute;left:0;right:0;bottom:0;height:62%;
    background:linear-gradient(to top,rgba(20,28,22,.94) 0%,rgba(20,28,22,.80) 34%,rgba(20,28,22,0) 100%)}
  .txt{position:absolute;left:82px;right:180px;bottom:96px;color:#fdf6ea}
  .txt .headline{color:#fdf6ea;margin:22px 0 26px}
  .txt .body{color:rgba(253,246,234,.74)}
  .txt .eyebrow{color:#f0a878}
  .badge{position:absolute;top:70px;left:82px;display:flex;align-items:center;gap:14px;
    color:rgba(253,246,234,.9);font-size:26px;font-weight:700;letter-spacing:.08em}
  .dot{width:12px;height:12px;border-radius:99px;background:var(--accent)}
</style>
<div class="card">
  <img class="shot" src="../../../docs/beginner-guide/img/06_farm_water.jpg">
  <div class="scrim"></div>
  <div class="badge"><span class="dot"></span>캄포레스트</div>
  <div class="txt">
    <div class="eyebrow">퇴근하고 5분</div>
    <div class="headline">오늘 뭐 했는지<br>모르겠는 날</div>
    <div class="body">회사 일은 티가 안 난다.<br>밭은 물 준 만큼 자란다.</div>
  </div>
</div>
