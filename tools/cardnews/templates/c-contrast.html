<meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  /* 대비형 — 세로 카드라 좌우(540px)보다 상하 분할이 읽힌다. 위=회사, 아래=숲 */
  .top{position:absolute;top:0;left:0;right:0;height:614px;background:#252c28;
    padding:92px 82px 0 82px;color:#e9ece9}
  .top .label{font-size:26px;font-weight:700;letter-spacing:.16em;color:#8b9790}
  .top .headline{font-size:88px;margin:30px 0 0;color:#f1f3f0}
  .top .sub{font-size:36px;font-weight:500;line-height:1.6;color:#98a49d;margin-top:28px}
  .bot{position:absolute;top:614px;left:0;right:0;bottom:0}
  .bot img{width:100%;height:100%;object-fit:cover;object-position:52% 44%}
  .botscrim{position:absolute;inset:0;
    background:linear-gradient(to top,rgba(24,34,26,.90) 0%,rgba(24,34,26,.34) 46%,rgba(24,34,26,0) 78%)}
  .bottxt{position:absolute;left:82px;right:200px;bottom:78px;color:#fdf6ea}
  .bottxt .label{font-size:26px;font-weight:700;letter-spacing:.16em;color:#f0a878}
  .bottxt .headline{font-size:88px;margin-top:26px;color:#fdf6ea}
  /* 이음새 — 오렌지 선 한 줄이 두 세계를 가른다 */
  .seam{position:absolute;top:610px;left:82px;width:150px;height:8px;
    background:var(--accent);border-radius:99px;z-index:3}
  .brand{position:absolute;top:92px;right:82px;font-size:24px;font-weight:700;
    letter-spacing:.1em;color:#8b9790}
</style>
<div class="card">
  <div class="top">
    <div class="label">회사</div>
    <div class="headline">오늘 뭐 했는지<br>모르겠는 날</div>
    <div class="sub">회의 세 번, 남은 건 회의록 세 개.</div>
  </div>
  <div class="brand">캄포레스트</div>
  <div class="seam"></div>
  <div class="bot">
    <img src="../../../docs/beginner-guide/img/06_farm_water.jpg"><div class="botscrim"></div>
    <div class="bottxt">
      <div class="label">숲</div>
      <div class="headline">물 준 만큼<br>자란다</div>
    </div>
  </div>
</div>
