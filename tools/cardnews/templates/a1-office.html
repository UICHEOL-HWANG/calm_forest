<meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .card{background:var(--ink)}
  .shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  /* 스크림은 글자가 앉는 아래쪽에만. 게임 화면을 탁하게 만들지 않는다 */
  .scrim{position:absolute;left:0;right:0;bottom:0;height:46%;
    background:linear-gradient(to top,rgba(14,18,16,.90) 0%,rgba(14,18,16,.55) 40%,rgba(14,18,16,0) 100%)}
  .txt{position:absolute;left:80px;right:170px;bottom:104px;color:#fdf6ea}
  .txt .headline{color:#fdf6ea;margin:20px 0 24px;text-shadow:0 2px 18px rgba(10,14,12,.45)}
  .txt .body{color:rgba(253,246,234,.80)}
  .txt .eyebrow{color:#f0a878}
  .badge{position:absolute;top:64px;left:80px;display:flex;align-items:center;gap:13px;
    color:rgba(253,246,234,.92);font-size:25px;font-weight:700;letter-spacing:.09em;
    text-shadow:0 2px 14px rgba(10,14,12,.6)}
  .dot{width:11px;height:11px;border-radius:99px;background:var(--accent)}
</style>
<div class="card">
  <img class="shot" src="../shots/city_slump.png">
  <div class="scrim"></div>
  <div class="badge"><span class="dot"></span>캄포레스트</div>
  <div class="txt">
    <div class="eyebrow">퇴근하고 5분</div>
    <div class="headline">오늘 뭐 했는지<br>모르겠는 날</div>
    <div class="body">회의 세 번, 남은 건 회의록 세 개.</div>
  </div>
</div>
