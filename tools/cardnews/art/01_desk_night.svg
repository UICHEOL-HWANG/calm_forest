<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <!-- 밤 사무실 책상. 평면 벡터, 사람 없음. 팔레트는 게임 토큰(_base.css)에서 가져왔다. -->
  <defs>
    <clipPath id="pane"><rect x="596" y="150" width="404" height="430" rx="6"/></clipPath>
  </defs>

  <rect width="1080" height="1350" fill="#1e241f"/>
  <!-- 벽 -->
  <rect x="0" y="0" width="1080" height="812" fill="#252c28"/>

  <!-- 창문: 건너편 건물의 불 켜진 창들. 아직 아무도 안 갔다 -->
  <rect x="596" y="150" width="404" height="430" rx="6" fill="#161b1e"/>
  <g clip-path="url(#pane)">
    <rect x="620" y="196" width="150" height="380" fill="#1c2329"/>
    <rect x="800" y="240" width="176" height="336" fill="#1a2126"/>
    <g fill="#e6d5a4">
      <rect x="646" y="228" width="38" height="27"/><rect x="712" y="228" width="38" height="27"/>
      <rect x="646" y="316" width="38" height="27"/><rect x="712" y="404" width="38" height="27"/>
      <rect x="828" y="284" width="42" height="29"/><rect x="906" y="372" width="42" height="29"/>
      <rect x="828" y="460" width="42" height="29"/>
    </g>
    <g fill="#a8c4d2">
      <rect x="712" y="316" width="38" height="27"/><rect x="646" y="492" width="38" height="27"/>
      <rect x="906" y="284" width="42" height="29"/><rect x="828" y="372" width="42" height="29"/>
    </g>
  </g>
  <!-- 창틀 -->
  <g stroke="#2f3833" stroke-width="9" fill="none">
    <rect x="596" y="150" width="404" height="430" rx="6"/><path d="M798 150v430M596 365h404"/>
  </g>

  <!-- 모니터가 흘리는 빛. 글로우가 아니라 책상에 떨어지는 광량이다 -->
  <path d="M300 712 L742 712 L860 812 L182 812 Z" fill="#fdf6ea" opacity=".055"/>

  <!-- 모니터 -->
  <rect x="286" y="392" width="440" height="288" rx="10" fill="#313832"/>
  <rect x="300" y="406" width="412" height="260" rx="5" fill="#fdf6ea"/>
  <!-- 빈 문서: 제목 줄 하나, 그 아래는 아무것도 없다 -->
  <rect x="330" y="440" width="150" height="11" rx="5" fill="#c9d0c8"/>
  <rect x="330" y="478" width="2" height="26" fill="#d4703c"/>
  <rect x="286" y="680" width="440" height="14" rx="4" fill="#272d28"/>
  <rect x="472" y="694" width="68" height="46" fill="#2b322c"/>
  <rect x="424" y="740" width="164" height="14" rx="7" fill="#313832"/>

  <!-- 책상 -->
  <rect x="-20" y="754" width="1120" height="58" fill="#3d443b"/>
  <rect x="-20" y="812" width="1120" height="538" fill="#2a302b"/>

  <!-- 키보드 -->
  <rect x="332" y="770" width="290" height="30" rx="6" fill="#353c36"/>
  <rect x="348" y="780" width="258" height="11" rx="4" fill="#2b322c"/>

  <!-- 식은 종이컵 -->
  <path d="M786 700 L858 700 L848 772 L796 772 Z" fill="#e8ded0"/>
  <rect x="782" y="692" width="80" height="15" rx="7" fill="#d4703c"/>

  <!-- 뒤로 밀린 의자 등받이 -->
  <rect x="112" y="852" width="238" height="212" rx="26" fill="#232923"/>
  <rect x="206" y="1064" width="34" height="120" fill="#1f251f"/>

  <!-- 서류 한 장 -->
  <rect x="640" y="792" width="196" height="14" rx="3" fill="#333a33" transform="rotate(-4 738 799)"/>
</svg>
