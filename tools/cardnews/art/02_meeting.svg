<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <!-- 끝난 회의실 테이블, 직부감. 평면 벡터, 사람 없음. 팔레트는 01_desk_night.svg 와 동일. -->

  <rect width="1080" height="1350" fill="#1e241f"/>
  <!-- 카펫 타일 이음선 -->
  <g stroke="#232923" stroke-width="3">
    <path d="M0 264 H1080 M0 636 H1080 M0 1008 H1080 M164 0 V1350 M916 0 V1350"/>
  </g>

  <!-- 의자 6개. 좌판은 테이블 밑으로 반쯤 들어가고 등받이만 밖에 나와 있다 -->
  <g>
    <g fill="#272d28">
      <rect x="150" y="212" width="120" height="120" rx="12"/>
      <rect x="150" y="438" width="120" height="120" rx="12"/>
      <rect x="150" y="664" width="120" height="120" rx="12"/>
      <rect x="810" y="212" width="120" height="120" rx="12"/>
      <rect x="810" y="438" width="120" height="120" rx="12"/>
      <rect x="810" y="664" width="120" height="120" rx="12"/>
    </g>
    <g fill="#202621">
      <rect x="112" y="222" width="34" height="100" rx="15"/>
      <rect x="112" y="448" width="34" height="100" rx="15"/>
      <rect x="112" y="674" width="34" height="100" rx="15"/>
      <rect x="934" y="222" width="34" height="100" rx="15"/>
      <rect x="934" y="448" width="34" height="100" rx="15"/>
      <rect x="934" y="674" width="34" height="100" rx="15"/>
    </g>
  </g>

  <!-- 테이블 -->
  <rect x="216" y="124" width="648" height="750" rx="16" fill="#3d443b"/>
  <rect x="216" y="124" width="648" height="750" rx="16" fill="none" stroke="#474f45" stroke-width="4"/>

  <!-- 닫힌 노트북 두 대. 위에서 보면 뚜껑 면 + 앞쪽 여는 홈이다 -->
  <g>
    <rect x="296" y="252" width="252" height="176" rx="10" fill="#171c18" opacity=".55"/>
    <rect x="288" y="244" width="252" height="176" rx="10" fill="#2f362f"/>
    <rect x="288" y="384" width="252" height="36" rx="10" fill="#252b25"/>
    <rect x="382" y="404" width="64" height="12" rx="6" fill="#1b201b"/>
    <circle cx="414" cy="318" r="19" fill="#39413a"/>
  </g>
  <g>
    <rect x="564" y="562" width="252" height="176" rx="10" fill="#171c18" opacity=".55"/>
    <rect x="556" y="554" width="252" height="176" rx="10" fill="#2f362f"/>
    <rect x="556" y="694" width="252" height="36" rx="10" fill="#252b25"/>
    <rect x="650" y="714" width="64" height="12" rx="6" fill="#1b201b"/>
    <circle cx="682" cy="628" r="19" fill="#39413a"/>
  </g>

  <!-- 식은 커피 세 잔 -->
  <g>
    <circle cx="646" cy="286" r="46" fill="#e8ded0"/><circle cx="646" cy="286" r="34" fill="#2a2420"/>
    <circle cx="356" cy="628" r="46" fill="#e8ded0"/><circle cx="356" cy="628" r="34" fill="#2a2420"/>
    <!-- 한 잔만 색이 있다 -->
    <circle cx="762" cy="404" r="46" fill="#d4703c"/><circle cx="762" cy="404" r="34" fill="#2a2420"/>
  </g>

  <!-- 뚜껑 열린 보드마카. 뚜껑은 저만치 떨어져 있다 -->
  <g transform="rotate(-8 470 486)">
    <rect x="378" y="472" width="184" height="30" rx="15" fill="#e8ded0"/>
    <rect x="378" y="472" width="42" height="30" rx="15" fill="#b9c1b8"/>
    <rect x="546" y="479" width="22" height="16" rx="8" fill="#9aa398"/>
  </g>
  <rect x="618" y="470" width="60" height="30" rx="15" fill="#c9d0c8" transform="rotate(16 648 485)"/>

  <!-- 아무것도 안 적힌 포스트잇 -->
  <g fill="#e6d5a4">
    <rect x="300" y="756" width="96" height="96" rx="3" transform="rotate(-7 348 804)"/>
    <rect x="422" y="770" width="96" height="96" rx="3" transform="rotate(5 470 818)"/>
  </g>
  <rect x="688" y="176" width="96" height="96" rx="3" fill="#c9d0c8" opacity=".5" transform="rotate(-3 736 224)"/>

  <!-- 천장 조명이 테이블에 떨어지는 광량 -->
  <rect x="216" y="124" width="648" height="750" rx="16" fill="#fdf6ea" opacity=".04"/>
</svg>
