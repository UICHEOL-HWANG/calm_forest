<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <!-- 막차 지하철 안. 평면 벡터, 사람 없음. -->
  <defs>
    <clipPath id="win"><rect x="120" y="330" width="840" height="212" rx="10"/></clipPath>
  </defs>

  <rect width="1080" height="1350" fill="#1a1f1c"/>

  <!-- 천장. 형광등은 배지(좌상단)를 피해서 아래로 내렸다 -->
  <rect x="0" y="0" width="1080" height="196" fill="#252c28"/>
  <rect x="160" y="140" width="760" height="26" rx="13" fill="#fdf6ea" opacity=".8"/>
  <rect x="0" y="196" width="1080" height="24" fill="#fdf6ea" opacity=".05"/>

  <!-- 벽 -->
  <rect x="0" y="196" width="1080" height="668" fill="#232a26"/>

  <!-- 창문: 터널이라 밖이 없다. 천장등만 되비친다 -->
  <rect x="120" y="330" width="840" height="212" rx="10" fill="#161b1e"/>
  <g clip-path="url(#win)">
    <rect x="150" y="392" width="780" height="12" rx="6" fill="#a8c4d2" opacity=".28"/>
    <rect x="150" y="418" width="780" height="4" rx="2" fill="#a8c4d2" opacity=".10"/>
    <path d="M654 330 L790 330 L706 542 L570 542 Z" fill="#a8c4d2" opacity=".045"/>
  </g>
  <rect x="120" y="330" width="840" height="212" rx="10" fill="none" stroke="#2b322c" stroke-width="7"/>
  <rect x="536" y="330" width="9" height="212" fill="#2b322c"/>

  <!-- 손잡이 한 줄. 아무도 안 잡아서 전부 같은 각도로 서 있다 -->
  <g fill="#313832">
    <rect x="186" y="220" width="7" height="80"/><rect x="356" y="220" width="7" height="80"/>
    <rect x="526" y="220" width="7" height="80"/><rect x="696" y="220" width="7" height="80"/>
    <rect x="866" y="220" width="7" height="80"/>
  </g>
  <g fill="none" stroke="#c9d0c8" stroke-width="9">
    <rect x="166" y="294" width="48" height="58" rx="24"/>
    <rect x="336" y="294" width="48" height="58" rx="24"/>
    <rect x="506" y="294" width="48" height="58" rx="24"/>
    <rect x="676" y="294" width="48" height="58" rx="24"/>
    <rect x="846" y="294" width="48" height="58" rx="24"/>
  </g>

  <!-- 세로 봉 -->
  <g fill="#3a423b">
    <rect x="122" y="196" width="12" height="676" rx="6"/>
    <rect x="1006" y="196" width="12" height="676" rx="6"/>
  </g>

  <!-- 빈 좌석 한 줄: 등받이 / 좌판 / 앞면 -->
  <rect x="140" y="600" width="720" height="84" rx="12" fill="#3a4642"/>
  <rect x="140" y="678" width="720" height="52" rx="10" fill="#48554f"/>
  <rect x="140" y="726" width="720" height="42" rx="8" fill="#2b3532"/>
  <g stroke="#2b3532" stroke-width="6">
    <path d="M260 606 V724 M380 606 V724 M500 606 V724 M620 606 V724 M740 606 V724"/>
  </g>
  <rect x="140" y="768" width="720" height="22" fill="#171c19" opacity=".75"/>

  <!-- 두고 내린 우산. 코너에 기대 세워져 있다 — 손잡이가 위, 끝이 바닥 -->
  <g transform="rotate(7 936 680)">
    <!-- 손잡이 갈고리 -->
    <path d="M936 556 q0 -34 -30 -34 q-22 0 -22 22 q0 20 22 20"
          fill="none" stroke="#d4703c" stroke-width="17" stroke-linecap="round"/>
    <!-- 대 -->
    <rect x="928" y="552" width="16" height="268" rx="8" fill="#2b322c"/>
    <!-- 접힌 천 -->
    <path d="M936 600 L964 632 L958 772 L914 772 L908 632 Z" fill="#313832"/>
    <rect x="906" y="676" width="60" height="13" rx="6" fill="#232a26"/>
    <!-- 끝 -->
    <path d="M928 818 L944 818 L936 846 Z" fill="#3a423b"/>
  </g>

  <!-- 바닥 -->
  <rect x="0" y="864" width="1080" height="486" fill="#202622"/>
  <rect x="0" y="864" width="1080" height="6" fill="#171c19"/>
</svg>
