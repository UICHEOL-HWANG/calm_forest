<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calm Forest Early Inconclusive Grid Only</title>
  <style>
    :root {
      --ink: #17201c;
      --muted: #657167;
      --line: #dce5dd;
      --paper: #fbfcf8;
      --green: #28745c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 1080px;
      height: 960px;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      letter-spacing: 0;
    }
    .page {
      width: 1080px;
      height: 960px;
      padding: 18px 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 16px;
    }
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 8px;
      min-height: 0;
    }
    .card-title {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: baseline;
      font-size: 23px;
      line-height: 1.2;
      font-weight: 850;
    }
    .card-title em {
      color: var(--green);
      font-style: normal;
    }
    .note {
      color: var(--muted);
      font-size: 14px;
      font-weight: 750;
      white-space: nowrap;
    }
    .chart {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #ffffff 0%, #fbfcfb 100%);
      overflow: hidden;
      border-radius: 6px;
    }
    .chart img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }
    .caption {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.3;
      font-weight: 800;
      padding: 0 2px 2px;
    }
  </style>
</head>
<body>
  <main class="page">
    <article class="card">
      <div class="card-title"><span>1. <em>무행동의 정체</em></span><span class="note">트래픽 혼합</span></div>
      <div class="chart"><img src="file:///Users/uicheol_hwang/calm_forest/ml/reports/figs/g_country_noaction.png" /></div>
      <div class="caption">“아무것도 안 했다”는 제품 문제와 잘못 들어온 트래픽이 섞인 값이었습니다.</div>
    </article>

    <article class="card">
      <div class="card-title"><span>2. <em>체류 시간이 너무 짧음</em></span><span class="note">원인 불명</span></div>
      <div class="chart"><img src="file:///Users/uicheol_hwang/calm_forest/ml/reports/figs/g_dwell_noaction.png" /></div>
      <div class="caption">5초 안에 떠난 기기는 로딩, 기기 문제, 유입 오류를 구분할 수 없었습니다.</div>
    </article>

    <article class="card">
      <div class="card-title"><span>3. <em>전환 경로가 약함</em></span><span class="note">게스트 해석</span></div>
      <div class="chart"><img src="file:///Users/uicheol_hwang/calm_forest/ml/reports/figs/g_conversion_path.png" /></div>
      <div class="caption">“게스트로 해보고 로그인”은 5대뿐이라 전환 가설을 강하게 말하기 어려웠습니다.</div>
    </article>

    <article class="card">
      <div class="card-title"><span>4. <em>배너 같은 안내문구가 안 뜸</em></span><span class="note">노출 조건</span></div>
      <div class="chart"><img src="file:///Users/uicheol_hwang/calm_forest/ml/reports/figs/g_nudge_funnel.png" /></div>
      <div class="caption">클릭 0건은 문구 실패라기보다, 안내문구가 뜨는 조건이 너무 좁았다는 신호에 가까웠습니다.</div>
    </article>
  </main>
</body>
</html>
