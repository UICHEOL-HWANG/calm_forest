# =============================================================
#  calm forest · pgs-auth Worker (Play Games authCode → Supabase 세션 교환)
#  ------------------------------------------------------------
#  배포: pgs-auth/ 에서 `npx wrangler deploy -c wrangler.toml` (절차는 README.md)
#  ⚠️ -c wrangler.toml 필수 — 없으면 루트 wrangler.jsonc(게임 본체)를 집어간다(toss-auth 와 같은 함정)
# =============================================================

name = "calmforest-pgs-auth"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true          # https://calmforest-pgs-auth.<서브도메인>.workers.dev

# ── 시크릿(코드에 넣지 말 것 — `npx wrangler secret put <이름> -c wrangler.toml`) ──
#   SUPABASE_SERVICE_KEY : service_role 키(유저 생성용 — 절대 클라이언트 노출 금지)
#   PGS_CLIENT_SECRET    : Play Games '게임 서버' OAuth 클라이언트 secret
#   PGS_USER_SECRET      : playerId → 파생 비밀번호용 HMAC 솔트
#                          ⚠️ 한 번 정하면 불변 — 바꾸면 기존 플레이 유저 로그인이 전부 깨짐

[vars]
# 공개값(브라우저·앱에도 그대로 나가는 값 — 시크릿 아님)
SUPABASE_URL = "https://zuyxgjfihxtfdpolljzw.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_4ii948uQwLP2_W9eIW7Qcg_hWuFON9t"
PGS_CLIENT_ID = "1003103780622-8l7nop9bgedmhc8eds1mlc3bv9v96chv.apps.googleusercontent.com"   # agriquant 웹 클라이언트 calm_forest — Play Games '게임 서버' 인증 정보로 연결(2026-09-25)

# ── 속도 제한 — IP 당 분당 20회(계정 대량 생성·구글 쿼터 소진 방지, 보안 리뷰 2026-09-25) ──
#   namespace_id 는 계정 안에서 고유한 임의 정수. 바인딩이 없으면 코드는 제한 없이 통과한다.
[[ratelimits]]
name = "PGS_LIMITER"
namespace_id = "2509"
  [ratelimits.simple]
  limit = 20
  period = 60

[observability]
enabled = true   # 실기기 실패 사유 추적용
