# =============================================================
#  calm forest · gc-auth Worker (게임센터 신원 서명 → Supabase 세션 교환)
#  ------------------------------------------------------------
#  배포: gc-auth/ 에서 `npx wrangler deploy -c wrangler.toml` (절차는 README.md)
#  ⚠️ -c wrangler.toml 필수 — 없으면 루트 wrangler.jsonc(게임 본체)를 집어간다(pgs-auth 와 같은 함정)
# =============================================================

name = "calmforest-gc-auth"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true          # https://calmforest-gc-auth.<서브도메인>.workers.dev

# ── 시크릿(코드에 넣지 말 것 — `npx wrangler secret put <이름> -c wrangler.toml`) ──
#   SUPABASE_SERVICE_KEY : service_role 키(유저 생성용 — 절대 클라이언트 노출 금지)
#   GC_USER_SECRET       : teamPlayerID → 파생 비밀번호용 HMAC 솔트
#                          ⚠️ 한 번 정하면 불변 — 바꾸면 기존 게임센터 유저 로그인이 전부 깨짐

[vars]
# 공개값(브라우저·앱에도 그대로 나가는 값 — 시크릿 아님)
SUPABASE_URL = "https://zuyxgjfihxtfdpolljzw.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_4ii948uQwLP2_W9eIW7Qcg_hWuFON9t"
GC_BUNDLE_ID = "com.cheorish.lab.calmforest"   # 이 앱이 서명한 신원만 받는다

# ── 속도 제한 — IP 당 분당 20회(계정 대량 생성 방지, pgs-auth 와 같은 값) ──
[[ratelimits]]
name = "GC_LIMITER"
namespace_id = "2510"
  [ratelimits.simple]
  limit = 20
  period = 60

[observability]
enabled = true   # 실기기 실패 사유 추적용
