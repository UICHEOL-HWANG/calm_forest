# =============================================================
#  calm forest · slackbot — Claude Agent SDK 슬랙봇 (uv 관리)
#  ------------------------------------------------------------
#  Slack 멘션/DM → Claude Agent SDK(Claude Code 하네스) → 답장.
#  오라클 VM에 systemd 로 상주. 실행: uv run python bot.py
# =============================================================
[project]
name = "calm-slackbot"
version = "0.1.0"
description = "Slack에서 Claude Agent(Claude Code 하네스)를 호출하는 개인 봇"
requires-python = ">=3.12"
dependencies = [
    "slack-bolt>=1.21",        # Socket Mode — 공인 포트 개방 불필요
    "aiohttp>=3.10",           # slack-bolt async 어댑터 요구
    "claude-agent-sdk>=0.1",   # Claude Code 하네스 (claude 바이너리 번들)
    "python-dotenv>=1.0",
]
