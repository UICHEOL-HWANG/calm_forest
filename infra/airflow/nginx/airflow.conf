# Airflow 실험실 — lab.calmforest.cloud (Cloudflare 프록시 뒤)
# 80: Flexible 모드 / 443(자체서명): Full 모드 — 존 SSL 설정 어느 쪽이든 동작
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name lab.calmforest.cloud _;

    ssl_certificate     /etc/nginx/certs/lab.crt;
    ssl_certificate_key /etc/nginx/certs/lab.key;

    real_ip_header CF-Connecting-IP;   # Cloudflare 뒤 실제 방문자 IP 복원

    # 🎯 이탈 예측 추론 — Airflow(8080)가 아니라 API(8100)로 보낸다
    location = /predict {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # 게임이 800ms 에 끊는다. 서버가 그보다 오래 붙들고 있을 이유가 없다.
        proxy_read_timeout 5s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
