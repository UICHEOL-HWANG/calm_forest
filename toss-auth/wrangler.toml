# =============================================================
#  calm forest · toss-auth Worker (앱인토스 토스 로그인 → Supabase 세션 교환)
#  ------------------------------------------------------------
#  배포: toss-auth/ 에서 `wrangler deploy` (절차는 README.md)
#  토스 파트너 API 는 mTLS(클라이언트 인증서)로 서버를 식별하므로
#  인증서를 업로드하고 아래 mtls_certificates 바인딩을 활성화해야 합니다.
# =============================================================

name = "calmforest-toss-auth"
main = "src/index.js"
compatibility_date = "2026-08-01"

# ── mTLS 클라이언트 인증서 바인딩 ──────────────────────────────
# 1) 앱인토스 콘솔에서 인증서 발급(토스 로그인 문서의 "mTLS 인증서 발급 방법")
# 2) wrangler mtls-certificate upload --cert cert.pem --key key.pem --name toss-partner
# 3) 출력된 certificate_id 로 아래 주석 해제:
# mtls_certificates = [
#   { binding = "TOSS_MTLS", certificate_id = "<업로드-후-발급된-UUID>" }
# ]

# ── 시크릿(코드에 넣지 말 것 — `wrangler secret put <이름>` 으로 등록) ──
#   SUPABASE_URL          : https://<프로젝트>.supabase.co
#   SUPABASE_SERVICE_KEY  : service_role 키(유저 생성용 — 절대 클라이언트 노출 금지)
#   SUPABASE_ANON_KEY     : publishable 키(비밀번호 로그인용)
#   TOSS_USER_SECRET      : 토스 userKey → 파생 비밀번호용 HMAC 솔트(임의의 긴 랜덤 문자열)

[vars]
# 허용 오리진(쉼표 구분) — 게임이 열리는 곳만
ALLOWED_ORIGINS = "https://calmforest.icuchoel.workers.dev,http://localhost:8000"
TOSS_API_BASE = "https://apps-in-toss-api.toss.im"
