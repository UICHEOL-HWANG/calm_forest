# =============================================================
#  calm forest · toss-auth Worker (앱인토스 게임 사용자 식별키 → Supabase 세션 교환)
#  ------------------------------------------------------------
#  배포: toss-auth/ 에서 `wrangler deploy` (절차는 README.md)
#  토스 파트너 API 는 mTLS(클라이언트 인증서)로 서버를 식별하므로
#  인증서를 업로드하고 아래 mtls_certificates 바인딩을 활성화해야 합니다.
# =============================================================

name = "calmforest-toss-auth"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true          # https://calmforest-toss-auth.<서브도메인>.workers.dev 로 노출

# ── mTLS 클라이언트 인증서 바인딩 ──────────────────────────────
#  인증서: CN=calmforest / 발급 Toss appsintoss Root CA / 만료 2027-09-29
#  (재발급 시 wrangler mtls-certificate upload 후 certificate_id 만 교체)
mtls_certificates = [
  { binding = "TOSS_MTLS", certificate_id = "a1a5ff8b-04f9-43d4-9e82-f173acc6c5c9" }
]

# ── 시크릿(코드에 넣지 말 것 — `wrangler secret put <이름>` 으로 등록) ──
#   SUPABASE_SERVICE_KEY  : service_role 키(유저 생성용 — 절대 클라이언트 노출 금지)
#   TOSS_USER_SECRET      : 토스 userKey → 파생 비밀번호용 HMAC 솔트(임의의 긴 랜덤 문자열)
#                           ⚠️ 한 번 정하면 불변 — 바꾸면 기존 토스 유저 로그인이 전부 깨짐

[vars]
# Supabase 공개값(브라우저에도 그대로 나가는 값이라 vars 로 둔다 — 시크릿 아님)
SUPABASE_URL = "https://zuyxgjfihxtfdpolljzw.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_4ii948uQwLP2_W9eIW7Qcg_hWuFON9t"

# CORS 는 모든 오리진 허용(src/index.js corsHeaders 주석 참고) — 허용 목록 없음
TOSS_API_BASE = "https://apps-in-toss-api.toss.im"

[observability]
enabled = true   # 실기기 실패 사유 추적용 — Cloudflare 대시보드 Logs 에 요청/console 보존
