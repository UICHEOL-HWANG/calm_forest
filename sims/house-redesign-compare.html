<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { bakeGroup, part, cloudBedParts } from '../js/dream/art.js';
import { PAL3 } from '../js/mirror/art.js';

const P = PAL3;
const R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
R.outputColorSpace = THREE.SRGBColorSpace; R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.05; R.setPixelRatio(1);

const LIGHT = {
  mirror: { bg: 0x2e2858, near: 26, far: 90, hemi: [0xb8c4ff, 0x3a3270, 0.95], amb: [0x8a90d8, 0.6], sun: [0xe8dcff, 1.0, [10, 22, 8]] },
  dream: { bg: 0xb89ad8, near: 28, far: 95, hemi: [0xe8dcff, 0x6a5aa8, 0.7], amb: [0x9a86d8, 0.55], sun: [0xffe6f5, 0.95, [-12, 22, 10]] },
};
function makeScene(kind) {
  const L = LIGHT[kind], s = new THREE.Scene();
  s.background = new THREE.Color(L.bg); s.fog = new THREE.Fog(L.bg, L.near, L.far);
  s.add(new THREE.HemisphereLight(L.hemi[0], L.hemi[1], L.hemi[2]));
  s.add(new THREE.AmbientLight(L.amb[0], L.amb[1]));
  const sun = new THREE.DirectionalLight(L.sun[0], L.sun[1]); sun.position.set(...L.sun[2]); s.add(sun);
  const pl = new THREE.PointLight(0xffb95e, 0.6, 16, 1.3); pl.position.set(0.5, 1.8, 3.8); s.add(pl);   // 게임의 플레이어 조명(집 앞에 선 모습)
  return s;
}
function bake(solid, glow) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(bakeGroup(solid), new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.85, side: THREE.DoubleSide })));
  g.add(new THREE.Mesh(bakeGroup(glow), new THREE.MeshBasicMaterial({ vertexColors: true })));
  return g;
}

// ── 조형 도구: 둥근 모서리·아치·곡선 지붕 ───────────────────
const B = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const Cy = (rt, rb, h, n = 12) => new THREE.CylinderGeometry(rt, rb, h, n);
const Sp = (r, a = 10, b = 8) => new THREE.SphereGeometry(r, a, b);
const Ico = (r) => new THREE.IcosahedronGeometry(r, 1);
const shade = (hex, k) => new THREE.Color(hex).multiplyScalar(k).getHex();
/** 모서리 둥근 상자 — 모든 벽·판·몰딩의 기본. 날 선 모서리가 "조잡함"의 주범이었다 */
const RB = (p, c, w, h, d, x, y, z, r = 0.07) => part(p, new RoundedBoxGeometry(w, h, d, 2, Math.min(r, w / 2 - 1e-3, h / 2 - 1e-3, d / 2 - 1e-3)), c, x, y, z);
/** 아치 판(문·창) — 바닥 y, 앞면 +z */
function arch(p, c, w, h, d, x, y, z, bev = 0.03) {
  const sh = new THREE.Shape(); const r = w / 2;
  sh.moveTo(-r, 0); sh.lineTo(-r, h - r); sh.absarc(0, h - r, r, Math.PI, 0, true); sh.lineTo(r, 0); sh.lineTo(-r, 0);
  return part(p, new THREE.ExtrudeGeometry(sh, { depth: d, bevelEnabled: true, bevelSize: bev, bevelThickness: bev, bevelSegments: 1, curveSegments: 10 }), c, x, y, z);
}
/** 회전체 지붕 — 끝이 살짝 들린 처마 곡선(원뿔의 직선 실루엣 대신) */
function lathe(p, c, r, h, seg, x, y, z, flare = true) {
  const pts = flare
    ? [[0.001, h], [0.26 * r, 0.7 * h], [0.6 * r, 0.34 * h], [0.9 * r, 0.1 * h], [r, 0.07 * h], [0.97 * r, -0.08 * h], [0.001, -0.08 * h]]
    : [[0.001, h], [0.5 * r, 0.8 * h], [0.85 * r, 0.45 * h], [r, 0.12 * h], [r, -0.06 * h], [0.001, -0.06 * h]];
  return part(p, new THREE.LatheGeometry(pts.map(([a, b]) => new THREE.Vector2(a, b)), seg), c, x, y, z);
}
/** 두꺼운 박공 지붕 — 압출한 지붕 판 + 처마 판(fascia) + 기와 단 + 용마루. 능선이 x */
function gableRoof(p, color, trim, len, hw, rise, t, y0) {
  const sh = new THREE.Shape(); sh.moveTo(-hw, 0); sh.lineTo(0, rise); sh.lineTo(hw, 0); sh.lineTo(hw, -t); sh.lineTo(0, rise - t); sh.lineTo(-hw, -t);
  const g = new THREE.ExtrudeGeometry(sh, { depth: len, bevelEnabled: true, bevelSize: 0.05, bevelThickness: 0.05, bevelSegments: 1 }); g.translate(0, 0, -len / 2);
  part(p, g, color, 0, y0, 0).rotation.y = Math.PI / 2;
  const a = Math.atan2(rise, hw), dk = shade(color, 0.82);
  for (const s of [-1, 1]) {
    RB(p, trim, len + 0.12, 0.13, 0.16, 0, y0 - 0.02, s * (hw + 0.03), 0.05);
    for (let k = 1; k <= 3; k++) { const f = k / 4; const b = RB(p, dk, len - 0.06, 0.05, 0.1, 0, y0 + rise * f + 0.05, s * hw * (1 - f), 0.02); b.rotation.x = s * a; }
  }

}
function gableEnd(p, color, x, hw, rise, t, y0) {
  const sh = new THREE.Shape(); sh.moveTo(-hw, 0); sh.lineTo(hw, 0); sh.lineTo(0, rise - t + 0.06);
  part(p, new THREE.ExtrudeGeometry(sh, { depth: 0.1, bevelEnabled: false }), color, x, y0, 0).rotation.y = Math.PI / 2;
}
const TRIM = 0xf0e8ff, DOOR = 0x4a4060;
/** 둥근 창 — 창틀 링 + 유리 + 십자 살 + 창턱 */
function roundWindow(solid, glow, color, x, y, z, r = 0.4) {
  part(solid, Cy(r + 0.12, r + 0.12, 0.1, 16), TRIM, x, y, z).rotation.x = Math.PI / 2;
  part(glow, Cy(r, r, 0.08, 16), color, x, y, z + 0.03).rotation.x = Math.PI / 2;
  RB(solid, TRIM, 2 * r, 0.06, 0.1, x, y, z + 0.08, 0.02); RB(solid, TRIM, 0.06, 2 * r, 0.1, x, y, z + 0.08, 0.02);
  RB(solid, TRIM, 2 * r + 0.4, 0.1, 0.26, x, y - r - 0.14, z + 0.1, 0.04);
}
function squareWindow(solid, glow, color, x, y, z, w = 0.62, h = 0.7, shutter = null) {
  RB(solid, TRIM, w + 0.2, h + 0.2, 0.1, x, y, z, 0.05);
  part(glow, B(w, h, 0.08), color, x, y, z + 0.04);
  RB(solid, TRIM, 0.05, h, 0.1, x, y, z + 0.06, 0.02); RB(solid, TRIM, w, 0.05, 0.1, x, y, z + 0.06, 0.02);
  RB(solid, TRIM, w + 0.38, 0.1, 0.24, x, y - h / 2 - 0.15, z + 0.08, 0.04);
  if (shutter) for (const s of [-1, 1]) RB(solid, shutter, 0.2, h + 0.16, 0.07, x + s * (w / 2 + 0.3), y, z + 0.03, 0.03);
}
function archDoor(solid, x, z, w = 0.85, h = 1.3, frame = TRIM, door = DOOR) {
  arch(solid, frame, w + 0.28, h + 0.14, 0.1, x, 0.3, z, 0.03);
  arch(solid, door, w, h, 0.1, x, 0.3, z + 0.08, 0.02);
  part(solid, Sp(0.05, 6, 5), 0xffe08a, x + w * 0.3, 0.95, z + 0.2);
}
function corners(solid, color, w, h, d, y) {
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) RB(solid, color, 0.17, h, 0.17, sx * w / 2, y, sz * d / 2, 0.06);
}

// ── 🪞 거울 마을 집 ───────────────────────────────────────
const M = {
  cur(solid, glow, i) {

    const r = part(solid, new THREE.ConeGeometry(2.4, 1.5, 4), P.roofs[i], 0, 2.95, 0); r.rotation.y = Math.PI / 4; r.scale.set(1, 1, 0.85);
    part(solid, B(0.7, 1.1, 0.05), DOOR, 0, 0.55, 1.31);
    for (const wx of [-0.75, 0.75]) part(glow, B(0.6, 0.6, 0.05), P.win[i], wx, 1.3, 1.31);
  },
  A(solid, glow, i) {   // 아늑한 박공 오두막
    const wall = P.walls[i], rf = P.roofs[i];
    RB(solid, P.stone, 3.15, 0.32, 2.75, 0, 0.16, 0, 0.1);
    RB(solid, wall, 2.9, 1.9, 2.5, 0, 1.27, 0, 0.1);
    corners(solid, TRIM, 2.9, 1.9, 2.5, 1.27);
    RB(solid, shade(wall, 0.9), 2.96, 0.14, 2.56, 0, 0.5, 0, 0.05);
    gableEnd(solid, shade(wall, 0.85), 1.46, 1.25, 1.3, 0.28, 2.2); gableEnd(solid, shade(wall, 0.85), -1.5, 1.25, 1.3, 0.28, 2.2);
    gableRoof(solid, rf, TRIM, 3.6, 1.7, 1.35, 0.28, 2.2);
    RB(solid, P.stone, 0.55, 1.5, 0.55, 0.95, 3.0, -0.55, 0.08); RB(solid, shade(P.stone, 1.12), 0.72, 0.16, 0.72, 0.95, 3.78, -0.55, 0.06);
    RB(solid, shade(P.stone, 0.88), 0.6, 0.1, 0.6, 0.95, 3.2, -0.55, 0.04);
    archDoor(solid, -0.6, 1.26);
    RB(solid, P.stone, 1.35, 0.16, 0.62, -0.6, 0.4, 1.62, 0.06); RB(solid, shade(P.stone, 1.1), 1.0, 0.14, 0.45, -0.6, 0.55, 1.62, 0.06);
    roundWindow(solid, glow, P.win[i], 0.8, 1.55, 1.26, 0.38);
    RB(solid, P.wood, 1.0, 0.24, 0.3, 0.8, 0.95, 1.52, 0.06);
    for (const fx of [-0.3, 0, 0.3]) part(glow, Sp(0.12, 7, 5), [0xff9ee0, 0xffe08a, 0xff9ee0][fx === 0 ? 1 : 0], 0.8 + fx, 1.15, 1.52);
    part(solid, Cy(0.05, 0.06, 1.55, 6), P.wood, 0.05, 0.78, 1.85); RB(solid, P.wood, 0.34, 0.06, 0.34, 0.05, 1.6, 1.85, 0.02);
    part(glow, B(0.24, 0.3, 0.24), P.lampGlow, 0.05, 1.8, 1.85);
    for (const [sx, sz] of [[-1.45, 2.4], [-1.0, 2.95], [-0.8, 3.5]]) part(solid, Cy(0.28, 0.3, 0.1, 7), shade(P.stone, 1.1), sx, 0.05, sz);
  },
  B(solid, glow, i) {   // 거울 지붕집: 지붕 위에 거꾸로 뜬 지붕 + 벽에 걸린 타원 거울
    const wall = P.walls[i], rf = P.roofs[i];
    RB(solid, P.stone, 3.15, 0.32, 2.75, 0, 0.16, 0, 0.1);
    RB(solid, wall, 2.9, 2.0, 2.5, 0, 1.32, 0, 0.1);
    corners(solid, TRIM, 2.9, 2.0, 2.5, 1.32);
    RB(solid, shade(wall, 0.9), 2.96, 0.14, 2.56, 0, 0.55, 0, 0.05);
    RB(solid, TRIM, 3.2, 0.16, 2.8, 0, 2.38, 0, 0.07);
    const r1 = lathe(solid, rf, 2.45, 1.6, 4, 0, 2.42, 0); r1.rotation.y = Math.PI / 4; r1.scale.z = 0.92;
    const r2 = lathe(solid, rf, 1.0, 1.0, 4, 0, 4.95, 0); r2.rotation.set(Math.PI, Math.PI / 4, 0);
    part(glow, new THREE.OctahedronGeometry(0.2, 0), 0xffe08a, 0, 4.12, 0).scale.y = 1.4;
    part(solid, Cy(0.05, 0.05, 0.35, 5), TRIM, 0, 4.12, 0);
    archDoor(solid, -0.75, 1.26);
    RB(solid, P.stone, 1.3, 0.16, 0.6, -0.75, 0.4, 1.62, 0.06);
    const fr = part(solid, Cy(0.68, 0.68, 0.14, 22), TRIM, 0.72, 1.55, 1.27); fr.rotation.x = Math.PI / 2; fr.scale.set(1, 1, 1.5);
    const fc = part(glow, Cy(0.52, 0.52, 0.1, 22), 0x8fb4ff, 0.72, 1.55, 1.33); fc.rotation.x = Math.PI / 2; fc.scale.set(1, 1, 1.5);
    part(glow, new THREE.OctahedronGeometry(0.1, 0), 0xe8f2ff, 0.55, 1.95, 1.42).scale.set(1, 1.5, 0.4);
    squareWindow(solid, glow, P.win[i], -0.75, 1.9 + 0.12, 1.26, 0.5, 0.42, rf);
    for (const [sx, sz] of [[1.6, 1.9], [1.1, 2.4]]) part(solid, Cy(0.3, 0.32, 0.1, 7), shade(P.stone, 1.1), sx, 0.05, sz);
  },
  C(solid, glow, i) {   // 비튼 2층 탑집
    const wall = P.walls[i], rf = P.roofs[i];
    RB(solid, P.stone, 3.15, 0.32, 2.75, 0, 0.16, 0, 0.1);
    RB(solid, wall, 2.9, 1.5, 2.5, 0, 1.07, 0, 0.1);
    corners(solid, TRIM, 2.9, 1.5, 2.5, 1.07);
    RB(solid, rf, 3.3, 0.22, 2.9, 0, 1.92, 0, 0.09);
    RB(solid, TRIM, 3.2, 0.1, 2.8, 0, 1.78, 0, 0.04);
    const up = new THREE.Group(); up.position.y = 2.03; up.rotation.y = 0.55; solid.add(up);
    RB(up, shade(wall, 1.1), 1.9, 1.45, 1.9, 0, 0.73, 0, 0.1);
    corners(up, TRIM, 1.9, 1.45, 1.9, 0.73);
    RB(up, TRIM, 2.2, 0.1, 2.2, 0, 1.48, 0, 0.04);
    lathe(up, rf, 1.5, 1.9, 6, 0, 1.5, 0);

  },
};

// ── 🌙 꿈의 숲 오두막(신축) ───────────────────────────────
const CREAM = 0xf4e6ff, LAV = 0xb98fd6, DEEP = 0x7a64b8, GOLD = 0xffe9a8, DREAM_TRIM = 0xfff6ff;
function dreamArchDoor(solid, x, z, w = 0.9, h = 1.3, trim = DREAM_TRIM) {
  arch(solid, trim, w + 0.3, h + 0.15, 0.12, x, 0.02, z, 0.03);
  arch(solid, 0x6a5a9a, w, h, 0.1, x, 0.02, z + 0.09, 0.02);
  part(solid, Sp(0.05, 6, 5), 0xffe08a, x + w * 0.28, 0.7, z + 0.2);
}
function dreamRound(solid, glow, x, y, z, ang, r = 0.3) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = ang; solid.add(g);
  const gg = new THREE.Group(); gg.position.set(x, y, z); gg.rotation.y = ang; glow.add(gg);
  part(g, Cy(r + 0.1, r + 0.1, 0.1, 14), DREAM_TRIM, 0, 0, 0).rotation.x = Math.PI / 2;
  part(gg, Cy(r, r, 0.08, 14), GOLD, 0, 0, 0.04).rotation.x = Math.PI / 2;
  RB(g, DREAM_TRIM, 2 * r, 0.05, 0.1, 0, 0, 0.08, 0.02); RB(g, DREAM_TRIM, 0.05, 2 * r, 0.1, 0, 0, 0.08, 0.02);
}
const D = {
  cur() {},
  A(solid, glow, cloud) {   // 구름 오두막: 구름 단 3층 지붕(구름은 게임 구름 바다처럼 달빛 발광 재질)
    part(solid, Cy(1.55, 1.7, 1.9, 16), 0xf6f0ff, 0, 0.95, 0);
    part(solid, Cy(1.62, 1.62, 0.16, 16), LAV, 0, 0.1, 0);
    part(solid, Cy(1.6, 1.6, 0.14, 16), DREAM_TRIM, 0, 1.15, 0);
    for (let k = 0; k < 9; k++) { const a = k / 9 * Math.PI * 2; part(cloud, Ico(0.62), 0xf4eeff, Math.cos(a) * 1.65, 2.0, Math.sin(a) * 1.65); }
    for (let k = 0; k < 6; k++) { const a = k / 6 * Math.PI * 2 + 0.3; part(cloud, Ico(0.58), 0xf4eeff, Math.cos(a) * 1.0, 2.6, Math.sin(a) * 1.0); }
    for (let k = 0; k < 3; k++) { const a = k / 3 * Math.PI * 2; part(cloud, Ico(0.5), 0xf4eeff, Math.cos(a) * 0.4, 3.1, Math.sin(a) * 0.4); }
    part(cloud, Ico(0.55), 0xf4eeff, 0, 3.4, 0);
    part(glow, new THREE.OctahedronGeometry(0.28, 0), 0xfff09e, 0, 4.1, 0).scale.y = 1.5;
    dreamArchDoor(solid, 0, 1.62);
    RB(solid, LAV, 1.4, 0.14, 0.7, 0, 0.07, 2.0, 0.05);
    dreamRound(solid, glow, 1.1, 1.0, 1.15, 0.8); dreamRound(solid, glow, -1.1, 1.0, 1.15, -0.8);
  },
  B(solid, glow) {   // 버섯집
    const stalk = [[0.001, 1.75], [1.2, 1.75], [1.1, 1.1], [1.25, 0.5], [1.4, 0], [0.001, 0]];
    part(solid, new THREE.LatheGeometry(stalk.map(([a, b]) => new THREE.Vector2(a, b)), 14), CREAM, 0, 0, 0);
    const cap = [[0.001, 3.3], [0.9, 3.15], [1.7, 2.65], [2.25, 1.95], [2.45, 1.55], [2.35, 1.4], [1.3, 1.55], [0.001, 1.6]];
    part(solid, new THREE.LatheGeometry(cap.map(([a, b]) => new THREE.Vector2(a, b)), 18), 0xff9ed8, 0, 0, 0);
