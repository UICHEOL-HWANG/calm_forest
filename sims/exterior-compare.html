<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>작업대·시세판 외관 시안</title>
<style>
  :root { --ink:#24312a; --line:#d9e2da; }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; font-family:'Segoe UI', system-ui, 'Apple SD Gothic Neo', sans-serif; color:var(--ink); background:#e9efe9; }
  h1 { font-size:19px; margin:0 0 4px; }
  h2 { font-size:16px; margin:22px 0 8px; }
  .lead { font-size:13px; opacity:.75; margin:0 0 6px; max-width:1180px; line-height:1.55; }
  .wrap { max-width:1180px; }
  .tag { font-size:11px; font-weight:700; opacity:.55; margin:12px 0 5px; }
  .grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; }
  figure { margin:0; min-width:0; }
  .cv { position:relative; width:100%; overflow:hidden; border-radius:12px; box-shadow:0 8px 24px rgba(30,50,40,.18); background:#cfe3d0; }
  .day .cv { aspect-ratio:4 / 5; }
  .night .cv { aspect-ratio:4 / 3; }
  .far .cv { aspect-ratio:16 / 10; }
  .cv canvas { display:block; width:100%; height:100%; }
  figcaption { font-size:13px; font-weight:700; margin:6px 2px 0; }
  figcaption small { font-weight:500; opacity:.6; margin-left:4px; }
  .night figcaption, .far figcaption { font-size:11px; font-weight:600; opacity:.7; }
  @media (max-width:640px) {
    body { padding:12px; }
    .grid { grid-template-columns:repeat(2, 1fr); gap:8px; }
    figcaption { font-size:12px; }
  }
</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div class="wrap">
<h1>작업대·시세판 외관 시안</h1>
<p class="lead">현재 모습과 새 시안 세 가지를 게임과 같은 각도(남쪽 위에서, 살짝 옆)로 나란히 놓았어요. 초록 인형은 플레이어 크기예요. 아래 두 줄은 밤과 실제 게임 카메라 거리에서 본 모습이에요.</p>
<section data-prop="workbench">
  <h2>🔧 작업대</h2>
  <div class="tag">낮</div>
  <div class="grid day"></div>
  <div class="tag">밤 (hemi 0.55)</div>
  <div class="grid night"></div>
  <div class="tag">게임 거리</div>
  <div class="grid far"></div>
</section>
<section data-prop="market">
  <h2>📊 시세판</h2>
  <div class="tag">낮</div>
  <div class="grid day"></div>
  <div class="tag">밤 (hemi 0.55)</div>
  <div class="grid night"></div>
  <div class="tag">게임 거리</div>
  <div class="grid far"></div>
</section>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { buildWorkbench, buildMarketBoard, buildFigure, meshCount } from './exterior-compare/variants.js';

const CAPTIONS = {
  workbench: { now: '현재', A: 'A 공방 부스', B: 'B 야외 목공 마당', C: 'C 장인 수레' },
  market: { now: '현재', A: 'A 시장 게시대', B: 'B 저울 간판', C: 'C 경매 무대 세트' },
};
const VARIANTS = ['now', 'A', 'B', 'C'];
const SETS = {
  day: { sky: 0xdff3ff, hemi: [0xffffff, 0xbfe8c9, 0.9], amb: 0.25, sun: [0xffe9c4, 1.1], ground: 0x7cc456, bloom: 0.35, lamp: 0.2 },
  night: { sky: 0x1b2145, hemi: [0x8090c0, 0x303848, 0.55], amb: 0.2, sun: [0x8a9ad8, 0.6], ground: 0x46685a, bloom: 0.55, lamp: 0.6 },
};
const VIEWS = {
  day: { dist: 7.6, ty: 1.05, set: 'day' },
  night: { dist: 7.6, ty: 1.05, set: 'night' },
  far: { dist: Math.hypot(14, 16), ty: 0.6, set: 'day' },
};
const DIR = new THREE.Vector3(-2.4, 14, 16).normalize();

const scene = new THREE.Scene();
const hemi = new THREE.HemisphereLight(0xffffff, 0xbfe8c9, 0.9);
const amb = new THREE.AmbientLight(0xfff0dd, 0.25);
const sun = new THREE.DirectionalLight(0xffe9c4, 1.1);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 1, far: 50 });
sun.shadow.bias = -0.0005;
scene.add(hemi, amb, sun, sun.target);
const groundMat = new THREE.MeshStandardMaterial({ color: SETS.day.ground, roughness: 1 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 120), groundMat);
ground.rotation.x = -Math.PI / 2; ground.position.x = 100; ground.receiveShadow = true;
scene.add(ground);

const props = [];
let slot = 0;
for (const [kind, build] of [['workbench', buildWorkbench], ['market', buildMarketBoard]]) {
  for (const v of VARIANTS) {
    const obj = build(THREE, v);
    const x = slot * 30; slot += 1;
    obj.position.set(x, 0, 0);
    scene.add(obj);
    const fig = buildFigure(THREE);
    fig.position.set(x + 1.85, 0, 0.75);
    fig.rotation.y = Math.PI + 0.6;
    scene.add(fig);
    props.push({ kind, v, obj, x, meshes: meshCount(obj) });
  }
}
const box = new THREE.Box3();
const stats = props.map(p => {
  box.setFromObject(p.obj);
  return { kind: p.kind, v: p.v, meshes: p.meshes, w: +(box.max.x - box.min.x).toFixed(2), d: +(box.max.z - box.min.z).toFixed(2), h: +box.max.y.toFixed(2), minZ: +box.min.z.toFixed(2), maxZ: +box.max.z.toFixed(2) };
});

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 120);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.35, 0.9, 0.85);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const only = new URLSearchParams(location.search).get('only');
const panels = [];
for (const sec of document.querySelectorAll('section[data-prop]')) {
  if (only && sec.dataset.prop !== only) { sec.remove(); continue; }
  const kind = sec.dataset.prop;
  for (const view of Object.keys(VIEWS)) {
    const grid = sec.querySelector(`.grid.${view}`);
    for (const v of VARIANTS) {
      const p = props.find(q => q.kind === kind && q.v === v);
      const fig = document.createElement('figure');
      const wrap = document.createElement('div'); wrap.className = 'cv';
      const cv = document.createElement('canvas'); wrap.appendChild(cv); fig.appendChild(wrap);
      const cap = document.createElement('figcaption');
      cap.textContent = CAPTIONS[kind][v];
      if (view === 'day') { const s = document.createElement('small'); s.textContent = `메시 ${p.meshes}`; cap.appendChild(s); }
      fig.appendChild(cap); grid.appendChild(fig);
      panels.push({ cv, wrap, view, prop: p });
    }
  }
}

function applySet(name, prop) {
  const s = SETS[name];
  scene.background = new THREE.Color(s.sky);
  hemi.color.set(s.hemi[0]); hemi.groundColor.set(s.hemi[1]); hemi.intensity = s.hemi[2];
  amb.intensity = s.amb;
  sun.color.set(s.sun[0]); sun.intensity = s.sun[1];
  sun.position.set(prop.x + 10, 18, 8);
  sun.target.position.set(prop.x, 0, 0);
  groundMat.color.set(s.ground);
  bloom.strength = s.bloom;
  for (const p of props) for (const m of p.obj.userData.lamps) m.emissiveIntensity = s.lamp;
}

function frame() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  for (const pn of panels) {
    const w = Math.max(2, Math.round(pn.wrap.clientWidth * dpr)), h = Math.max(2, Math.round(pn.wrap.clientHeight * dpr));
    const vw = VIEWS[pn.view];
    applySet(vw.set, pn.prop);
    renderer.setSize(w, h, false);
    composer.setSize(w, h);
    camera.aspect = w / h;
    const tgt = new THREE.Vector3(pn.prop.x, vw.ty, 0.1);
    camera.position.copy(tgt).addScaledVector(DIR, vw.dist);
    camera.lookAt(tgt);
    camera.updateProjectionMatrix();
    composer.render();
    if (pn.cv.width !== w || pn.cv.height !== h) { pn.cv.width = w; pn.cv.height = h; }
    pn.cv.getContext('2d').drawImage(renderer.domElement, 0, 0, w, h);
  }
}

window.__ext = { frame, stats };
document.body.dataset.stats = JSON.stringify(stats);
frame();
document.fonts?.ready.then(() => frame());
let t;
window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(frame, 120); });
</script>
</body>
</html>
