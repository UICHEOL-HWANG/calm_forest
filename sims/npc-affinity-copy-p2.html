<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>호감도 P2 편지 검수</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #eef1ec; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif; color: #2c2418; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .lead { margin: 0 0 16px; font-size: 14px; color: #555; line-height: 1.6; max-width: 1080px; }
  .letters { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; max-width: 1180px; }
  .lt { background: #fffdf6; border-radius: 16px; padding: 13px 15px; box-shadow: 0 0 0 2px #fff, 0 4px 0 #d8ccb6, 0 8px 16px rgba(0,0,0,0.08); }
  .lt .lh { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 800; }
  .lt .tone { font-size: 11px; color: #8a7a66; font-weight: 600; }
  .lt p { margin: 7px 0 8px; font-size: 13.5px; line-height: 1.65; word-break: keep-all; }
  .lt .att { font-size: 12px; font-weight: 800; border-radius: 9px; padding: 4px 9px; display: inline-block; background: #f3ece0; color: #7a5a30; }
  .lt .n { font-size: 11px; color: #aaa; }
</style>
</head>
<body>
<h1>✉️ 호감도 P2 편지 22통 (단짝 ❤️10 · 가족 ❤️15)</h1>
<p class="lead">앞서 확정한 이웃·친구 편지(L1~L22)에 이어지는 편지예요. 말투는 같은 주민별 말투(반말·하오체·하게체·해요체·합쇼체)를 이어 가고, 단짝 편지는 확정한 전용 아이템을, 가족 편지는 액자를 동봉해요. 고칠 편지는 번호로 말씀해 주세요(예: "L27은 ..."). 엠대시와 "놀다"는 넣지 않았어요.</p>
<div class="letters" id="letters"></div>
<script>
const P2 = [
  ['farmer', '🧑‍🌾', '농부 삼촌', '반말, 푸근', '#48914a',
    '네 덕에 올해 밭일이 하나도 안 힘들었어. 그래서 수레 하나 꾸며 봤지. 제일 잘 여문 놈들로만 골라 실었으니까 마당에 두고 볼 때마다 웃어. 비 오는 날엔 모자도 씌워 두고.', '🥕 채소 수레',
    '이제 내 밭이 네 밭이고 네 밭이 내 밭 같아. 장에서 사진을 한 장 찍었는데, 네 식탁에 두면 내가 매일 아침 인사하는 셈이겠다.', '🖼️ 농부 삼촌 액자'],
  ['builder', '👷', '목수 아저씨', '반말, 힘 있게', '#b8492a',
    '이 흔들의자, 처음으로 남 주려고 짠 거야! 데크까지 깔았으니까 해 질 녘에 앉아서 마을 한번 내려다봐. 삐걱거리면 바로 불러. 고쳐 줄게!', '🪑 목수의 흔들의자',
    '망치 들고 다닌 지 몇십 년인데 이런 이웃은 처음이야. 우리 이제 한 식구나 마찬가지지! 사진 한 장 넣었어. 네 집 지을 때 그 자리에 나도 있었다는 증거로.', '🖼️ 목수 아저씨 액자'],
  ['merchant', '🧙', '방랑 상인', '하오체', '#7044b0',
    '먼 마을에서 쓰던 천막을 하나 들고 왔소. 떠돌다 돌아올 때 그대 마당에 이 천막이 서 있으면 집에 온 기분일 것 같구려. 좌판에 올린 병들은 밤이면 은은히 빛난다오.', '⛺ 보라 천막',
    '떠도는 사람에게 돌아올 곳이 생겼으니, 이제 나도 이 마을 사람이오. 그 마음을 담아 내 얼굴을 한 장 보내오. 식탁 한쪽에 두고 가끔 안부를 물어 주시오.', '🖼️ 방랑 상인 액자'],
  ['angler', '🎣', '낚시꾼 할아버지', '하게체, 허허', '#2f6fae',
    '허허, 자네 마당에 작은 물가를 하나 만들어 두게. 내가 쓰던 의자랑 양동이를 같이 보내네. 물고기가 안 물어도 앉아 있으면 마음이 편해지는 자리일세.', '🎣 낚시 쉼터',
    '이 나이에 식구가 하나 늘 줄은 몰랐네. 허허, 쑥스럽지만 사진을 한 장 보내네. 자네 식탁에 두면 같이 아침 먹는 기분이겠구먼.', '🖼️ 낚시꾼 할아버지 액자'],
  ['chef', '🐼', '요리사 판다', '반말, 들뜸', '#5a5a52',
    '짜잔! 내가 제일 아끼는 찜기 탁자야! 김이 모락모락 나는 걸 보면 배고파지지? 친구랑 같이 먹으려고 의자도 두 개 놨어!', '🎋 대나무 찜기 탁자',
    '우리 이제 한솥밥 먹는 사이야! 그 기념으로 내 사진을 보내. 식탁에 두면 밥이 더 맛있어질 거야. 진짜야!', '🖼️ 요리사 판다 액자'],
  ['forager', '🦡', '숲지기 오소리', '반말, 부드럽게', '#5a5249',
    '숲에서 제일 예쁜 그루터기를 찾았어. 그 위에 버섯 등불을 키워 봤는데, 밤이 되면 은은하게 빛나. 네 마당에도 숲 한 조각이 있으면 좋겠다 싶었어.', '🍄 버섯 등불',
    '숲에서 혼자 지낸 시간이 길었는데, 요즘은 네가 있어서 덜 쓸쓸해. 사진 한 장 넣어 둘게. 식탁 위에서 너를 지켜 줄게.', '🖼️ 숲지기 오소리 액자'],
  ['stargazer', '⭐', '별 보는 아이', '해요체, 아이', '#4a5cb8',
    '제 망원경을 드릴게요! 밤에 들여다보면 별이 엄청 크게 보여요. 별 의자에 앉아서 보면 더 잘 보여요. 같이 보고 싶을 땐 불러 주세요!', '🔭 꼬마 망원경',
    '제가 정했어요. 같이 별을 본 사람은 가족이에요! 그래서 제 사진을 드려요. 식탁에 두고 밤마다 인사해 주세요.', '🖼️ 별 보는 아이 액자'],
  ['ferryman', '🦆', '사공 오리', '하게체, 뱃사람', '#a87a10',
    '바다로 못 나가게 된 배가 한 척 있는데, 버리기 아까워 꽃을 심어 봤네. 자네 마당에 띄워 두면 물 위에 꽃이 피는 셈이지. 밤엔 고물 등불을 켜 두시게.', '🛶 꽃배 화분',
    '뱃사람은 정을 잘 안 주는데, 자네한텐 어쩔 수가 없구먼. 사진 한 장 넣었네. 식탁에 두면 내가 물때 맞춰 안부를 묻는 걸로 알게.', '🖼️ 사공 오리 액자'],
  ['rancher', '🐔', '목장 아주머니', '해요체, 살뜰', '#a8452f',
    '우리 닭이 병아리를 둘이나 깠어요! 둥지째 보내니까 마당 볕 좋은 데 두세요. 아침마다 삐약삐약 인사할 거예요.', '🐣 병아리 둥지',
    '서로 아침상 걱정해 주던 사이가 이제 가족이 됐네요. 아침상 차릴 때마다 생각나서 사진을 한 장 보내요. 식탁에 두고 밥 든든히 챙겨 먹어요.', '🖼️ 목장 아주머니 액자'],
  ['curator', '🧑‍🦳', '큐레이터 할아버지', '합쇼체, 정중', '#4a5a7a',
    '제 수장품 가운데 가장 아끼는 항아리를 보내 드립니다. 유리 진열장에 넣어 두었으니, 그대의 마당이 작은 박물관이 되겠지요. 안에 든 보석은 밤이면 은은히 빛납니다.', '🏺 유리 진열장',
    '오랜 세월 물건만 모아 왔습니다만, 결국 가장 귀한 것은 사람이더군요. 제 초상을 한 점 보내 드립니다. 식탁 한편에 두시면 영광이겠습니다.', '🖼️ 큐레이터 할아버지 액자'],
  ['courier', '🦉', '의뢰 올빼미', '하게체, 차분', '#a87a10',
    '오늘은 의뢰 쪽지 대신 우체통을 물고 왔네. 내가 쉬어 갈 자리도 위에 만들어 두었지. 앞으로 자네한테 오는 소식은 여기로 먼저 오게 하겠네.', '📮 올빼미 우체통',
    '마을 소식을 나르며 수많은 집을 봤지만, 이렇게 마음이 머무는 집은 처음이네. 내 모습을 한 장 남기네. 식탁에 두면 늘 곁에 있는 걸로 알게.', '🖼️ 의뢰 올빼미 액자'],
];
let n = 22;
document.getElementById('letters').innerHTML = P2.map(([id, f, name, tone, c, best, bestGift, fam, famGift]) => {
  const card = (stage, body, att) => `<div class="lt"><div class="lh"><span style="color:${c}">✉️ ${f} ${name}의 편지 · ${stage}</span><span class="n">L${++n}</span></div>
    <div class="tone">${tone}</div><p>${body}</p><span class="att">🎁 ${att}</span></div>`;
  return card('💛 단짝', best, bestGift) + card('🌳 가족', fam, famGift);
}).join('');
</script>
</body>
</html>
