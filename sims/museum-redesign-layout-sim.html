<!doctype html>
<meta charset="utf-8">
<title>🏛️ 박물관 층 배치 시안 비교 — calm forest</title>
<style>
  html,body{margin:0;height:100%;background:#2a2a28;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;overflow:hidden}
  canvas{display:block}
  .lab{position:fixed;background:rgba(255,255,255,.93);padding:7px 11px;border-radius:9px;font-size:12.5px;line-height:1.55;max-width:330px;color:#2f3f2f}
  .lab b{font-size:14.5px;color:#2f5e2f}
  .lab i{color:#a0522d;font-style:normal;font-weight:700}
  #ui{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);background:rgba(255,255,255,.93);padding:6px 12px;border-radius:9px;font-size:12.5px}
  button{font:inherit;padding:3px 9px;border-radius:7px;border:1px solid #b8c8b8;background:#fff;cursor:pointer}
  button.on{background:#5b8f5b;color:#fff}
</style>
<div id="labs"></div>
<div id="ui">남쪽 벽: <button id="bUp" class="on">상층(문 없음)</button> <button id="bGround">1층(정문)</button></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// =============================================================
//  🏛️ 층 배치 시안 — 가장 빽빽한 층(3층 36칸 · 특별전 요리는 더 많다)을 네 방식으로
//  ▶ 같은 카메라각(약 41°)·같은 36칸으로 비교한다. 앞줄 유리장이 뒷줄을 가리는지가 핵심.
//  ▶ 전시물은 자리표시(색 구슬)다 — 조형 시안은 museum-redesign-exhibits-sim.html
// =============================================================
const N = 36;
const CAT = [0x8fbf6a, 0xd9a06a, 0x5f9ec8, 0xb8a8d8];           // 구역(카테고리) 색
const colorOf = (i, n) => CAT[Math.min(3, Math.floor(i / (n / 4)))];
const mat = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: .9, ...o });
const M = {
  wall: mat(0xf3e2c8), trim: mat(0xf2ece0), floor: mat(0xd9b98a), wood: mat(0xb5834f),
  stone: mat(0xcfc7b0), dark: mat(0x6b5a46), part: mat(0xe9d6b4),
  glass: mat(0xbfe3ea, { roughness: .3, transparent: true, opacity: .28, side: THREE.DoubleSide }),
};
const box = (g, w, h, d, x, y, z, m, ry = 0) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); o.rotation.y = ry; o.castShadow = o.receiveShadow = true; g.add(o); return o; };

// ── 전시 자리 — [x, z, ry, kind]  kind: 'case'(유리장 1.9m) | 'open'(낮은 탁자 위) ──
function slotsA() {                       // 현재 방식 그대로(museumSlots 포팅) — 15×13 방, 벽 13 + 가운데 섬
  const out = [], side = 5, step = 7.3 / (side - 1), z0 = -2.9;
  for (let i = 0; i < side; i++) out.push([-6.3, z0 + i * step, Math.PI / 2, 'case']);
  for (let i = 0; i < side; i++) out.push([6.3, z0 + i * step, -Math.PI / 2, 'case']);
  for (let i = 0; i < 3; i++) out.push([(i - 1) * 2.6, -5.3, 0, 'case']);
  let rest = N - out.length; const cols = 5, rows = Math.ceil(rest / cols), rh = Math.min(2.1, 8.3 / (rows - 1));
  for (let r = 0; r < rows && rest > 0; r++) for (let c = 0; c < cols && rest > 0; c++, rest--) out.push([(c - 2) * 1.95, -3.3 + r * rh, r % 2 ? Math.PI : 0, 'case']);
  return out;
}
function slotsB() {                       // 알코브 3칸 — 22×13 방, 낮은 칸막이 2장, 구역마다 12칸
  const out = [], cx = [-7.33, 0, 7.33];
  const leftX = [-10.2, -3.17, 4.17], rightX = [-4.17, 3.17, 10.2];
  for (let b = 0; b < 3; b++) {
    for (let k = 0; k < 3; k++) out.push([cx[b] + (k - 1) * 1.9, -5.3, 0, 'case']);
    for (let k = 0; k < 3; k++) out.push([leftX[b], -3.6 + k * 2.1, Math.PI / 2, 'case']);
    for (let k = 0; k < 3; k++) out.push([rightX[b], -3.6 + k * 2.1, -Math.PI / 2, 'case']);
    for (let k = 0; k < 3; k++) out.push([cx[b] + (k - 1) * 1.7, 2.8, Math.PI, 'case']);
  }
  return out;
}
function slotsC() {                       // 회랑형 — 20×14 방, 벽 15칸 + 낮은 탁자 2줄(뚜껑 없는 전시)
  const out = [];
  for (let k = 0; k < 7; k++) out.push([(k - 3) * 2.3, -5.8, 0, 'case']);
  for (let k = 0; k < 4; k++) out.push([-8.8, -3.4 + k * 2.2, Math.PI / 2, 'case']);
  for (let k = 0; k < 4; k++) out.push([8.8, -3.4 + k * 2.2, -Math.PI / 2, 'case']);
  for (let k = 0; k < 11; k++) out.push([(k - 5) * 1.12, -1.9, 0, 'open']);
  for (let k = 0; k < 10; k++) out.push([(k - 4.5) * 1.12, 1.9, Math.PI, 'open']);
  return out;
}
function slotsD() {                       // 층 늘리기 — 한 층 16칸 상한, 섬 없이 벽만(15×13 방)
  const out = [];
  for (let k = 0; k < 4; k++) out.push([(k - 1.5) * 2.6, -5.3, 0, 'case']);
  for (let k = 0; k < 6; k++) out.push([-6.3, -3.2 + k * 1.75, Math.PI / 2, 'case']);
  for (let k = 0; k < 6; k++) out.push([6.3, -3.2 + k * 1.75, -Math.PI / 2, 'case']);
  return out;
}
const VARIANTS = [
  { title: 'A · 지금 방식', note: '15×13 방 하나에 <i>가운데 섬 5열</i>. 앞줄 유리장이 뒷줄을 가림', W: 15, D: 13, slots: slotsA },
  { title: 'B · 알코브 3구역', note: '22×13 방을 <i>낮은 칸막이</i>로 3구역(12칸씩). 구역=카테고리, 줄은 한 줄만', W: 22, D: 13, slots: slotsB, parts: true },
  { title: 'C · 회랑 + 낮은 탁자', note: '20×14. 벽 15칸 + <i>뚜껑 없는 낮은 탁자</i> 2줄. 소품은 위에서 다 보임', W: 20, D: 14, slots: slotsC, tables: true },
  { title: 'D · 층을 늘리기 (칸 ≤16)', note: '벽만 쓰는 16칸, 가운데 비움. <i>대신 층이 늘어난다</i>(전체 약 8층)', W: 15, D: 13, slots: slotsD },
];

function buildRoom(v, ground) {
  const g = new THREE.Group(), W = v.W, D = v.D, H = 3.2, hw = W / 2, hd = D / 2;
  box(g, W, .2, D, 0, -.1, 0, M.floor);
  box(g, W + .4, .18, .5, 0, H, -hd, M.trim);
  box(g, W, H, .3, 0, H / 2, -hd, M.wall); box(g, .3, H, D, -hw, H / 2, 0, M.wall); box(g, .3, H, D, hw, H / 2, 0, M.wall);
  const RAIL = .9;
  if (ground) {                          // 1층: 정문 자리를 비운다
    const dw = 2.8, s = (W - dw) / 2;
    box(g, s, RAIL, .3, -(dw + s) / 2, RAIL / 2, hd, M.wall); box(g, s, RAIL, .3, (dw + s) / 2, RAIL / 2, hd, M.wall);
    box(g, dw, .06, 1.1, 0, .02, hd - .2, M.dark);
  } else {                               // 상층: 문 없이 난간+유리창으로 막는다
    box(g, W, RAIL, .3, 0, RAIL / 2, hd, M.wall); box(g, W, .12, .4, 0, RAIL, hd, M.trim);
    box(g, W, 1.0, .06, 0, RAIL + .06 + .5, hd, M.glass);
    for (let k = -4; k <= 4; k++) box(g, .08, 1.0, .1, k * W / 8.5, RAIL + .56, hd, M.trim);
  }
  for (const sx of [1, -1]) for (let i = 0; i < 5; i++) box(g, .5, .22, 1.5, sx * (hw - 2.9 + i * .5), .11 + i * .22, -hd + 1.0, M.stone);   // 계단 북동(위)·북서(아래)
  if (v.parts) for (const px of [-3.67, 3.67]) { box(g, .25, 1.1, 7.0, px, .55, -hd + 3.5, M.part); box(g, .35, .1, 7.0, px, 1.13, -hd + 3.5, M.trim); }
  if (v.tables) for (const tz of [-1.9, 1.9]) { box(g, 12.4, .75, 1.2, 0, .375, tz, M.wood); box(g, 12.6, .08, 1.3, 0, .78, tz, M.stone); }
  const slots = v.slots(), n = slots.length;
  slots.forEach(([x, z, ry, kind], i) => {
    const ex = new THREE.Mesh(new THREE.IcosahedronGeometry(.2, 0), mat(colorOf(i, n), { roughness: .6, flatShading: true }));
    ex.castShadow = true;
    if (kind === 'case') {
      box(g, .8, .85, .58, x, .43, z, M.wood, ry); box(g, .95, .12, .7, x, .9, z, M.stone, ry);
      box(g, .86, .88, .54, x, 1.41, z, M.glass, ry); box(g, .94, .07, .62, x, 1.88, z, M.trim, ry);
      ex.position.set(x, 1.2, z); ex.scale.setScalar(.8);
    } else { ex.position.set(x, .95, z); ex.scale.setScalar(.75); }
    g.add(ex);
  });
  return g;
}

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xefe3ce);
scene.add(new THREE.HemisphereLight(0xfff2e2, 0xb8a98c, .8));
const sun = new THREE.DirectionalLight(0xfff4e4, .95); sun.position.set(6, 14, 8); sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14 }); sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);

let ground = false, rooms = [];
function rebuild() {
  rooms.forEach(r => { scene.remove(r); r.traverse(o => o.geometry?.dispose?.()); });
  rooms = VARIANTS.map((v, i) => { const r = buildRoom(v, ground); r.position.set(i * 40, 0, 0); scene.add(r); return r; });
}
const labs = document.getElementById('labs');
VARIANTS.forEach((v, i) => { const d = document.createElement('div'); d.className = 'lab'; d.innerHTML = `<b>${v.title}</b><br>${v.note}`; d.id = 'lab' + i; labs.appendChild(d); });
const cam = new THREE.PerspectiveCamera(36, 1, .1, 200);
function layout() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h);
  VARIANTS.forEach((_, i) => { const d = document.getElementById('lab' + i); d.style.left = (i % 2 ? w / 2 + 8 : 8) + 'px'; d.style.top = (i < 2 ? 8 : h / 2 + 8) + 'px'; });
}
addEventListener('resize', layout);
function frame() {
  const w = innerWidth, h = innerHeight;
  renderer.setScissorTest(true);
  VARIANTS.forEach((v, i) => {
    const x = (i % 2) * w / 2, y = (i < 2 ? h / 2 : 0), vw = w / 2, vh = h / 2;
    renderer.setViewport(x, y, vw, vh); renderer.setScissor(x, y, vw, vh);
    cam.aspect = vw / vh;
    const t = Math.tan(THREE.MathUtils.degToRad(cam.fov / 2));
    const R = Math.max(v.W / 2 / (t * cam.aspect), v.D * .62 / t) * 1.08;
    const cx = i * 40, a = THREE.MathUtils.degToRad(41);
    cam.position.set(cx, Math.sin(a) * R, 1 + Math.cos(a) * R); cam.lookAt(cx, .6, .4); cam.updateProjectionMatrix();
    renderer.render(scene, cam);
  });
  requestAnimationFrame(frame);
}
const bUp = document.getElementById('bUp'), bG = document.getElementById('bGround');
bUp.onclick = () => { ground = false; bUp.classList.add('on'); bG.classList.remove('on'); rebuild(); };
bG.onclick = () => { ground = true; bG.classList.add('on'); bUp.classList.remove('on'); rebuild(); };
rebuild(); layout(); frame();
</script>
