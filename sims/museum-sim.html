<!doctype html>
<meta charset="utf-8">
<title>🏛️ 박물관 외관 시안 — calm forest</title>
<style>
  html,body{margin:0;height:100%;background:linear-gradient(#cfe4ee,#eaf2e6);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#3a4a3a;overflow:hidden}
  canvas{display:block}
  #ui{position:fixed;left:0;right:0;bottom:0;padding:10px 14px 14px;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);border-top:1px solid #cfdccf;font-size:13px}
  #ui .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:5px 0}
  button{font:inherit;padding:5px 11px;border-radius:8px;border:1px solid #b8c8b8;background:#fff;cursor:pointer}
  button.on{background:#5b8f5b;color:#fff;border-color:#4a7a4a}
  label{display:flex;gap:6px;align-items:center;white-space:nowrap}
  input[type=range]{width:120px}
  b{color:#2f5e2f}
  #hud{position:fixed;top:10px;right:12px;background:rgba(255,255,255,.9);padding:9px 12px;border-radius:10px;font-size:12.5px;line-height:1.7;min-width:190px}
  #hud .big{font-size:19px;font-weight:700;color:#2f5e2f}
  #hud .warn{color:#b5462f;font-weight:700}
  #note{position:fixed;top:10px;left:12px;background:rgba(255,255,255,.86);padding:8px 11px;border-radius:9px;font-size:12px;line-height:1.6;max-width:250px;cursor:pointer}
  #note.min{opacity:.15}
</style>
<div id="note"></div>
<div id="hud"></div>
<div id="ui">
  <div class="row"><b>증축</b> <span id="stages"></span> <b style="margin-left:6px">보기</b> <span id="views"></span></div>
  <div class="row">
    <label><input id="merge" type="checkbox" checked> <b>재질별 병합</b></label>
    <label>거리 <input id="dist" type="range" min="10" max="46" step="0.5" value="24"><span id="distV">24</span></label>
    <label>회전 <input id="ang" type="range" min="-180" max="180" step="5" value="28"><span id="angV">28°</span></label>
    <label><input id="spin" type="checkbox"> 자동</label>
    <label><input id="night" type="checkbox"> 밤</label>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

// =============================================================
//  🏛️ 마을 박물관 외관 — 증축 1~3층 + 특별전 별관
//  ------------------------------------------------------------
//  ▶ 레퍼런스(석조 고딕)에서 **공간 구조만** 가져온다 — 아치 회랑·2층 발코니·계단·화분.
//    재질은 기존 건물과 같은 크림 팔레트로 번역한다(사실적 석조를 그대로 넣으면 박물관만 다른 게임처럼 보인다).
//  ▶ ⚡ 최적화가 이 시안의 절반이다: ☕카페 홀이 쓰는 규칙을 그대로 —
//    **색을 몇 가지로 묶고 그 재질별로 지오메트리를 합친다. 메시 수 = 재질 수.**
//    [재질별 병합] 을 꺼 보면 난간 기둥 하나하나가 드로우콜이 되는 걸 눈으로 볼 수 있다.
//  ▶ mergeGeos 는 js/game.js 의 것과 같은 구현(이식할 때 그대로 쓰인다).
// =============================================================

const PAL = {
  wall:  0xf3e2c8,   // 크림 벽 — ☕카페 실내와 같은 색
  trim:  0xf2ece0,   // 흰 트림 — 🚜헛간과 같은 색
  roof:  0x8a8f96,   // 슬레이트 지붕
  stone: 0xcfc7b0,   // 기단·계단·디딤돌
  wood:  0xb5834f,   // 문·창틀
  dark:  0x6b5a46,   // 아치 안쪽(입구 그늘)
  leaf:  0x5fa15f,   // 화분 잎
  pot:   0xc4764a,   // 화분
};
const clayMat = (c, flat = true) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.95, metalness: 0, flatShading: flat });
const glassMat = () => new THREE.MeshStandardMaterial({ color: 0xbfe3ea, roughness: 0.35, metalness: 0, transparent: true, opacity: 0.45 });

// js/game.js 의 mergeGeos 와 같은 구현 — 이식할 때 그대로 쓴다
function mergeGeos(geos) {
  const flat = geos.map(g => (g.index ? g.toNonIndexed() : g));
  const out = new THREE.BufferGeometry();
  for (const name of ['position', 'normal', 'uv']) {
    if (!flat[0].attributes[name]) continue;
    const size = flat[0].attributes[name].itemSize;
    let total = 0;
    for (const g of flat) total += g.attributes[name].count;
    const arr = new Float32Array(total * size);
    let off = 0;
    for (const g of flat) { arr.set(g.attributes[name].array, off); off += g.attributes[name].count * size; }
    out.setAttribute(name, new THREE.BufferAttribute(arr, size));
  }
  return out;
}

// ── 지오메트리 조각 ──────────────────────────────────────────
const box = (w, h, d, x, y, z, ry = 0) => { const g = new THREE.BoxGeometry(w, h, d); if (ry) g.rotateY(ry); g.translate(x, y, z); return g; };
const cyl = (r, h, seg, x, y, z) => { const g = new THREE.CylinderGeometry(r, r, h, seg); g.translate(x, y, z); return g; };
// 아치 트림 — 사각 기둥 두 개 + 반원 링. 벽에 구멍을 뚫지 않고 "조립" 한다(CSG 는 무겁다)
function archFrame(w, h, d, t, x, y, z) {
  const out = [];
  const legH = h - w / 2;
  out.push(box(t, legH, d, x - w / 2 + t / 2, y + legH / 2, z));
  out.push(box(t, legH, d, x + w / 2 - t / 2, y + legH / 2, z));
  const R = w / 2, seg = 10;
  for (let i = 0; i < seg; i++) {                      // 반원을 짧은 막대로 근사(flatShading 과 잘 맞는다)
    const a0 = Math.PI * i / seg, a1 = Math.PI * (i + 1) / seg, am = (a0 + a1) / 2;
    // ⚠️ 막대의 길이축(y)을 그 자리의 접선 (-sin am, cos am) 에 맞춰야 한다.
    //    rotateZ(θ) 는 (0,1) 을 (-sinθ, cosθ) 로 보내므로 θ = am 이다.
    //    (π/2 - am 으로 두면 꼭대기에서 막대가 수직으로 서서 아치가 톱니처럼 벌어진다)
    const len = 2 * R * Math.sin((a1 - a0) / 2) * 1.06;
    const g = new THREE.BoxGeometry(t, len, d);
    g.rotateZ(am);
    g.translate(x + Math.cos(am) * (R - t / 2), y + legH + Math.sin(am) * (R - t / 2), z);
    out.push(g);
  }
  return out;
}
// 아치 개구부 안쪽(그늘) — 입구가 "뚫려 보이게" 하는 면. 트림과 같은 아치 윤곽으로 뽑는다
//   (사각형으로 두면 아치 어깨 위로 벽이 비쳐 트림이 떠 보인다)
function archHole(w, h, x, y, z) {
  const R = (w - 0.24) / 2, legH = (h - 0.1) - R;
  const sh = new THREE.Shape();
  sh.moveTo(-R, 0); sh.lineTo(-R, legH); sh.absarc(0, legH, R, Math.PI, 0, true); sh.lineTo(R, 0); sh.closePath();
  const g = new THREE.ExtrudeGeometry(sh, { depth: 0.12, bevelEnabled: false, curveSegments: 10 });
  g.translate(x, y, z - 0.06);
  return g;
}

// ── 박물관 ───────────────────────────────────────────────────
//   stage 1: 1층 개관 · 2: 2층 + 발코니 · 3: 3층 + 페디먼트 · 4: 특별전 별관까지
const W = 11, D = 8, FH = 3.4;          // 폭 · 깊이 · 층고

function buildMuseum(stage) {
  const P = {};                          // 재질키 → 지오메트리 배열
  // ⚠️ mergeGeos 는 첫 지오메트리의 속성 목록을 기준으로 합친다 — uv 가 없는 조각이 섞이면 터진다.
  //    직접 만든 BufferGeometry(페디먼트 같은 것)에는 uv 가 없으므로 여기서 채워 준다.
  const ensureUV = g => {
    if (!g.attributes.uv) g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2));
    return g;
  };
  const put = (k, ...gs) => (P[k] ||= []).push(...gs.flat().map(ensureUV));

  // 기단 + 정면 계단 — 레퍼런스의 "올라가서 들어가는" 진입감
  put('stone', box(W + 1.6, 0.5, D + 1.6, 0, 0.25, 0));
  for (let i = 0; i < 3; i++) put('stone', box(5.2, 0.18, 0.6, 0, 0.5 - 0.18 * (i + 0.5), D / 2 + 0.5 + i * 0.6));

  const floors = Math.min(stage, 3);
  for (let f = 0; f < floors; f++) {
    const y0 = 0.5 + f * FH;
    // 벽 네 면 — 얇은 판으로 세운다(속을 채우면 정점만 늘고 보이지 않는다)
    put('wall', box(W, FH, 0.3, 0, y0 + FH / 2, -D / 2));
    put('wall', box(0.3, FH, D, -W / 2, y0 + FH / 2, 0));
    put('wall', box(0.3, FH, D, W / 2, y0 + FH / 2, 0));
    // 정면은 개구부를 위해 좌우 벽 + 위 인방으로 나눈다
    const openW = f === 0 ? 3.0 : 2.2, side = (W - openW) / 2;
    put('wall', box(side, FH, 0.3, -(openW + side) / 2, y0 + FH / 2, D / 2));
    put('wall', box(side, FH, 0.3,  (openW + side) / 2, y0 + FH / 2, D / 2));
    put('wall', box(openW, FH - 2.8, 0.3, 0, y0 + FH - (FH - 2.8) / 2, D / 2));

    // 정면 아치(1층=입구, 위층=큰 창) + 좌우 아치창
    put('trim', archFrame(openW + 0.5, 2.8, 0.42, 0.26, 0, y0, D / 2 + 0.02));
    put(f === 0 ? 'dark' : 'glass', archHole(openW + 0.26, 2.8, 0, y0, D / 2 + 0.06));
    for (const sx of [-1, 1]) for (let i = 0; i < 2; i++) {
      const x = sx * (2.6 + i * 1.9);
      put('trim', archFrame(1.25, 2.0, 0.34, 0.18, x, y0 + 0.5, D / 2 + 0.02));
      put('glass', archHole(1.05, 2.0, x, y0 + 0.5, D / 2 + 0.06));
    }
    // 측면 회랑 아치 — 레퍼런스의 아치 회랑
    for (const sx of [-1, 1]) for (let i = 0; i < 3; i++) {
      const z = -2.4 + i * 2.4;
      const fr = archFrame(1.5, 2.2, 0.34, 0.18, 0, y0 + 0.4, 0);
      fr.forEach(g => { g.rotateY(Math.PI / 2); g.translate(sx * (W / 2 + 0.02), 0, z); });
      put('trim', fr);
      const hole = archHole(1.3, 2.2, 0, y0 + 0.4, 0);
      hole.rotateY(Math.PI / 2); hole.translate(sx * (W / 2 + 0.06), 0, z);
      put('glass', hole);
    }
    // 층 경계 코니스
    put('trim', box(W + 0.7, 0.3, D + 0.7, 0, y0 + FH, 0));
  }

  const top = 0.5 + floors * FH;
  // 2층부터 정면 발코니 — ⚡ 난간 기둥 22개. [재질별 병합] 을 끄면 이게 그대로 드로우콜이 된다
  if (stage >= 2) {
    const by = 0.5 + FH;
    put('stone', box(W + 1.4, 0.22, 1.6, 0, by + 0.11, D / 2 + 0.6));
    put('trim', box(W + 1.4, 0.18, 0.2, 0, by + 1.0, D / 2 + 1.32));
    for (let i = 0; i < 22; i++) put('trim', cyl(0.075, 0.78, 6, -W / 2 - 0.6 + i * (W + 1.2) / 21, by + 0.55, D / 2 + 1.32));
  }
  // 지붕 — 3층까지 올라가면 삼각 페디먼트, 그 전엔 평지붕 파라펫
  if (stage >= 3) {
    const ped = new THREE.BufferGeometry();
    const h = 1.7, w = W / 2 + 0.5;
    const v = new Float32Array([ -w,0,0,  w,0,0,  0,h,0,   -w,0,-0.6,  w,0,-0.6,  0,h,-0.6 ]);
    ped.setAttribute('position', new THREE.BufferAttribute(v, 3));
    ped.setIndex([0,1,2, 5,4,3]); ped.computeVertexNormals();
    const pg = ped.toNonIndexed(); pg.translate(0, top, D / 2 + 0.3);
    put('trim', pg);
    put('roof', box(W + 1.0, 0.34, D + 1.0, 0, top + 0.17, 0));
  } else {
    put('roof', box(W + 1.0, 0.3, D + 1.0, 0, top + 0.15, 0));
    put('trim', box(W + 1.2, 0.45, 0.22, 0, top + 0.5, D / 2 + 0.5));
    put('trim', box(W + 1.2, 0.45, 0.22, 0, top + 0.5, -D / 2 - 0.5));
  }
  // 특별전 별관 — 본관 서쪽에 낮게 붙인다(🍳요리 도감)
  if (stage >= 4) {
    const ax = -(W / 2 + 3.4), aw = 5.4, ad = 5.4, ah = 3.0;
    put('stone', box(aw + 1.0, 0.4, ad + 1.0, ax, 0.2, 1.2));
    put('wall', box(aw, ah, 0.3, ax, 0.4 + ah / 2, 1.2 - ad / 2));
    put('wall', box(aw, ah, 0.3, ax, 0.4 + ah / 2, 1.2 + ad / 2));
    put('wall', box(0.3, ah, ad, ax - aw / 2, 0.4 + ah / 2, 1.2));
    put('trim', archFrame(1.8, 2.2, 0.4, 0.2, ax, 0.4, 1.2 + ad / 2 + 0.02));
    put('dark', archHole(1.6, 2.2, ax, 0.4, 1.2 + ad / 2 + 0.06));
    put('roof', box(aw + 0.8, 0.28, ad + 0.8, ax, 0.4 + ah + 0.14, 1.2));
    put('trim', box(aw + 1.0, 0.24, ad + 1.0, ax, 0.4 + ah, 1.2));
  }
  // 화분 — 레퍼런스의 식물. 입구 양옆
  for (const sx of [-1, 1]) {
    const px = sx * (openWFront() / 2 + 1.3);
    put('pot', cyl(0.34, 0.5, 8, px, 0.75, D / 2 + 1.0));
    put('leaf', new THREE.IcosahedronGeometry(0.52, 0).translate(px, 1.4, D / 2 + 1.0));
  }
  return P;
}
function openWFront() { return 3.0; }

// ── 씬 ───────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.info.autoReset = false;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 300);
const hemi = new THREE.HemisphereLight(0xdff0ff, 0x9ab88f, 1.0); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3dc, 1.3); sun.position.set(6, 12, 8); scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(40, 40).rotateX(-Math.PI / 2), clayMat(0x8fbf72, false));
scene.add(ground);

const rig = new THREE.Group(); scene.add(rig);
let stage = 1, merged = true, meshCount = 0;

function rebuild() {
  for (let i = rig.children.length - 1; i >= 0; i--) {
    const o = rig.children[i];
    o.traverse(m => { if (m.isMesh) { m.geometry.dispose(); m.material.dispose(); } });
    rig.remove(o);
  }
  const P = buildMuseum(stage);
  meshCount = 0;
  for (const [k, geos] of Object.entries(P)) {
    const mat = k === 'glass' ? glassMat() : clayMat(PAL[k], k !== 'stone');
    if (merged) {
      rig.add(new THREE.Mesh(mergeGeos(geos), mat)); meshCount++;
    } else {
      for (const g of geos) { rig.add(new THREE.Mesh(g, mat.clone())); meshCount++; }
    }
  }
}

// ── UI ───────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
function chips(host, items, get, set) {
  host.innerHTML = '';
  items.forEach(it => {
    const b = document.createElement('button');
    b.textContent = it.name; b.title = it.desc || '';
    b.className = get() === it.id ? 'on' : '';
    b.onclick = () => { set(it.id); chips(host, items, get, set); rebuild(); fitCamera(); };
    host.appendChild(b);
  });
}
const STAGES = [
  { id: 1, name: '1층 개관', desc: '🌾작물7 · 🐟물고기3 · ⛏️광물3 = 13종' },
  { id: 2, name: '2층',      desc: '🍄채집4 · 🐛반딧불이4 · 🪏땅속3 · 🐾흔적2 = 13종' },
  { id: 3, name: '3층',      desc: '🛶강4 · 🌫️정령4 · 🌦️날씨4 · 🧑주민6 = 18종' },
  { id: 4, name: '+ 특별전', desc: '🍳요리 — 서쪽 별관' },
];
chips($('stages'), STAGES, () => stage, id => stage = id);
let view = 'free';
chips($('views'), [
  { id: 'free', name: '자유' },
  { id: 'game', name: '게임 카메라', desc: '마을에서 실제로 보이는 각도(41°)' },
], () => view, id => view = id);

let dist = 24, ang = 28, spin = false;
// 1층과 특별전까지 지은 상태는 크기가 두 배 가까이 다르다 — 단계에 맞춰 물러난다
function fitCamera() {
  const base = stage >= 4 ? 34 : stage >= 3 ? 30 : stage >= 2 ? 26 : 22;
  dist = base * Math.max(1, 1.5 / Math.max(0.4, camera.aspect));
  $('dist').value = dist; $('distV').textContent = dist.toFixed(0);
}
$('dist').oninput = e => { dist = +e.target.value; $('distV').textContent = dist; };
$('ang').oninput = e => { ang = +e.target.value; $('angV').textContent = ang + '°'; spin = false; $('spin').checked = false; };
$('spin').onchange = e => spin = e.target.checked;
$('merge').onchange = e => { merged = e.target.checked; rebuild(); };
$('night').onchange = e => {
  const n = e.target.checked;
  hemi.intensity = n ? 0.42 : 1.0; sun.intensity = n ? 0.3 : 1.3;
  sun.color.set(n ? 0x9fb6e0 : 0xfff3dc);
  document.body.style.background = n ? 'linear-gradient(#1b2740,#2b3a4a)' : 'linear-gradient(#cfe4ee,#eaf2e6)';
  ground.material.color.set(n ? 0x3f5a44 : 0x8fbf72);
};

const note = $('note');
note.onclick = () => note.classList.toggle('min');
note.innerHTML = '<b>🏛️ 무엇을 보는가</b><br>레퍼런스의 <b>구조</b>만 가져오고<br>색은 기존 건물 팔레트로 번역<br>(크림 벽 = ☕카페 실내와 같은 색)<br><br>' +
  '<b>[재질별 병합]</b> 을 꺼 보세요 —<br>난간 기둥 22개가 그대로<br>드로우콜이 됩니다<br><br><small>이 상자를 누르면 접힙니다</small>';

function resize() {
  const h = innerHeight - $('ui').offsetHeight;
  renderer.setSize(innerWidth, h);
  camera.aspect = innerWidth / h; camera.updateProjectionMatrix();
}
addEventListener('resize', () => { resize(); fitCamera(); }); resize(); rebuild(); fitCamera();

let t0 = performance.now(), calls = 0, tris = 0;
(function loop(now) {
  const dt = (now - t0) / 1000; t0 = now;
  if (spin) { ang += dt * 14; if (ang > 180) ang -= 360; $('ang').value = ang.toFixed(0); $('angV').textContent = Math.round(ang) + '°'; }
  rig.rotation.y = ang * Math.PI / 180;
  const pitch = view === 'game' ? 0.72 : 0.30;   // 게임 카메라는 41° 내려본다
  camera.position.set(0, Math.sin(pitch) * dist + 1.5, Math.cos(pitch) * dist);
  camera.lookAt(0, view === 'game' ? 2.2 : 3.4, 0);
  renderer.info.reset();
  renderer.render(scene, camera);
  calls = renderer.info.render.calls; tris = renderer.info.render.triangles;
  const over = calls > 25;
  $('hud').innerHTML =
    `드로우콜 <span class="big ${over ? 'warn' : ''}">${calls}</span>` +
    `${over ? ' <span class="warn">⚠︎ 목표 25 초과</span>' : ' <small>(목표 ≤25)</small>'}<br>` +
    `메시 ${meshCount} · 삼각형 ${tris.toLocaleString()}<br>` +
    `<small>바닥 1콜 포함 · 병합 ${merged ? 'ON' : 'OFF'}</small>`;
  requestAnimationFrame(loop);
})(performance.now());
</script>
