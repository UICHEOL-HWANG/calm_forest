<!doctype html>
<meta charset="utf-8">
<title>꾸미기 가게 시안 — calm forest</title>
<style>
  html,body{margin:0;height:100%;background:linear-gradient(#cfe4ee,#eaf2e6);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#3a4a3a;overflow:hidden}
  canvas{display:block}
  #ui{position:fixed;left:0;right:0;bottom:0;padding:9px 14px 13px;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);border-top:1px solid #cfdccf;font-size:13px}
  #ui .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:5px 0}
  button{font:inherit;padding:5px 10px;border-radius:8px;border:1px solid #b8c8b8;background:#fff;cursor:pointer}
  button.on{background:#5b8f5b;color:#fff;border-color:#4a7a4a}
  label{display:flex;gap:6px;align-items:center;white-space:nowrap}
  input[type=range]{width:110px}
  b{color:#2f5e2f}
  #labels{position:fixed;top:0;left:0;right:0;pointer-events:none}
  .tag{position:absolute;transform:translate(-50%,0);text-align:center;font-size:12px;font-weight:600;
       background:rgba(255,255,255,.86);padding:3px 9px;border-radius:7px;white-space:nowrap;line-height:1.35}
  .tag small{display:block;font-weight:400;opacity:.65;font-size:10.5px}
  #hud{position:fixed;top:10px;right:12px;background:rgba(255,255,255,.88);padding:8px 12px;border-radius:9px;font-size:12px;line-height:1.7;max-width:300px}
</style>
<div id="labels"></div>
<div id="hud"></div>
<div id="ui">
  <div class="row"><b>지붕안</b> <span id="vars"></span> <button id="single">한 채만</button></div>
  <div class="row">
    <label>거리 <input id="dist" type="range" min="4" max="26" step="0.2" value="15"><span id="distV">15</span></label>
    <label>회전 <input id="ang" type="range" min="-60" max="60" step="1" value="0"><span id="angV">0°</span></label>
    <label>내려봄 <input id="elev" type="range" min="10" max="70" step="0.5" value="41.2"><span id="elevV">41.2°</span></label>
    <button id="lock41">📐 마을 41°</button>
    <label><input id="night" type="checkbox"> 밤 조명</label>
    <label><input id="walk" type="checkbox" checked> 주인 배회</label>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';
import { buildAnimalHead } from '../js/animal-faces.js';
//  조형은 js/shop/building.js 가 단일 출처다 — 이 시뮬은 **복제본을 두지 않고** import 한다.
//  확정안은 B(뒤 60% 지붕). A·C·D 는 설계 기록이라 variant 인자로만 남긴다.
import { buildShop, updateShopOwner, SHOP_H } from '../js/shop/building.js';

// =============================================================
//  🏪 꾸미기 가게 시안 — 밖에서 안이 보이는 디오라마
//  스펙: docs/superpowers/specs/2026-09-21-cosmetics-pet-design.md
//  ------------------------------------------------------------
//  ▶ 이 시뮬이 답해야 하는 질문은 하나다:
//      **마을 카메라 각도(41°)에서 가게 안의 주인이 보이는가?**
//    레퍼런스 이미지는 거의 눈높이 아이소메트릭이라 안이 훤히 보이지만,
//    이 게임 카메라는 camOffset(0,14,16) → atan(14/16) = 41.2° 로 꽤 위에서 내려다본다.
//    그 각도에서 평지붕을 그대로 얹으면 내부가 덮인다. 그래서 지붕안 4가지를 비교한다.
//
//  ▶ 카메라가 **고정**인 게 이 설계의 전제다 — js/game.js:12231 camOffset 은 상수고,
//    시선이 늘 −Z 다(game.js:7317 주석: "정면을 카메라 쪽으로"). 그래서 정면을 +Z 로
//    두면 플레이어가 어디 있든 안이 보인다. 회전 슬라이더는 검수용이지 게임엔 없다.
//
//  ▶ 색은 **새로 만들지 않았다**. 크림 회벽은 카페와 같은 0xfaf8f4(clayMat 두 번째 인자
//    false = 매끈 — 카페가 "아치가 각지지 않도록" 쓰는 방식), 분홍은 WALL_COLORS 의 0xe0b0b0.
//
//  ▶ ⚠️ 차양 줄무늬를 조각마다 메시로 만들면 드로우콜이 튄다(카페가 병합 후 24).
//    **정점색 한 덩어리**로 굽는다 — 🦊여우 꼬리가 쓰는 방식과 같다.
// =============================================================

const VARIANTS = [
  { id: 'A', name: '레퍼런스 그대로', desc: '평지붕 전체 + 차양' },
  { id: 'B', name: '앞 처마 물림',    desc: '지붕을 뒤 60%만' },
  { id: 'C', name: '천장까지 개방',   desc: '앞 상인방 제거' },
  { id: 'D', name: '지붕 없음',       desc: '차양만 (열린 가판)' },
];

// =============================================================
//  무대
// =============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdbe9ee);
scene.fog = new THREE.Fog(0xdbe9ee, 40, 90);
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

//  ⚠️ 시뮬 하늘을 파랗게(0xdfefff) 줬더니 크림색이 회색으로 죽었다.
//     게임(js/game.js:2961)은 하늘이 **순백**이고 땅 바운스가 연녹이다. 그대로 맞춘다.
const hemi = new THREE.HemisphereLight(0xffffff, 0xbfe8c9, 0.90); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe9c4, 1.10);   // game.js:2966 과 같은 값
sun.position.set(6, 12, 8); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 0.5, far: 42 });
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun);
const rim = new THREE.DirectionalLight(0xbfd8e8, 0.30); rim.position.set(-6, 4, -5); scene.add(rim);

const ground = new THREE.Mesh(new THREE.CircleGeometry(40, 48), new THREE.MeshStandardMaterial({ color: 0x9fc08a, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

const root = new THREE.Group(); scene.add(root);
const labels = document.getElementById('labels');
let tags = [], shops = [];

let single = null;
function layout() {
  [...root.children].forEach(c => root.remove(c));
  labels.innerHTML = ''; tags = []; shops = [];
  const list = single ? VARIANTS.filter(v => v.id === single) : VARIANTS;
  const GX = 6.2;
  list.forEach((v, i) => {
    const s = buildShop(THREE, buildAnimalHead, v.id);   // { group, owner, lamp }
    const x = (i - (list.length - 1) / 2) * GX;
    s.group.position.set(x, 0, 0);
    root.add(s.group); shops.push(s);
    const el = document.createElement('div'); el.className = 'tag';
    el.innerHTML = `<b>${v.id}. ${v.name}</b><small>${v.desc}</small>`;
    labels.appendChild(el); tags.push({ el, x, y: SHOP_H + 1.25, z: 0 });
  });
}

const _v = new THREE.Vector3();
function placeTags() {
  tags.forEach(t => {
    _v.set(t.x, t.y, t.z); _v.project(camera);
    t.el.style.left = ((_v.x * 0.5 + 0.5) * innerWidth) + 'px';
    t.el.style.top = ((-_v.y * 0.5 + 0.5) * innerHeight) + 'px';
    t.el.style.display = _v.z > 1 ? 'none' : '';
  });
}

// ── 조작 ─────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
let dist = 15, angle = 0, elev = 41.2;
const setV = (id, v, txt) => { $(id).value = v; $(id + 'V').textContent = txt; };

function renderBtns() {
  const vb = $('vars'); vb.innerHTML = '';
  VARIANTS.forEach(v => {
    const b = document.createElement('button'); b.textContent = v.id; if (single === v.id) b.className = 'on';
    b.onclick = () => { single = single === v.id ? null : v.id; dist = single ? 7.5 : 15; setV('dist', dist, dist); layout(); renderBtns(); };
    vb.appendChild(b);
  });
  $('single').className = single ? 'on' : '';
}
$('single').onclick = () => { single = single ? null : 'A'; dist = single ? 7.5 : 15; setV('dist', dist, dist); layout(); renderBtns(); };
$('dist').oninput = e => { dist = +e.target.value; $('distV').textContent = dist; };
$('ang').oninput = e => { angle = +e.target.value; $('angV').textContent = angle + '°'; };
$('elev').oninput = e => { elev = +e.target.value; $('elevV').textContent = elev.toFixed(1) + '°'; };
$('lock41').onclick = () => { angle = 0; elev = 41.2; setV('ang', 0, '0°'); setV('elev', 41.2, '41.2°'); };
$('night').onchange = e => {
  const n = e.target.checked;
  hemi.intensity = n ? 0.26 : 0.90; sun.intensity = n ? 0.16 : 1.10;
  hemi.color.set(n ? 0x9fb4d8 : 0xffffff); rim.intensity = n ? 0.12 : 0.30;
  ground.material.color.set(n ? 0x4a6350 : 0x9fc08a);
  scene.fog.color.set(n ? 0x36485c : 0xdbe9ee); scene.background.set(n ? 0x36485c : 0xdbe9ee);
  shops.forEach(s => { if (s.lamp) s.lamp.intensity = n ? 1.5 : 0.85; });
};

$('hud').innerHTML =
  `🏪 <b>꾸미기 가게 시안</b><br>` +
  `<span style="opacity:.62">묻는 것: <b>41°에서 안의 주인이 보이는가</b></span><br>` +
  `<span style="opacity:.62">마을 카메라 camOffset(0,14,16) → atan(14/16) = <b>41.2°</b></span><br>` +
  `<span style="opacity:.62">색은 카페 회벽·WALL_COLORS 핑크 그대로</span>`;

layout(); renderBtns();
const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  const t = clock.getElapsedTime();
  // 주인 배회 — 규칙은 모듈(js/shop/building.js)에 있다. 위상만 채마다 어긋낸다
  if ($('walk').checked) shops.forEach((s, i) => updateShopOwner(s, t, i * 1.7));

  const r = THREE.MathUtils.degToRad(angle), e = THREE.MathUtils.degToRad(elev);
  camera.position.set(Math.sin(r) * Math.cos(e) * dist, Math.sin(e) * dist + 0.6, Math.cos(r) * Math.cos(e) * dist);
  camera.lookAt(0, 1.3, 0);
  placeTags();
  renderer.render(scene, camera);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

window.__shopSim = { VARIANTS: VARIANTS.map(v => v.id), setSingle: id => { single = id; dist = id ? 7.5 : 15; setV('dist', dist, dist); layout(); renderBtns(); } };
</script>
