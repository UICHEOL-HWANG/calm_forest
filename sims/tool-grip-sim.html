<!doctype html>
<meta charset="utf-8">
<title>도구 쥐기 시뮬 — calm forest</title>
<style>
  html,body{margin:0;height:100%;background:linear-gradient(#cfe4ee,#eaf2e6);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#3a4a3a;overflow:hidden}
  canvas{display:block}
  #ui{position:fixed;left:0;right:0;bottom:0;padding:8px 14px 12px;background:rgba(255,255,255,.88);backdrop-filter:blur(6px);border-top:1px solid #cfdccf;font-size:13px}
  #ui .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:4px 0}

       background:rgba(255,255,255,.85);padding:3px 9px;border-radius:7px;white-space:nowrap;line-height:1.35}

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { buildAnimalHead, plushMat } from '../js/animal-faces.js';
import { paletteOf } from '../js/tool-tiers.js';

const clayMat = (color, flat = true) =>
  new THREE.MeshStandardMaterial({ color, roughness: .95, metalness: 0, flatShading: flat });

// ══════════════════════════════════════════════════════════════
//  게임 원본 (js/game.js) — ANIMALS · 팔 상수 · toolMesh(0단계) · 제스처
// ══════════════════════════════════════════════════════════════
const ANIMALS = [
  { id:'fox', name:'🦊 여우', body:0xf0883a, belly:0xf9ecd8, ear:0x8a4a24, bodyR:.52, bodyScale:[.90,1.08,.90], headR:.37, headY:1.26 },
  { id:'dog', name:'🐶 강아지', body:0xf0913a, belly:0xfaf3e8, ear:0x8a6038, bodyR:.56, bodyScale:[1.03,.99,1.00], headR:.40, headY:1.24 },
  { id:'rabbit', name:'🐰 토끼', body:0xf3eeea, belly:0xffffff, ear:0xf0c0c8, bodyR:.46, bodyScale:[1.00,.96,1.00], headR:.39, headY:1.12 },
  { id:'cat', name:'🐱 고양이', body:0x9fa0c2, belly:0xf2f2f8, ear:0xf0b0b8, bodyR:.50, bodyScale:[.88,1.10,.88], headR:.36, headY:1.25 },
  { id:'bear', name:'🐻 곰', body:0x936a44, belly:0xd2b38a, ear:0x6a4828, bodyR:.63, bodyScale:[1.08,1.00,1.06], headR:.44, headY:1.34 },
  { id:'panda', name:'🐼 판다', body:0xf6f6f6, belly:0xffffff, ear:0x2a2a2a, armColor:0x262626, bodyR:.63, bodyScale:[1.08,1.00,1.06], headR:.45, headY:1.34, band:true },
  { id:'chick', name:'🐤 병아리', body:0xffe05a, belly:0xfff0a0, ear:0xffb020, bodyR:.50, bodyScale:[1.02,.94,1.02], headR:.35, headY:1.06, wings:true },
];
let ANIMAL = ANIMALS[4];

const _axX = new THREE.Vector3(1,0,0), _axZ = new THREE.Vector3(0,0,1), _up = new THREE.Vector3(0,1,0), _down = new THREE.Vector3(0,-1,0);
const ARM_AIM_R = new THREE.Quaternion().setFromUnitVectors(_down, new THREE.Vector3(.29,-.90,.32).normalize());
const ARM_AIM_L = new THREE.Quaternion().setFromUnitVectors(_down, new THREE.Vector3(-.29,-.90,.32).normalize());
const SLASH = { back: 1.10, strike: -1.50, lift: -1.20 };
const WRIST_MAX = .55;
const TOOL_QSWING = new THREE.Quaternion().setFromAxisAngle(_axX, Math.PI);
function slashPhase(p, B, S) {
  if (p < .32) { const q = p/.32;        return B * (1 - (1-q)*(1-q)); }
  if (p < .58) { const q = (p-.32)/.26;  return B + (S - B) * q*q; }
  const q = (p-.58)/.42;                 return S + (0 - S) * (1 - (1-q)*(1-q));
}

// toolMesh — game.js 원본 0단계 경로
function toolMesh(id, tier = 0) {
  const g = new THREE.Group();
  const T = paletteOf(tier);
  const wood = (l) => new THREE.Mesh(new THREE.CylinderGeometry(.028,.028,l,6), clayMat(T.wood));
  const GRIP = T.grip, STEEL = T.metal, EDGE = T.edge;
  const handle = (l, r = .030) => {
    const h = new THREE.Mesh(new THREE.CylinderGeometry(r*.8, r, l, 7), clayMat(T.wood));
    h.position.y = l/2 - .08;
    const band = new THREE.Mesh(new THREE.CylinderGeometry(r*1.18, r*1.18, .07, 7), clayMat(GRIP));
    band.position.y = -.02;
    const knob = new THREE.Mesh(new THREE.SphereGeometry(r*1.35, 7, 6), clayMat(GRIP));
    knob.position.y = -.08;
    g.add(h, band, knob);
    return l - .08;
  };
  if (id === 'axe') {
    const top = handle(.52);
    const head = new THREE.Mesh(new THREE.BoxGeometry(.17,.13,.06), clayMat(STEEL)); head.position.set(.075, top-.05, 0); g.add(head);
    const blade = new THREE.Mesh(new THREE.BoxGeometry(.07,.155,.028), clayMat(EDGE)); blade.position.set(.175, top-.05, 0); blade.rotation.z = .06; g.add(blade);
    const poll = new THREE.Mesh(new THREE.BoxGeometry(.05,.09,.07), clayMat(STEEL)); poll.position.set(-.035, top-.05, 0); g.add(poll);
    g.scale.setScalar(1.18);
  } else if (id === 'hoe') {
    const top = handle(.52);
    const IRON = 0x4d5156;
    const hd = new THREE.Group(); hd.position.y = top + .01; g.add(hd);
    hd.add(new THREE.Mesh(new THREE.BoxGeometry(.085,.095,.075), clayMat(IRON)));
    [-1,1].forEach(sx => {
      const TH = [.14,.32], LEN = [.13,.12];
      let px = sx*.042, py = .012;
      for (let i = 0; i < 2; i++) {
        const dx = Math.cos(TH[i])*sx, dy = -Math.sin(TH[i]);
        const seg = new THREE.Mesh(new THREE.BoxGeometry(LEN[i], .048 - i*.012, .05 - i*.012), clayMat(IRON));
        seg.position.set(px + dx*LEN[i]/2, py + dy*LEN[i]/2, 0); seg.rotation.z = -sx*TH[i]; hd.add(seg);
        px += dx*LEN[i]; py += dy*LEN[i];
      }
      const tip = new THREE.Mesh(new THREE.ConeGeometry(.020,.085,6), clayMat(IRON));
      const t3 = .48, dx = Math.cos(t3)*sx, dy = -Math.sin(t3);
      tip.position.set(px + dx*.042, py + dy*.042, 0); tip.rotation.z = -sx*(Math.PI/2 + t3); hd.add(tip);
    });
    g.scale.setScalar(1.18);
  } else if (id === 'seed') {
    const bag = new THREE.Mesh(new THREE.SphereGeometry(.12,8,8), clayMat(0xcaa06a)); bag.position.y = .08; bag.scale.set(1,1.15,1); g.add(bag);
    g.scale.setScalar(1.25);
  } else if (id === 'water') {
    const body = new THREE.Mesh(new THREE.CylinderGeometry(.11,.12,.2,10), clayMat(T.can)); body.position.y = .18; g.add(body);
    const spout = new THREE.Mesh(new THREE.CylinderGeometry(.02,.035,.22,6), clayMat(T.can)); spout.position.set(.15,.26,0); spout.rotation.z = -.9; g.add(spout);
    g.scale.setScalar(1.25);
  } else if (id === 'sickle') {
    const top = handle(.30,.034);
    const bl = new THREE.Group(); bl.position.y = top + .01; bl.rotation.y = .10; g.add(bl);
    const TH = [.06,.28,.60], LEN = [.15,.12,.10], W = [.055,.045,.030];
    let px = 0, py = 0;
    for (let i = 0; i < 3; i++) {
      const dx = Math.sin(TH[i]), dy = Math.cos(TH[i]);
      const seg = new THREE.Mesh(new THREE.BoxGeometry(W[i], LEN[i], .016), clayMat(STEEL));
      seg.position.set(px + dx*LEN[i]/2, py + dy*LEN[i]/2, 0); seg.rotation.z = -TH[i]; bl.add(seg);
      const edge = new THREE.Mesh(new THREE.BoxGeometry(.013, LEN[i]*.94, .012), clayMat(EDGE));
      edge.position.set(px + dx*LEN[i]/2 + dy*(W[i]/2), py + dy*LEN[i]/2 - dx*(W[i]/2), 0); edge.rotation.z = -TH[i]; bl.add(edge);
      px += dx*LEN[i]; py += dy*LEN[i];
    }
    const ferrule = new THREE.Mesh(new THREE.CylinderGeometry(.030,.036,.06,7), clayMat(STEEL)); ferrule.position.y = top - .01; g.add(ferrule);
    g.scale.setScalar(1.18);
  } else if (id === 'shovel') {
    const top = handle(.58);
    const collar = new THREE.Mesh(new THREE.CylinderGeometry(.034,.042,.07,7), clayMat(STEEL)); collar.position.y = top + .01; g.add(collar);
    const bw = .105, bh = .13, sh = new THREE.Shape();
    sh.moveTo(-bw,0); sh.lineTo(-bw,bh); sh.absarc(0,bh,bw,Math.PI,0,true); sh.lineTo(bw,0); sh.closePath();
    const bladeGeo = new THREE.ExtrudeGeometry(sh, { depth:.03, bevelEnabled:true, bevelThickness:.012, bevelSize:.012, bevelSegments:3, curveSegments:14 });
    bladeGeo.translate(0,0,-.015);
    const blade = new THREE.Mesh(bladeGeo, clayMat(STEEL,false)); blade.position.y = top + .03; g.add(blade);
    g.scale.setScalar(1.18);
  } else if (id === 'hammer') {
    const top = handle(.50);
    const head = new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,.20,8), clayMat(STEEL)); head.position.y = top - .04; head.rotation.z = Math.PI/2; g.add(head);
    [-1,1].forEach(sx => {
      const cap = new THREE.Mesh(new THREE.CylinderGeometry(.062,.058,.03,8), clayMat(EDGE));
      cap.position.set(sx*.105, top - .04, 0); cap.rotation.z = Math.PI/2; g.add(cap);
    });
    const pin = new THREE.Mesh(new THREE.SphereGeometry(.022,6,5), clayMat(GRIP)); pin.position.y = top + .022; g.add(pin);
    g.scale.setScalar(1.18);
  } else if (id === 'rod') {
    const rknob = new THREE.Mesh(new THREE.SphereGeometry(.040,7,6), clayMat(GRIP)); rknob.position.y = -.09; g.add(rknob);
    const rear = new THREE.Mesh(new THREE.CylinderGeometry(.026,.030,.20,7), clayMat(GRIP)); rear.position.y = -.01; g.add(rear);
    const poleG = new THREE.Group(); poleG.position.y = .08; poleG.rotation.z = -.12; g.add(poleG);
    const RL = .92;
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(.013,.026,RL,6), clayMat(T.pole)); pole.position.y = RL/2; poleG.add(pole);
    const lineG = new THREE.Group(); lineG.position.y = RL; lineG.rotation.z = .12; poleG.add(lineG);
    const line = new THREE.Mesh(new THREE.CylinderGeometry(.006,.006,.34,5), clayMat(0xe8e4d8)); line.position.y = -.17; lineG.add(line);
    const bob = new THREE.Mesh(new THREE.SphereGeometry(.042,8,7), clayMat(0xd94f4f)); bob.position.y = -.38; bob.scale.set(1,1.25,1); lineG.add(bob);
    g.scale.setScalar(1.25);
  } else if (id === 'net') {
    const h = wood(.62); h.position.y = .2; g.add(h);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(.17,.018,6,14), clayMat(0xdfe6ea)); ring.position.y = .6; ring.rotation.x = Math.PI/2; g.add(ring);
    const bag = new THREE.Mesh(new THREE.ConeGeometry(.16,.3,10,1,true),
      new THREE.MeshStandardMaterial({ color:0xfaffff, transparent:true, opacity:.45, roughness:1, side:THREE.DoubleSide }));
    bag.position.y = .74; g.add(bag);
    g.scale.setScalar(1.25);
  }
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return g;
}

// ══════════════════════════════════════════════════════════════
//  조정안 파라미터 — VARIANTS 가 ① 현재(게임값) 위에 덮어쓴다
// ══════════════════════════════════════════════════════════════
const BASE = {
  grip: {},            // 도구별 쥐는 점 {y: 도구를 자루 따라 내림, x, z, rx, rz}
  restX: -.12, restZ: -.16,
  wristMax: WRIST_MAX, wristEnv: false,
  slash: { ...SLASH },
  pourLift: -.9, pourTilt: 1.1,
  twistBack: .42, twist: .55,   // 몸 비틀기(와인드업 / 벰) — 몸 전체가 돌아 팔·도구와의 상대 위치는 그대로
  wing: { hx: 0, hy: 0, hz: 0, restZ: .20 },
};
// ── 조정안 — 이 시뮬의 격자 탐색으로 찾은 값(동물 7 × 도구 9 × 동작 전 구간 관통률 측정) ──
const LONG = ['axe','hoe','sickle','shovel','hammer','rod','net'];
const gripAll = (g) => Object.fromEntries(LONG.map(t => [t, { ...g }]));
const HANG = { water: { x:.08, y:.30, z:.08, ry:-.8 },   // 통 윗단을 쥐고 매닮 · 주둥이는 바깥-앞 대각선(41° 카메라에서 읽히게)
               seed:  { x:.08, y:.20, z:.08 } };          // 주머니 목을 쥐고 매닮
const HANG_WING = { water: { x:.06, y:.22, z:.06, ry:-.8 }, seed: { x:.06, y:.14, z:.06 } };   // 🐤 키가 작아 덜 늘어뜨림
const PROP = {
  ...BASE,
  grip: { ...gripAll({ z:.075, y:.07 }), ...HANG },  // 자루를 발바닥 앞쪽으로 — 팔뚝 속을 안 지나감 · 끝 혹이 주먹 아래로
  restX: .12, restZ: -.05,
  // 스윙(팔 궤적·손목·몸 비틀기)은 원본 유지 — 사용자 결정 2026-09-23(휘두르는 모션은 바꾸지 않는다)
  // 🐤 병아리는 ① 현재 그대로(사용자 결정 2026-09-23) — 날개 보정 후보는 WING_ALT 에 보관
};
const WING_ALT = {   // 검토했지만 채택 안 함: 날개 끝 바깥·앞에서 쥐고(관통 79%→6%) 베기 폭 따로
  wing: { hx: .18, hy: 0, hz: .30, restZ: -.05 },
  gripWing: { ...gripAll({ z:0, y:.07 }), ...HANG_WING },
  slashWing: { back: 1.10, strike: -.15, lift: -1.50 },
};
// 기각된 스윙 수정안(2026-09-23) — 비교용으로만 남긴다: 팔은 몸 앞까지만 쓸고 몸 비틀기로 폭 보충
const SWING_ALT = { ...PROP, wristEnv: true, slash: { back: 1.10, strike: -.45, lift: -1.20 }, twist: .90 };
const FADE = { ...PROP, gripFade: true };
// 2026-09-27 감싸 쥐기 후보 — 모두 ④(스윙 원본) 위에 얹는다
const WRAP_A = { ...FADE, wrap: 'knuckle' };
const WRAP_B = { ...FADE, wrap: 'fist' };
const WRAP_C = { ...FADE, wrap: 'fistThumb' };
const WRAP_B2 = { ...FADE, wrap: 'fistLines' };
const WRAP_B3 = { ...FADE, wrap: 'fistThumbWrap' };
const WRAP_B4 = { ...FADE, wrap: 'fistFull' };
const WRAP_H1 = { ...FADE, wrap: 'hole' };
const WRAP_H2 = { ...FADE, wrap: 'holeLines' };
const HOLE_RIM = { ...FADE, hole: 'rim', gripZk: .49 };
const SOFTHOLE_1 = { ...FADE, gripZk: .49, dimple: { mode: 'hole', r1: 1.08, r2: 2.4, ao: 0 } };
const SOFTHOLE_2 = { ...FADE, gripZk: .49, dimple: { mode: 'hole', r1: 1.05, r2: 1.7, ao: 0 } };
const SOFTHOLE_3 = { ...FADE, gripZk: .49, dimple: { mode: 'hole', r1: 1.05, r2: 1.7, ao: .35 } };
const DIMPLE_1 = { ...FADE, gripZk: .49, dimple: { depth: .22, inf: 2.3, ao: .35, lip: 0 } };
const DIMPLE_2 = { ...FADE, gripZk: .49, dimple: { depth: .38, inf: 2.8, ao: .55, lip: 0 } };
const DIMPLE_3 = { ...FADE, gripZk: .49, dimple: { depth: .38, inf: 2.8, ao: .55, lip: .06 } };
const HOLE_DARK = { ...FADE, hole: 'dark', gripZk: .49 };
const HOLE_DEEP = { ...FADE, hole: 'deep', gripZk: .49 };
const CENTER = { ...FADE, restX: .35, grip: { ...gripAll({ z:0, y:.07 }), ...HANG } };
// 2026-09-28 게임 적용안 — ④ + 자루 앞 오프셋을 발바닥 반지름 × 0.67(토끼 비율)로 (js/data/grip.js)
const APPLIED = { ...FADE, gripZk: .67 };
const VARIANTS = [
  { key:'applied', title:'⑤ 적용(토끼 비율)', sub:'자루가 발바닥 앞 가장자리에 걸림', P: APPLIED },
  { key:'fade', title:'④ 이전 게임',     sub:'자루가 발바닥 가장자리를 꿰뚫음', P: FADE },
  { key:'a',    title:'A 손가락 마디',   sub:'자루 앞쪽에 마디 4개', P: WRAP_A },
  { key:'b',    title:'B 주먹',          sub:'자루를 따라 쥔 주먹 하나', P: WRAP_B },
  { key:'c',    title:'C 주먹+엄지',     sub:'B + 엄지', P: WRAP_C },
  { key:'d',    title:'D 가운데 쥐기',   sub:'메시 추가 없이 발바닥 한가운데', P: CENTER },
];
// 이전 비교(①원본·②·③스윙 수정안)는 BASE·PROP·SWING_ALT 로 남아 있다

// ══════════════════════════════════════════════════════════════
//  리그 조립 — buildAnimalMesh(몸·배·머리·팔) 발췌
// ══════════════════════════════════════════════════════════════
function buildRig(P) {
  if (ANIMAL.wings && !P.gripWing) P = BASE;   // 🐤 날개 보정이 없는 안은 게임처럼 원본 자세(쥐는 점·스윙·손목 전부)
  const a = ANIMAL, R = a.bodyR, HR = a.headR, HY = a.headY, bs = a.bodyScale;
  const bodyY = R*bs[1] + .02;
  const root = new THREE.Group();
  const anchor = new THREE.Group(); root.add(anchor);
  const body = new THREE.Mesh(new THREE.SphereGeometry(R,32,24), plushMat(a.body));
  body.position.y = bodyY; body.scale.set(...bs); body.castShadow = true; anchor.add(body);
  const cols = [{ m: body, k: 'sphere', r: R, tag: 'body' }];
  const belly = new THREE.Mesh(new THREE.SphereGeometry(R*.62,24,18), plushMat(a.belly));
  belly.position.set(0, bodyY - R*.16, R*.55); belly.scale.set(1,1.1,.6); anchor.add(belly);
  const headG = buildAnimalHead(a.id, { HR, HY, body:a.body, belly:a.belly }); anchor.add(headG);
  cols.push({ m: headG, k: 'sphere', r: 1, tag: 'head' });
  if (a.band) [-1,1].forEach(s => {
    const b = new THREE.Mesh(new THREE.SphereGeometry(R*.34,10,8), clayMat(0x2a2a2a,false));
    b.scale.set(.5,.8,.78); b.position.set(s*R*.78, bodyY + R*.22, 0); anchor.add(b);
  });
  let armR, armL;
  if (a.wings) {
    const WLEN = 1.15, halfH = R*.34*.85;
    const mkWing = (side) => {
      const pivot = new THREE.Group(); pivot.rotation.order = 'YXZ';
      pivot.position.set(side*R*.90, bodyY + R*.28, R*.05);
      const aim = new THREE.Group(); aim.rotation.z = -side*.20; pivot.add(aim);
      const w = new THREE.Mesh(new THREE.SphereGeometry(R*.34,10,8), clayMat(0xffd23a,false));
      w.scale.set(.30, .85*WLEN, .75);
      w.position.set(side*R*.02, -(halfH*WLEN) + R*.08, 0); w.castShadow = true; aim.add(w);
      cols.push({ m: w, k: 'sphere', r: R*.34, tag: side > 0 ? 'armR' : 'armL' });
      const hand = new THREE.Group();
      hand.position.set(side*P.wing.hx*R, -(halfH*2*WLEN) + R*.12 + P.wing.hy*R, R*.04 + P.wing.hz*R);
      aim.add(hand);
      return { pivot, hand, aim, paw: null, gripR: R*.14 };
    };
    armR = mkWing(1); armL = mkWing(-1);
  } else {
    const mkArm = (side) => {
      const pivot = new THREE.Group(); pivot.rotation.order = 'YXZ';
      pivot.position.set(side*R*.85*bs[0], bodyY + R*.54, R*.20);
      const aim = new THREE.Group(); aim.quaternion.copy(side > 0 ? ARM_AIM_R : ARM_AIM_L); pivot.add(aim);
      const ar = R*.23, al = R*.32;
      const upper = new THREE.Mesh(new THREE.CapsuleGeometry(ar, al, 4, 8), a.armColor ? clayMat(a.armColor,false) : plushMat(a.body));
      upper.position.y = -(al/2 + ar*.4); upper.castShadow = true; aim.add(upper);
      cols.push({ m: upper, k: 'capsule', r: ar, h: al, tag: side > 0 ? 'armR' : 'armL' });
      // 🫳 V안(자루 자리 파기): 오른손 발바닥만 세분화를 올리고 정점색을 켠다 — placeDimple 이 매 프레임 변형
      const dimple = side > 0 && P.dimple && !a.wings;
      const pawGeo = new THREE.SphereGeometry(ar*1.06, dimple ? 28 : 10, dimple ? 22 : 8);
      const pawMat = clayMat(a.ear, false);
      if (dimple) {
        pawGeo.userData.base = pawGeo.attributes.position.array.slice();
        pawGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(pawGeo.attributes.position.count * 3).fill(1), 3));
        pawMat.vertexColors = true;
      }
      const paw = new THREE.Mesh(pawGeo, pawMat);
      paw.position.y = -(al + ar*.9); paw.castShadow = true; aim.add(paw);
      if (side < 0) cols.push({ m: paw, k: 'sphere', r: ar*1.06, tag: 'armL' });   // 오른손 발바닥은 쥐는 자리 — 제외
      const hand = new THREE.Group(); hand.position.y = -(al + ar*.9); aim.add(hand);
      return { pivot, hand, aim, paw, gripR: ar*1.06 };
    };
    armR = mkArm(1); armL = mkArm(-1);
  }
  anchor.add(armR.pivot, armL.pivot);

  // 도구: hand → gripG(쥐는 자세 회전) → off(쥐는 점 보정) → mesh
  const gripG = new THREE.Group(); armR.hand.add(gripG);
  const off = new THREE.Group(); gripG.add(off);
  const tool = toolMesh(TOOL); off.add(tool);
  const gp = ((a.wings && P.gripWing) || P.grip)[TOOL] || {};
  // gripZk: 긴 도구의 앞 오프셋을 발바닥 반지름 비례로(작은 발에서 자루가 가장자리를 스치면 구멍 입·출구가 겹친다)
  const gz = (P.gripZk && !a.wings && LONG.includes(TOOL)) ? P.gripZk * armR.gripR : (gp.z || 0);
  off.position.set(gp.x || 0, -(gp.y || 0), gz);
  off.rotation.set(gp.rx || 0, gp.ry || 0, gp.rz || 0);
  // 🕳️ 관통 구멍 — 자루가 발바닥 구를 드나드는 두 지점에 구멍 입구(applyPose 가 매 프레임 자루 선에 맞춤)
  let holes = null;
  if (!a.wings && P.hole && LONG.includes(TOOL)) {
    holes = [0, 1].map(() => buildHole(a, P.hole));
    holes.forEach(h => armR.hand.add(h));
  }
  // ✊ 감싸 쥐기 — 자루를 따라 붙는 발바닥색 조형(off 의 자식이라 자루와 같이 움직인다)
  let wrap = null;
  if (!a.wings && P.wrap && LONG.includes(TOOL)) {
    wrap = buildWrap(P.wrap, armR.gripR, a);
    wrap.position.y = gp.y || 0;          // 발바닥 중심과 같은 높이의 자루 지점
    off.add(wrap);
  }
  const qRestOrig = (a.wings ? new THREE.Quaternion().setFromAxisAngle(_axZ, BASE.wing.restZ) : ARM_AIM_R.clone().invert())
    .multiply(new THREE.Quaternion().setFromAxisAngle(_axX, BASE.restX))
    .multiply(new THREE.Quaternion().setFromAxisAngle(_axZ, BASE.restZ));
  const qRest = (a.wings
    ? new THREE.Quaternion().setFromAxisAngle(_axZ, P.wing.restZ)
    : ARM_AIM_R.clone().invert())
    .multiply(new THREE.Quaternion().setFromAxisAngle(_axX, P.restX))
    .multiply(new THREE.Quaternion().setFromAxisAngle(_axZ, P.restZ));
  return { root, anchor, R: armR, L: armL, gripG, off, tool, wrap, holes, P, qRest, qRestOrig, offP: off.position.clone(), bodyY, cols };
}

// 구멍 입구 한 개 — 자루(원기둥)와 발바닥(구)의 실제 교선 위에 그린다(평평한 원판은 가장자리에서 떴다).
//   dark: 자루 둘레 틈(어둡게) · lip: 그 바깥 테두리 띠(밝게). 정점은 placeHoles 가 매 프레임 구 표면에 찍는다
const HOLE_N = 24;
function buildHole(a, style) {
  const g = new THREE.Group();
  const base = new THREE.Color(a.armColor || a.ear);
  const mk = (count, idx, mat) => {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(count * 3), 3));
    geo.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(count * 3), 3));
    geo.setIndex(idx);
    const m = new THREE.Mesh(geo, mat); m.frustumCulled = false; g.add(m); return m;
  };
  // 틈: 중심 1 + 테두리 N 부채꼴
  const fan = []; for (let k = 0; k < HOLE_N; k++) fan.push(0, 1 + k, 1 + (k + 1) % HOLE_N);
  g.userData.dark = mk(HOLE_N + 1, fan, new THREE.MeshStandardMaterial({ color: base.clone().multiplyScalar(style === 'deep' ? .22 : .38), roughness: 1,
    side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }));
  if (style !== 'dark') {
    const band = []; for (let k = 0; k < HOLE_N; k++) { const a0 = k, a1 = (k + 1) % HOLE_N; band.push(a0, HOLE_N + a0, a1, a1, HOLE_N + a0, HOLE_N + a1); }
    g.userData.lip = mk(HOLE_N * 2, band, new THREE.MeshStandardMaterial({ color: base.clone().multiplyScalar(1.15), roughness: .95,
      side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -3 }));
  }
  g.userData.gap = style === 'deep' ? 1.55 : 1.35;
  return g;
}

// 감싸 쥐기 조형 — pr = 발바닥 반지름. 자루 축 = 로컬 y, 발바닥 중심은 -z 쪽(자루가 발바닥 앞에 있으므로)
function buildWrap(kind, pr, a) {
  const g = new THREE.Group();
  const mat = clayMat(a.armColor || a.ear, false);
  const HR = .042;                       // 자루+그립 밴드 바깥 반지름(도구 배율 1.18 반영)
  const put = (geo, x, y, z, sx = 1, sy = 1, sz = 1) => {
    const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.scale.set(sx, sy, sz);
    m.castShadow = true; g.add(m); return m;
  };
  if (kind === 'hole' || kind === 'holeLines') {
    // 구멍 주먹 — 가운데가 뚫린 회전체(Lathe). 위아래 입구 테두리가 자루 쪽으로 말려 들어가
    //   "자루가 표면을 뚫는" 대신 "주먹 구멍을 지나가는" 그림이 된다. 자루와 같은 축(z 이동 없음)
    const rO = pr * .68, H = pr * .95, ri = HR + .006, lip = pr * .16;
    const prof = [
      [ri, H - lip], [ri + .004, H], [rO * .55, H * .985], [rO * .88, H * .80], [rO, H * .42],
      [rO, -H * .42], [rO * .88, -H * .80], [rO * .55, -H * .985], [ri + .004, -H], [ri, -H + lip], [ri, H - lip],
    ].map(([x, y]) => new THREE.Vector2(x, y)).reverse();   // 아래→위 순서여야 면이 바깥을 향한다(반대면 뒤집힌 컵처럼 보임)
    put(new THREE.LatheGeometry(prof, 20), 0, 0, 0);
    // 입구 안쪽 그늘 — 자루와 구멍 벽 사이 틈이 어둡게 보여야 "구멍"으로 읽힌다
    const dark = new THREE.MeshStandardMaterial({ color: new THREE.Color(a.armColor || a.ear).multiplyScalar(.35), roughness: 1, side: THREE.DoubleSide });
    const inner = new THREE.Mesh(new THREE.CylinderGeometry(ri - .001, ri - .001, 2 * (H - lip * .4), 14, 1, true), dark);
    g.add(inner);
    if (kind === 'holeLines') {
      const c = new THREE.Color(a.armColor || a.ear).multiplyScalar(.55);
      const lm = clayMat(c.getHex(), false), ARC = Math.PI * .45;
      for (let i = 0; i < 3; i++) {
        const t = new THREE.Mesh(new THREE.TorusGeometry(rO * .995, rO * .028, 4, 12, ARC), lm);
        t.rotation.set(Math.PI / 2, 0, Math.PI / 2 - ARC / 2);
        t.position.set(0, (i - 1) * H * .30, 0);
        g.add(t);
      }
    }
  } else if (kind === 'knuckle') {
    const fr = pr * .30;
    for (let i = 0; i < 4; i++) put(new THREE.SphereGeometry(fr, 10, 8), 0, (i - 1.5) * fr * 1.25, HR + fr * .45, 1.25, .8, .9);
  } else {
    const r = pr * .62, len = pr * .55;
    const flat = kind === 'fistFull';
    const fist = put(new THREE.CapsuleGeometry(r, len, 4, 12), 0, 0, -pr * .12, flat ? 1.12 : 1, 1, flat ? .84 : 1);
    if (kind === 'fistThumb') put(new THREE.SphereGeometry(pr * .30, 10, 8), pr * .30, len / 2 + r * .55, r * .35, 1, .8, 1.2);
    // 마디선 — 주먹 앞 반쪽을 두르는 가는 호 3줄(살짝 어두운 색). 구슬(A)과 달리 덩어리를 더하지 않는다
    if (kind === 'fistLines' || kind === 'fistFull') {
      // v2: 앞쪽 80°만 · 더 가늘고 어둡게 — 길게 두르면 자루에 감은 끈처럼 읽혔다(1차 시안)
      const c = new THREE.Color(a.armColor || a.ear).multiplyScalar(.55);
      const lm = clayMat(c.getHex(), false);
      const zc = -pr * .12, rz = flat ? .84 : 1, rx = flat ? 1.12 : 1;
      const ARC = Math.PI * .45;
      for (let i = 0; i < 3; i++) {
        const t = new THREE.Mesh(new THREE.TorusGeometry(r * .995, r * .028, 4, 12, ARC), lm);
        t.rotation.set(Math.PI / 2, 0, Math.PI / 2 - ARC / 2);
        t.scale.set(rx, 1, rz);   // 납작 주먹이면 호도 같이 눌러 표면에 붙인다(회전 후 x·z)
        t.position.set(0, (i - 1) * len * .62, zc);
        g.add(t);
      }
    }
    // 감싼 엄지 — 자루 앞을 비스듬히 덮는 짧은 캡슐(위에 얹은 혹이 아니라 자루를 가로지른다)
    if (kind === 'fistThumbWrap' || kind === 'fistFull') {
      // v2: 짧고 통통하게 · 더 파묻기 — 가늘고 길면 소시지를 붙인 것처럼 보였다(1차 시안)
      const th = put(new THREE.CapsuleGeometry(pr * .25, pr * .20, 4, 10), pr * .04, len * .50, (flat ? r * .84 : r) * .62 - pr * .12);
      th.rotation.z = .85;
    }
    void fist;
  }
  return g;
}

// ── 제스처 — game.js updatePlayer 의 도구질 분기 발췌 ──
const _q = new THREE.Quaternion(), _q2 = new THREE.Quaternion(), _q3 = new THREE.Quaternion(), _dir = new THREE.Vector3();
function applyPose(rig, p, active) {
  const { anchor, R: Ra, L: La, P } = rig;
  const s = Math.sin(p*Math.PI);
  anchor.rotation.set(0,0,0); anchor.position.y = 0; anchor.scale.set(1,1,1);
  Ra.pivot.rotation.set(0,0,0); La.pivot.rotation.set(0,0,0);
  let wristK = 0, pour = 0, digK = 0;
  if (active) {
    if (TOOL === 'shovel') {
      const eo = q => 1 - (1-q)*(1-q);
      const seg = (a,b) => Math.max(0, Math.min(1, (p-a)/(b-a)));
      const lp = (a,b,q) => a + (b-a)*q;
      const a = eo(seg(0,.22)), lv = eo(seg(.32,.62)), th = eo(seg(.62,.82)), k = 1 - eo(seg(.82,1));
      const stomp = Math.sin(seg(.22,.32)*Math.PI);
      const armX = lp(lp(-1.25*a, -.55, lv), -.35, th);
      Ra.pivot.rotation.set(armX*k, -.9*th*k, .12*a*k);
      La.pivot.rotation.set(armX*.92*k, -.6*th*k, -.32*a*k);
      anchor.rotation.x = lp(lp(.30*a, -.26, lv), -.10, th)*k + stomp*.12;
      anchor.rotation.y = -.60*th*k;
      anchor.position.y = -(stomp*.16 + .05*a*k);
      anchor.scale.set(1 + stomp*.08, 1 - stomp*.10, 1 + stomp*.08);
      _dir.set(lp(lp(0,0,lv), -.75, th), lp(lp(-.92,-.30,lv), .05, th), lp(lp(.40,.95,lv), .66, th)).normalize();
      digK = a*k;
    } else {
      let k;
      if (TOOL === 'water' || TOOL === 'seed') {
        Ra.pivot.rotation.set(P.pourLift*s, 0, 0);
        k = 0; pour = s*P.pourTilt;
      } else {
        const SL = (ANIMAL.wings && P.slashWing) || P.slash;
        const yaw = slashPhase(p, SL.back, SL.strike);
        Ra.pivot.rotation.set(SL.lift*s, yaw, 0);
        k = yaw / SL.back;
        // 원본: |k| 비례 → 정면(yaw≈0)을 지날 때 손목이 0 이 돼 자루가 얼굴 앞에서 수직으로 선다
        wristK = P.wristEnv ? Math.min(1, s*1.6) * P.wristMax : Math.min(1, Math.abs(k)*1.25) * P.wristMax;
      }
      La.pivot.rotation.set(-Math.abs(k)*.35, -k*.50, Math.max(0,-k)*.40);
      anchor.rotation.x = .18*s;
      const tw = pour ? BASE.twist : P.twist;   // 비틀기 확대는 베기만 — 붓기까지 돌면 조리개가 몸 뒤로 숨는다
      anchor.rotation.y = p < .32 ? P.twistBack*(p/.32) : -tw*s;
      anchor.position.y = -s*.1;
      anchor.scale.set(1 + s*.06, 1 - s*.07, 1 + s*.06);
    }
  }
  // gripFade: 베기 동안(s) 쥐는 점·자세를 원본으로 되돌림 — 스윙 궤적을 원본과 똑같이 유지
  const fade = P.gripFade && active && !pour && digK === 0 ? s : 0;
  rig.off.position.copy(rig.offP).multiplyScalar(1 - fade);
  // ✊ 휘두르는 동안 주먹은 발바닥 속으로 줄어든다 — 스윙 중 손은 지금과 똑같이(혹 방지). 2/3 지점에서 완전히 숨음
  if (rig.wrap) { const w = Math.max(0, 1 - fade * 1.5); rig.wrap.scale.setScalar(w); rig.wrap.visible = w > .01; }
  _q3.slerpQuaternions(rig.qRest, rig.qRestOrig, fade);
  _q.slerpQuaternions(_q3, TOOL_QSWING, wristK);
  if (pour) _q.multiply(_q2.setFromAxisAngle(_axX, pour));
  if (digK > 0) {
    rig.root.updateWorldMatrix(true, true);
    Ra.hand.getWorldQuaternion(_q2); rig.root.getWorldQuaternion(_q3);
    const dq = new THREE.Quaternion().setFromUnitVectors(_up, _dir).premultiply(_q3).premultiply(_q2.invert());
    _q.slerp(dq, digK);
  }
  rig.gripG.quaternion.copy(_q);
  if (rig.holes) placeHoles(rig);
  if (rig.P.dimple && rig.R.paw && rig.R.paw.geometry.userData.base) placeDimple(rig);
}

// 자루 축(off 원점 + gripG 의 y 축)과 발바닥 구(손 원점, 반지름 pr)의 두 교점 둘레에 구멍 교선을 그린다
const _hP = new THREE.Vector3(), _hD = new THREE.Vector3(), _hU = new THREE.Vector3(), _hV = new THREE.Vector3(), _hO = new THREE.Vector3(), _hX = new THREE.Vector3();
const HANDLE_R = .036;   // 발바닥 표면 높이에서의 자루 반지름(도구 배율 1.18 반영 근사)
// 자루와 평행한 선(원점 o)이 구와 만나는 점 — sgn +1 위쪽 입구 / -1 아래쪽 출구. 못 만나면 null
function hitSphere(o, D, pr, sgn, out) {
  const b = o.dot(D), c = o.lengthSq() - pr * pr, disc = b * b - c;
  if (disc < 0) return null;
  return out.copy(D).multiplyScalar(-b + sgn * Math.sqrt(disc)).add(o);
}
function placeHoles(rig) {
  const pr = rig.R.gripR;
  _hP.copy(rig.off.position).applyQuaternion(rig.gripG.quaternion);
  _hD.set(0, 1, 0).applyQuaternion(rig.gripG.quaternion);
  _hU.set(1, 0, 0); if (Math.abs(_hU.dot(_hD)) > .9) _hU.set(0, 0, 1);
  _hU.addScaledVector(_hD, -_hU.dot(_hD)).normalize(); _hV.crossVectors(_hD, _hU);
  rig.holes.forEach((h, i) => {
    const sgn = i ? -1 : 1, gap = h.userData.gap;
    const put = (attr, nrm, idx, r, ang) => {   // 자루 축에서 r 떨어진 평행선의 교점을 표면에 찍는다
      // 발바닥이 작아 테두리가 가장자리 밖으로 나가면 그 방향만 반지름을 줄여 가장자리에 붙인다(입구 전체를 숨기지 않게)
      let hit = false;
      for (let tries = 0; tries < 12 && !hit; tries++, r *= .9) {
        _hO.copy(_hP);
        if (r > 0) _hO.addScaledVector(_hU, Math.cos(ang) * r).addScaledVector(_hV, Math.sin(ang) * r);
        hit = !!hitSphere(_hO, _hD, pr * .995, sgn, _hX);
        if (r === 0) break;
      }
      if (!hit) return false;
      const n = _hX.length();
      attr.setXYZ(idx, _hX.x / n * pr * 1.003, _hX.y / n * pr * 1.003, _hX.z / n * pr * 1.003);
      nrm.setXYZ(idx, _hX.x / n, _hX.y / n, _hX.z / n);
      return true;
    };
    const dark = h.userData.dark, dp = dark.geometry.attributes.position, dn = dark.geometry.attributes.normal;
    let ok = put(dp, dn, 0, 0, 0);
    for (let k = 0; ok && k < HOLE_N; k++) ok = put(dp, dn, 1 + k, HANDLE_R * gap, k / HOLE_N * Math.PI * 2);
    const lip = h.userData.lip;
    if (ok && lip) {
      const lp = lip.geometry.attributes.position, ln = lip.geometry.attributes.normal;
      for (let k = 0; ok && k < HOLE_N; k++) {
        const ang = k / HOLE_N * Math.PI * 2;
        ok = put(lp, ln, k, HANDLE_R * gap, ang) && put(lp, ln, HOLE_N + k, HANDLE_R * gap * 1.28, ang);
      }
      lp.needsUpdate = ln.needsUpdate = true;
    }
    dp.needsUpdate = dn.needsUpdate = true;
    h.visible = ok;   // 자루가 표면을 스치듯 지나 교선이 끊기면 그 입구는 숨긴다
  });
}

// 🫳 자루 자리 파기 — 발바닥 정점 중 자루 축에 가까운 것을 안쪽으로 부드럽게 눌러 넣는다(찰흙에 막대를 꽂은 모양).
//   거리 d(정점↔자루 축)가 자루 반지름 근처면 깊게, inf 까지 매끄럽게 0. 깊이에 비례해 정점색을 어둡게(틈 그늘).
//   lip>0 이면 파인 둘레를 살짝 도톰하게 올린다
function placeDimple(rig) {
  const P = rig.P.dimple, paw = rig.R.paw, geo = paw.geometry, base = geo.userData.base;
  const pos = geo.attributes.position, col = geo.attributes.color;
  _hP.copy(rig.off.position).applyQuaternion(rig.gripG.quaternion);
  _hD.set(0, 1, 0).applyQuaternion(rig.gripG.quaternion);
  const hr = HANDLE_R, inf = hr * P.inf;
  for (let i = 0; i < pos.count; i++) {
    _hO.set(base[i*3], base[i*3+1], base[i*3+2]);
    _hX.copy(_hO).sub(_hP);
    const d = _hX.addScaledVector(_hD, -_hX.dot(_hD)).length();   // 정점에서 자루 축까지 거리
    if (P.mode === 'hole') {
      // ⭕ 자루 자리만 구멍 — 축에서 R2 안쪽 정점을 축 바깥으로 밀어 [0,R2] → [R1,R2] 로 옮긴다.
      //   자루를 두른 매끈한 원형 입구(반지름 R1)가 생기고, 원래 들쭉날쭉하던 교선이 사라진다
      const R1 = hr * P.r1, R2 = hr * P.r2;
      let nd = d, shade = 1;
      if (d < R2 && d > 1e-6) {
        nd = R1 + d * (R2 - R1) / R2;
        _hX.multiplyScalar((nd - d) / d);                  // _hX = 축에 수직인 성분 → 바깥으로 밀 만큼
        if (P.ao) shade = 1 - P.ao * (1 - (nd - R1) / (R2 - R1));
      } else _hX.set(0, 0, 0);
      pos.setXYZ(i, _hO.x + (d < R2 ? _hX.x : 0), _hO.y + (d < R2 ? _hX.y : 0), _hO.z + (d < R2 ? _hX.z : 0));
      col.setXYZ(i, shade, shade, shade);
      continue;
    }
    let k = 0;
    if (d < inf) { const q = Math.max(0, (d - hr * .6) / (inf - hr * .6)); k = 1 - q*q*(3 - 2*q); }
    let rim = 0;
    if (P.lip && d >= inf * .75 && d < inf * 1.35) rim = Math.sin((d - inf * .75) / (inf * .6) * Math.PI);
    const scale = 1 - k * P.depth + rim * P.lip;
    pos.setXYZ(i, _hO.x * scale, _hO.y * scale, _hO.z * scale);
    const shade = 1 - k * P.ao;
    col.setXYZ(i, shade, shade, shade);
  }
  pos.needsUpdate = col.needsUpdate = true;
  geo.computeVertexNormals();
}

// ── 관통 측정 — 도구 정점이 몸·머리 타원체(0.96 축소) 안에 든 비율 ──
const _v = new THREE.Vector3(), _w = new THREE.Vector3(), _h = new THREE.Vector3();
function toolVerts(rig) {
  if (rig._verts) return rig._verts;
  const out = [];
  rig.tool.traverse(o => {
    if (!o.isMesh) return;
    const n = o.geometry.attributes.position.count;
    for (let i = 0; i < n; i++) out.push({ o, i });
  });
  return (rig._verts = out);
}
const _inv = [];
function clipNow(rig) {
  rig.root.updateWorldMatrix(true, true);
  rig.cols.forEach((c, i) => { (_inv[i] ||= new THREE.Matrix4()).copy(c.m.matrixWorld).invert(); });
  const vs = toolVerts(rig), hit = { body: 0, head: 0, armR: 0, armL: 0 };
  rig.R.hand.getWorldPosition(_h);
  let n = 0;
  for (const { o, i } of vs) {
    _v.fromBufferAttribute(o.geometry.attributes.position, i).applyMatrix4(o.matrixWorld);
    if (_v.distanceTo(_h) < rig.R.gripR) continue;   // 주먹 속(쥔 부분)은 가려지는 게 정상
    let inside = false;
    for (let j = 0; j < rig.cols.length; j++) {
      const c = rig.cols[j];
      _w.copy(_v).applyMatrix4(_inv[j]);
      let d;
      if (c.k === 'sphere') d = _w.length() / c.r;
      else { const y = Math.max(-c.h/2, Math.min(c.h/2, _w.y)); d = Math.hypot(_w.x, _w.y - y, _w.z) / c.r; }
      if (d < .96) { hit[c.tag]++; inside = true; }
    }
    if (inside) n++;
  }
  const f = x => x / vs.length * 100;
  return { pct: f(n), body: f(hit.body), head: f(hit.head), arm: f(hit.armR + hit.armL) };
}
function clipProfile(rig) {
  let max = 0, sum = 0, n = 0, maxP = 0, head = 0;
  for (let p = 0; p <= 1.0001; p += .02) {
    applyPose(rig, p, true);
    const c = clipNow(rig);
    if (c.pct > max) { max = c.pct; maxP = p; }
    head = Math.max(head, c.head);
    sum += c.pct; n++;
  }
  applyPose(rig, 0, false);
  const idle = clipNow(rig).pct;
  return { max, mean: sum/n, maxP, idle, head };
}

function aimCam() {
  const h = innerHeight - $('ui').offsetHeight;
  renderer.setSize(innerWidth, h, false); renderer.domElement.style.height = h + 'px';
  camera.aspect = innerWidth / h; camera.updateProjectionMatrix();
  const n = focus < 0 ? VARIANTS.length : 1;
  const cx = focus < 0 ? 0 : (focus - (VARIANTS.length-1)/2) * SPACING;
  let d = Math.max(4.5, n*SPACING*.62 / Math.tan(camera.fov*Math.PI/360) / Math.min(camera.aspect, 2.2));
  let ty = .95, ox = 0;
  let tz = 0;
  if (closeUp && focus >= 0 && rigs[focus]) {   // 손 클로즈업 — 오른손을 화면 중앙에
    rigs[focus].root.updateWorldMatrix(true, true);
    rigs[focus].R.hand.getWorldPosition(_v);
    d = 2.3; ty = _v.y + .2; ox = _v.x - cx; tz = _v.z;
  } else if (closeUp) { d *= .8; ty = .75; }
  const el = camEl*Math.PI/180, az = camAz;
  controls.target.set(cx + ox, ty, tz);
  camera.position.set(cx + ox + Math.sin(az)*d*Math.cos(el), ty + d*Math.sin(el), tz + Math.cos(az)*d*Math.cos(el));
  controls.update();
}
addEventListener('resize', aimCam);

    el.style.display = r.root.visible ? '' : 'none';
    _v.set(r.root.position.x, 2.2, 0).project(camera);
    el.style.left = (rect.left + (_v.x*.5+.5)*rect.width) + 'px';
    el.style.top = Math.max(4, rect.top + (-_v.y*.5+.5)*rect.height) + 'px';
  });
}

// 📊 전체 측정 — 동물 7 × 도구 9 × 조정안별 동작 중 최대 관통률
function runMatrix() {
  const keepA = ANIMAL, keepT = TOOL;
  const rows = [];
  for (const a of ANIMALS) {
    ANIMAL = a;
    const row = { a: a.name, cells: [] };
    for (const t of Object.keys(TOOL_NAMES)) {
      TOOL = t;
      row.cells.push(VARIANTS.map(v => clipProfile(buildRig(v.P))));
    }
    rows.push(row);
  }
  ANIMAL = keepA; TOOL = keepT;
  window.__matrix = rows;
  const tools = Object.values(TOOL_NAMES).map(s => s.split(' ')[0]);
  $('hud').innerHTML = `<b>동작 중 최대 관통률(%)</b> — ${VARIANTS.map(v => v.title).join(' / ')}<table><tr><th></th>${tools.map(t => `<th>${t}</th>`).join('')}</tr>` +
    rows.map(r => `<tr><th>${r.a.split(' ')[0]}</th>${r.cells.map(c => `<td>${c.map(x => `<span class="${x.max > 1 ? 'r' : 'g'}">${x.max.toFixed(0)}</span>`).join('/')}</td>`).join('')}</tr>`).join('') + '</table>';
}

let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(.05, (now - last)/1000); last = now;
  if (playing) { p += dt * +$('spd').value / .417; if (p >= 1) p -= 1; $('scrub').value = p; }
  $('scrubV').textContent = p.toFixed(2);
  rigs.forEach((r, i) => { r.root.visible = focus < 0 || focus === i; applyPose(r, p, playing || p > 0); });
  controls.update();
  renderer.render(scene, camera);
  placeTags();
}
// 🖼️ 비교 시트 — 행=상황(동물·도구·진행도), 열=조정안. 같은 카메라로 한 칸씩 렌더해 격자로 붙인다
function drawSheet(cases, cw = 300, ch = 230) {
  const keep = { A: ANIMAL, T: TOOL, focus, closeUp };
  const cv = document.createElement('canvas');
  const head = 26, side = 150;
  cv.width = side + cw * VARIANTS.length; cv.height = head + ch * cases.length;
  const g = cv.getContext('2d');
  g.fillStyle = '#f4f7f1'; g.fillRect(0, 0, cv.width, cv.height);
  g.font = '600 14px -apple-system, sans-serif'; g.fillStyle = '#2f5e2f';
  VARIANTS.forEach((v, i) => g.fillText(v.title, side + i*cw + 10, 18));
  renderer.setSize(cw, ch, false); camera.aspect = cw / ch; camera.updateProjectionMatrix();
  cases.forEach((c, row) => {
    ANIMAL = ANIMALS.find(a => a.id === c.a); TOOL = c.t; rebuild();
    renderer.setSize(cw, ch, false); camera.aspect = cw / ch; camera.updateProjectionMatrix();
    rigs.forEach((r, i) => {
      rigs.forEach((o, j) => o.root.visible = j === i);
      applyPose(r, c.p, c.p > 0);
      r.root.updateWorldMatrix(true, true);
      const R = ANIMAL.bodyR, cx = r.root.position.x;
      const az = c.az ?? .35, el = (c.el ?? 34) * Math.PI/180, d = c.d ?? 4.4;
      let ty = .8, tx = cx + (c.dx ?? R*.2), tz = 0;
      if (c.hand) { r.R.hand.getWorldPosition(_v); tx = _v.x; ty = _v.y + .08; tz = _v.z; }
      camera.position.set(tx + Math.sin(az)*d*Math.cos(el), ty + d*Math.sin(el), tz + Math.cos(az)*d*Math.cos(el));
      camera.lookAt(tx, ty, tz);
      renderer.render(scene, camera);
      g.drawImage(renderer.domElement, side + i*cw, head + row*ch, cw, ch);
      const pr = clipNow(r);
      g.font = '600 12px -apple-system, sans-serif';
      g.fillStyle = pr.pct > 1 ? '#c0392b' : '#2f7a3a';
      g.fillText(`관통 ${pr.pct.toFixed(0)}%`, side + i*cw + 8, head + row*ch + ch - 8);
    });
    g.fillStyle = '#3a4a3a'; g.font = '600 13px -apple-system, sans-serif';
    c.label.split('\n').forEach((ln, k) => g.fillText(ln, 10, head + row*ch + ch/2 - 8 + k*18));
    g.strokeStyle = '#d5dfd2'; g.beginPath(); g.moveTo(0, head + row*ch); g.lineTo(cv.width, head + row*ch); g.stroke();
  });
  ANIMAL = keep.A; TOOL = keep.T; focus = keep.focus; closeUp = keep.closeUp; rebuild();
  let ov = document.getElementById('sheet');
  if (!ov) { ov = document.createElement('div'); ov.id = 'sheet';
    ov.style.cssText = 'position:fixed;inset:0;background:#f4f7f1;overflow:auto;z-index:9';
    document.body.appendChild(ov); }
  ov.innerHTML = '<button style="position:fixed;top:8px;right:10px;z-index:10" onclick="this.parentNode.remove()">✕ 닫기</button>';
  cv.style.cssText = 'display:block;margin:0 auto;max-width:100%;max-height:100%'; ov.appendChild(cv);
