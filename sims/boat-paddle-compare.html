<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>카약 노 시안</title>
<style>
body{margin:0;background:#4f6f76;font-family:system-ui,sans-serif;color:#fff}
main{max-width:1200px;margin:0 auto;padding:20px 16px 50px}
h1{font-size:22px;margin:0 0 4px}.lead{color:#e3eeec;font-size:13px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.col{background:#2f4a50;border-radius:16px;overflow:hidden}
.col img{width:100%;display:block}
.col .cap{padding:10px 12px 14px;font-size:13px;line-height:1.5}
.col .cap b{display:block;font-size:16px;margin-bottom:2px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.tag{font-size:11px;opacity:.7;padding:4px 8px}
</style></head><body><main>
<h1>🛶 카약 노 디자인 시안</h1>
<p class="lead">왼쪽: 가까이서 · 오른쪽: 실제 플레이 시점. 비 오는 저녁 조명이라 색이 실제보다 어둡게 나왔어요.</p>
<div class="grid">
<div class="col"><div class="pair"><img src="boat-look/rowB.jpg"><img src="boat-look/rowB.jpg"></div><div class="cap"><b>지금 · 기본 막대</b>나무 막대 + 청록 네모 날. 밋밋해요.</div></div>
<div class="col"><div class="pair"><img src="boat-look/p1c.jpg"><img src="boat-look/p1.jpg"></div><div class="cap"><b>1 · 나뭇잎 노</b>연두 잎사귀 날 + 잎맥, 노란 끈 매듭, 하얀 손잡이 띠. 숲 마을 느낌.</div></div>
<div class="col"><div class="pair"><img src="boat-look/p2c.jpg"><img src="boat-look/p2.jpg"></div><div class="cap"><b>2 · 물방울 클래식</b>청록 물방울 날에 크림색 무늬, 금색 테, 빨간 손잡이. 배 색(청록·빨강)과 맞춤.</div></div>
<div class="col"><div class="pair"><img src="boat-look/p3c.jpg"><img src="boat-look/p3.jpg"></div><div class="cap"><b>3 · 꽃잎 줄무늬</b>산호색 꽃잎 날 + 흰 줄, 하늘·산호 줄무늬 손잡이, 가운데 별 장식.</div></div>
</div></main></body></html>
