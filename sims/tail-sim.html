<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>tail sim</title>
<style>body{margin:0;background:#eef3ea;font-family:system-ui}#lbl{position:fixed;top:10px;left:0;right:0;display:flex;justify-content:space-around;font-size:15px;color:#345}
#ctl{position:fixed;bottom:10px;left:10px;font-size:13px;color:#345}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head><body>
<div id="lbl"><span>🦊 여우 (현재 → 새)</span><span>🐶 강아지 (현재 → 새)</span><span>🐱 고양이 (현재 → 새)</span></div>
<div id="ctl">뒤에서 본 각도로 천천히 회전 · 왼쪽=현재(구 체인) · 오른쪽=새(테이퍼 튜브)</div>
<script type="module">
import * as THREE from 'three';
const clayMat = (color, flat=true)=> new THREE.MeshStandardMaterial({color, roughness:0.95, metalness:0, flatShading:flat});

const ANIMALS = [
  { id:'fox', body:0xe07b3c, belly:0xf5e9d8, bodyR:0.52, bodyScale:[0.90,1.08,0.90], headR:0.37, headY:1.26,
    tail:{ type:'bushy', color:0xe07b3c, tip:0xf7efe2 } },
  { id:'dog', body:0xc9945a, belly:0xf0e2cc, bodyR:0.56, bodyScale:[1.03,0.99,1.00], headR:0.40, headY:1.24,
    tail:{ type:'curl', color:0xc9945a } },
  { id:'cat', body:0x9aa0a8, belly:0xf0f0f0, bodyR:0.50, bodyScale:[0.88,1.10,0.88], headR:0.36, headY:1.25,
    tail:{ type:'long', color:0x9aa0a8 } },
];

// ── 테이퍼 튜브: 곡선을 따라 관을 뽑되 굵기를 t(0..1)의 함수로 ──
// pts: 제어점 배열(Vector3), radiusFn(t)→반지름, colorFn(t)→색(없으면 단색)
function taperedTube(pts, radiusFn, colorFn, segs=32, radial=10) {
  const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.5);
  const frames = curve.computeFrenetFrames(segs, false);
  const pos=[], nor=[], col=[], idx=[];
  const c = new THREE.Color();
  for (let i=0;i<=segs;i++){
    const t=i/segs, P=curve.getPointAt(t), r=radiusFn(t);
    const N=frames.normals[i], B=frames.binormals[i];
    if (colorFn) c.set(colorFn(t));
    for (let j=0;j<=radial;j++){
      const a=j/radial*Math.PI*2, cx=Math.cos(a), sy=Math.sin(a);
      const nx=cx*N.x+sy*B.x, ny=cx*N.y+sy*B.y, nz=cx*N.z+sy*B.z;
      pos.push(P.x+r*nx, P.y+r*ny, P.z+r*nz); nor.push(nx,ny,nz);
      if (colorFn) col.push(c.r,c.g,c.b);
    }
  }
  for (let i=0;i<segs;i++) for (let j=0;j<radial;j++){
    const a=i*(radial+1)+j, b=a+radial+1;
    idx.push(a,b,a+1, b,b+1,a+1);
  }
  const g=new THREE.BufferGeometry();
  g.setIndex(idx);
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor,3));
  if (colorFn) g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  return g;
}
// 끝을 둥글게 닫는 캡(시작 쪽은 몸에 묻히므로 생략)
const cap = (P, r, mat) => { const m=new THREE.Mesh(new THREE.SphereGeometry(r,10,8), mat); m.position.copy(P); return m; };

function buildTail(a, R, mode){
  const t=a.tail, tail=new THREE.Group();
  const tm=clayMat(t.color,false);
  const put=(mesh,x,y,z)=>{mesh.position.set(x,y,z); mesh.castShadow=true; tail.add(mesh);};
  if (mode==='old'){
    if (t.type==='bushy'){
      const seg=[[0,0.02,-0.10,0.26],[0,0.14,-0.26,0.29],[0,0.30,-0.40,0.27],[0,0.48,-0.48,0.22]];
      seg.forEach(([x,y,z,r])=>put(new THREE.Mesh(new THREE.SphereGeometry(R*r,10,8),tm),R*x,R*y,R*z));
      put(new THREE.Mesh(new THREE.SphereGeometry(R*0.19,10,8),clayMat(t.tip,false)),0,R*0.64,-R*0.50);
    } else if (t.type==='curl'){
      const seg=[[0.02,-0.08,0.16],[0.20,-0.16,0.14],[0.36,-0.10,0.12],[0.46,0.02,0.10]];
      seg.forEach(([y,z,r])=>put(new THREE.Mesh(new THREE.SphereGeometry(R*r,10,8),tm),0,R*y,R*z));
    } else if (t.type==='long'){
      const seg=[[0.00,-0.10,0.12],[0.16,-0.22,0.11],[0.34,-0.26,0.10],[0.52,-0.20,0.09],[0.66,-0.06,0.08]];
      seg.forEach(([y,z,r])=>put(new THREE.Mesh(new THREE.SphereGeometry(R*r,8,8),tm),0,R*y,R*z));
    }
    return tail;
  }
  // ── 새 디자인 ──
  const V=(x,y,z)=>new THREE.Vector3(R*x,R*y,R*z);
  if (t.type==='bushy'){            // 🦊 굵고 풍성, 뒤로 뻗다 끝이 살짝 들림, 끝 1/3 흰색
    const pts=[V(0,-0.05,0.10), V(0,0.06,-0.30), V(0,0.30,-0.50), V(0,0.60,-0.58), V(0,0.88,-0.54)];
    const rad=t=>R*(0.29+0.05*Math.sin(Math.PI*t))*(1-0.38*Math.max(0,t-0.70)/0.30);
    const tip=new THREE.Color(t.tip), base=new THREE.Color(t.color);
    const colF=u=> u<0.60? base : u<0.68? base.clone().lerp(tip,(u-0.60)/0.08) : tip;
    const m=new THREE.Mesh(taperedTube(pts,rad,colF,40,12), new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.95}));
    m.castShadow=true; tail.add(m);
    const P=new THREE.CatmullRomCurve3(pts,false,'catmullrom',0.5).getPointAt(1);
    tail.add(cap(P, rad(1)*0.98, clayMat(t.tip,false)));
  } else if (t.type==='curl'){      // 🐶 짧게 위로 말린 곡선(첨부 이미지 형태)
    const pts=[V(0,-0.05,0.10), V(0,0.05,-0.22), V(0,0.30,-0.40), V(0,0.58,-0.36), V(0,0.72,-0.14)];
    const rad=u=>R*(0.15*(1-u)+0.05);
    const m=new THREE.Mesh(taperedTube(pts,rad,null,32,10), tm); m.castShadow=true; tail.add(m);
    const P=new THREE.CatmullRomCurve3(pts,false,'catmullrom',0.5).getPointAt(1);
    tail.add(cap(P, rad(1)*0.98, tm));
  } else if (t.type==='long'){      // 🐱 가늘고 길게 S자, 끝 뾰족
    const pts=[V(0,-0.05,0.10), V(0,0.08,-0.36), V(0,0.45,-0.60), V(0,0.90,-0.58), V(0,1.22,-0.36)];
    const rad=u=>R*(0.17*(1-u*0.62)+0.02)*(1-0.30*Math.max(0,u-0.85)/0.15);
    const m=new THREE.Mesh(taperedTube(pts,rad,null,44,10), tm); m.castShadow=true; tail.add(m);
    const P=new THREE.CatmullRomCurve3(pts,false,'catmullrom',0.5).getPointAt(1);
    tail.add(cap(P, rad(1)*0.98, tm));
  }
  return tail;
}

function buildChar(a, mode){
  const g=new THREE.Group();
  const R=a.bodyR, bs=a.bodyScale, HR=a.headR, HY=a.headY;
  const bodyY=R*bs[1]+0.02;
  const body=new THREE.Mesh(new THREE.IcosahedronGeometry(R,1), clayMat(a.body,false));
  body.position.y=bodyY; body.scale.set(...bs); body.castShadow=true; g.add(body);
  const belly=new THREE.Mesh(new THREE.SphereGeometry(R*0.62,16,12), clayMat(a.belly,false));
  belly.position.set(0,bodyY-R*0.16,R*0.55); belly.scale.set(1,1.1,0.6); g.add(belly);
  const head=new THREE.Mesh(new THREE.IcosahedronGeometry(HR,1), clayMat(a.body,false));
  head.position.y=HY; head.castShadow=true; g.add(head);
  const tail=buildTail(a,R,mode);
  tail.position.set(0, bodyY+R*0.10, -R*bs[2]*0.86);
  g.add(tail); g.userData.tail=tail;
  return g;
}

const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); renderer.setPixelRatio(devicePixelRatio);
const size=()=>{ const W=innerWidth||800,H=innerHeight||450; renderer.setSize(W,H); cam.aspect=W/H; cam.position.z=14*Math.max(1,1.78/cam.aspect); cam.lookAt(0,0.75,0); cam.updateProjectionMatrix(); };
renderer.shadowMap.enabled=true; document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xeef3ea);
scene.add(new THREE.HemisphereLight(0xffffff,0x88aa77,0.9));
const sun=new THREE.DirectionalLight(0xfff2d8,1.2); sun.position.set(4,8,3); sun.castShadow=true; scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(40,40), new THREE.MeshStandardMaterial({color:0xcfe0c2})); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
const cam=new THREE.PerspectiveCamera(20,16/9,0.1,100); cam.position.set(0,3.6,14); cam.lookAt(0,0.75,0);
size(); addEventListener('resize',size);

const groups=[];
ANIMALS.forEach((a,i)=>{
  const cx=(i-1)*2.9;
  const o=buildChar(a,'old'); o.position.set(cx-0.7,0,0); scene.add(o); groups.push(o);
  const n=buildChar(a,'new'); n.position.set(cx+0.7,0,0); scene.add(n); groups.push(n);
});
let ph=0, last=performance.now();
function loop(now){
  const dt=(now-last)/1000; last=now; ph+=dt;
  groups.forEach(g=>{ g.rotation.y=Math.PI*0.62+Math.sin(ph*0.4)*0.3; const t=g.userData.tail; t.rotation.y=Math.sin(ph*2.2)*0.16; t.rotation.x=Math.sin(ph*1.1)*0.05; });
  renderer.render(scene,cam); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
