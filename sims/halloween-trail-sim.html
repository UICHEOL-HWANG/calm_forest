// 박쥐 한 장 — a: 날갯짓(+1 활짝 위 … -1 아래), st: 색
function drawBat(c, S, a, st) {

// ---------- 입자: THREE.Points 하나(드로우콜 +1) ----------
function makePoints(env, atlas, cap) {
  const geo = new THREE.BufferGeometry();
  const A = { position: 3, aColor: 3, aSize: 1, aAlpha: 1, aFrame: 1, aRot: 1 };
  const arr = {};
  for (const [k, n] of Object.entries(A)) { arr[k] = new Float32Array(cap * n); geo.setAttribute(k, new THREE.BufferAttribute(arr[k], n)); }

//  🎃 호박불 3안

function pumpkinGeo(night) {
  const R = 0.07, YC = 0.057, KY = 0.82, geos = [];

function lanternCell(env) {
  const { scene, rnd, night } = env, geo = pumpkinGeo(night);
  const atlas = makeAtlas([halo(255, 150, 40, 0.9), fnEmber]), pts = makePoints(env, atlas, 28);

    stamp({ x, z }) {

      lan.push({ m, age: 0, x, z, ph: rnd() * 6 });
      for (let i = 0; i < 2; i++) emb.push({ y: 0.11, z, bx: x, ph: rnd() * 6, vy: 0.22 + rnd() * 0.18, age: -i * 0.25, life: 1.0 + rnd() * 0.5, size: 0.04 + rnd() * 0.02 });
    },
    tick(dt) {
      const out = [];

        l.m.scale.setScalar(Math.max(0.001, pop * (0.8 + 0.2 * fo))); l.m.material.opacity = fo; l.m.material.color.setScalar(fl);

      }
      emb = emb.map(e => ({ ...e, age: e.age + dt })).filter(e => e.age < e.life);
      for (const e of emb) if (e.age > 0) { const k = e.age / e.life;
        out.push({ x: e.bx + Math.sin(e.age * 4 + e.ph) * 0.03, y: e.y + e.vy * e.age, z: e.z, size: e.size * (1 - k * 0.4), alpha: Math.min(1, e.age * 6) * (1 - k) * (0.7 + 0.3 * Math.sin(e.age * 20 + e.ph)), frame: 1 }); }

  };

function refCell(item) {
  return env => {
    const { scene, rnd, night } = env;
    let live = [], pool = [], fx = null;
    if (item === 'firefly') { fx = createTrailFx(THREE, { cap: 64, rnd }); scene.add(fx.points); }
    return {
      stamp({ x, z }) {
        const m = pool.pop() || buildTrailMark(THREE, item, 1, 'rabbit'); m.position.set(x, 0.01, z); scene.add(m); live.push({ m, t: 0 });
        if (fx) fx.onStamp('firefly', { x, y: 0, z }, { nightLevel: night ? 1 : 0 });
      },
      tick(dt) {
        for (let i = live.length - 1; i >= 0; i--) { const e = live[i]; e.t += dt; const a = Math.max(0, 1 - e.t / FADE);
          e.m.traverse(o => { if (o.material) o.material.opacity = a; }); if (a <= 0) { scene.remove(e.m); pool.push(e.m); live.splice(i, 1); } }
        if (fx) fx.update(dt, { nightLevel: night ? 1 : 0 });
        return live.length + (fx ? 1 : 0);
      },
    };
  };
}

// ---------- 뷰(공유 렌더러 하나 → 2D 캔버스로 복사해 컨텍스트 수를 아낀다) ----------
const gl = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
const views = [];
function makeView(canvas, make, seed) {

  canvas.width = Math.round(w * pr); canvas.height = Math.round(h * pr);
  const night = mode === 'night', scene = new THREE.Scene(), rnd = mulberry(seed);
  const cam = new THREE.PerspectiveCamera(32, w / h, 0.1, 100), e = CAM.elev * Math.PI / 180;
  cam.position.set(0, Math.sin(e) * CAM.dist, CAM.lookZ + Math.cos(e) * CAM.dist); cam.lookAt(0, 0.1, CAM.lookZ);
  // 바닥 은은한 풀빛 판(시안 전용 — 게임 드로우콜 아님)

  gr.addColorStop(0, night ? 'rgba(40,66,70,.9)' : 'rgba(150,196,140,.55)'); gr.addColorStop(1, night ? 'rgba(40,66,70,0)' : 'rgba(150,196,140,0)'); gg.fillStyle = gr; gg.fillRect(0, 0, 128, 128);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 2.6).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(gc), transparent: true, depthWrite: false }));
  ground.position.y = -0.002; ground.renderOrder = -1; scene.add(ground);
  if (night) { scene.add(new THREE.HemisphereLight(0x8090c8, 0x1a2038, 0.75)); const d = new THREE.DirectionalLight(0x9fb0ee, 0.55); d.position.set(-2, 4, 2); scene.add(d); }
  else { scene.add(new THREE.HemisphereLight(0xffffff, 0x9ab0a0, 1.05)); const k = new THREE.DirectionalLight(0xfff2d8, 1.15); k.position.set(2.5, 4, 3); scene.add(k); }

function sim(v, t, dt) {

}

    if (c.clientWidth > 0) makeView(c, CELLS[prod].find(x => x.id === id).make, +c.dataset.seed); });
}
let T = 0;
function modeBar() {
  const el = document.getElementById('mode'); el.innerHTML = '';
  [['day', '☀️ 낮'], ['night', '🌙 밤']].forEach(([k, l]) => { const b = document.createElement('button'); b.textContent = l; b.className = mode === k ? 'on' : '';
    b.onclick = () => { mode = k; document.body.classList.toggle('night', k === 'night'); modeBar(); build(); T = 0; }; el.appendChild(b); });
}
document.body.classList.toggle('night', mode === 'night');
modeBar(); build();

// 고정 스텝 시계(?t=초) — 없으면 실시간. 캡처는 항상 고정 스텝으로 찍는다.
const fixed = q.get('t');
let prev = performance.now();
if (fixed) {
  const end = +fixed;
  for (let s = 0; s < end; s += 1 / 60) views.forEach(v => sim(v, s, 1 / 60));
  views.forEach(draw);
  window.__counts = views.map(v => v.count);
  window.__ready = true;
} else {
  (function loop(now) { const dt = Math.min(0.05, (now - prev) / 1000); prev = now; T += dt;
    views.forEach(v => { sim(v, T, dt); draw(v); }); requestAnimationFrame(loop); })(prev);
}
