<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘의 꾸미기 배너 시안</title>
<style>
:root { --cream:#fff7ec; --mint:#bfe8c9; --ink:#4a5a4f; --panel:rgba(255,255,255,0.86); --shadow:0 6px 18px rgba(90,120,100,0.18); }
* { box-sizing:border-box; }
body { margin:0; padding:24px; font-family:'Segoe UI',system-ui,sans-serif; background:linear-gradient(180deg,#5f9a6b,#4d8459); color:var(--ink); }
h1 { margin:0 0 4px; font-size:22px; color:#fff; }
.lead { margin:0 0 20px; color:#e6f7e9; font-size:13px; line-height:1.5; max-width:1100px; }
.cols { display:flex; gap:24px; align-items:flex-start; }
.col { display:flex; flex-direction:column; gap:8px; }
.col > h2 { margin:0; font-size:16px; color:#fff; }
.col > p { margin:0; font-size:12px; color:#e6f7e9; max-width:var(--cw,560px); line-height:1.45; min-height:34px; }
.stack { display:flex; flex-direction:column; gap:22px; }

.screen { position:relative; overflow:hidden; border-radius:22px; background:
  radial-gradient(circle at 18% 22%, rgba(60,110,70,.55) 0 60px, transparent 61px),
  radial-gradient(circle at 82% 16%, rgba(50,100,62,.55) 0 80px, transparent 81px),
  radial-gradient(circle at 70% 70%, rgba(210,190,140,.35) 0 120px, transparent 121px),
  linear-gradient(180deg,#a9dcb2 0%,#8fcb98 45%,#7dbb86 100%);
  box-shadow:0 14px 30px -14px rgba(0,0,0,.45); }
.screen .tag { position:absolute; left:12px; top:10px; font-size:11px; font-weight:800; color:#fff; background:rgba(0,0,0,.28); padding:3px 8px; border-radius:8px; }
.pc { width:600px; height:720px; }
.pt { width:390px; height:844px; }
.ls { width:844px; height:390px; }

.panel { position:absolute; left:50%; transform:translateX(-50%); background:var(--panel); backdrop-filter:blur(8px); border-radius:18px; box-shadow:var(--shadow); padding:12px 16px; display:flex; flex-direction:column; gap:10px; color:var(--ink); }
.pc .panel { width:460px; bottom:90px; }
.pt .panel { width:94%; bottom:78px; padding:10px 12px; gap:8px; }
.ls .panel { width:600px; bottom:8px; max-height:374px; padding:9px 14px; gap:6px; overflow:hidden; }
.dm-head { font-weight:700; font-size:14px; text-align:center; }
.ls .dm-head { font-size:13px; }
.ck-inv { font-size:12px; opacity:.75; margin-left:6px; }
.tabs { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
.ls .tabs { flex-wrap:nowrap; overflow:hidden; justify-content:flex-start; }
.sh-tab { border:none; border-radius:10px; padding:6px 12px; font:inherit; font-weight:700; font-size:13px; background:#eef2ee; color:var(--ink); white-space:nowrap; flex:0 0 auto; }
.pt .sh-tab { padding:6px 11px; font-size:12px; }
.ls .sh-tab { padding:4px 11px; font-size:12px; }
.sh-tab.active { background:var(--mint); }
.body { display:flex; gap:10px; align-items:flex-start; }
.pt .body { gap:8px; }
.ls .body { flex:1 1 auto; min-height:0; align-items:stretch; }
.prev { flex:0 0 136px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:8px 6px; border-radius:14px; background:linear-gradient(160deg,#eef7f0,#dcebe0); box-shadow:inset 0 2px 10px rgba(90,120,100,.12); height:176px; }
.pt .prev { flex-basis:108px; height:150px; }
.ls .prev { flex-basis:120px; height:auto; }
.prev .bear { font-size:62px; line-height:1; position:relative; }
.pt .prev .bear { font-size:50px; }
.prev .bear i { position:absolute; font-style:normal; font-size:.42em; left:50%; bottom:-2px; transform:translateX(-50%); }
.prev small { font-size:10px; opacity:.6; text-align:center; }
.items { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:6px; overflow:hidden; }
.pc .items { max-height:336px; }
.pt .items { max-height:320px; }
.ls .items { min-height:0; }
.sh-row { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 10px; border-radius:12px; background:#f4faf5; box-shadow:var(--shadow); flex:0 0 auto; }
.sh-row > span { font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.pt .sh-row > span { font-size:12px; }
.sh-row .btn { border:none; border-radius:10px; padding:6px 10px; font:inherit; font-size:12px; font-weight:800; background:var(--mint); color:var(--ink); white-space:nowrap; flex:0 0 auto; }
.dm-actions { display:flex; justify-content:flex-end; }
.dm-actions button { border:none; border-radius:10px; padding:8px 14px; font:inherit; font-weight:600; font-size:13px; background:#eef2ee; color:var(--ink); }
.ls .dm-actions button { padding-top:7px; padding-bottom:7px; }

.dp { flex:0 0 auto; display:flex; flex-direction:column; gap:8px; padding:10px 12px; border-radius:16px; background:linear-gradient(160deg,#fff8e4,#fdeec8); box-shadow:0 8px 20px -10px rgba(160,110,30,.45), inset 0 0 0 1.5px #f0cf7a; overflow:hidden; }
.k-pt .dp { padding:9px 10px; gap:7px; }
.k-ls .dp { padding:8px 10px; gap:6px; }
.hero { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; align-items:center; }
.k-ls .hero { grid-template-columns:auto 1fr auto; }
.ico { grid-row:span 2; width:48px; height:48px; border-radius:14px; background:#fff; display:flex; align-items:center; justify-content:center; font-size:28px; box-shadow:inset 0 0 0 1.5px #f3dfa8; position:relative; }
.k-pt .ico { width:42px; height:42px; font-size:24px; border-radius:12px; }
.k-ls .ico { width:42px; height:42px; font-size:24px; border-radius:12px; }
.ico .ok { position:absolute; right:-4px; bottom:-4px; width:18px; height:18px; border-radius:50%; background:#5bb37a; color:#fff; font-size:11px; font-weight:900; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 2px #fff8e4; }
.top { display:flex; justify-content:space-between; align-items:baseline; gap:6px; min-width:0; }
.top em { font-style:normal; font-size:11px; font-weight:800; color:#a8641a; white-space:nowrap; }
.top small { font-size:10.5px; opacity:.65; white-space:nowrap; font-weight:700; }
.half { font-size:10px; font-weight:800; color:#a8641a; background:#fff0c9; border-radius:6px; padding:1px 5px; margin-left:4px; }
.name { font-size:14px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.k-pt .name, .k-ls .name { font-size:13px; }
.buys { grid-column:1 / -1; margin-top:6px; display:flex; gap:6px; align-items:stretch; }
.k-ls .buys { grid-row:1 / span 2; grid-column:3; margin-top:0; }
.buy { min-height:40px; border:none; border-radius:12px; padding:0 12px; font:inherit; font-size:12.5px; font-weight:800; background:var(--mint); color:var(--ink); white-space:nowrap; flex:0 0 auto; box-shadow:inset 0 -2px 0 rgba(60,120,80,.18); }
.k-pt .buy { padding:0 9px; font-size:12px; }
.buy s { opacity:.55; font-weight:600; margin-right:4px; }
.buy.off { background:#e6ebe6; color:#7f8f85; box-shadow:none; }
.buys.solo .buy { flex:1 1 auto; }
.k-ls .buys.solo .buy { flex:0 0 auto; min-width:120px; }
.rw-ad { min-height:40px; position:relative; overflow:hidden; display:inline-flex; align-items:center; justify-content:center; border:0; border-radius:12px; padding:0 12px 0 8px; font:inherit; font-weight:700; font-size:12.5px; color:#fbf6e6; background:linear-gradient(180deg,#3d6b4a,#2f5a3a); box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 14px -6px rgba(31,74,44,.6); white-space:nowrap; flex:1 1 auto; }
.k-pt .rw-ad { padding:0 8px 0 6px; font-size:12px; }
.k-ls .rw-ad { flex:0 0 auto; }
.rw-tag { display:inline-block; margin-right:6px; font-size:10px; font-weight:800; letter-spacing:.04em; padding:3px 5px; border-radius:6px; background:rgba(255,211,107,.18); color:#ffd36b; }
.k-pt .rw-tag { margin-right:4px; padding:2px 4px; font-size:9.5px; }

.rib { margin:-10px -12px 0; padding:7px 12px; display:flex; align-items:center; justify-content:space-between; gap:8px; background:linear-gradient(90deg,var(--th1),var(--th2)); color:var(--thk); border-bottom:1.5px solid var(--thb); }
.k-pt .rib { margin:-9px -10px 0; padding:6px 10px; }
.k-ls .rib { margin:-8px -10px 0; padding:5px 10px; }
.rib b { font-size:12.5px; font-weight:800; white-space:nowrap; }
.k-pt .rib b { font-size:12px; }
.rib > span { font-size:11px; font-weight:800; white-space:nowrap; background:rgba(255,255,255,.7); padding:2px 7px; border-radius:20px; }
.th-winter { --th1:#d7e9fb; --th2:#eef6ff; --thk:#3c6a97; --thb:#bcd6f0; }
.th-tea { --th1:#dcefd2; --th2:#f1f8ea; --thk:#4b7637; --thb:#c3dfb3; }
.strip { display:flex; gap:4px; }
.k-ls .rib .strip { flex:1 1 auto; justify-content:center; }
.cell { flex:1 1 0; aspect-ratio:1; max-width:30px; border-radius:8px; background:rgba(255,255,255,.75); display:flex; align-items:center; justify-content:center; font-size:15px; position:relative; }
.k-pt .cell { font-size:13px; border-radius:7px; }
.k-ls .cell { width:24px; flex:0 0 24px; font-size:13px; border-radius:7px; }
.cell.soon > span { filter:grayscale(1); opacity:.38; }
.cell.gone > span { filter:grayscale(1); opacity:.22; }
.cell.gone { background:rgba(255,255,255,.35); }
.cell.today { background:#fff; box-shadow:0 0 0 2px #d6a23a; }
.cell .ck { position:absolute; right:-3px; bottom:-3px; width:12px; height:12px; border-radius:50%; background:#5bb37a; color:#fff; font-size:8px; font-weight:900; display:flex; align-items:center; justify-content:center; }

.teaser { display:flex; align-items:center; gap:8px; padding-top:7px; border-top:1.5px dashed #ecd498; }
.k-ls .teaser { padding-top:6px; gap:10px; }
.k-ls .teaser .tz { flex-direction:row; align-items:baseline; gap:6px; flex:0 0 auto; }
.k-ls .teaser .cnt-row { flex:1 1 auto; justify-content:flex-end; }
.k-ls .teaser .bar { max-width:110px; }
.sil { flex:0 0 auto; width:34px; height:34px; border-radius:10px; background:repeating-linear-gradient(135deg,#fff6df 0 5px,#fdeec8 5px 10px); box-shadow:inset 0 0 0 1.5px #ecd498; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.k-ls .sil { width:28px; height:28px; border-radius:8px; }
.k-ls .sil i { font-size:17px; }
.sil i { font-style:normal; font-size:22px; filter:brightness(0) blur(1.2px); opacity:.28; }
.tz { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:1px; }
.tz b { font-size:11.5px; font-weight:800; color:#a8641a; white-space:nowrap; }
.tz small { font-size:10.5px; opacity:.65; font-weight:700; white-space:nowrap; }
.bar { height:5px; border-radius:4px; background:rgba(214,162,58,.18); overflow:hidden; }
.bar i { display:block; height:100%; background:linear-gradient(90deg,#e8b84f,#d6a23a); border-radius:4px; }
.cnt-row { display:flex; align-items:center; gap:8px; }
.cnt-row .bar { flex:1 1 auto; }
.cnt-row small { font-size:10.5px; font-weight:800; color:#8a6a2a; white-space:nowrap; }

.dex-h { display:flex; justify-content:space-between; align-items:baseline; }
.dex-h b { font-size:11px; font-weight:800; color:#8a6a2a; }
.dex-h small { font-size:10.5px; opacity:.65; font-weight:700; }
.chips { display:flex; gap:5px; overflow:hidden; position:relative; }
.chip { flex:0 0 auto; min-height:40px; min-width:46px; padding:0 7px; border-radius:12px; background:rgba(255,255,255,.8); display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:inset 0 0 0 1.5px #f0dfb2; }
.chip i { font-style:normal; font-size:15px; line-height:1.1; }
.chip span { font-size:9.5px; font-weight:800; color:#8a6a2a; line-height:1.2; }
.chip.on { background:#fff; box-shadow:inset 0 0 0 2px #d6a23a; }
.chip.full { background:linear-gradient(160deg,#ffe9a8,#ffd36b); box-shadow:inset 0 0 0 1.5px #e7b64b; }
.chip.more { background:rgba(255,255,255,.55); min-width:44px; }
.grid { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; padding:8px; border-radius:12px; background:rgba(255,255,255,.6); }
.k-ls .grid { grid-template-columns:repeat(8,1fr); padding:6px; }
.g { display:flex; flex-direction:column; align-items:center; gap:1px; padding:4px 0 3px; border-radius:9px; background:#fff; }
.g i { font-style:normal; font-size:18px; line-height:1.15; }
.k-ls .g i { font-size:16px; }
.g span { font-size:9.5px; font-weight:800; color:#8a7a5a; white-space:nowrap; }
.g.own span { color:#3d8a57; }
.g.today { box-shadow:inset 0 0 0 2px #d6a23a; }
.g.today span { color:#a8641a; }
.g.soon i { filter:grayscale(1); opacity:.38; }
.grid-h { grid-column:1 / -1; display:flex; justify-content:space-between; font-size:11px; font-weight:800; color:#8a6a2a; padding:0 2px 2px; }
.grid-h small { font-weight:700; opacity:.65; font-size:10.5px; }

.sheet { display:flex; flex-direction:column; gap:18px; }
.srow { display:flex; gap:22px; align-items:flex-start; }
.rowlab { flex:0 0 70px; }
.sheet .cap { font-size:11.5px; font-weight:800; color:#fff; margin-bottom:6px; }
.cardbox { padding:12px; border-radius:16px; background:rgba(255,255,255,.86); }
.w-pc { width:306px; } .w-pt { width:251px; } .w-ls { width:466px; }
.rowlab { font-size:13px; font-weight:800; color:#fff; align-self:center; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const WINTER = [
  { ico:'🧶', name:'방울 뜨개 모자', st:'own' },
  { ico:'🧣', name:'손뜨개 겨울 목도리', st:'today' },
  { ico:'🪵', name:'등에 멘 장작 바구니', st:'soon', inDays:1 },
  { ico:'🥾', name:'털장화 발자국', st:'soon', inDays:2 },
  { ico:'🔥', name:'작은 벽난로', st:'own' },
  { ico:'🐑', name:'양털 러그', st:'soon', inDays:4 },
  { ico:'☕', name:'핫초코 탁자', st:'soon', inDays:5 },
  { ico:'⛄', name:'목도리 두른 눈사람', st:'soon', inDays:6 },
];
const TEA = [
  { ico:'🌱', name:'찻잎 머리띠', st:'own' },
  { ico:'🍵', name:'개다리 소반', st:'gone' },
  { ico:'🍵', name:'청자 찻잔 목걸이', st:'own' },
  { ico:'🫖', name:'청자 찻주전자 배낭', st:'gone' },
  { ico:'🟩', name:'말차 네모 방석', st:'gone' },
  { ico:'🫖', name:'열린 다기 선반', st:'today' },
  { ico:'☘️', name:'찻잎 새순 발자국', st:'soon' },
  { ico:'🎋', name:'둥근 돌확', st:'soon' },
];
const THEMES = [
  ['❄️','겨울 준비',2,8,'on'], ['🐿️','숲속 친구',5,8], ['🎄','크리스마스',0,8], ['🐚','바닷가',8,8,'full'],
  ['🧁','디저트',3,8], ['🌙','밤하늘',1,8], ['🧧','새해',0,8], ['⛺','캠핑',2,8], ['🌸','벚꽃',0,8],
  ['☔','비 오는 날',1,8], ['🍵','찻집',0,8], ['🎨','화실',0,8], ['🛠️','도구 세트',1,11],
];
const TODAY = { ico:'🧣', name:'손뜨개 겨울 목도리', price:1200, left:'3:42', tomorrow:'🪵' };
const TEA_TODAY = { ico:'🫖', name:'열린 다기 선반', price:1300, left:'11:05' };

const fmt = n => n.toLocaleString('ko-KR');
function buys(s, it) {
  if (s === 'owned') return `<div class="buys solo"><button class="buy off">이미 있어요</button></div>`;
  if (s === 'half') return `<div class="buys solo"><button class="buy"><s>${fmt(it.price)}</s>🪙 ${fmt(Math.ceil(it.price / 2))}</button></div>`;
  return `<div class="buys"><button class="buy">🪙 ${fmt(it.price)}</button><button class="rw-ad"><span class="rw-tag">AD</span>광고 보고 반값</button></div>`;
}
function hero(s, it, rightOwned) {
  const half = s === 'half' ? '<b class="half">반값</b>' : '';
  const right = s === 'owned' ? (rightOwned || '내일 바뀌어요') : `⏳ ${it.left}`;
  const ok = s === 'owned' ? '<b class="ok">✓</b>' : '';
  return `<div class="hero"><div class="ico">${it.ico}${ok}</div>
    <div class="top"><em>📅 오늘의 꾸미기${half}</em><small>${right}</small></div>
    <div class="name">${it.name}</div>${buys(s, it)}</div>`;
}
function strip(list, s) {
  return `<div class="strip">${list.map(x => {
    const own = x.st === 'own' || (x.st === 'today' && s === 'owned');
    return `<div class="cell ${x.st}"><span>${x.ico}</span>${own ? '<b class="ck">✓</b>' : ''}</div>`;
  }).join('')}</div>`;
}
function conceptA(k, s, opt = {}) {
  const list = opt.tea ? TEA : WINTER;
  const it = opt.tea ? TEA_TODAY : TODAY;
  const th = opt.tea ? ['th-tea', '🍵 찻집 주간'] : ['th-winter', '❄️ 겨울 준비 주간'];
  const own = list.filter(x => x.st === 'own').length + (s === 'owned' ? 1 : 0);
  const count = `${own}/8 모음`;
  if (k === 'ls') return `<div class="dp ${th[0]}"><div class="rib"><b>${th[1]}</b>${strip(list, s)}<span>${count}</span></div>${hero(s, it)}</div>`;
  return `<div class="dp ${th[0]}"><div class="rib"><b>${th[1]}</b><span>${count}</span></div>${hero(s, it)}${strip(list, s)}</div>`;
}
function conceptB(k, s) {
  const got = 23 + (s === 'owned' ? 1 : 0);
  const tz = `<div class="sil"><i>${TODAY.tomorrow}</i></div><div class="tz"><b>내일의 꾸미기</b><small>${TODAY.left} 뒤 공개</small></div>`;
  const bar = `<div class="cnt-row"><div class="bar"><i style="width:${(got / 107 * 100).toFixed(1)}%"></i></div><small>🎀 ${got}/107 모음</small></div>`;
  if (k === 'ls') return `<div class="dp">${hero(s, TODAY, '자정에 바뀌어요')}<div class="teaser"><div class="sil"><i>${TODAY.tomorrow}</i></div><div class="tz"><b>내일의 꾸미기</b><small>${TODAY.left} 뒤 공개</small></div>${bar}</div></div>`;
  return `<div class="dp">${hero(s, TODAY, '자정에 바뀌어요')}<div class="teaser">${tz}</div>${bar}</div>`;
}
function chips(k, s) {
  const n = k === 'ls' ? 7 : k === 'pc' ? 4 : 3;
  const shown = THEMES.slice(0, n).map(([e, , a, b, c]) => {
    const got = c === 'on' && s === 'owned' ? a + 1 : a;
    return `<div class="chip ${c || ''}"><i>${e}</i><span>${c === 'full' ? '완성' : `${got}/${b}`}</span></div>`;
  }).join('');
  return `<div class="chips">${shown}<div class="chip more"><i>📖</i><span>+${THEMES.length - n}</span></div></div>`;
}
function grid(s) {
  const cells = WINTER.map(x => {
    const own = x.st === 'own' || (x.st === 'today' && s === 'owned');
    const lab = own ? '✓ 있어요' : x.st === 'today' ? '오늘' : x.inDays === 1 ? '내일' : `${x.inDays}일 뒤`;
    const cls = own ? 'own' : x.st === 'today' ? 'today' : 'soon';
    return `<div class="g ${cls}${x.st === 'today' ? ' today' : ''}"><i>${x.ico}</i><span>${lab}</span></div>`;
  }).join('');
  const got = 2 + (s === 'owned' ? 1 : 0);
  return `<div class="grid"><div class="grid-h"><span>❄️ 겨울 준비 ${got}/8</span><small>다시 오는 날</small></div>${cells}</div>`;
}
function conceptC(k, s, opt = {}) {
  const got = 23 + (s === 'owned' ? 1 : 0);
  const head = `<div class="dex-h"><b>📖 테마 도감 ${got}/107</b><small>${opt.open ? '접기 ▴' : '눌러서 보기'}</small></div>`;
  return `<div class="dp">${hero(s, TODAY)}${head}${chips(k, s)}${opt.open ? grid(s) : ''}</div>`;
}
const CONCEPTS = {
  A: { title:'A · 이번 주 테마', desc:'테마 띠 + 오늘 아이템 + 같은 테마 8칸. 점 줄을 지우고 이번 주에 뭐가 나오는지, 몇 개 모았는지를 한 줄로 보여 줘요.', fn:conceptA },
  B: { title:'B · 내일 예고', desc:'오늘 카드 아래에 내일 아이템 실루엣과 남은 시간. 점 줄 대신 107칸 모음 막대. 다시 들어올 이유를 만들어요.', fn:conceptB },
  C: { title:'C · 테마 도감', desc:'오늘 카드 아래에 테마별 칩(n/8). 칩을 누르면 그 테마 8칸과 다시 오는 날이 펼쳐져요. 전체 진행도를 보여 줘요.', fn:conceptC },
};

const TABS = ['🎩 머리','🧣 목','🎒 가방','✨ 이펙트','🧥 스킨','🪓 도구','🐾 펫'];
const ROWS = [['🧢 털모자', 1600], ['🧢 캡', 1500], ['🍄 버섯 모자', 1800], ['🎀 리본 머리띠', 1300], ['🌼 꽃 화관', 1700]];
function screen(k, card) {
  const tags = { pc:'PC 1280×800 · 패널 460', pt:'세로 폰 390×844', ls:'가로 폰 844×390' };
  return `<div class="screen ${k} k-${k}"><span class="tag">${tags[k]}</span><div class="panel">
    <div class="dm-head">🎀 꾸미기<span class="ck-inv">🪙 2,340</span></div>
    <div class="tabs">${TABS.map((t, i) => `<button class="sh-tab${i === 1 ? ' active' : ''}">${t}</button>`).join('')}</div>
    <div class="body"><div class="prev"><div class="bear">🐻<i>🧣</i></div><small>🖐️ 드래그해서<br>돌려보기</small></div>
      <div class="items">${card}${ROWS.map(([n, p]) => `<div class="sh-row"><span>${n}</span><button class="btn">🪙 ${fmt(p)}</button></div>`).join('')}</div></div>
    <div class="dm-actions"><button>닫기</button></div></div></div>`;
}
function compare(k) {
  const w = { pc:600, pt:390, ls:844 }[k];
  const label = { pc:'PC', pt:'세로 폰', ls:'가로 폰' }[k];
  const body = Object.entries(CONCEPTS).map(([, c]) => `<div class="col" style="--cw:${w}px"><h2>${c.title}</h2><p>${c.desc}</p>${screen(k, c.fn(k, 'ad'))}</div>`).join('');
  return `<h1>📅 오늘의 꾸미기 배너 · ${label} 비교</h1><p class="lead">상태: 살 수 있음 + 광고 반값 버튼. 카드는 실제 자리(#cos-items, 미리보기 오른쪽)에 넣었어요. 카드 폭 PC 282 · 세로 폰 227 · 가로 폰 442px.</p>
    <div class="${k === 'ls' ? 'stack' : 'cols'}">${body}</div>`;
}
function sheet(id) {
  const c = CONCEPTS[id];
  const states = [['ad', '살 수 있음 + 광고 반값'], ['half', '광고 보고 반값 적용'], ['owned', '이미 있어요']];
  const extra = id === 'C' ? [['ad', '칩 눌러 펼침', { open:true }]] : id === 'A' ? [['ad', '다른 테마(찻집) 예', { tea:true }]] : [];
  const all = [...states, ...extra];
  const kinds = [['pc', 'PC'], ['pt', '세로 폰'], ['ls', '가로 폰']];
  const rows = kinds.map(([k, lab]) => `<div class="srow"><div class="rowlab">${lab}</div>` + all.map(([s, cap, opt]) =>
    `<div class="k-${k}"><div class="cap">${cap}</div><div class="cardbox w-${k}">${c.fn(k, s, opt || {})}</div></div>`).join('') + '</div>').join('');
  return `<h1>${c.title} · 상태 시트</h1><p class="lead">${c.desc} 카드만 실제 폭(PC 282 · 세로 227 · 가로 442px)으로 잘라 보여요.</p>
    <div class="sheet">${rows}</div>`;
}
const v = new URLSearchParams(location.search).get('v') || 'pc';
document.getElementById('root').innerHTML = CONCEPTS[v] ? sheet(v) : compare(v);
</script>
</body>
</html>
