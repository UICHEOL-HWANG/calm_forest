<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>계절 채집물 모양 비교</title>
<style>
  :root{--bg:#24301f;--card:rgba(255,255,255,.94);--ink:#2f3f2f;--accent:#2f5e2f}
  html,body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:var(--ink)}
  #c{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
  main{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:8px 16px}
  h2{color:#e8f0e0;font-size:15px;margin:14px 0 6px}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .row.three{grid-template-columns:repeat(3,1fr)}
  .cell{aspect-ratio:1;border-radius:10px;position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
  .cell span{position:absolute;left:6px;bottom:6px;background:var(--card);border-radius:7px;padding:2px 7px;font-size:12px}
  .cell b{color:var(--accent)}
  @media (max-width:520px){.row{grid-template-columns:repeat(2,1fr)}.row.three{grid-template-columns:repeat(3,1fr)}.cell span{font-size:10.5px}}
</style>
<canvas id="c"></canvas>
<main id="m"></main>
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

const clay = (color, flat = true) => new THREE.MeshStandardMaterial({ color, roughness: 0.95, metalness: 0, flatShading: flat });
const add = (g, geo, color, pos, opt = {}) => {
  const m = new THREE.Mesh(geo, clay(color, opt.flat ?? true));
  m.position.set(...pos);
  if (opt.rot) m.rotation.set(...opt.rot);
  if (opt.scl) m.scale.set(...opt.scl);
  m.castShadow = !!opt.shadow; m.receiveShadow = true; g.add(m); return m;
};

const REF = {
  '숲 버섯': (g) => [[0, 0, 1], [0.26, 0.12, 0.7], [-0.2, -0.18, 0.55]].forEach(([x, z, s]) => {
    add(g, new THREE.CylinderGeometry(0.055 * s, 0.07 * s, 0.26 * s, 7), 0xf3ead8, [x, 0.13 * s, z]);
    add(g, new THREE.SphereGeometry(0.16 * s, 10, 7, 0, Math.PI * 2, 0, Math.PI / 2), 0xe0705a, [x, 0.26 * s, z], { flat: false, scl: [1, 0.8, 1], shadow: true });
  }),
  '산딸기': (g) => {
    add(g, new THREE.IcosahedronGeometry(0.36, 0), 0x7fbf7a, [0, 0.26, 0], { scl: [1.1, 0.85, 1.1], shadow: true });
    for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2; add(g, new THREE.SphereGeometry(0.075, 7, 6), 0x8a7ad0, [Math.cos(a) * 0.28, 0.3 + Math.sin(i) * 0.08, Math.sin(a) * 0.28], { flat: false }); }
  },
  '도토리': (g) => [[0, 0], [0.2, 0.16], [-0.17, 0.2]].forEach(([x, z]) => {
    add(g, new THREE.SphereGeometry(0.12, 8, 7), 0xc99a5a, [x, 0.12, z], { flat: false, scl: [1, 1.25, 1], shadow: true });
    add(g, new THREE.SphereGeometry(0.115, 8, 6, 0, Math.PI * 2, 0, Math.PI / 2), 0x8a5f3a, [x, 0.2, z], { flat: false });
  }),
  '숲 약초': (g) => { for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; add(g, new THREE.ConeGeometry(0.07, 0.5, 5), 0x7fd6a0, [Math.cos(a) * 0.1, 0.26, Math.sin(a) * 0.1], { rot: [Math.cos(a) * 0.35, 0, -Math.sin(a) * 0.35], shadow: true }); } },
};

const leaf = (g, color, a, r, len, wid, lift, tilt) => add(g, new THREE.SphereGeometry(0.5, 7, 4), color,
  [Math.cos(a) * r, lift, Math.sin(a) * r], { scl: [len, 0.05, wid], rot: [0, -a, tilt] });
const berries = (g, color, pts, rad = 0.07) => pts.forEach(([x, y, z]) => add(g, new THREE.SphereGeometry(rad, 8, 6), color, [x, y, z], { flat: false }));
const grapeCluster = (cx, cz, y0, rows) => {
  const out = [];
  rows.forEach((n, ri) => { for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2 + ri; const r = n === 1 ? 0 : 0.075 * (n / 3); out.push([cx + Math.cos(a) * r, y0 - ri * 0.1, cz + Math.sin(a) * r]); } });
  return out;
};
const cone = (g, x, z, len, color, yaw, lay = true) => {
  const grp = new THREE.Group(); grp.position.set(x, 0.13, z); if (lay) grp.rotation.set(0, yaw, Math.PI / 2 - 0.15);
  const R = [0.15, 0.135, 0.115, 0.09, 0.06]; R.forEach((r, k) => { const m = new THREE.Mesh(new THREE.ConeGeometry(r, 0.13, 8), clay(k % 2 ? color : 0x6e5238)); m.position.y = -len / 2 + k * len / R.length + 0.06; m.rotation.y = k * 0.4; m.castShadow = true; grp.add(m); });
  g.add(grp); return grp;
};

const OPTS = {
  '🌱 어린 쑥': [
    ['A 땅에 퍼진 잎', (g) => { for (let i = 0; i < 7; i++) leaf(g, i % 2 ? 0x9cc98a : 0x86b878, i / 7 * Math.PI * 2, 0.17, 0.36, 0.16, 0.05 + (i % 2) * 0.015, 0.25); add(g, new THREE.IcosahedronGeometry(0.07, 0), 0xc8e0b8, [0, 0.07, 0]); }],
    ['B 통통한 새순', (g) => { for (let i = 0; i < 4; i++) { const a = i / 4 * Math.PI * 2 + 0.4; add(g, new THREE.SphereGeometry(0.5, 7, 5), i % 2 ? 0x9cc98a : 0xb6d9a2, [Math.cos(a) * 0.07, 0.15, Math.sin(a) * 0.07], { scl: [0.13, 0.3, 0.07], rot: [Math.sin(a) * 0.5, -a, Math.cos(a) * 0.5], shadow: true }); } }],
    ['C 솜털 덤불', (g) => { add(g, new THREE.IcosahedronGeometry(0.28, 0), 0x9cc98a, [0, 0.14, 0], { scl: [1.2, 0.55, 1.2], shadow: true }); [[0.08, 0.05], [-0.12, 0.02], [0.02, -0.13], [-0.03, 0.12]].forEach(([x, z]) => add(g, new THREE.IcosahedronGeometry(0.06, 0), 0xe4efdc, [x, 0.27, z])); }],
  ],
  '🍇 머루': [
    ['A 누운 송이', (g) => { const grp = new THREE.Group(); berries(grp, 0x6b4fa3, grapeCluster(0, 0, 0.32, [4, 3, 2, 1])); add(grp, new THREE.CylinderGeometry(0.015, 0.015, 0.14, 4), 0x6b5a3a, [0, 0.4, 0]); grp.rotation.x = 1.35; grp.position.set(0, 0.1, -0.1); g.add(grp); }],
    ['B 잎 위 송이', (g) => { leaf(g, 0x5f9a4a, 0.4, 0.14, 0.5, 0.42, 0.03, 0); leaf(g, 0x4f8a3e, 2.6, 0.12, 0.42, 0.36, 0.035, 0); berries(g, 0x6b4fa3, [[0, 0.1, 0], [0.12, 0.09, 0.04], [-0.11, 0.09, 0.05], [0.04, 0.09, -0.12], [-0.06, 0.09, -0.09], [0.06, 0.09, 0.12], [0, 0.2, 0.01], [0.07, 0.19, -0.05], [-0.06, 0.19, 0.04]], 0.075); }],
    ['C 덩굴 그루', (g) => { add(g, new THREE.IcosahedronGeometry(0.3, 0), 0x4f8a3e, [0, 0.2, 0], { scl: [1.2, 0.7, 1.1], shadow: true }); berries(g, 0x5a3f8f, [...grapeCluster(0.2, 0.18, 0.28, [3, 2, 1]), ...grapeCluster(-0.22, 0.12, 0.28, [3, 2, 1])], 0.06); }],
  ],
  '🌰 알밤': [
    ['A 벌어진 밤송이', (g) => { add(g, new THREE.SphereGeometry(0.26, 10, 5, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), 0x8a6a2a, [0, 0.16, 0], { scl: [1, 0.6, 1] }); for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; add(g, new THREE.ConeGeometry(0.03, 0.12, 4), 0x9aa040, [Math.cos(a) * 0.25, 0.17, Math.sin(a) * 0.25], { rot: [Math.sin(a) * 1.2, 0, -Math.cos(a) * 1.2] }); } [[0, 0.06], [-0.08, -0.06], [0.09, -0.05]].forEach(([x, z]) => add(g, new THREE.SphereGeometry(0.085, 8, 6), 0x9b6236, [x, 0.15, z], { flat: false, scl: [1, 0.8, 1.15] })); }],
    ['B 반들 밤톨 셋', (g) => [[0, 0, 0], [0.22, 0.12, 1.4], [-0.2, 0.16, -1]].forEach(([x, z, r]) => { add(g, new THREE.SphereGeometry(0.14, 10, 7), 0x9b6236, [x, 0.11, z], { flat: false, scl: [1, 0.75, 1.2], rot: [0, r, 0], shadow: true }); add(g, new THREE.SphereGeometry(0.1, 8, 5), 0xe0c8a0, [x, 0.06, z], { flat: false, scl: [1.3, 0.35, 1.3], rot: [0, r, 0] }); })],
    ['C 가시 송이와 밤', (g) => { add(g, new THREE.IcosahedronGeometry(0.2, 1), 0x9aa040, [-0.08, 0.18, 0], { shadow: true }); for (let i = 0; i < 14; i++) { const v = new THREE.Vector3().setFromSphericalCoords(0.2, Math.acos(1 - 2 * (i + 0.5) / 14), i * 2.4); const m = add(g, new THREE.ConeGeometry(0.025, 0.12, 4), 0x7f8a30, [-0.08 + v.x * 1.05, 0.18 + v.y * 1.05, v.z * 1.05]); m.lookAt(-0.08 + v.x * 3, 0.18 + v.y * 3, v.z * 3); m.rotateX(Math.PI / 2); } [[0.22, 0.12], [0.18, -0.14]].forEach(([x, z]) => add(g, new THREE.SphereGeometry(0.1, 8, 6), 0x9b6236, [x, 0.08, z], { flat: false, scl: [1, 0.8, 1.15] })); }],
  ],
  '🌲 솔방울': [
    ['A 누운 솔방울', (g) => { cone(g, 0, 0, 0.42, 0x8a6a4a, 0.5); }],
    ['B 솔방울과 솔잎', (g) => { cone(g, -0.05, 0.03, 0.36, 0x8a6a4a, 0.4); cone(g, 0.2, -0.12, 0.28, 0x9a7a58, 2.2); for (let i = 0; i < 7; i++) { const a = -0.9 + i * 0.22; add(g, new THREE.CylinderGeometry(0.008, 0.008, 0.4, 3), 0x4f7a3a, [Math.cos(a) * 0.18 - 0.05, 0.02, Math.sin(a) * 0.18 + 0.18], { rot: [Math.PI / 2, 0, a] }); } }],
    ['C 서리 앉은 솔방울', (g) => { const c = cone(g, 0, 0, 0.42, 0x8a6a4a, 0, false); c.position.y = 0.21; [0.15, 0.135, 0.115, 0.09, 0.06].forEach((r, k) => { const s = new THREE.Mesh(new THREE.TorusGeometry(r * 0.95, 0.014, 3, 12), clay(0xeef4fa)); s.rotation.x = Math.PI / 2; s.position.y = -0.21 + k * 0.42 / 5 - 0.005; c.add(s); }); const top = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 4), clay(0xf4f8fc)); top.position.y = 0.21; c.add(top); }],
  ],
};

const SEASON_GROUND = { '🌱 어린 쑥': 0x9fc47a, '🍇 머루': 0x7fae5a, '🌰 알밤': 0xc9a45a, '🌲 솔방울': 0xe4ecef };
const cells = [];
const main = document.getElementById('m');
const section = (title, entries, three, ground) => {
  const h = document.createElement('h2'); h.textContent = title; main.append(h);
  const row = document.createElement('div'); row.className = 'row' + (three ? ' three' : ''); main.append(row);
  for (const [label, build] of entries) {
    const el = document.createElement('div'); el.className = 'cell'; el.innerHTML = `<span><b>${label}</b></span>`; row.append(el);
    const scene = new THREE.Scene();
    const floor = new THREE.Mesh(new THREE.CircleGeometry(1.1, 24), clay(ground)); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
    const g = new THREE.Group(); build(g); scene.add(g);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x6a7a50, 1.5));
    const sun = new THREE.DirectionalLight(0xfff4e0, 1.8); sun.position.set(2, 5, 3); sun.castShadow = true; sun.shadow.mapSize.set(512, 512);
    Object.assign(sun.shadow.camera, { left: -1.5, right: 1.5, top: 1.5, bottom: -1.5 }); scene.add(sun);
    const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
    const pitch = 41.2 * Math.PI / 180, d = 2.6; cam.position.set(0, Math.sin(pitch) * d, Math.cos(pitch) * d); cam.lookAt(0, 0.12, 0);
    cells.push({ el, scene, cam });
  }
};
section('지금 채집물 4종 (기준)', Object.entries(REF), false, 0x7fae5a);
for (const [name, opts] of Object.entries(OPTS)) section(name, opts, true, SEASON_GROUND[name]);

const canvas = document.getElementById('c');
const r = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
r.shadowMap.enabled = true; r.outputColorSpace = THREE.SRGBColorSpace; r.setScissorTest(true);
const draw = () => {
  r.setPixelRatio(devicePixelRatio); r.setSize(innerWidth, innerHeight, false);
  r.setClearColor(0x24301f); r.setScissor(0, 0, innerWidth, innerHeight); r.clear();
  for (const c of cells) {
    const b = c.el.getBoundingClientRect();
    if (b.bottom < 0 || b.top > innerHeight) continue;
    const y = innerHeight - b.bottom;
    r.setViewport(b.left, y, b.width, b.height); r.setScissor(b.left, y, b.width, b.height);
    c.cam.aspect = b.width / b.height; c.cam.updateProjectionMatrix(); r.render(c.scene, c.cam);
  }
};
addEventListener('scroll', draw, { passive: true }); addEventListener('resize', draw); draw();
</script>
