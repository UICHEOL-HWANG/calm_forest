<!doctype html>
<meta charset="utf-8">
<title>펫 조형 시안 — calm forest</title>
<style>
  html,body{margin:0;height:100%;background:linear-gradient(#cfe4ee,#eaf2e6);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#3a4a3a;overflow:hidden}
  canvas{display:block}
  #ui{position:fixed;left:0;right:0;bottom:0;padding:10px 14px 14px;background:rgba(255,255,255,.88);backdrop-filter:blur(6px);border-top:1px solid #cfdccf;font-size:13px}
  #ui .row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:5px 0}
  button{font:inherit;padding:5px 11px;border-radius:8px;border:1px solid #b8c8b8;background:#fff;cursor:pointer}
  button.on{background:#5b8f5b;color:#fff;border-color:#4a7a4a}
  label{display:flex;gap:6px;align-items:center;white-space:nowrap}
  input[type=range]{width:120px}
  b{color:#2f5e2f}
  #labels{position:fixed;top:0;left:0;right:0;pointer-events:none}
  .tag{position:absolute;transform:translate(-50%,0);text-align:center;font-size:12px;font-weight:600;
       background:rgba(255,255,255,.82);padding:3px 9px;border-radius:7px;white-space:nowrap;line-height:1.35}
  .tag small{display:block;font-weight:400;opacity:.65;font-size:10.5px}
  @media (max-width:760px){ .tag{font-size:10.5px;padding:2px 6px} .tag small{display:none} }
  #hud{position:fixed;top:10px;right:12px;background:rgba(255,255,255,.85);padding:8px 12px;border-radius:9px;font-size:12px;line-height:1.7;max-width:280px}
  #hud .warn{color:#b4553a;font-weight:600}
</style>
<div id="labels"></div>
<div id="hud"></div>
<div id="ui">
  <div class="row">
    <b>방향</b> <span id="dirs"></span>
  </div>
  <div class="row">
    <label>카메라 거리 <input id="dist" type="range" min="2" max="14" step="0.1" value="7.4"><span id="distV">7.4</span></label>
    <label>회전 <input id="ang" type="range" min="-180" max="180" step="5" value="16"><span id="angV">16°</span></label>
    <label>높이 <input id="elev" type="range" min="4" max="45" step="1" value="17"><span id="elevV">17°</span></label>
    <label><input id="spin" type="checkbox"> 자동 회전</label>
    <label><input id="night" type="checkbox"> 밤 조명</label>
    <label><input id="ghost" type="checkbox" checked> 캐릭터 대비</label>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';
//  🍃 고른 종의 조형·팔레트·공통 헬퍼는 **모듈이 단일 출처**다. 여기 복제본을 두지 않는다.
import { PET_KIND, PET_PALETTE, buildPet, updatePetAnim } from '../js/pet/art.js';

// =============================================================
//  🐾 펫 조형 시안 — 방향 4종 × 성장 3단계
//  ------------------------------------------------------------
//  ▶ 왜 이 4종인가: 게임에 이미 도는 동물이 많다(플레이어 7종 · 일꾼 3종 ·
//    주민 · 닭 · 방문객 도감 · 밤손님). 네발 포유류/설치류 자리는 다 찼고,
//    베타에서 "누가 누군지 모르겠다"를 이미 맞았다. 그래서 후보는 전부
//    **지상 네발 실루엣을 피한 것**들이다 — 뜨거나(정령·새), 돌덩이거나(흙꼬마).
//
//  ▶ 성장은 색이 아니라 **실루엣**으로 읽혀야 한다. 멀리서 봐도 1→3단계가
//    구분되게 "윤곽이 바뀌는 축"을 방향마다 하나씩 못박았다:
//      ✨정령   = 주위를 도는 파편 수 + 후광
//      🐦새     = 꽁지깃 길이 + 볏
//      🫘흙꼬마 = 몸을 덮는 식생(민둥돌 → 이끼 → 꽃·버섯)
//      🍃잎사귀 = 잎 장수 + 망토
//
//  ▶ 조형 규칙(이 저장소에서 비싸게 배운 것들):
//    · 부속을 꽂지 말고 **형태로 승격**한다 — 이끼는 붙이는 게 아니라 몸 윗면을 덮는다.
//    · 눈은 **작고 어둡게**. 크고 흰 눈은 인형이 아니라 캐릭터가 된다.
//    · 면이 겹치면 줄무늬(z-fighting)가 인다 — 덮는 조각은 확실히 띄운다.
//    · 촘촘한 반복은 환공포증으로 읽힌다 — 파편·깃털·꽃잎은 6을 넘기지 않는다.
//
//  ▶ ⚠️ 블룸 임계 0.85(js/tool-tiers.js BLOOM_LUMA) — 휘도가 이 값을 넘는 색을
//    넓은 면에 칠하면 UnrealBloomPass 후광이 형태를 통째로 삼킨다(🛶나룻배 등불 사고).
//    정령은 빛나는 물체라 여기 제일 걸리기 쉽다. 아래 PALETTE 의 모든 색을
//    부팅 시 luma() 로 검산해 HUD 에 띄운다 — 넘는 색이 있으면 빨갛게 경고한다.
//
//  ▶ ✅ 종 확정: 🍃 **잎사귀 정령**(PET_KIND = 'leaf'). 조형·팔레트·공통 헬퍼는
//    js/pet/art.js 로 옮겼고 이 파일이 그걸 import 한다 — 시안이 복제본으로 남으면
//    게임과 갈린다(tool-tier-sim 에서 낚싯대 0단계 값이 갈려 역이식된 사고가 있었다).
//    나머지 세 후보(✨정령·🐦새·🫘흙꼬마)는 **설계 기록**으로 여기 남긴다 — 게임엔 안 간다.
//    왜 잎사귀 정령인가는 js/pet/art.js 머리주석에 적었다.
// =============================================================

// ── 블룸 검산 (js/tool-tiers.js 와 같은 식 — Rec.709) ──
const BLOOM_LUMA = 0.85;
const luma = hex => (0.2126 * ((hex >> 16) & 255) + 0.7152 * ((hex >> 8) & 255) + 0.0722 * (hex & 255)) / 255;

// ── 팔레트 — **모듈이 단일 출처**다. 넓은 면에 쓰는 색은 전부 0.85 아래로 맞췄다 ──
//   ⚠️ 여기서 색을 다시 적지 않는다. 시안이 복제본으로 남으면 게임과 갈린다
//      (tool-tier-sim 에서 낚싯대 0단계 값이 갈려 역이식된 사고가 있었다).
const P = PET_PALETTE;

// ── 조형 — **네 종 전부 모듈이 그린다**(2026-09-23, 4종 확장) ──
//   시안에 조형을 남겨 두지 않는다. 이 파일은 이제 **검수 무대**일 뿐이다.
const buildOf = kind => st => buildPet(THREE, kind, st);

// =============================================================
//  구성 표 — 방향 4종 × 3단계. 이름/설명이 캡처의 라벨이 된다
// =============================================================
const DIRS = [
  { id: 'spirit', ico: '✨', name: '정령',        build: buildOf('spirit'),
    stages: ['씨눈 — 코어 하나', '어린 정령 — 파편 3', '정령 — 파편 6 + 후광'],
    note: '지상 실루엣과 0 충돌 · 색만 바꿔도 새 상품' },
  { id: 'bird',   ico: '🐦', name: '새',          build: buildOf('bird'),
    stages: ['새끼 — 솜털 한 가닥', '어린 새 — 꽁지 3장', '어른 새 — 꽁지 5장 + 볏'],
    note: '쓰다듬는 맛 · 낚시 보조가 자연스럽다' },
  { id: 'golem',  ico: '🫘', name: '흙꼬마',      build: buildOf('golem'),
    stages: ['돌멩이 — 팔도 다리도 없다', '이끼가 덮인다', '꽃과 버섯이 핀다'],
    note: '로스터와 100% 무충돌 · 밭일 서사' },
  { id: PET_KIND, ico: '🍃', name: '잎사귀 정령', build: buildOf(PET_KIND),
    stages: ['씨앗 — 잎 1장', '잎 3장 + 줄기 팔', '잎 왕관 5장 + 망토'],
    note: '정령의 신비 + 만질 형태' },
];

// =============================================================
//  무대
// =============================================================
const scene = new THREE.Scene();
// ⚠️ background 를 안 주면 지평선 위가 검게 남는다(캔버스가 body 그라데이션을 덮는다).
scene.background = new THREE.Color(0xdbe9ee);
scene.fog = new THREE.Fog(0xdbe9ee, 16, 38);
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xdfefff, 0x6f7f68, 0.85); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3df, 1.15);
sun.position.set(4, 8, 5); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 0.5, far: 24 });
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun);
const rim = new THREE.DirectionalLight(0xbfd8e8, 0.35); rim.position.set(-5, 3, -4); scene.add(rim);

const ground = new THREE.Mesh(new THREE.CircleGeometry(14, 48), new THREE.MeshStandardMaterial({ color: 0x9fc08a, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

// ── 그리드 배치 — X 가 성장(왼→오), Z 가 방향(앞→뒤) ──
const GX = 1.30, GZ = 1.35;
const cells = [];
const root = new THREE.Group(); scene.add(root);

// 👤 캐릭터 대비 — 플레이어 체형(몸 R 0.52 · 머리 Y 1.26)을 흐린 실루엣으로 세운다.
//    펫이 "무릎 높이"인지 눈으로 확인하지 않으면 인게임에서 크기가 어긋난다.
const ghost = new THREE.Group();
{
  const gm = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, transparent: true, opacity: 0.30, depthWrite: false });
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.52, 16, 12), gm); b.position.y = 0.56; b.scale.set(0.9, 1.08, 0.9); ghost.add(b);
  const h = new THREE.Mesh(new THREE.SphereGeometry(0.37, 16, 12), gm); h.position.y = 1.26; ghost.add(h);
}
root.add(ghost);

let listNow = DIRS;
function layout(filter) {
  cells.length = 0;
  [...root.children].forEach(c => { if (c !== ghost) root.remove(c); });
  listNow = filter ? DIRS.filter(d => d.id === filter) : DIRS;
  const z0 = -((listNow.length - 1) / 2) * GZ;
  listNow.forEach((d, di) => {
    for (let st = 0; st < 3; st++) {
      const g = d.build(st);
      const x = (st - 1) * GX, z = z0 + di * GZ;
      g.position.set(x, 0, z);
      root.add(g);
      cells.push({ dir: d, st, group: g, x, z, y0: 0 });
    }
  });
  ghost.position.set(-2 * GX - 0.40, 0, z0 + (listNow.length - 1) * GZ * 0.5);
  buildTags(z0);
}

// ── 라벨(DOM) ─────────────────────────────────────────────────
const labels = document.getElementById('labels');
let tags = [];
function buildTags(z0) {
  labels.innerHTML = ''; tags = [];
  cells.forEach(c => {
    const el = document.createElement('div'); el.className = 'tag';
    el.innerHTML = `${c.st + 1}단계<small>${c.dir.stages[c.st]}</small>`;
    labels.appendChild(el);
    tags.push({ el, x: c.x, z: c.z, y: [0.78, 0.92, 1.06][c.st] });
  });
  listNow.forEach((d, di) => {
    const el = document.createElement('div'); el.className = 'tag';
    el.innerHTML = `${d.ico} <b>${d.name}</b><small>${d.note}</small>`;
    labels.appendChild(el);
    tags.push({ el, x: -2 * GX - 0.40, z: z0 + di * GZ, y: 1.72 });
  });
}

const v = new THREE.Vector3();
function placeTags() {
  tags.forEach(t => {
    v.set(t.x, t.y, t.z);
    root.localToWorld(v); v.project(camera);
    t.el.style.left = ((v.x * 0.5 + 0.5) * innerWidth) + 'px';
    t.el.style.top  = ((-v.y * 0.5 + 0.5) * innerHeight) + 'px';
    t.el.style.display = v.z > 1 ? 'none' : '';
  });
}

// ── 조작 ─────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
let filter = null, dist = 7.4, angle = 16, elev = 17;

const dirsBox = $('dirs');
function renderBtns() {
  dirsBox.innerHTML = '';
  const mk = (label, on, fn) => {
    const b = document.createElement('button'); b.textContent = label; if (on) b.className = 'on';
    b.onclick = () => { fn(); renderBtns(); }; dirsBox.appendChild(b);
  };
  mk('전체', filter === null, () => { filter = null; layout(null); dist = 7.4; $('dist').value = 7.4; $('distV').textContent = '7.4'; });
  DIRS.forEach(d => mk(`${d.ico} ${d.name}`, filter === d.id, () => { filter = d.id; layout(d.id); dist = 3.8; $('dist').value = 3.8; $('distV').textContent = '3.8'; }));
}

$('dist').oninput = e => { dist = +e.target.value; $('distV').textContent = dist.toFixed(1); };
$('ang').oninput  = e => { angle = +e.target.value; $('angV').textContent = angle + '°'; };
$('elev').oninput = e => { elev = +e.target.value; $('elevV').textContent = elev + '°'; };
$('ghost').onchange = e => { ghost.visible = e.target.checked; };
$('night').onchange = e => {
  const n = e.target.checked;
  hemi.intensity = n ? 0.30 : 0.85; sun.intensity = n ? 0.22 : 1.15;
  hemi.color.set(n ? 0x9fb4d8 : 0xdfefff); rim.intensity = n ? 0.16 : 0.35;
  document.body.style.background = n ? 'linear-gradient(#2b3a52,#3d4f52)' : 'linear-gradient(#cfe4ee,#eaf2e6)';
  ground.material.color.set(n ? 0x4a6350 : 0x9fc08a);
  scene.fog.color.set(n ? 0x36485c : 0xdbe9ee);
  scene.background.set(n ? 0x36485c : 0xdbe9ee);
};

// ── HUD — 블룸 검산 결과를 띄운다(넘는 색이 있으면 빨갛게) ──
{
  const nums = Object.entries(P).filter(([, c]) => typeof c === 'number');
  const over = nums.filter(([, c]) => luma(c) > BLOOM_LUMA);
  $('hud').innerHTML =
    `🐾 <b>펫 조형 시안</b><br>방향 4종 × 성장 3단계<br>` +
    `<span style="opacity:.6">X축 = 성장 · Z축 = 방향</span><br>` +
    (over.length
      ? `<span class="warn">⚠️ 블룸 초과 ${over.length}색: ${over.map(([k]) => k).join(', ')}</span>`
      : `<span style="color:#3f7a4a">✓ 블룸 임계 0.85 — ${nums.length}색 전부 통과</span>`);
  console.log('[pet-sim] 블룸 검산', Object.fromEntries(nums.map(([k, c]) => [k, +luma(c).toFixed(3)])));
}

// ── 루프 ─────────────────────────────────────────────────────
layout(null); renderBtns();
const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  const t = clock.getElapsedTime();
  if ($('spin').checked) {
    angle = (angle + 0.28) % 360;
    $('ang').value = angle > 180 ? angle - 360 : angle;
    $('angV').textContent = Math.round(angle) + '°';
  }

  // 정령 계열 — 공전·맥동·둥둥. 멈춰 있으면 "빛덩이"가 아니라 "구슬"로 보인다
  //   ▶ 애니메이션 규약도 모듈이 단일 출처다(게임의 updatePet 이 같은 함수를 부른다).
  //     위상은 group.position(= 그리드 좌표 c.x·c.z)에서 딴다 — 값이 같다.
  cells.forEach(c => updatePetAnim(c.group, t));

  const r = THREE.MathUtils.degToRad(angle), e = THREE.MathUtils.degToRad(elev);
  camera.position.set(Math.sin(r) * Math.cos(e) * dist, Math.sin(e) * dist + 0.55, Math.cos(r) * Math.cos(e) * dist);
  camera.lookAt(0, 0.55, 0);
  placeTags();
  renderer.render(scene, camera);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// 헤드리스 캡처용 — 밖에서 방향을 고르고 애니메이션을 고정할 수 있게 열어 둔다
window.__petSim = { DIRS, setFilter: id => { filter = id; layout(id); renderBtns(); } };
</script>
