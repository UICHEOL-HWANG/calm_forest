<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🦆 사공 퀴즈 시안 — calm forest</title>
<!--
  🦆 사공 오리 퀴즈 — 화면 3안 · 사공 대사 · 보상안 (dev/active/ferry-quiz Task 1, 디자인 게이트)
  A 대화창 이어가기(#chat-modal 그대로) / B 퀴즈 카드(2×2 타일) / C 나루터 팻말(나무 판 + 밧줄 표찰)
  색·말풍선·선택지 물성은 index.html #chat-modal(701~757행)에서 그대로 옮겼다.
  문제는 실제 게임 데이터: 🍑 복숭아 4일(js/orchard.js FRUITS)
  쿼리: ?w=375&design=B  → 폭 고정 + 한 안만(모바일 캡처용). 없으면 세 안을 나란히(PC).
-->
<style>
  :root { --mint: #bfe8c9; --ink: #4a5a4f; --shadow: 0 6px 18px rgba(90,120,100,0.18); }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", system-ui, sans-serif;
         background: #dfe9df; color: var(--ink); }
  .page { padding: 18px 16px 28px; }
  h1 { font-size: 18px; margin: 0 0 4px; } .sub { font-size: 12.5px; opacity: .7; margin: 0 0 14px; }
  .row { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 16px; }
  .col h2 { font-size: 15px; margin: 0 0 8px; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
  .col h2 small { font-weight: 500; opacity: .65; font-size: 12px; }
  .scene { position: relative; border-radius: 16px; overflow: hidden; padding: 18px 12px; min-height: 410px;
           background: radial-gradient(120% 90% at 30% 20%, #cfe6c3 0%, #a9c79c 45%, #7fa27a 100%); display: grid; place-items: center; }
  .scene::before { content: ''; position: absolute; inset: 0; background: rgba(24,42,33,0.42); }
  .scene > * { position: relative; }
  .state { font-size: 11.5px; font-weight: 700; margin: 10px 0 6px; opacity: .7; }

  /* A 대화창 이어가기 (#chat-modal 물성 그대로) */
  .chat-card { width: min(100%, 430px); display: flex; flex-direction: column;
    background: linear-gradient(180deg, #fffefa 0%, #fdfaf1 100%); border: 1px solid rgba(120,150,120,0.16);
    border-radius: 20px; padding: 14px 16px 16px; box-shadow: 0 18px 44px -12px rgba(38,64,48,0.34); }
  .chat-head { display: flex; align-items: center; gap: 9px; padding-bottom: 11px; border-bottom: 1px solid rgba(120,150,120,0.14); }
  .chip { width: 30px; height: 30px; flex: none; display: grid; place-items: center; background: #eef5ea; border-radius: 50%; font-size: 17px; }
  .cname { font-weight: 700; font-size: 15px; color: #2f5d43; }
  .qno { margin-left: auto; font-size: 12px; font-weight: 700; color: #7d9a83; }
  .log { margin: 12px 0 4px; display: flex; flex-direction: column; gap: 8px; }
  .tl { font-size: 14px; line-height: 1.6; padding: 9px 13px; max-width: 88%; word-break: keep-all; }
  .tl.npc { background: #ecf4e8; color: #2b4a37; align-self: flex-start; border-radius: 14px 14px 14px 4px; }
  .tl.me { background: #e6eef8; color: #2a4560; align-self: flex-end; border-radius: 14px 14px 4px 14px; }
  .tl.npc.hint { background: #fbf3e2; color: #6b4d1c; }
  .choices { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; }
  .choices button { display: flex; align-items: center; gap: 8px; text-align: left; padding: 10px 12px 10px 14px;
    font: inherit; font-size: 13.5px; color: #35604a; background: #fff; border: 1px solid rgba(120,150,120,0.22);
    border-left: 3px solid #cfe0cd; border-radius: 12px; }
  .choices button b { width: 18px; color: #9ab79c; font-weight: 800; }
  .dots { display: flex; gap: 5px; margin-left: 8px; } .dots i { width: 8px; height: 8px; border-radius: 50%; background: #dfe8dc; }
  .dots i.ok { background: #7fb389; } .dots i.no { background: #e6b3a4; } .dots i.now { outline: 2px solid #7fb389; outline-offset: 1px; }
  .done { display: flex; justify-content: flex-end; padding-top: 12px; }
  .done button { border: none; border-radius: 12px; padding: 9px 20px; font: inherit; font-weight: 800; font-size: 13.5px; background: var(--mint); color: var(--ink); }

  /* B 퀴즈 카드 (2×2 타일) */
  .qcard { width: min(100%, 400px); background: #fff; border-radius: 22px; padding: 16px 16px 18px; box-shadow: 0 20px 60px rgba(30,50,40,0.35); }
  .qtop { display: flex; align-items: center; gap: 10px; }
  .duck { width: 44px; height: 44px; border-radius: 50%; background: #fff4dc; display: grid; place-items: center; font-size: 26px; box-shadow: inset 0 0 0 2px #f2d7a0; flex: none; }
  .qtop .who { font-size: 12px; color: #8a7a55; font-weight: 700; } .qtop .say { font-size: 13px; color: #5b6b5f; }
  .prog { margin-left: auto; display: flex; gap: 4px; } .prog i { width: 22px; height: 6px; border-radius: 3px; background: #e7ece6; }
  .prog i.ok { background: #7fb389; } .prog i.no { background: #e6b3a4; } .prog i.now { background: #f0c96a; }
  .qtext { margin: 16px 2px 14px; font-size: 17px; font-weight: 800; line-height: 1.45; color: #34463b; word-break: keep-all; text-align: center; }
  .qtext .big { display: block; font-size: 38px; margin-bottom: 4px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tiles button { border: 2px solid #e4ece2; background: #f8fbf6; border-radius: 16px; padding: 14px 8px; font: inherit;
    font-size: 16px; font-weight: 800; color: #3c5a47; min-height: 56px; }
  .tiles button.right { border-color: #7fb389; background: #e6f4e5; color: #2c6a40; }
  .tiles button.wrong { border-color: #e6b3a4; background: #fbece7; color: #9a4b39; }
  .tiles button.dim { opacity: .45; }
  .fb { margin-top: 12px; border-radius: 14px; padding: 10px 12px; font-size: 13.5px; line-height: 1.55; background: #fbf3e2; color: #6b4d1c; word-break: keep-all; }
  .qfoot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; min-height: 34px; }
  .qfoot .left { font-size: 12px; color: #8d9a90; }
  .qfoot button { border: none; border-radius: 12px; padding: 9px 18px; font: inherit; font-weight: 800; font-size: 13.5px; background: var(--mint); color: var(--ink); }

  /* C 나루터 팻말 (나무 판 + 밧줄 표찰) */
  .board { width: min(100%, 410px); border-radius: 14px; padding: 18px 16px 16px; color: #4a3218; position: relative;
    background: repeating-linear-gradient(0deg, rgba(90,55,20,.08) 0 2px, transparent 2px 38px),
                repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 7px),
                linear-gradient(180deg, #d9a86a 0%, #c99356 100%);
    box-shadow: inset 0 0 0 3px #a8733b, inset 0 0 0 6px #e1b57c, 0 18px 40px -10px rgba(40,25,10,.55); }
  .board::before, .board::after { content: ''; position: absolute; top: 10px; width: 10px; height: 10px; border-radius: 50%; background: #7a4f22; }
  .board::before { left: 10px; } .board::after { right: 10px; }
  .bhead { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 900; font-size: 15px; color: #5a3a14; }
  .bhead .n { font-size: 12px; background: #7a4f22; color: #f7e4c4; border-radius: 10px; padding: 2px 8px; }
  .paper { margin: 12px 4px 4px; background: #fbf4e4; border-radius: 6px; padding: 12px 14px; font-size: 15.5px; font-weight: 800; line-height: 1.5;
    text-align: center; color: #4a3218; box-shadow: 0 2px 0 rgba(90,55,20,.25); transform: rotate(-.6deg); word-break: keep-all; }
  .rope { height: 12px; margin: 10px 6px 0; background: repeating-linear-gradient(115deg, #b99462 0 5px, #9c7545 5px 9px); border-radius: 6px; }
  .tags { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: -2px; }
  .tag { display: flex; flex-direction: column; align-items: center; }
  .tag::before { content: ''; width: 2px; height: 12px; background: #7a5a33; }
  .tag button { width: 100%; border: none; border-radius: 8px 8px 12px 12px; padding: 10px 2px; font: inherit; font-weight: 900; font-size: 15px;
    background: #f3e2c3; color: #5a3a14; box-shadow: 0 3px 0 #b88b52; }
  .tag.right button { background: #cfe8c4; color: #2c5a2c; box-shadow: 0 3px 0 #7fae72; transform: rotate(2deg); }
  .tag.wrong button { background: #f1cdbf; color: #8a3d2a; box-shadow: 0 3px 0 #c98d77; transform: rotate(-3deg); }
  .bsay { display: flex; gap: 8px; align-items: flex-start; margin-top: 14px; }
  .bsay .duck { width: 36px; height: 36px; font-size: 21px; }
  .bsay p { margin: 0; background: #fbf4e4; border-radius: 12px 12px 12px 4px; padding: 8px 11px; font-size: 13.5px; line-height: 1.55; word-break: keep-all; }

  /* 문구·보상 */
  .notes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 18px; }
  .notes section { background: #fff; border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); }
  .notes h3 { margin: 0 0 8px; font-size: 14.5px; }
  .notes table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .notes td { padding: 6px 4px; border-top: 1px solid #edf1ec; vertical-align: top; line-height: 1.5; word-break: keep-all; }
  .notes td:first-child { width: 66px; font-weight: 700; color: #6d7f71; white-space: nowrap; }
  .rw { border: 2px solid #e7ece6; border-radius: 12px; padding: 9px 11px; margin-bottom: 8px; font-size: 13px; line-height: 1.55; }
  .rw.rec { border-color: #7fb389; background: #f3faf2; } .rw b { font-size: 13.5px; }
  .pill { display: inline-block; font-size: 11px; font-weight: 800; background: #7fb389; color: #fff; border-radius: 8px; padding: 1px 6px; margin-left: 4px; }
</style>
<div class="page" id="page"></div>
<script>
const Q = new URLSearchParams(location.search);
const W = +Q.get('w') || 0, ONLY = Q.get('design');
if (W) document.body.style.width = W + 'px';

// 실제 게임 데이터 — 🍑 복숭아는 심고 4일(js/orchard.js FRUITS.growDays)
const Q2 = { big: '🍑', text: '🍑 복숭아나무는 심고 며칠이면 열매가 열리겠나?', short: '복숭아나무는 심고 며칠이면 열매를 맺나?',
  choices: ['2일', '3일', '4일', '5일'], answer: 2, picked: 1, hint: '과수원 묘목 가게에서 나무마다 걸리는 날을 볼 수 있다네.' };
const dots = (fb) => `<span class="dots"><i class="ok"></i><i class="${fb ? 'no' : 'now'}"></i><i></i></span>`;

const A = (fb) => `<div class="chat-card">
  <div class="chat-head"><span class="chip">🦆</span><span class="cname">사공 오리</span>${dots(fb)}<span class="qno">퀴즈 2/3</span></div>
  <div class="log"><div class="tl npc">두 번째일세. ${Q2.text}</div>
    ${fb ? `<div class="tl me">${Q2.choices[Q2.picked]}</div><div class="tl npc hint">허허, 아깝구먼. 답은 <b>${Q2.choices[Q2.answer]}</b>일세 — ${Q2.hint}</div>` : ''}</div>
  ${fb ? '<div class="done"><button>다음 문제 ›</button></div>'
       : `<div class="choices">${Q2.choices.map((c, i) => `<button><b>${'①②③④'[i]}</b>${c}</button>`).join('')}</div>`}
</div>`;

const B = (fb) => `<div class="qcard">
  <div class="qtop"><span class="duck">🦆</span><div><div class="who">사공 오리</div><div class="say">${fb ? '허허, 아깝구먼!' : '두 번째일세, 천천히 보시게.'}</div></div>
    <span class="prog"><i class="ok"></i><i class="${fb ? 'no' : 'now'}"></i><i></i></span></div>
  <div class="qtext"><span class="big">${Q2.big}</span>${Q2.short}</div>
  <div class="tiles">${Q2.choices.map((c, i) => `<button class="${fb ? (i === Q2.answer ? 'right' : i === Q2.picked ? 'wrong' : 'dim') : ''}">${c}</button>`).join('')}</div>
  ${fb ? `<div class="fb">답은 <b>${Q2.choices[Q2.answer]}</b>일세 — ${Q2.hint}</div>` : ''}
  <div class="qfoot"><span class="left">${fb ? '맞힌 문제 1개' : '하루 한 번 · 3문제'}</span>${fb ? '<button>다음 ›</button>' : ''}</div>
</div>`;

const C = (fb) => `<div class="board">
  <div class="bhead">🦆 나루터 수수께끼 <span class="n">2 / 3</span></div>
  <div class="paper">${Q2.short}</div>
  <div class="rope"></div>
  <div class="tags">${Q2.choices.map((c, i) => `<div class="tag ${fb ? (i === Q2.answer ? 'right' : i === Q2.picked ? 'wrong' : '') : ''}"><button>${c}</button></div>`).join('')}</div>
  <div class="bsay"><span class="duck">🦆</span><p>${fb ? `허허, 아깝구먼. 답은 <b>${Q2.choices[Q2.answer]}</b>일세 — ${Q2.hint}` : '물때 기다리는 동안 하나 더 풀어 보시게.'}</p></div>
</div>`;

const DESIGNS = [
  ['A', '대화창 이어가기', '기존 주민 대화창 그대로 · 새 UI 거의 없음 · 가장 가벼움', A],
  ['B', '퀴즈 카드', '2×2 큰 타일 · 정답/오답 색 · 폰 엄지로 누르기 쉬움', B],
  ['C', '나루터 팻말', '나무 판 + 밧줄 표찰 · 분위기 최고 · CSS 만으로(중간 무게)', C],
];
const col = ([id, name, note, fn]) => `<div class="col"><h2>${id}안 ${name} <small>${note}</small></h2>
  <div class="state">① 문제</div><div class="scene">${fn(false)}</div>
  <div class="state">② 틀렸을 때 — 정답 + 어디서 알 수 있는지</div><div class="scene">${fn(true)}</div></div>`;

const LINES = [
  ['시작', '물때 기다리는 동안 문제 셋 내 보겠네. / 강 건너는 셈 치고 머리 좀 써 보시게. / 오늘도 왔구먼! 수수께끼 셋일세.'],
  ['정답', '옳거니! 제법이구먼. / 허, 훤하구먼! / 맞았네, 역시 이 마을 사람일세.'],
  ['오답', '허허, 아깝구먼. 답은 {답}일세 — {힌트} / 괜찮네, 나도 처음엔 헷갈렸다네. 답은 {답}일세 — {힌트}'],
  ['3/3', '셋 다 맞혔구먼! 이 강 물길을 다 아는 사람일세.'],
  ['끝 1~2', '오늘은 {n}개일세. 내일 물때에 또 오시게.'],
  ['끝 0', '허허, 오늘은 물살이 셌구먼. 내일은 맞힐 걸세.'],
  ['이미 함', '오늘 수수께끼는 끝났다네. 내일 물때에 또 오시게.'],
];
const REWARDS = [
  ['a', '🪱 미끼 · 🌱 비료', '정답 1개마다 🪱미끼 2 · 3/3 이면 🌱비료 3 더', '보물상자와 같은 실물 재료. 낚시·농사에 바로 쓰인다. 코인 인플레 없음.'],
  ['b', '🪙 코인', '정답 1개마다 🪙8 · 3/3 이면 🪙15 더 (하루 최대 39)', '어디든 쓰이지만 매일 공짜 코인이 쌓인다.'],
  ['c', '🛶 뱃길 한 번 더 + 미끼', '정답 1개마다 🪱미끼 1 · 3/3 이면 <b>오늘 뱃길 +1회</b>(하루 3 → 4)', '사공다운 보상 — 퀴즈 → 나룻배로 이어진다. 보물상자는 여전히 하루 1개.'],
];

const show = ONLY ? DESIGNS.filter(d => d[0] === ONLY) : DESIGNS;
document.getElementById('page').innerHTML = `
  <h1>🦆 사공 오리 퀴즈 — 화면 3안</h1>
  <p class="sub">문제는 실제 게임 데이터(🍑 복숭아 = 4일). 하루 한 번 · 4지선다 3문제 · 틀리면 정답과 "어디서 알 수 있는지"를 알려준다.</p>
  <div class="row" style="--cols:${W && W < 700 ? 1 : show.length}">${show.map(col).join('')}</div>
  ${ONLY ? '' : `<div class="notes">
    <section><h3>💬 사공 대사 후보 (하게체 · 나무라지 않기)</h3><table>${LINES.map(([k, v]) => `<tr><td>${k}</td><td>${v.split(' / ').join('<br>')}</td></tr>`).join('')}</table></section>
    <section><h3>🎁 보상 안 — 별(★)은 가치가 거의 없어 뺐다</h3>${REWARDS.map(([id, t, rule, why]) => `<div class="rw ${id === 'c' ? 'rec' : ''}"><b>(${id}) ${t}</b>${id === 'c' ? '<span class="pill">추천</span>' : ''}<br>${rule}<br><span style="opacity:.7">${why}</span></div>`).join('')}</section>
  </div>`}`;
document.body.dataset.ready = '1';
</script>
