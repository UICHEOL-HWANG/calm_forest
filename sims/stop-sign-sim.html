<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>정류장 표지판 시안</title>
<style>
  body { margin: 0; background: #15122a; color: #e8e4ff; font: 14px/1.5 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 16px 16px 4px; } p { margin: 0 16px 8px; color: #a9a2d6; font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 0 16px 16px; }
  .cell { background: #211c40; border-radius: 10px; padding: 8px; } .cell b { display: block; } .cell small { color: #a9a2d6; display: block; margin-top: 4px; }
  canvas { width: 100%; display: block; border-radius: 6px; margin-top: 4px; }
</style>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>
</head><body>
<h1>🚏 정류장 표지판 — 현재 + 3안</h1>
<p>모바일 줌 플레이 카메라 · 플레이어는 「거울 마을행 타기」 자리(정류장 북쪽) · 위: 마을 · 아래: 거울 마을 색</p>
<div class="grid" id="g"></div>
<script type="module">
import * as THREE from 'three';
import { makeStopSignFace } from '../js/mirror/art.js';
const W = 360, H = 420;
const R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
R.setPixelRatio(1); R.setSize(W, H, false); R.outputColorSpace = THREE.SRGBColorSpace; R.toneMapping = THREE.ACESFilmicToneMapping;
const mat = (c) => new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: 0.85 });
function put(p, geo, c, x, y, z) { const m = new THREE.Mesh(geo, mat(c)); m.position.set(x, y, z); p.add(m); return m; }
// 정류장 본체(makeStopShelter 와 같은 치수) — 표지판만 안마다 바꾼다
function shelter(roof, wood, sign) {
  const g = new THREE.Group();
  for (const s of [-1.1, 1.1]) put(g, new THREE.CylinderGeometry(0.09, 0.11, 2.3, 6), wood, s, 1.15, -0.4);
  put(g, new THREE.BoxGeometry(2.8, 0.16, 1.3), roof, 0, 2.36, -0.25).rotation.x = 0.12;
  put(g, new THREE.BoxGeometry(1.8, 0.12, 0.45), wood, 0, 0.48, -0.55);
  SIGN[sign](g, wood);
  return g;
}
// 얼굴 메시는 (1.7, 2.4, 0.2) 기준으로 만들어진다 — 원하는 자리·크기로 옮긴다
function face(g, x, y, z, s = 1) { const f = makeStopSignFace(); f.scale.setScalar(s); f.position.set(x - 1.7 * s, y - 2.4 * s, z - 0.2 * s); g.add(f); return f; }
const SIGN = {
  now(g) { put(g, new THREE.CylinderGeometry(0.06, 0.06, 2.6, 6), 0x8a8f99, 1.7, 1.3, 0.2); put(g, new THREE.BoxGeometry(1.0, 0.4, 0.06), 0xfff8ea, 1.7, 2.4, 0.2); face(g, 1.7, 2.4, 0.2); },
  A(g, wood) {   // 지붕 간판 — 기둥 없이 지붕 위에 붙어 정류장과 한 덩어리
    put(g, new THREE.BoxGeometry(1.0, 0.4, 0.06), 0x3f63a8, 0.85, 2.72, -0.25); face(g, 0.85, 2.72, -0.25);
    for (const x of [0.5, 1.2]) put(g, new THREE.BoxGeometry(0.05, 0.14, 0.05), wood, x, 2.5, -0.25);
  },
  B(g) {   // 낮은 말뚝 표지(1.4m) — 정류장 옆 바닥, 시선보다 낮다
    put(g, new THREE.CylinderGeometry(0.06, 0.06, 1.4, 6), 0x8a8f99, 1.75, 0.7, -0.4);
    put(g, new THREE.BoxGeometry(0.7, 0.3, 0.05), 0x3f63a8, 1.75, 1.3, -0.4); face(g, 1.75, 1.3, -0.4, 0.7);
  },
  C(g, wood) {   // 기둥 깃발 — 지붕 기둥 바깥으로 짧게 단 판(새 기둥 없음)
    put(g, new THREE.BoxGeometry(0.4, 0.05, 0.05), wood, 1.3, 1.95, -0.4);
    put(g, new THREE.BoxGeometry(0.62, 0.4, 0.05), 0x3f63a8, 1.62, 1.75, -0.4); face(g, 1.62, 1.75, -0.4, 0.62);
  },
};
const LBL = { now: ['현재', '긴 기둥(2.6m) + 판 — 플레이어 앞을 가로지른다'], A: ['A · 지붕 간판', '기둥 없이 지붕 위에 붙인 판 — 정류장과 한 덩어리'], B: ['B · 낮은 말뚝', '1.4m 말뚝 + 작은 판 — 시선보다 낮다'], C: ['C · 기둥 깃발', '지붕 기둥에 옆으로 단 판 — 새 기둥 없음'] };
function scene(day) {
  const s = new THREE.Scene(); s.background = new THREE.Color(day ? 0xcfe3c8 : 0x2e2858); s.fog = new THREE.Fog(s.background, 30, 80);
  s.add(new THREE.HemisphereLight(day ? 0xffffff : 0xb8c4ff, day ? 0x8a9a70 : 0x3a3270, day ? 1.1 : 0.95));
  s.add(new THREE.AmbientLight(day ? 0xffffff : 0x8a90d8, 0.6));
  const sun = new THREE.DirectionalLight(day ? 0xfff2dc : 0xe8dcff, 1.2); sun.position.set(10, 22, 8); s.add(sun);
  put(s, new THREE.CircleGeometry(40, 32), day ? 0xa8b878 : 0x50629a, 0, 0, 0).rotation.x = -Math.PI / 2;
  return s;
}
for (const k of ['now', 'A', 'B', 'C']) {
  const cell = document.createElement('div'); cell.className = 'cell'; cell.innerHTML = `<b>${LBL[k][0]}</b>`;
  for (const day of [true, false]) {
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H; cell.appendChild(cv);
    const s = scene(day);
    const sh = shelter(day ? 0x6f8fc9 : 0x7ad6c0, day ? 0xb98a5e : 0xc8c0e0, k); sh.rotation.y = Math.PI; s.add(sh);
    const pl = new THREE.Group(); put(pl, new THREE.SphereGeometry(0.42, 12, 10), 0xc8682c, 0, 0.55, 0); put(pl, new THREE.SphereGeometry(0.32, 12, 10), 0xc8682c, 0, 1.15, 0); pl.position.set(-0.9, 0, -1.3); s.add(pl);
    const cam = new THREE.PerspectiveCamera(42, W / H, 0.1, 200); cam.position.set(-0.6, 6.2, 6.4); cam.lookAt(-0.6, 0.6, -0.8);
    R.render(s, cam); cv.getContext('2d').drawImage(R.domElement, 0, 0);
  }
  cell.insertAdjacentHTML('beforeend', `<small>${LBL[k][1]}</small>`);
  document.getElementById('g').appendChild(cell);
}
document.title += ' ✓';
</script></body></html>
