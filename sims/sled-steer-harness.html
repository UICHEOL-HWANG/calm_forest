<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>썰매 조작 검수</title>
<style>
  :root{--top-inset:env(safe-area-inset-top)}
  html,body{margin:0;height:100%;overflow:hidden;background:#cfe6f3;touch-action:none;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
  canvas{display:block}
  #info{position:fixed;left:8px;bottom:8px;z-index:50;font-size:12px;background:rgba(255,255,255,.85);padding:6px 8px;border-radius:8px;color:#2c3e4a;pointer-events:none;white-space:pre}
</style>
<div id="info"></div>
<script type="module">
import * as THREE from '../vendor/three/three.module.js';
import { COURSE, centerX, obstacleRadius } from '../js/mountain/course.js';
import { createSled, stepSled, tryBoost } from '../js/mountain/sled.js';
import { physOf } from '../js/mountain/sled-lineup.js';
import { bindSledInput, initialInput, worldSteer } from '../js/mountain/sled-input.js';
import { showRunHud, showStick, boostButton, showBoostFx } from '../js/mountain/sled-hud.js';
import { Sound } from '../js/sound.js';
import { slopePoint } from '../js/mountain/terrain.js';
import { sledCamTargets, sledPose, sledYaw } from '../js/mountain/sled-view.js';
import { buildSledMesh } from '../js/mountain/sled-art.js';

const id = new URLSearchParams(location.search).get('sled') || 'basic';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfe6f3);
scene.add(new THREE.HemisphereLight(0xffffff, 0x9ab4c8, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(10, 40, -20);
scene.add(sun);
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 400);

const rows = 220, cols = 8;
const pos = [];
for (let r = 0; r <= rows; r++) {
  const z = (r / rows) * COURSE.length;
  for (let c = 0; c <= cols; c++) {
    const x = centerX(z) - COURSE.width / 2 + (c / cols) * COURSE.width;
    const p = slopePoint(z, x);
    pos.push(p.x, p.y, p.z);
  }
}
const idx = [];
for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
  const a = r * (cols + 1) + c, b = a + cols + 1;
  idx.push(a, b, a + 1, a + 1, b, b + 1);
}
const g = new THREE.BufferGeometry();
g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
g.setIndex(idx);
g.computeVertexNormals();
scene.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color: 0xffffff, side: THREE.DoubleSide })));

COURSE.obstacles.forEach(o => {
  const p = slopePoint(o.z, o.x);
  const m = new THREE.Mesh(new THREE.SphereGeometry(obstacleRadius(o), 16, 12), new THREE.MeshLambertMaterial({ color: o.kind === 'rock' ? 0x7d8790 : 0xf4f8fb }));
  m.position.set(p.x, p.y + obstacleRadius(o) * 0.6, p.z);
  scene.add(m);
});
COURSE.flags.forEach(f => [[-1, 0xe5484d], [1, 0x3a7aa8]].forEach(([sd, col]) => {
  const p = slopePoint(f.z, f.x + sd * f.half);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 1.6), new THREE.MeshLambertMaterial({ color: col }));
  pole.position.set(p.x, p.y + 0.8, p.z);
  scene.add(pole);
}));

const sledMesh = buildSledMesh(THREE, id);
scene.add(sledMesh);
const rider = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 12), new THREE.MeshLambertMaterial({ color: 0xf0c48a }));
scene.add(rider);

let sled = createSled(3, physOf(id));
const boost = () => { const a = sled.acorns; sled = tryBoost(sled); if (sled.acorns < a) Sound.sledBoost(); };
const input = bindSledInput(document.body, boost, { initial: initialInput(matchMedia('(pointer: coarse)').matches) });
boostButton().onclick = boost;
let yaw = sledYaw(0);

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

function update(dt) {
  if (!sled.finished) {
    const steer = worldSteer(input.read());
    sled = stepSled(sled, dt * 1000, steer);
    yaw += (sledYaw(sled.vx / sled.phys.steerRate) - yaw) * Math.min(1, dt * 8);
    showStick(input.stick());
    showBoostFx(sled, dt);
    showRunHud({ timeMs: sled.t, acorns: sled.acorns });
    document.getElementById('info').textContent = `${id}  steer ${steer.toFixed(2)}  vx ${sled.vx.toFixed(2)}\n🚩 ${sled.flagsPassed}/${sled.flagIdx}  💥 ${sled.hits.length}`;
  } else if (!window.__done) {
    window.__done = true;
    setTimeout(() => { sled = createSled(3, physOf(id)); window.__done = false; }, 1500);
  }
  const pose = sledPose(sled, yaw);
  sledMesh.position.set(pose.x, pose.y, pose.z);
  sledMesh.rotation.set(pose.pitch, pose.yaw, 0, "YXZ");
  rider.position.set(pose.x, pose.y + 0.8, pose.z);
  const { pos: cp, look } = sledCamTargets(sled);
  camera.position.set(cp.x, cp.y, cp.z);
  camera.lookAt(look.x, look.y, look.z);
  renderer.render(scene, camera);
}

let last = performance.now();
function frame(now) {
  update(Math.max(0, Math.min(0.05, (now - last) / 1000)));
  last = now;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__harness = {
  get sled() { return sled; },
  input,
  boost,
  tick(ms) { for (let i = 0; i < ms / 16; i++) update(0.016); },
};
</script>
