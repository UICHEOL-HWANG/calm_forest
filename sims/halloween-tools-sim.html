<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { buildAnimalHead, plushMat } from '../js/animal-faces.js';
import { ARM_AIM_R, ARM_AIM_L, TOOL_QREST_HOLD, TOOL_GRIP } from '../js/data/character.js';
import { gripForwardZ, pawRadius, ARM_R_K } from '../js/data/grip.js';
import { backAnchor } from '../js/cosmetics/anchors.js';
import { clothShell } from '../js/cosmetics/art.js';

// =============================================================
//  🎃🦇 할로윈 프리미엄 시안 (2026-10-06) — 시안 전용, 게임 코드 미수정
//  ------------------------------------------------------------
//  · 도구 세트 3안 × 9종 + 우산. 4번째 테마(tools_shroom·moon·bloom 옆)로 들어갈 후보.
//      A 🎃 잭오랜턴  — 날·통 자체가 호박(결 홈·꼭지·밤에 켜지는 얼굴)
//      B 🦇 달밤 보라  — 박쥐 날개 날 · 가마솥 물조리개 · 끝마다 꼬마 호박 하나
//      C 🌽 수확제     — 짚·옥수수·허수아비 기움천 · 새끼줄 · 옥수수 방망이
//  · 도구는 모양만 바뀐다. 쥐는 자리·모션은 게임 원본 값을 import 해서 그대로 쓴다
//    (js/data/character.js TOOL_GRIP·TOOL_QREST_HOLD, js/data/grip.js gripForwardZ).
//  · 망토 3안: 클로스 껍질은 js/cosmetics/art.js clothShell 을 import (복제본 없음).
//      A 🦇 펼친 박쥐 날개 · B 가장자리 뾰족 짧은 망토 · C 일반 망토 + 꼬마 박쥐
//  · 블룸 임계 0.85 — 넓은 면 색은 그 아래, 발광은 작은 면(얼굴·별·물약)만.
// =============================================================

const glowMats = [];
const clay = (color, o = {}) => {
  const m = new THREE.MeshStandardMaterial({ color, roughness: 0.95, metalness: 0, flatShading: !o.smooth, side: o.side ?? THREE.FrontSide });
  if (o.glow) { m.emissive = new THREE.Color(o.glow); m.userData.glow = { hex: o.glow, k: o.k ?? 0.8 }; glowMats.push({ m, k: o.k ?? 0.8 }); }
  if (o.opacity != null) { m.transparent = true; m.opacity = o.opacity; }
  return m;
};
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const M = (geo, mat, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); return m; };
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t * t * (3 - 2 * t);
const smooth = (a, b, t) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));

// ── 2D 윤곽 ───────────────────────────────────────────────
function starShape(r, k = 0.46, n = 5) {
  const s = new THREE.Shape();
  for (let i = 0; i < n * 2; i++) { const a = Math.PI / 2 + i * Math.PI / n, rr = i % 2 ? r * k : r; i ? s.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : s.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  s.closePath(); return s;
}
function petalShape(w, h) {
  const s = new THREE.Shape();
  s.moveTo(0, 0); s.bezierCurveTo(w * 1.1, h * 0.22, w * 0.95, h * 0.8, 0, h); s.bezierCurveTo(-w * 0.95, h * 0.8, -w * 1.1, h * 0.22, 0, 0);
  return s;
}
function crescentShape(R = 0.13, cx = -0.08, deg = 84) {
  const s = new THREE.Shape(), a0 = deg * Math.PI / 180;
  const ex = R * Math.cos(a0), ey = R * Math.sin(a0), r2 = Math.hypot(ex - cx, ey), ti = Math.atan2(ey, ex - cx);
  for (let i = 0; i <= 16; i++) { const a = -a0 + 2 * a0 * i / 16; i ? s.lineTo(R * Math.cos(a), R * Math.sin(a)) : s.moveTo(R * Math.cos(a), R * Math.sin(a)); }
  for (let i = 0; i <= 16; i++) { const a = ti - 2 * ti * i / 16; s.lineTo(cx + r2 * Math.cos(a), r2 * Math.sin(a)); }
  s.closePath(); return s;
}
function roundBlade(bw, bh) {
  const sh = new THREE.Shape();
  sh.moveTo(-bw, 0); sh.lineTo(-bw, bh); sh.absarc(0, bh, bw, Math.PI, 0, true); sh.lineTo(bw, 0); sh.closePath();
  return sh;
}
const ext = (shape, depth, bev = 0.01, seg = 12) => {
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: bev > 0, bevelThickness: bev, bevelSize: bev, bevelSegments: 2, curveSegments: seg });
  g.translate(0, 0, -depth / 2); return g;
};
// 호박 조각 날 — 반원 가장자리에 결(홈) n 개
function sliceShape(R, ribs = 3) {
  const s = new THREE.Shape(), N = 30;
  for (let i = 0; i <= N; i++) {
    const a = -Math.PI / 2 + Math.PI * i / N, th = a + Math.PI / 2;
    const rr = R * (1 - 0.075 * (1 - Math.abs(Math.sin(ribs * th))));
    i ? s.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : s.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  s.closePath(); return s;
}
// 박쥐 날개(날 모양) — 어깨 (0,.05) → 바깥 +x, 끝이 뾰족한 손가락 셋
function batWingShape(sc = 1) {
  const P = (x, y) => [x * sc, y * sc], s = new THREE.Shape();
  s.moveTo(...P(0, 0.05));
  s.quadraticCurveTo(...P(0.10, 0.17), ...P(0.27, 0.11));
  [[0.21, 0.015], [0.245, -0.075], [0.15, -0.025], [0.165, -0.115], [0.09, -0.05], [0.075, -0.125], [0, -0.06]].forEach(p => s.lineTo(...P(...p)));
  s.closePath(); return s;
}
// 박쥐 실루엣(양각용) — 반쪽을 거울로
function batSilShape(sc = 1) {
  const half = [[0, 0.028], [0.011, 0.052], [0.021, 0.03], [0.05, 0.046], [0.092, 0.062], [0.083, 0.02], [0.064, 0.012], [0.068, -0.014], [0.046, -0.006], [0.04, -0.032], [0.02, -0.009], [0, -0.03]];
  const full = [...half, ...half.slice(1, -1).reverse().map(([x, y]) => [-x, y])];
  const s = new THREE.Shape(); full.forEach(([x, y], i) => i ? s.lineTo(x * sc, y * sc) : s.moveTo(x * sc, y * sc)); s.closePath(); return s;
}
// 잭오랜턴 얼굴(단위 좌표 ±0.7) — 눈 둘 + 이빨 있는 웃는 입
const FACE = (() => {
  const eye = (cx, cy, w) => { const s = new THREE.Shape(); s.moveTo(cx - w, cy - w * 0.7); s.lineTo(cx + w, cy - w * 0.7); s.lineTo(cx, cy + w * 0.9); s.closePath(); return s; };
  const mouth = new THREE.Shape();
  const top = [[-0.62, -0.10], [-0.44, -0.10], [-0.32, -0.30], [-0.17, -0.10], [0, -0.30], [0.17, -0.10], [0.32, -0.30], [0.44, -0.10], [0.62, -0.10]];
  mouth.moveTo(...top[0]); top.slice(1).forEach(p => mouth.lineTo(...p));
  for (let i = 1; i <= 8; i++) { const a = i / 8; mouth.lineTo(0.62 - 1.24 * a, -0.10 - 0.52 * Math.sin(Math.PI * a)); }
  mouth.closePath();
  return [eye(-0.38, 0.24, 0.2), eye(0.38, 0.24, 0.2), mouth];
})();

// ── 호박: 결 있는 납작 구 + 꼭지 ────────────────────────────
const pGeo = new Map();
function pumpkinGeo(r, ribs = 6, amp = 0.09, squash = 0.82) {
  const key = [r, ribs, amp, squash].join();
  if (pGeo.has(key)) return pGeo.get(key);
  const g = new THREE.SphereGeometry(r, ribs * 4, 9), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i), phi = Math.atan2(z, x);
    const f = 1 + amp * Math.cos(ribs * phi) * Math.sqrt(Math.max(0, 1 - (y / r) ** 2));
    p.setXYZ(i, x * f, y * squash, z * f);
  }
  g.computeVertexNormals(); pGeo.set(key, g); return g;
}
function pumpkin(parent, r, x, y, z, o = {}) {
  const col = o.color ?? 0xf0893a, sq = o.squash ?? 0.82;
  const gr = new THREE.Group(); gr.position.set(x, y, z); parent.add(gr);
  gr.add(M(pumpkinGeo(r, o.ribs ?? 6, o.amp ?? 0.09, sq), clay(col, { smooth: true })));
  const st = M(new THREE.CylinderGeometry(r * 0.13, r * 0.2, r * 0.42, 5), clay(o.stem ?? 0x6f8a3a), 0, r * sq * 0.98 + r * 0.08, 0);
  st.rotation.z = o.stemTilt ?? 0.28; gr.add(st);
  return gr;
}
// 곡면(구)에 새기는 얼굴 — normal 쪽을 보게 놓는다. 면 안쪽으로 반쯤 묻어 가장자리에서 뜨지 않게
function carved(parent, mat, pos, s, normal, depth = 0.16) {
  const gr = new THREE.Group(); gr.position.copy(pos); gr.quaternion.setFromUnitVectors(V3(0, 0, 1), normal.clone().normalize()); gr.scale.setScalar(s); parent.add(gr);
  FACE.forEach(sh => gr.add(M(ext(sh, depth, 0, 2), mat)));
  return gr;
}

// ── 자루 ─────────────────────────────────────────────────
//  P.knobFn(g, r) 이 있으면 끝 혹을 그걸로(호박·짚 다발). 반환: 꼭대기 y
function handle(g, P, l, r = 0.030) {
  g.add(M(new THREE.CylinderGeometry(r * 0.8, r, l, 7), clay(P.wood), 0, l / 2 - 0.08, 0));
  g.add(M(new THREE.CylinderGeometry(r * 1.18, r * 1.18, 0.07, 7), clay(P.grip), 0, -0.02, 0));
  if (P.knobFn) P.knobFn(g, r); else g.add(M(new THREE.SphereGeometry(r * 1.35, 7, 6), clay(P.knob ?? P.grip), 0, -0.08, 0));
  return l - 0.08;
}
function calyx(g, y, color, r0 = 0.032) {   // 목을 받친 잎 5장
  for (let i = 0; i < 5; i++) {
    const a = i * Math.PI * 2 / 5, s = M(new THREE.ConeGeometry(0.022, 0.075, 4), clay(color), Math.cos(a) * r0, y, Math.sin(a) * r0);
    s.rotation.set(Math.sin(a) * 0.55, 0, -Math.cos(a) * 0.55); g.add(s);
  }
}
function rodFrame(g, { knobFn, rear, pole, line = 0xe8e4d8 }, bob) {
  knobFn(g);
  g.add(M(new THREE.CylinderGeometry(0.026, 0.030, 0.20, 7), rear, 0, -0.01, 0));
  const poleG = new THREE.Group(); poleG.position.y = 0.08; poleG.rotation.z = -0.12; g.add(poleG);
  const RL = 0.92; pole(poleG, RL);
  const lineG = new THREE.Group(); lineG.position.y = RL; lineG.rotation.z = 0.12; poleG.add(lineG);
  lineG.add(M(new THREE.CylinderGeometry(0.006, 0.006, 0.34, 5), clay(line), 0, -0.17, 0));
  const b = new THREE.Group(); b.position.y = -0.38; lineG.add(b); bob(b);
  g.scale.setScalar(1.25);
}
function pickArms(hd, segMat, tipMat) {
  [-1, 1].forEach(sx => {
    const TH = [0.14, 0.32], LEN = [0.13, 0.12]; let px = sx * 0.042, py = 0.012;
    for (let i = 0; i < 2; i++) {
      const dx = Math.cos(TH[i]) * sx, dy = -Math.sin(TH[i]);
      const seg = M(new THREE.BoxGeometry(LEN[i], 0.048 - i * 0.012, 0.05 - i * 0.012), segMat, px + dx * LEN[i] / 2, py + dy * LEN[i] / 2, 0);
      seg.rotation.z = -sx * TH[i]; hd.add(seg); px += dx * LEN[i]; py += dy * LEN[i];
    }
    const t3 = 0.48, dx = Math.cos(t3) * sx, dy = -Math.sin(t3);
    const tip = M(new THREE.ConeGeometry(0.020, 0.085, 6), tipMat, px + dx * 0.042, py + dy * 0.042, 0);
    tip.rotation.z = -sx * (Math.PI / 2 + t3); hd.add(tip);
  });
}
function sickleBlade(g, top, segMat, edgeMat, wk = 1) {
  const bl = new THREE.Group(); bl.position.y = top + 0.01; bl.rotation.y = 0.10; g.add(bl);
  const TH = [0.06, 0.28, 0.60], LEN = [0.15, 0.12, 0.10], W = [0.055 * wk, 0.045 * wk, 0.030 * wk]; let px = 0, py = 0;
  for (let i = 0; i < 3; i++) {
    const dx = Math.sin(TH[i]), dy = Math.cos(TH[i]);
    const seg = M(new THREE.BoxGeometry(W[i], LEN[i], 0.016), segMat, px + dx * LEN[i] / 2, py + dy * LEN[i] / 2, 0); seg.rotation.z = -TH[i]; bl.add(seg);
    const edge = M(new THREE.BoxGeometry(0.013, LEN[i] * 0.94, 0.012), edgeMat, px + dx * LEN[i] / 2 + dy * (W[i] / 2), py + dy * LEN[i] / 2 - dx * (W[i] / 2), 0); edge.rotation.z = -TH[i]; bl.add(edge);
    px += dx * LEN[i]; py += dy * LEN[i];
  }
}
const netBagC = (color, opacity) => clay(color, { opacity, side: THREE.DoubleSide });

// ── 팔레트 ─────────────────────────────────────────────────
const BASE = { wood: 0x8a5a3a, grip: 0x5f3d26, metal: 0x6d757c, edge: 0xd9dfe4, can: 0x8fd0ea, pole: 0x7a4a2a };
const JA = { orange: 0xf0893a, orangeD: 0xd9691f, cream: 0xffdca0, stem: 0x7f8f3c, stemD: 0x5c6d2a, leaf: 0x8cc05a, olive: 0x7d6a3c, brownD: 0x4d3322, carve: 0x40261a, glow: 0xffb12e };
const BT = { vio: 0x7c66bd, plum: 0x4f3f88, night: 0x35295f, lilac: 0xbaa9ea, orange: 0xf59a3a, gold: 0xffd96a, pot: 0x2f2650, potion: 0x8fe06a };
const HV = { wood: 0x9a6b3a, woodD: 0x6e4a28, straw: 0xe9c75e, strawD: 0xc99a3c, rope: 0xd9c08a, burlap: 0xcdac72, burlapD: 0xa88650, red: 0xc9482f, blue: 0x6286c0, corn: 0xf4cf48, cornD: 0xdcae2c, husk: 0x90c04c, huskD: 0x628f38, pump: 0xf08a35, cream: 0xf6e7b8 };

// =============================================================
//  도구 조형: BUILD[theme][tool](g)  (원점 = 쥐는 곳, +y 가 위)
// =============================================================
const TOOLS = [
  { id: 'axe', name: '🪓 도끼' }, { id: 'shovel', name: '🪏 삽' }, { id: 'water', name: '💧 물조리개' }, { id: 'rod', name: '🎣 낚싯대' },
  { id: 'hoe', name: '⛏️ 괭이' }, { id: 'sickle', name: '🌾 낫' }, { id: 'hammer', name: '🔨 망치' }, { id: 'net', name: '🦋 포충망' }, { id: 'seed', name: '🌱 씨앗' },
];
const REP = ['axe', 'shovel', 'water', 'rod'];

const BUILD = { base: {}, jack: {}, bat: {}, harvest: {} };

// ── 기본(게임 0단계 그대로) — 관통·크기 비교 기준 ──
Object.assign(BUILD.base, {
  axe(g) { const top = handle(g, BASE, 0.52);
    g.add(M(new THREE.BoxGeometry(0.17, 0.13, 0.06), clay(BASE.metal), 0.075, top - 0.05, 0));
    const bl = M(new THREE.BoxGeometry(0.07, 0.155, 0.028), clay(BASE.edge), 0.175, top - 0.05, 0); bl.rotation.z = 0.06; g.add(bl);
    g.add(M(new THREE.BoxGeometry(0.05, 0.09, 0.07), clay(BASE.metal), -0.035, top - 0.05, 0)); g.scale.setScalar(1.18); },
  shovel(g) { const top = handle(g, BASE, 0.58);
    g.add(M(new THREE.CylinderGeometry(0.034, 0.042, 0.07, 7), clay(BASE.metal), 0, top + 0.01, 0));
    g.add(M(ext(roundBlade(0.105, 0.13), 0.03, 0.012, 14), clay(BASE.metal, { smooth: true }), 0, top + 0.03, 0)); g.scale.setScalar(1.18); },
  water(g) { g.add(M(new THREE.CylinderGeometry(0.11, 0.12, 0.2, 10), clay(BASE.can), 0, 0.18, 0));
