<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>마을 지도 스타일 시안</title>
<style>
:root { --ink:#2c3a30; --sub:#5d6b60; --bg:#e9efe2; --card:#ffffff; --line:#dfe6d6; --gold:#e0a63a; --green:#2f7a44; }
* { box-sizing:border-box; }
body { margin:0; background:radial-gradient(circle at 20% 0%, #f6f1e2, var(--bg) 60%); color:var(--ink); font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; min-height:100vh; }
main { max-width:1320px; margin:0 auto; padding:28px 20px 60px; }
h1 { font-size:24px; margin:0 0 6px; letter-spacing:-.01em; }
.lead { color:var(--sub); margin:0 0 22px; max-width:820px; }
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
.opt { display:flex; flex-direction:column; gap:12px; }
.head { display:flex; align-items:baseline; gap:8px; }
.tag { font-size:12px; font-weight:700; color:#fff; background:var(--ink); border-radius:999px; padding:2px 10px; }
.opt.rec .tag { background:var(--gold); }
.head h2 { font-size:17px; margin:0; }
.modal { background:var(--card); border-radius:22px; padding:16px 16px 14px; box-shadow:0 10px 30px rgba(40,60,45,.14); text-align:center; }
.modal .t { font-weight:800; font-size:17px; margin-bottom:2px; }
.modal .s { font-size:12px; color:var(--sub); margin-bottom:10px; }
.modal canvas { width:100%; aspect-ratio:1/1; display:block; border-radius:16px; }
.hud { position:relative; height:150px; border-radius:16px; overflow:hidden; background:url('north-expand/top.jpg') 46% 40%/340% no-repeat; }
.hud::after { content:""; position:absolute; inset:0; background:rgba(255,255,255,.18); backdrop-filter:blur(2px); }
.hud canvas { position:absolute; left:16px; top:16px; width:108px; height:108px; border-radius:14px; z-index:1; box-shadow:0 4px 14px rgba(0,0,0,.18); border:2px solid rgba(255,255,255,.5); }
.hud .note { position:absolute; left:140px; top:18px; right:12px; z-index:1; font-size:12.5px; color:#22332a; background:rgba(255,255,255,.82); border-radius:12px; padding:8px 10px; }
ul { margin:0; padding-left:18px; font-size:14px; }
.pro li::marker { content:"＋ "; color:#2f8a50; }
.con li::marker { content:"－ "; color:#c0563d; }
.foot { margin-top:22px; font-size:13px; color:var(--sub); background:rgba(255,255,255,.6); border-radius:14px; padding:12px 14px; }
@media (max-width:980px) { .grid { grid-template-columns:1fr; max-width:520px; margin:0 auto; } }
@media (max-width:480px) { main { padding:18px 16px 40px; } }
</style>
</head>
<body>
<main>
  <h1>🗺️ 마을 지도를 실제 마을 모습으로</h1>
  <p class="lead">지도를 열 때 게임 장면을 위에서 한 번 찍어서 지도로 쓰는 방식이에요. 내 집·장식·해금된 시설이 그대로 보이고, 계절이 바뀌면 지도도 따라 바뀌어요. 아래 그림은 지금 마을을 낮 시간에 찍은 렌더예요(바다터 이동 전 모습).</p>
  <div class="grid" id="grid"></div>
  <p class="foot">미니맵은 실제 크기(108px)로 넣었어요. 옆 배경은 게임 화면 느낌을 내려고 같은 렌더를 흐리게 깐 것이에요. 밤에 지도를 열어도 지도는 낮 조명으로 찍어서 읽기 쉽게 둘 계획이에요.</p>
</main>
<script>
const D = Math.PI / 180;
const V = { x0: -47, z0: -47, w: 94 };
const WATER = [[16, 9, 6], [0, -21.5, 7], [24, -21.5, 12]];
const MOAT = [-26.3, 4.8, 7];
const PLACES = [
  ['🌳', '세계수', 4, -35], ['🏔️', '설산', -15, -29.5], ['🌫️', '안개 숲', -21, -20], ['🛶', '나루터', 0, -15],
  ['🌊', '바다터', 14.5, -12.5], ['🏠', '나의 집', -8, -8], ['🎀', '꾸미기 가게', -17.5, -4], ['🔧', '작업대', 4, -5],
  ['🍳', '자유주방', 7.4, -6.4], ['🏪', '상점', 9, 0], ['🏆', '리더보드', 13.5, 1.5], ['🏞️', '호수', 16, 9],
  ['🍎', '과수원', 33, 7], ['🏛️', '박물관', -26, 5], ['🔭', '천문대', 25, 22], ['🍄', '채집 숲', -18, 23],
  ['🌟', '반딧불이 계곡', 7, 26], ['🏮', '빛 공방', 16.5, 33.5], ['⛏️', '채굴 동굴', -12, 0],
];
const OPTS = [
  { key: 'A', title: '렌더 그대로', mode: 'raw',
    pros: ['실제 게임 화면과 색이 똑같아요', '구현이 가장 단순해요'],
    cons: ['클레이 재질이라 위에서 보면 회녹색으로 칙칙해요', '미니맵 크기에선 물과 풀밭이 구분이 잘 안 돼요'] },
  { key: 'B', title: '밝은 그림책 톤', mode: 'book', rec: true,
    pros: ['같은 렌더를 채도·밝기만 올려 동화책 지도처럼 보여요', '물·숲·시설 색이 또렷해서 미니맵에서도 읽혀요', '해변 테두리로 섬 모양이 살아요'],
    cons: ['게임 화면보다 조금 더 화사해요'] },
  { key: 'C', title: '그림 지도 + 렌더 반투명', mode: 'mix',
    pros: ['지금 그림 지도의 또렷한 파랑·초록을 유지해요', '시설 모양은 렌더로 은은하게 보여요'],
    cons: ['두 겹이 겹쳐 흐릿하고 탁해 보일 수 있어요', '"실제 마을" 느낌은 B보다 약해요'] },
];
const img = new Image(); img.src = 'north-expand/top.jpg';
function landPath(c, px, off) {
  c.beginPath();
  for (let i = 0; i <= 360; i += 3) {
    const t = i * D, wob = Math.sin(t * 7) * .7 + Math.sin(t * 3 + 1) * .6;
    const dn = Math.abs(((i + 105 + 540) % 360) - 180), north = dn < 42 ? 8.5 * Math.cos(dn / 42 * Math.PI / 2) ** 2 : 0;
    const r = 42 + north + off + wob;
    const [a, b] = px(Math.cos(t) * r, Math.sin(t) * r);
    if (i) c.lineTo(a, b); else c.moveTo(a, b);
  }
  c.closePath();
}
function paint(c, S, mode, withLabels) {
  const K = S / V.w, px = (x, z) => [(x - V.x0) * K, (z - V.z0) * K];
  const imgDraw = () => { const [a, b] = px(-56, -56); c.drawImage(img, a, b, 112 * K, 112 * K); };
  c.fillStyle = '#8fc9e2'; c.fillRect(0, 0, S, S);
  c.save(); c.globalAlpha = .35; c.strokeStyle = '#fff'; c.lineWidth = 1;
  for (let y = 10; y < S; y += 14) { c.beginPath(); for (let x = 0; x <= S; x += 6) c.lineTo(x, y + Math.sin(x / 9 + y) * 1.2); c.stroke(); }
  c.restore();
  c.fillStyle = '#f0e0b8'; landPath(c, px, 2.4); c.fill();
  c.save(); landPath(c, px, 0); c.clip();
  if (mode === 'raw') imgDraw();
  if (mode === 'book') { c.filter = 'saturate(1.55) brightness(1.16) contrast(1.08)'; imgDraw(); c.filter = 'none'; }
  if (mode === 'mix') {
    c.fillStyle = '#a8d88a'; c.fillRect(0, 0, S, S);
    c.globalAlpha = .45; c.filter = 'saturate(1.3)'; imgDraw(); c.filter = 'none'; c.globalAlpha = 1;
    WATER.forEach(([x, z, r]) => { const [a, b] = px(x, z); c.beginPath(); c.arc(a, b, r * K, 0, 7); c.fillStyle = 'rgba(127,196,230,.85)'; c.fill(); });
    const [ma, mb] = px(MOAT[0], MOAT[1]); c.beginPath(); c.arc(ma, mb, MOAT[2] * K, 0, 7); c.lineWidth = 1.3 * K; c.strokeStyle = 'rgba(127,196,230,.9)'; c.stroke();
  }
  c.restore();
  c.lineWidth = Math.max(1, S / 260); c.strokeStyle = 'rgba(255,255,255,.75)'; landPath(c, px, 0); c.stroke();
  if (!withLabels) {
    const [a, b] = px(2, -6);
    c.beginPath(); c.arc(a, b, 4, 0, 7); c.fillStyle = '#fff'; c.fill(); c.lineWidth = 2; c.strokeStyle = '#2f7a44'; c.stroke();
    c.beginPath(); c.moveTo(a, b); c.lineTo(a, b - 9); c.stroke();
    c.beginPath(); c.arc(S - 11, S - 11, 8, 0, 7); c.fillStyle = 'rgba(255,255,255,.88)'; c.fill();
    c.fillStyle = '#3a5a44'; c.font = 'bold 11px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('⤢', S - 11, S - 10.5);
    return;
  }
  const placed = [];
  const hit = r => placed.some(q => Math.abs(q.x - r.x) * 2 < q.w + r.w && Math.abs(q.y - r.y) * 2 < q.h + r.h);
  const fs = Math.max(13, S / 26), lf = Math.max(10, S / 42);
  c.textAlign = 'center'; c.textBaseline = 'middle';
  PLACES.forEach(([ico, , x, z]) => { const [a, b] = px(x, z); placed.push({ x: a, y: b, w: fs + 4, h: fs + 4 }); });
  const OFFS = [[0, 1.15], [0, -1.15], [2.6, 0], [-2.6, 0], [2.2, 1], [-2.2, 1], [0, 1.9], [0, -1.9]];
  PLACES.forEach(([ico, name, x, z]) => {
    const [a, b] = px(x, z);
    c.font = fs + 'px sans-serif'; c.fillText(ico, a, b);
    c.font = `bold ${lf}px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif`;
    const w = c.measureText(name).width + 8, h = lf + 7;
    let box = null;
    for (const [ox, oy] of OFFS) { const r = { x: a + ox * w / 2.6, y: b + oy * fs, w, h }; if (!hit(r)) { box = r; break; } }
    if (!box) box = { x: a, y: b + fs * 1.15, w, h };
    box.x = Math.max(w / 2 + 2, Math.min(S - w / 2 - 2, box.x)); box.y = Math.max(h / 2 + 2, Math.min(S - h / 2 - 2, box.y));
    placed.push(box);
    c.lineWidth = 3; c.strokeStyle = 'rgba(255,255,255,.95)'; c.strokeText(name, box.x, box.y);
    c.fillStyle = '#33513c'; c.fillText(name, box.x, box.y);
  });
}
function render() {
  document.querySelectorAll('canvas[data-mode]').forEach(cv => {
    const S = cv.clientWidth, dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = Math.round(S * dpr); cv.height = Math.round(S * dpr);
    const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    paint(c, S, cv.dataset.mode, cv.dataset.big === '1');
  });
}
const grid = document.getElementById('grid');
OPTS.forEach(o => {
  const el = document.createElement('section'); el.className = 'opt' + (o.rec ? ' rec' : '');
  el.innerHTML = `<div class="head"><span class="tag">${o.rec ? '추천 · ' : ''}안 ${o.key}</span><h2>${o.title}</h2></div>
    <div class="modal"><div class="t">🗺️ 마을 지도</div><div class="s">가고 싶은 곳을 찾아보세요</div><canvas data-mode="${o.mode}" data-big="1"></canvas></div>
    <div class="hud"><canvas data-mode="${o.mode}"></canvas><div class="note">미니맵 실제 크기(108px). 누르면 위 지도가 열려요.</div></div>
    <ul class="pro">${o.pros.map(s => `<li>${s}</li>`).join('')}</ul>
    <ul class="con">${o.cons.map(s => `<li>${s}</li>`).join('')}</ul>`;
  grid.appendChild(el);
});
img.onload = render;
addEventListener('resize', () => img.complete && render());
</script>
</body>
</html>
