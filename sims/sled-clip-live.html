<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>썰매 모션 확인</title>
<style>
  html,body{margin:0;background:#1f2a33;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#eef3f6}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px}
  figure{margin:0;background:#111a21;border-radius:10px;overflow:hidden;position:relative}
  figcaption{font-size:13px;padding:6px 10px}
  canvas{display:block;width:100%;height:auto;aspect-ratio:16/10}
  .toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(28,44,35,.92);color:#fff;font-size:14px;padding:7px 14px;border-radius:18px;opacity:0;transition:opacity .25s}
  .toast.on{opacity:1}
  @media (max-width:700px){.grid{grid-template-columns:1fr}}
</style>
<div class="grid">
  <figure><canvas id="c0"></canvas><figcaption>① 점프대 옆에서 본 모습: 판자를 타고 올라가 뜬다</figcaption></figure>
  <figure><canvas id="c1"></canvas><figcaption>② 점프대 게임 시점(뒤에서 따라가는 카메라)</figcaption></figure>
  <figure><canvas id="c2"></canvas><figcaption>③ 깃발 기둥을 스치며 내려갈 때(게임 시점)</figcaption></figure>
  <figure><canvas id="c3"></canvas><div class="toast" id="toast">☕ 몸이 녹았어요~</div><figcaption>④ 카페: 주문 → 앉아서 두 모금 → 주문한 자리로 복귀</figcaption></figure>
</div>
<script type="module">
import * as THREE from '../vendor/three/three.module.js';
import { COURSE } from '../js/mountain/course.js';
import { slopePoint } from '../js/mountain/terrain.js';
import { buildMountainSpace } from '../js/mountain/interior-art.js';
import { buildSledProps } from '../js/mountain/sled-props.js';
import { sledPose, sledSeat, sledLift, sledCamTargets, sledYaw } from '../js/mountain/sled-view.js';
import { createSled, stepSled } from '../js/mountain/sled.js';
import { createGateBend } from '../js/mountain/gate-bend.js';
import { buildCafeRoom } from '../js/mountain/cafe-art.js';
import { TABLES, ORDER_SPOT, DRINK, drinkPose, nearestSeat } from '../js/mountain/cafe-layout.js';

const W = 800, H = 500;
const renderers = [0, 1, 2, 3].map(i => {
  const r = new THREE.WebGLRenderer({ canvas: document.getElementById(`c${i}`), antialias: true });
  r.setSize(W, H, false);
  r.outputColorSpace = THREE.SRGBColorSpace;
  return r;
});

function lights(scene) {
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8aa0b4, 1.5));
  const sun = new THREE.DirectionalLight(0xffffff, 1.3);
  sun.position.set(-8, 20, 6);
  scene.add(sun);
}

function rider() {
  const g = new THREE.Group();
  const fur = new THREE.MeshLambertMaterial({ color: 0xd9a066 });
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.5, 20, 14), fur);
  body.scale.set(1, 0.9, 0.9);
  body.position.y = 0.55;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 20, 14), fur);
  head.position.y = 1.25;
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 8), new THREE.MeshLambertMaterial({ color: 0x3a2a20 }));
  nose.position.set(0, 1.18, 0.38);
  [-1, 1].forEach(s => {
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.12, 10, 8), fur);
    ear.position.set(s * 0.26, 1.58, 0);
    g.add(ear);
  });
  g.add(body, head, nose);
  const holder = new THREE.Group();
  holder.add(g);
  holder.userData.anchor = g;
  return holder;
}

function sledWorld() {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xcfe6f3);
  scene.fog = new THREE.Fog(0xcfe6f3, 40, 160);
  lights(scene);
  const space = buildMountainSpace(THREE);
  const props = buildSledProps(THREE, COURSE);
  scene.add(space, props.group);
  const sled = space.userData.sled;
  sled.visible = true;
  const who = rider();
  scene.add(who);
  return { scene, space, props, sled, who, gates: createGateBend(space.userData.gates) };
}

const seat = sledSeat('basic');
function place(w, s, yaw) {
  const pose = sledPose(s, yaw);
  w.sled.position.set(pose.x, pose.y, pose.z);
  w.sled.rotation.set(pose.pitch + pose.flip, pose.yaw, 0);
  const p = slopePoint(s.z, s.x);
  w.who.position.set(p.x, p.y + seat + sledLift(s), p.z);
  w.who.rotation.set(pose.flip, yaw, 0);
}

function chase(cam, s, dt) {
  const t = sledCamTargets(s);
  cam.position.lerp(new THREE.Vector3(t.pos.x, t.pos.y, t.pos.z), Math.min(1, dt * 6));
  cam.lookAt(t.look.x, t.look.y, t.look.z);
}

const steerTo = (s, tx) => Math.max(-1, Math.min(1, (tx - s.x) * 1.4));

const rampW = sledWorld();
const rampCams = [new THREE.PerspectiveCamera(40, W / H, 0.1, 300), new THREE.PerspectiveCamera(50, W / H, 0.1, 300)];
const ramp = COURSE.ramps[0];
let rs;
const resetRamp = () => {
  rs = { ...createSled(0), z: ramp.z - 22, x: ramp.x + 0.3 };
  const t = sledCamTargets(rs);
  rampCams[1].position.set(t.pos.x, t.pos.y, t.pos.z);
};
resetRamp();

const gateW = sledWorld();
const gateCam = new THREE.PerspectiveCamera(50, W / H, 0.1, 300);
let gs;
const gateTarget = s => {
  const f = COURSE.flags.find(fl => fl.z > s.z - 1) || COURSE.flags.at(-1);
  const side = COURSE.flags.indexOf(f) % 2 ? -1 : 1;
  return f.x + side * (f.half + 0.45);
};
const resetGate = () => {
  gs = { ...createSled(0), z: COURSE.flags[3].z - 14, x: COURSE.flags[3].x };
  gateW.gates.reset();
  const t = sledCamTargets(gs);
  gateCam.position.set(t.pos.x, t.pos.y, t.pos.z);
};
resetGate();

const cafeScene = new THREE.Scene();
cafeScene.background = new THREE.Color(0x2a2320);
lights(cafeScene);
cafeScene.add(buildCafeRoom(THREE));
const guest = rider();
cafeScene.add(guest);
const mug = new THREE.Group();
mug.rotation.order = 'YXZ';
mug.add(new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.09, 0.2, 12), new THREE.MeshLambertMaterial({ color: 0xf3e6cf })));
const topc = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.085, 0.02, 12), new THREE.MeshLambertMaterial({ color: 0x6b3b24 }));
topc.position.y = 0.1;
mug.add(topc);
cafeScene.add(mug);
const cafeCam = new THREE.PerspectiveCamera(42, W / H, 0.1, 100);
const toast = document.getElementById('toast');
const stand = { x: ORDER_SPOT.x - 0.9, z: ORDER_SPOT.z + 0.6, ry: -Math.PI / 2 };
const st = nearestSeat(stand), tb = TABLES[st.table];
const table = { x: tb.x + (st.x - tb.x) * 0.35, y: 0.89, z: tb.z };
const mouth = { x: st.x + Math.sin(st.ry) * DRINK.mouth.fwd, y: DRINK.mouth.y, z: st.z + Math.cos(st.ry) * DRINK.mouth.fwd };
const WAIT = 1.4, END = 2.2;
cafeCam.position.set((st.x + stand.x) / 2 + 0.2, 4.4, Math.max(st.z, stand.z) + 3.8);
cafeCam.lookAt((st.x + stand.x) / 2, 0.8, (st.z + stand.z) / 2);
let cafeT = 0;

function cafeTick(dt) {
  cafeT = (cafeT + dt) % (WAIT + DRINK.s + END);
  const a = guest.userData.anchor;
  if (cafeT < WAIT) {
    guest.position.set(stand.x, 0, stand.z);
    guest.rotation.y = stand.ry;
    a.position.y = Math.sin(cafeT * 2) * 0.03;
    a.rotation.x = 0;
    mug.visible = false;
    toast.classList.remove('on');
  } else if (cafeT < WAIT + DRINK.s) {
    const pose = drinkPose((cafeT - WAIT) / DRINK.s, table, mouth);
    guest.position.set(st.x, 0, st.z);
    guest.rotation.y = st.ry;
    a.position.y = -0.3;
    a.rotation.x = -DRINK.lean * pose.sip;
    mug.visible = true;
    mug.rotation.y = st.ry;
    mug.position.set(pose.at.x, pose.at.y, pose.at.z);
    mug.rotation.x = -pose.tilt;
  } else {
    guest.position.set(stand.x, 0, stand.z);
    guest.rotation.y = stand.ry;
    a.position.y = Math.sin(cafeT * 2) * 0.03;
    a.rotation.x = 0;
    mug.visible = false;
    toast.classList.add('on');
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  rs = stepSled(rs, dt * 1000, steerTo(rs, ramp.x + 0.3), COURSE);
  if (rs.z > ramp.z + 28) resetRamp();
  place(rampW, rs, sledYaw(0));
  const sp = slopePoint(rs.z, rs.x);
  rampCams[0].position.set(sp.x - 6.5, sp.y + 1.6, sp.z - 0.4);
  rampCams[0].lookAt(sp.x, sp.y + 0.6, sp.z);
  chase(rampCams[1], rs, dt);
  renderers[0].render(rampW.scene, rampCams[0]);
  renderers[1].render(rampW.scene, rampCams[1]);

  const steer = steerTo(gs, gateTarget(gs));
  gs = stepSled(gs, dt * 1000, steer, COURSE);
  if (gs.z > COURSE.flags[7].z + 4) resetGate();
  place(gateW, gs, sledYaw(gs.vx / gs.phys.steerRate));
  gateW.gates.update(slopePoint(gs.z, gs.x), sledLift(gs), dt);
  chase(gateCam, gs, dt);
  renderers[2].render(gateW.scene, gateCam);

  cafeTick(dt);
  renderers[3].render(cafeScene, cafeCam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
