<!doctype html>
<meta charset="utf-8">
<title>stair concepts</title>
<style>html,body{margin:0;height:100%;background:#cfe6dc}canvas{display:block}#lbl{position:fixed;left:12px;top:10px;font:600 14px sans-serif;color:#3b4a40;background:rgba(255,255,255,.7);padding:6px 10px;border-radius:10px}</style>
<div id="lbl"></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
// 계단 컨셉 뷰어 — ?stair=3|4|5|6|rooftop  ·  ?all=1 나란히  ·  ?cam=game(게임 카메라 각도) | orbit | close(계단 크게)
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const q = new URLSearchParams(location.search);
const NAMES = ['3', '4', '5', '6', 'rooftop'];
const list = q.get('all') ? NAMES : [q.get('stair') || '4'];
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xcfe6dc); scene.fog = new THREE.Fog(0xcfe6dc, 30, 80);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
scene.add(new THREE.HemisphereLight(0xfff4e0, 0x88a878, 0.9));
const sun = new THREE.DirectionalLight(0xffe8c8, 1.6); sun.position.set(8, 14, 6); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20 }); scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(60, 48), new THREE.MeshStandardMaterial({ color: 0x9fd08a, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -3; scene.add(ground);   // 내려가는 계단 구멍(깊이 2)보다 낮게 — 안 그러면 구멍 안으로 바깥 잔디가 비쳐 보인다
// 게임과 같은 도우미 — house-concepts 와 같은 H 객체(js/game.js 의 clayMat/glass 와 같은 값)
const H = {
  clay: (hex, opts = {}) => new THREE.MeshStandardMaterial({ color: hex, roughness: 0.85, metalness: 0, flatShading: true, ...opts }),
  glass: (hex = 0x7fb3d5) => new THREE.MeshStandardMaterial({ color: hex, roughness: 0.15, metalness: 0.1, transparent: true, opacity: 0.55 }),
  box: (w, h, d, mat, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; return m; },
};
const label = [];
for (let i = 0; i < list.length; i++) {
  const name = list[i];
  try {
    const mod = await import(`./stairs.js?v=${Date.now()}`);
    const g = mod.build(THREE, H, name);
    g.position.x = (i - (list.length - 1) / 2) * 13;
    scene.add(g); label.push(name);
  } catch (e) { console.error(name, e); label.push(name + ' ✗'); }
}
document.getElementById('lbl').textContent = label.join('  ·  ');
window.__scene = scene;   // 디버그용(콘솔 조사)
const spread = list.length > 1 ? 2.2 : 1;
const camMode = q.get('cam') || 'game';
// ⚠️ OrbitControls.update() 는 camera.lookAt() 을 곧장 덮어써 target(기본 0,1.2,0)을 다시 본다 —
//    모드별 목표점을 tgt 에 넣고 ctl.target 도 같이 옮겨야 실제로 그쪽을 본다.
let tgt = [0, 1.2, 0];
if (camMode === 'line') { scene.fog = null; camera.position.set(0, 8, 30); tgt = [0, 1.4, 0]; }
else if (camMode === 'ascend') { camera.position.set(0.4, 2.6, -2.4); tgt = [3.7, 1.5, 2.0]; }     // 오르는 계단(오른쪽 벽) 크게 — 열린 정면 쪽에서, 디딤판·스트링어·난간이 보이는 각도
else if (camMode === 'descend') { camera.position.set(-1.0, 2.8, -3.4); tgt = [-1.8, -0.4, -0.3]; } // 내려가는 구멍 크게 — 역시 열린 정면 쪽에서
else if (camMode === 'roof') { camera.position.set(1.2, 2.4, 4.0); tgt = [-1.3, 1.0, -0.8]; }      // 루프탑 계단실 박스
else if (camMode === 'game') { camera.position.set(0, 14 * spread, 16 * spread); tgt = [0, 1.2, 0]; }
else { camera.position.set(6, 6, 9); tgt = [0, 1.5, 0]; }
const ctl = new OrbitControls(camera, renderer.domElement); ctl.target.set(...tgt); camera.lookAt(...tgt); ctl.update();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
window.__ready = true;
renderer.setAnimationLoop(() => renderer.render(scene, camera));
</script>
