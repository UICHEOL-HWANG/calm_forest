import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';

import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { buildPet, updatePetAnim } from '../js/pet/art.js';

const TAU = Math.PI * 2, glowMats = [], anims = [];
const clay = (color, o = {}) => {
  const m = new THREE.MeshStandardMaterial({ color, roughness: 0.9, metalness: 0, flatShading: !o.smooth, side: o.side ?? THREE.FrontSide });
  if (o.glow) { m.emissive = new THREE.Color(o.glow); glowMats.push({ m, k: o.k ?? 0.8 }); }
  if (o.opacity != null) { m.transparent = true; m.opacity = o.opacity; m.depthWrite = false; }
  return m;
};
const M = (geo, mat, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = !mat.transparent; return m; };
const S = (r, ws = 14, hs = 10) => new THREE.SphereGeometry(r, ws, hs);
const eyes = (g, r, x, y, z) => [-1, 1].forEach(s => { g.add(M(S(r, 8, 6), clay(0x2e241c, { smooth: true }), s * x, y, z)); g.add(M(S(r * 0.35, 6, 4), clay(0xffffff, { smooth: true }), s * x + r * 0.3, y + r * 0.35, z + r * 0.7)); });
const cheeks = (g, r, x, y, z, c = 0xf4a3b4) => [-1, 1].forEach(s => { const m = M(S(r, 8, 6), clay(c, { smooth: true }), s * x, y, z); m.scale.z = 0.3; g.add(m); });
function petal(w, h) { const s = new THREE.Shape(); s.moveTo(0, 0); s.bezierCurveTo(w * 1.1, h * 0.22, w * 0.95, h * 0.8, 0, h); s.bezierCurveTo(-w * 0.95, h * 0.8, -w * 1.1, h * 0.22, 0, 0); return s; }
const petalGeo = (w, h, d = 0.012) => { const g = new THREE.ExtrudeGeometry(petal(w, h), { depth: d, bevelEnabled: true, bevelThickness: d * 0.4, bevelSize: d * 0.4, bevelSegments: 1, curveSegments: 8 }); g.translate(0, 0, -d / 2); return g; };
const star = (r, k = 0.5) => { const s = new THREE.Shape(); for (let i = 0; i < 10; i++) { const a = Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * k : r; i ? s.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : s.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); } s.closePath(); const g = new THREE.ExtrudeGeometry(s, { depth: r * 0.3, bevelEnabled: true, bevelThickness: r * 0.15, bevelSize: r * 0.08, bevelSegments: 2 }); g.translate(0, 0, -r * 0.15); return g; };

function cloudDragon(stage) {
  const g = new THREE.Group(), body = new THREE.Group(); g.add(body); body.position.y = 0.32;
  const C = { body: 0xb9c4f2, belly: 0xf3f2fb, horn: 0xf6dfa4, wing: 0xd7c6f4, cloud: 0xf4f6fb, tip: 0xfff1b0 };
  const b = M(S(0.16), clay(C.body, { smooth: true })); b.scale.set(1, 0.95, 1.05); body.add(b);
  const head = new THREE.Group(); head.position.set(0, 0.16, 0.06); body.add(head);
  head.add(M(S(0.13), clay(C.body, { smooth: true })));
  const sn = M(S(0.075), clay(C.belly, { smooth: true }), 0, -0.03, 0.1); sn.scale.set(1.2, 0.8, 0.7); head.add(sn);
  eyes(head, 0.02, 0.055, 0.02, 0.115); cheeks(head, 0.022, 0.09, -0.02, 0.1);
  [-1, 1].forEach(s => { const h = M(new THREE.ConeGeometry(0.025, 0.08, 6), clay(C.horn, { smooth: true }), s * 0.06, 0.12, -0.01); h.rotation.z = -s * 0.3; head.add(h); });
  [[0, -0.12, 0, 0.1], [0.09, -0.11, 0.04, 0.07], [-0.09, -0.11, 0.04, 0.07], [0, -0.1, 0.1, 0.07], [0.05, -0.1, -0.08, 0.06], [-0.05, -0.1, -0.08, 0.06]].forEach(([x, y, z, r]) => body.add(M(new THREE.IcosahedronGeometry(r, 1), clay(C.cloud, { smooth: true }), x, y, z)));
  [-1, 1].forEach(s => { const w = M(petalGeo(0.05, 0.14), clay(C.wing, { smooth: true }), s * 0.12, 0.06, -0.06); w.rotation.set(0.3, s * 0.6, -s * 1.1); body.add(w); anims.push({ obj: w, kind: 'flap', base: -s * 1.1, s }); });
  const tail = new THREE.CatmullRomCurve3([new THREE.Vector3(0, -0.02, -0.14), new THREE.Vector3(0, 0.02, -0.26), new THREE.Vector3(0.06, 0.1, -0.3), new THREE.Vector3(0.02, 0.14, -0.24)]);
  body.add(new THREE.Mesh(new THREE.TubeGeometry(tail, 20, 0.025, 6), clay(C.body, { smooth: true })));
  body.add(M(star(0.03), clay(C.tip, { glow: 0xfff1b0, k: 0.8 }), 0.02, 0.15, -0.24));
  if (stage >= 1) { const cl = new THREE.Group(); cl.position.set(0, 0.42, 0); body.add(cl); [[0, 0, 0, 0.05], [0.05, -0.01, 0, 0.04], [-0.05, -0.01, 0, 0.04]].forEach(([x, y, z, r]) => cl.add(M(new THREE.IcosahedronGeometry(r, 1), clay(0xe4e8f6, { smooth: true }), x, y, z))); anims.push({ obj: cl, kind: 'bob', base: 0.42, amp: 0.02 }); g.userData.rain = cl; }
  if (stage >= 2) [0, 1, 2, 3, 4].forEach(i => { const c = [0xf6a6c6, 0xffe48a, 0xa4e3c4, 0x9ecbf3, 0xc4acf0][i]; const a = M(new THREE.TorusGeometry(0.2 - i * 0.012, 0.007, 4, 24, Math.PI), clay(c, { smooth: true }), 0, 0.3, -0.2); body.add(a); });
  anims.push({ obj: body, kind: 'bob', base: 0.32, amp: 0.03 });
  return g;
}
function hedgehog(stage) {
  const g = new THREE.Group(), C = { body: 0xf3cfa6, face: 0xfbeedd, nose: 0x3a2a24, p1: 0xf5a3bf, p2: 0xffd27a, p3: 0xc8b6f2, leaf: 0x86c06a };
  const b = M(S(0.16), clay(C.body, { smooth: true }), 0, 0.15, 0); b.scale.set(1, 0.85, 1.1); g.add(b);
  const f = M(S(0.1), clay(C.face, { smooth: true }), 0, 0.14, 0.12); f.scale.set(1, 0.9, 0.9); g.add(f);
  g.add(M(S(0.018, 8, 6), clay(C.nose, { smooth: true }), 0, 0.13, 0.215));
  eyes(g, 0.017, 0.045, 0.17, 0.19); cheeks(g, 0.02, 0.07, 0.13, 0.17);
  [-1, 1].forEach(s => g.add(M(S(0.035, 8, 6), clay(C.body, { smooth: true }), s * 0.08, 0.03, 0.06)));
  const cols = [C.p1, C.p2, C.p3];
  for (let row = 0; row < 3; row++) for (let i = 0; i < 6; i++) {
    const a = -Math.PI * 0.85 + i / 5 * Math.PI * 0.7 + row * 0.12, el = 0.35 + row * 0.35, n = new THREE.Vector3(Math.cos(a) * Math.cos(el), Math.sin(el), Math.sin(a) * Math.cos(el) - 0.2).normalize();
    const p = M(petalGeo(0.035, 0.1 - row * 0.012), clay(cols[(i + row) % 3], { smooth: true }), n.x * 0.14, 0.15 + n.y * 0.12, n.z * 0.15 - 0.02);
    p.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), n); g.add(p);
  }
  if (stage >= 1) { const lf = M(petalGeo(0.03, 0.08), clay(C.leaf, { smooth: true }), 0.03, 0.28, 0.05); lf.rotation.z = -0.5; g.add(lf); }
  if (stage >= 2) for (let i = 0; i < 5; i++) { const a = i / 5 * TAU; const fl = M(S(0.022, 8, 6), clay([C.p1, C.p2, C.p3][i % 3], { smooth: true }), Math.cos(a) * 0.07, 0.29, 0.03 + Math.sin(a) * 0.05); g.add(fl); }
  if (stage >= 2) g.add(M(S(0.014, 6, 4), clay(0xfff1b0, { glow: 0xfff1b0, k: 0.8, smooth: true }), 0, 0.31, 0.03));
  anims.push({ obj: g, kind: 'wiggle' });
  return g;
}
function axolotl(stage) {
  const g = new THREE.Group(), C = { body: 0xf6b3c8, belly: 0xfde3ea, gill: 0xee7fa6, tip: 0xffd6f0, fin: 0xf9cddc, smile: 0x7a3a4a };
  const body = new THREE.Group(); body.position.y = 0.1; g.add(body);
  const b = M(S(0.12), clay(C.body, { smooth: true }), 0, 0, -0.04); b.scale.set(0.9, 0.75, 1.35); body.add(b);
  const head = M(S(0.13), clay(C.body, { smooth: true }), 0, 0.07, 0.13); head.scale.set(1.15, 0.85, 0.95); body.add(head);
  eyes(body, 0.016, 0.07, 0.1, 0.235); cheeks(body, 0.02, 0.1, 0.05, 0.21, 0xf38aa8);
  const sm = M(new THREE.TorusGeometry(0.035, 0.005, 4, 12, Math.PI), clay(C.smile, { smooth: true }), 0, 0.055, 0.24); sm.rotation.z = Math.PI; body.add(sm);
  [-1, 1].forEach(s => [0.5, 0, -0.5].forEach((t, i) => {
    const gp = new THREE.Group(); gp.position.set(s * 0.13, 0.1 + t * 0.06, 0.1); gp.rotation.set(0, 0, -s * (0.5 - t * 0.8)); body.add(gp);
    gp.add(M(new THREE.CylinderGeometry(0.01, 0.014, 0.1, 6), clay(C.gill, { smooth: true }), s * 0.04, 0, 0).rotateZ(s * Math.PI / 2));
    gp.add(M(S(0.018, 8, 6), clay(C.tip, { glow: stage >= 1 ? 0xffb8e0 : null, k: 0.7, smooth: true }), s * 0.095, 0, 0));
    anims.push({ obj: gp, kind: 'sway', base: gp.rotation.z, ph: i + s });
  }));
  const fin = M(petalGeo(0.07, 0.2, 0.01), clay(C.fin, { smooth: true, opacity: 0.9 }), 0, 0.02, -0.12); fin.rotation.x = -Math.PI / 2; body.add(fin); anims.push({ obj: fin, kind: 'tail' });
  [-1, 1].forEach(s => [0.08, -0.12].forEach(z => body.add(M(S(0.03, 8, 6), clay(C.body, { smooth: true }), s * 0.1, -0.07, z))));
  if (stage >= 2) body.add(M(star(0.03), clay(0xffe48a, { glow: 0xffe48a, k: 0.8 }), 0, 0.2, 0.1));
  return g;
}
function unicorn(stage) {
  const g = new THREE.Group(), C = { body: 0xfaf3f6, hoof: 0xd7c6f4, horn: 0xf6dfa4, mane: [0xf6a6c6, 0xffe48a, 0xa4e3c4, 0x9ecbf3, 0xc4acf0] };
  const b = M(S(0.14), clay(C.body, { smooth: true }), 0, 0.2, -0.03); b.scale.set(0.9, 0.85, 1.2); g.add(b);
  [-1, 1].forEach(s => [0.08, -0.12].forEach(z => { g.add(M(new THREE.CylinderGeometry(0.03, 0.032, 0.1, 8), clay(C.body, { smooth: true }), s * 0.07, 0.08, z)); g.add(M(new THREE.CylinderGeometry(0.034, 0.034, 0.03, 8), clay(C.hoof, { smooth: true }), s * 0.07, 0.03, z)); }));
  const head = new THREE.Group(); head.position.set(0, 0.36, 0.1); g.add(head);
  head.add(M(S(0.13), clay(C.body, { smooth: true })));
  const sn = M(S(0.07), clay(0xfde6ee, { smooth: true }), 0, -0.04, 0.1); sn.scale.set(1.15, 0.8, 0.8); head.add(sn);
  eyes(head, 0.019, 0.055, 0.02, 0.112); cheeks(head, 0.02, 0.085, -0.02, 0.1);
  [-1, 1].forEach(s => { const e = M(new THREE.ConeGeometry(0.03, 0.07, 6), clay(C.body, { smooth: true }), s * 0.07, 0.11, -0.02); e.rotation.z = -s * 0.35; head.add(e); });
  const horn = M(new THREE.ConeGeometry(0.022, 0.1 + stage * 0.02, 8), clay(C.horn, { smooth: true }), 0, 0.15, 0.04); horn.rotation.x = 0.3; head.add(horn);
  head.add(M(star(0.018), clay(0xfff1b0, { glow: 0xfff1b0, k: 0.85 }), 0, 0.21 + stage * 0.01, 0.06));
  C.mane.forEach((c, i) => head.add(M(S(0.04 - i * 0.002, 10, 8), clay(c, { smooth: true }), 0, 0.09 - i * 0.045, -0.08 - i * 0.02)));
  C.mane.forEach((c, i) => { const t = M(S(0.035, 10, 8), clay(c, { smooth: true }), 0, 0.22 - i * 0.03, -0.2 - i * 0.025); g.add(t); });
  if (stage >= 1) for (let i = 0; i < 4; i++) { const a = -0.8 + i * 0.5; head.add(M(S(0.018, 8, 6), clay(C.mane[i], { smooth: true }), Math.sin(a) * 0.09, 0.1, Math.cos(a) * 0.05 - 0.02)); }
  if (stage >= 2) [-1, 1].forEach(s => { const w = M(petalGeo(0.05, 0.13), clay(0xe9ddfb, { smooth: true }), s * 0.11, 0.26, -0.05); w.rotation.set(0.3, s * 0.6, -s * 1.15); g.add(w); anims.push({ obj: w, kind: 'flap', base: -s * 1.15, s }); });
  anims.push({ obj: head, kind: 'nod' });

}

function fxFor(kind, g) {
  const grp = new THREE.Group(); g.add(grp);
  const n = kind === 'sparkle' ? 10 : 8;
  for (let i = 0; i < n; i++) {
    let m;
    if (kind === 'rain') m = M(new THREE.CapsuleGeometry(0.008, 0.03, 2, 4), clay(0x9fd4f0, { smooth: true, opacity: 0.9 }));
