<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>거울 마을 하늘·연못 + 양 시안</title>
<style>
  body { margin: 0; background: #15122a; color: #e8e4ff; font: 14px/1.5 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 16px 16px 4px; } h2 { font-size: 15px; margin: 18px 16px 6px; color: #c8bfff; }
  p.note { margin: 0 16px 8px; color: #a9a2d6; font-size: 12px; }
  .grid { display: grid; gap: 10px; padding: 0 16px; }
  .sky { grid-template-columns: repeat(3, 1fr); } .sheep { grid-template-columns: repeat(4, 1fr); }
  .cell { background: #211c40; border-radius: 10px; padding: 8px; }
  .cell b { display: block; margin-bottom: 4px; } .cell small { color: #a9a2d6; display: block; margin-top: 4px; }
  canvas { width: 100%; display: block; border-radius: 6px; margin-top: 4px; }
</style>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>
</head><body>
<h1>🪞 거울 마을 — C안(도착 때 하늘 + 마을 안 연못) · 🐑 마차 양</h1>
<p class="note">실제 buildMirrorWorld·makeMoonCarriage 로 렌더 · 조명은 게임 atMirror 값 · 블룸 없음(색은 임계 0.85 아래로 맞춤)</p>
<h2>하늘·연못 3안 — ① 평소 플레이 카메라(41°) ② 연못 앞(줌 인) ③ 도착 연출(카메라를 잠깐 올려다봄)</h2>
<div class="grid sky" id="sky"></div>
<h2>마차 양 — 현재 + 3안 (옆 · 앞 비스듬)</h2>
<div class="grid sheep" id="sheep"></div>
<script type="module">
import * as THREE from 'three';
import { buildMirrorWorld } from '../js/mirror/art.js';
import { makeMoonCarriage, bakeGroup, part } from '../js/dream/art.js';
import { MIRROR_PARK } from '../js/mirror/layout.js';

const W = 480, H = 360;
// 렌더러 하나를 같이 쓰고 칸마다 2D 로 옮긴다(WebGL 컨텍스트 16개 한도)
const R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
R.setPixelRatio(1); R.setSize(W, H, false); R.outputColorSpace = THREE.SRGBColorSpace; R.toneMapping = THREE.ACESFilmicToneMapping;
function stage(canvas) {
  const r = { render(sc, cam) { R.render(sc, cam); canvas.getContext('2d').drawImage(R.domElement, 0, 0); } };
  const s = new THREE.Scene(); s.fog = new THREE.Fog(0x2e2858, 26, 90); s.background = new THREE.Color(0x2e2858);
  s.add(new THREE.HemisphereLight(0xb8c4ff, 0x3a3270, 0.95));
  s.add(new THREE.AmbientLight(0x8a90d8, 0.6));
  const sun = new THREE.DirectionalLight(0xe8dcff, 1.0); sun.position.set(10, 22, 8); s.add(sun);
  return { r, s };
}
const basic = (c, o = {}) => new THREE.MeshBasicMaterial({ color: c, fog: false, ...o });
function mk(parent, geo, m, x, y, z) { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); parent.add(o); return o; }
// 낮 마을 색(블룸 임계 아래로 한 톤 눌렀다)
const DAY = { grass: 0x8fc79a, walls: [0xe6c9a8, 0xe8d8b8, 0xdcc0a0], roofs: [0xd47a74, 0x7aa0d8, 0xd89a5c], leaf: 0x6fae6a, trunk: 0x9a7350, dirt: 0xa88a6a };

function house(g, x, z, i, s = 1) {
  mk(g, new THREE.BoxGeometry(3 * s, 2.2 * s, 2.6 * s), basic(DAY.walls[i % 3]), x, 1.1 * s, z);
  const rf = mk(g, new THREE.ConeGeometry(2.4 * s, 1.5 * s, 4), basic(DAY.roofs[i % 3]), x, 2.95 * s, z); rf.rotation.y = Math.PI / 4;
}
function tree(g, x, z, s = 1) {
  mk(g, new THREE.CylinderGeometry(0.15 * s, 0.2 * s, 1.2 * s, 5), basic(DAY.trunk), x, 0.6 * s, z);
  mk(g, new THREE.ConeGeometry(0.9 * s, 2.0 * s, 6), basic(DAY.leaf), x, 2.0 * s, z);
}
// ── 하늘 3안 ─────────────────────────────────────────────
const SKY = {
  1(g) {   // 시안 B 그대로 — 초록 원판 + 집 3, 뒤집어 매단다
    mk(g, new THREE.CircleGeometry(13, 40), basic(DAY.grass, { side: THREE.DoubleSide }), 0, 0, 0).rotation.x = -Math.PI / 2;
    [[-6, -2], [5, -4], [0, 5]].forEach(([x, z], i) => house(g, x, z, i));
  },
  2(g) {   // 뒤집힌 떠 있는 섬 — 흙 원뿔이 하늘로, 잔디·집·나무가 아래로
    mk(g, new THREE.CylinderGeometry(11, 10.4, 0.8, 12), basic(DAY.grass), 0, -0.4, 0);
    mk(g, new THREE.ConeGeometry(10.4, 9, 12), basic(DAY.dirt), 0, -5.2, 0).rotation.x = Math.PI;
    [[-5, -2], [4, -3.5], [0.5, 4.5]].forEach(([x, z], i) => house(g, x, z, i, 0.9));
    [[-2, 0.5], [7, 2], [-7.5, 3], [3, -7]].forEach(([x, z]) => tree(g, x, z));
    mk(g, new THREE.CylinderGeometry(0.5, 0.6, 5, 8), basic(0xe6d8c8), -1, 2.5, -6.5);   // 등대
    mk(g, new THREE.ConeGeometry(0.75, 1.1, 8), basic(0xd47a74), -1, 5.5, -6.5);
  },
  3(g) {   // 거울 천장 — 하늘 전체를 덮는 낮 마을(원경), 가장자리는 안개처럼 사라진다
    const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
    const gr = x.createRadialGradient(128, 128, 20, 128, 128, 128); gr.addColorStop(0, '#8fc79a'); gr.addColorStop(0.75, '#7ab68a'); gr.addColorStop(1, 'rgba(46,40,88,0)');
    x.fillStyle = gr; x.fillRect(0, 0, 256, 256); x.strokeStyle = '#d8c49a'; x.lineWidth = 10; x.beginPath(); x.arc(128, 128, 60, 0, Math.PI * 1.6); x.stroke();
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
    mk(g, new THREE.CircleGeometry(34, 48), basic(0xffffff, { map: tex, transparent: true, side: THREE.DoubleSide, depthWrite: false }), 0, 0, 0).rotation.x = -Math.PI / 2;
    [[-12, -4], [10, -9], [2, 12], [-4, -15], [16, 6]].forEach(([px, pz], i) => house(g, px, pz, i, 1.1));
    for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2; tree(g, Math.cos(a) * 22, Math.sin(a) * 22, 1.3); }
    mk(g, new THREE.CylinderGeometry(0.7, 0.85, 7, 8), basic(0xe6d8c8), -18, 3.5, 10);
    mk(g, new THREE.ConeGeometry(1.0, 1.4, 8), basic(0xd47a74), -18, 7.7, 10);
  },
};
// 하늘 자리 — 도착 카메라(서쪽에서 동쪽을 봄)가 올려다볼 때 들어오는 곳, 위아래 뒤집기
const SKY_AT = { 1: [22, 17, 4], 2: [22, 17, 4], 3: [18, 19, 2] };
function addSky(s, c) { const g = new THREE.Group(); SKY[c](g); g.rotation.z = Math.PI; g.scale.setScalar(0.75); g.position.set(...SKY_AT[c]); s.add(g); }

// ── 연못 3안(캔버스 한 장 → 원판 하나, 드로우콜 1) ─────────
function pondTex(c) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 256; const x = cv.getContext('2d');
  x.save(); x.beginPath(); x.arc(128, 128, 126, 0, Math.PI * 2); x.clip();
  if (c === 2) {   // 연못 너머 낮 마을 들여다보기(위에서 본 마을)
    x.fillStyle = '#8fc79a'; x.fillRect(0, 0, 256, 256);
    x.strokeStyle = '#d8c49a'; x.lineWidth = 18; x.beginPath(); x.moveTo(0, 170); x.quadraticCurveTo(128, 110, 256, 150); x.stroke();
    x.fillStyle = '#9ccfe8'; x.beginPath(); x.ellipse(170, 70, 34, 24, 0.3, 0, Math.PI * 2); x.fill();
    [[60, 80, '#d47a74'], [120, 200, '#7aa0d8'], [200, 200, '#d89a5c']].forEach(([px, py, col]) => {
      x.fillStyle = col; x.beginPath(); x.moveTo(px, py - 24); x.lineTo(px + 24, py); x.lineTo(px, py + 24); x.lineTo(px - 24, py); x.fill();
      x.fillStyle = 'rgba(0,0,0,.12)'; x.beginPath(); x.moveTo(px, py - 24); x.lineTo(px + 24, py); x.lineTo(px, py); x.fill(); });
    for (const [tx, ty] of [[30, 140], [90, 30], [220, 110], [40, 220], [170, 140]]) { x.fillStyle = '#6fae6a'; x.beginPath(); x.arc(tx, ty, 14, 0, Math.PI * 2); x.fill(); }
  } else {         // 낮 하늘이 비친 수면 + 가장자리에서 안쪽으로 거꾸로 선 집·나무(물에 비친 모양)
    const gr = x.createRadialGradient(128, 128, 10, 128, 128, 128); gr.addColorStop(0, '#cfe6ee'); gr.addColorStop(1, '#8cc4e0');
    x.fillStyle = gr; x.fillRect(0, 0, 256, 256);
    x.fillStyle = 'rgba(255,255,255,.55)'; for (const [cx, cy, r] of [[95, 110, 16], [112, 104, 20], [130, 112, 14], [165, 150, 12], [178, 146, 15]]) { x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill(); }
    const items = [[0.3, 'h', '#e6c9a8', '#d47a74'], [1.5, 't'], [2.4, 'h', '#e8d8b8', '#7aa0d8'], [3.4, 't'], [4.3, 'h', '#dcc0a0', '#d89a5c'], [5.4, 't']];
    for (const [a, k, wall, roof] of items) {
      x.save(); x.translate(128 + Math.cos(a) * 126, 128 + Math.sin(a) * 126); x.rotate(a + Math.PI / 2);   // 바깥 → 안쪽으로 선다
      if (k === 'h') { x.fillStyle = wall; x.fillRect(-16, 0, 32, 24); x.fillStyle = roof; x.beginPath(); x.moveTo(-22, 24); x.lineTo(0, 44); x.lineTo(22, 24); x.fill(); }
      else { x.fillStyle = '#9a7350'; x.fillRect(-3, 0, 6, 12); x.fillStyle = '#6fae6a'; x.beginPath(); x.moveTo(-13, 12); x.lineTo(0, 40); x.lineTo(13, 12); x.fill(); }
      x.restore();
    }
    if (c === 3) { x.strokeStyle = 'rgba(255,255,255,.6)'; x.lineWidth = 3; for (const r of [40, 70, 100]) { x.beginPath(); x.arc(128, 128, r, 0, Math.PI * 2); x.stroke(); } }
  }
  x.restore();
  x.strokeStyle = '#c89eff'; x.lineWidth = 6; x.beginPath(); x.arc(128, 128, 124, 0, Math.PI * 2); x.stroke();   // 기존 연못 빛 테두리
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function addPond(s, c) { const m = mk(s, new THREE.CircleGeometry(3, 40), new THREE.MeshBasicMaterial({ map: pondTex(c) }), 0, 0.05, 0); m.rotation.x = -Math.PI / 2; }

function player(s, x, z) { const g = new THREE.Group(); const m = new THREE.MeshStandardMaterial({ color: 0x8a5a3a }); mk(g, new THREE.SphereGeometry(0.45, 12, 10), m, 0, 0.6, 0); mk(g, new THREE.SphereGeometry(0.33, 12, 10), m, 0, 1.25, 0); g.position.set(x, 0, z); s.add(g); return g; }

const LABEL = {
  1: ['C-1 · 시안 B 그대로', '하늘: 초록 원판+집 3 · 연못: 낮 하늘 + 가장자리에 거꾸로 비친 집·나무'],
  2: ['C-2 · 뒤집힌 섬 + 마을 들여다보기', '하늘: 흙 원뿔이 위로 솟은 섬, 집·나무·등대가 매달림 · 연못: 위에서 본 낮 마을'],
  3: ['C-3 · 거울 천장', '하늘: 하늘 전체를 덮는 낮 마을(가장자리 안개로 사라짐) · 연못: 낮 하늘 + 비친 집 + 물결 링'],
};
for (const c of [1, 2, 3]) {
  const cell = document.createElement('div'); cell.className = 'cell'; cell.innerHTML = `<b>${LABEL[c][0]}</b>`;
  for (const view of ['play', 'pond', 'ride']) {
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H; cell.appendChild(cv);
    const { r, s } = stage(cv); s.add(buildMirrorWorld().group); addSky(s, c); addPond(s, c);
    const cam = new THREE.PerspectiveCamera(42, W / H, 0.1, 200);
    if (view === 'play') { player(s, 2.5, 8); cam.position.set(2.5, 14, 24); cam.lookAt(2.5, 0, 8); }
    else if (view === 'pond') { player(s, 1.5, 4.5); cam.position.set(1.5, 7.5, 9.5); cam.lookAt(0.6, 0, 1.2); }   // 연못 앞에 섰을 때(줌 인)
    else {   // 도착 — 내려앉는 마차 왼쪽 옆(dist 10, 높이 +4.5), 시선을 위로 들어 하늘 마을을 잡는다
      const car = makeMoonCarriage(); car.position.set(0.8, 3.6, 4); car.rotation.y = 0.12; s.add(car);
      cam.position.set(0.8 - 14, 3.6 + 2.5, 4 + 1.7); cam.lookAt(0.8 + 2, 3.6 + 4.2, 4);
    }
    r.render(s, cam);
  }
  cell.insertAdjacentHTML('beforeend', `<small>${LABEL[c][1]}</small>`);
  document.getElementById('sky').appendChild(cell);
}

// ── 양 ──────────────────────────────────────────────────
const plum = 0x5a4a5a, wool = 0xf2eefa;
function rein(s, sx) { const m = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 2.0, 4), new THREE.MeshBasicMaterial({ color: 0xffd27a })); m.position.set(-sx * 0.45, 0.3, -1.0); m.rotation.x = Math.PI / 2 - 0.2; s.add(m); }
const wingMat = () => new THREE.MeshStandardMaterial({ color: 0xe8f4ff, transparent: true, opacity: 0.9, flatShading: true, side: THREE.DoubleSide });
function feather(len, w) { const sh = new THREE.Shape(); sh.moveTo(0, 0); sh.quadraticCurveTo(w, len * 0.45, 0, len); sh.quadraticCurveTo(-w * 0.35, len * 0.5, 0, 0); return new THREE.ShapeGeometry(sh, 6); }
function fanWing(side, n, len) {   // 깃털 n 장을 부채꼴로 — 몸 옆에서 위·뒤로
  const g = new THREE.Group();
  for (let i = 0; i < n; i++) { const f = new THREE.Mesh(feather(len * (1 - i * 0.18), 0.16), wingMat()); f.rotation.set(0, 0, -side * (1.05 + i * 0.28)); g.add(f); }
  g.rotation.set(-0.9, side * 0.2, 0); return g;   // 옆으로 펴고 뒤로 눕힌다(위로 솟은 가시처럼 안 보이게)
}
const SHEEP = {
  1(s) {   // 구름 양 — 한 덩어리 몸 + 몸에 반쯤 묻힌 털 혹 · 짙은 얼굴·옆 귀 · 접은 다리
    const b = new THREE.Group();
    part(b, new THREE.SphereGeometry(0.4, 12, 10), wool, 0, 0, 0).scale.set(1, 0.85, 1.2);
    [[0, 0.3, 0.1], [0.24, 0.2, -0.1], [-0.24, 0.2, -0.1], [0, 0.22, -0.32], [0.2, 0.22, 0.28], [-0.2, 0.22, 0.28]].forEach(([x, y, z]) => part(b, new THREE.IcosahedronGeometry(0.2, 1), wool, x, y, z));
    part(b, new THREE.SphereGeometry(0.2, 10, 8), plum, 0, 0.05, 0.5).scale.set(0.85, 1, 1.15);
    part(b, new THREE.IcosahedronGeometry(0.13, 1), wool, 0, 0.22, 0.48);   // 앞머리 털
    for (const e of [-1, 1]) { part(b, new THREE.SphereGeometry(0.1, 8, 6), plum, e * 0.2, 0.1, 0.42).scale.set(1.4, 0.5, 0.7); part(b, new THREE.SphereGeometry(0.035, 6, 4), 0xf4ecd8, e * 0.08, 0.1, 0.66); }
    for (const [x, z] of [[0.17, 0.25], [-0.17, 0.25], [0.17, -0.25], [-0.17, -0.25]]) part(b, new THREE.CylinderGeometry(0.05, 0.045, 0.22, 6), plum, x, -0.36, z).rotation.x = -0.5;
    s.add(new THREE.Mesh(bakeGroup(b), new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, flatShading: true })));
    for (const side of [-1, 1]) { const w = fanWing(side, 3, 0.6); w.position.set(side * 0.3, 0.2, -0.05); s.add(w); }
  },
  2(s) {   // 꿈 양 — 라벤더빛 털 · 크림 얼굴에 눈 · 금빛 말린 뿔 · 하늘색 깃 3장
    const b = new THREE.Group(), lav = 0xe6ddff;
    part(b, new THREE.CapsuleGeometry(0.3, 0.38, 4, 10), lav, 0, 0, 0).rotation.x = Math.PI / 2;
    for (let i = 0; i < 7; i++) part(b, new THREE.IcosahedronGeometry(0.17, 1), lav, Math.sin(i * 1.7) * 0.18, 0.26, -0.3 + i * 0.1);
    part(b, new THREE.SphereGeometry(0.22, 10, 8), 0xf0dccb, 0, 0.12, 0.48).scale.set(0.9, 1, 1.05);
    part(b, new THREE.IcosahedronGeometry(0.15, 1), lav, 0, 0.3, 0.44);
    for (const e of [-1, 1]) {
      part(b, new THREE.SphereGeometry(0.04, 6, 4), 0x3a2e48, e * 0.09, 0.15, 0.68);
      const h = part(b, new THREE.TorusGeometry(0.09, 0.035, 5, 10, Math.PI * 1.5), 0xe8c87a, e * 0.2, 0.24, 0.42); h.rotation.y = e * Math.PI / 2;
    }
    part(b, new THREE.SphereGeometry(0.05, 6, 4), 0xe8a0b0, 0, 0.06, 0.69);
    s.add(new THREE.Mesh(bakeGroup(b), new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, flatShading: true })));
    for (const side of [-1, 1]) { const w = fanWing(side, 3, 0.7); w.position.set(side * 0.28, 0.18, -0.1); s.add(w); }
  },
  3(s) {   // 토실 양 — 큰 원 몸 + 허리 둘레 털 주름 · 크림 주둥이 짙은 머리 · 처진 귀 · 금방울 · 작은 날개
    const b = new THREE.Group();
    part(b, new THREE.SphereGeometry(0.45, 12, 10), wool, 0, 0, -0.05);
    for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2; part(b, new THREE.SphereGeometry(0.17, 8, 6), wool, Math.cos(a) * 0.42, 0.05 + Math.sin(i * 2.1) * 0.04, -0.05 + Math.sin(a) * 0.42); }
    part(b, new THREE.SphereGeometry(0.25, 10, 8), plum, 0, 0.12, 0.45);
    part(b, new THREE.SphereGeometry(0.14, 8, 6), 0xf0dccb, 0, 0.05, 0.64).scale.set(1.1, 0.8, 0.7);
    part(b, new THREE.IcosahedronGeometry(0.15, 1), wool, 0, 0.36, 0.42);
    for (const e of [-1, 1]) { part(b, new THREE.SphereGeometry(0.11, 8, 6), plum, e * 0.25, 0.1, 0.42).scale.set(0.5, 1.3, 0.7); part(b, new THREE.SphereGeometry(0.035, 6, 4), 0xf4ecd8, e * 0.1, 0.18, 0.66); }
    part(b, new THREE.SphereGeometry(0.07, 8, 6), 0xe8c87a, 0, -0.12, 0.62);
    s.add(new THREE.Mesh(bakeGroup(b), new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, flatShading: true })));
    for (const side of [-1, 1]) { const w = fanWing(side, 2, 0.45); w.position.set(side * 0.38, 0.28, -0.1); s.add(w); }
  },
};
const SL = { 0: ['현재', '털 5덩이 + 공 머리 · 몸을 관통하는 납작 원판 날개'], 1: ['S-1 · 구름 양', '한 덩어리 몸+묻힌 털 혹 · 짙은 얼굴·옆 귀 · 접은 다리 · 깃털 3장 날개'], 2: ['S-2 · 꿈 양', '라벤더 털 · 크림 얼굴·눈·분홍 코 · 금빛 말린 뿔 · 하늘색 깃 3장'], 3: ['S-3 · 토실 양', '큰 원 몸 + 허리 털 주름 · 크림 주둥이 · 처진 귀 · 금방울 · 작은 날개'] };
for (const c of [0, 1, 2, 3]) {
  const cell = document.createElement('div'); cell.className = 'cell'; cell.innerHTML = `<b>${SL[c][0]}</b>`;
  for (const view of ['side', 'front']) {
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H; cell.appendChild(cv);
    const { r, s } = stage(cv); s.add(buildMirrorWorld().group);
    const car = makeMoonCarriage(); car.position.set(MIRROR_PARK.x, 0, MIRROR_PARK.z); car.rotation.y = MIRROR_PARK.heading; s.add(car);
    if (c) for (const sh of car.userData.sheep) { const sx = sh.position.x; sh.clear(); SHEEP[c](sh); rein(sh, sx); }
    car.updateMatrixWorld(true);
    const head = new THREE.Vector3(0, 1.0, 3.0).applyMatrix4(car.matrixWorld);
    const cam = new THREE.PerspectiveCamera(36, W / H, 0.1, 200);
    if (view === 'side') cam.position.set(head.x - 0.3, head.y + 0.8, head.z + 3.2);
    else cam.position.set(head.x + 2.3, head.y + 0.9, head.z + 1.9);
    cam.lookAt(head.x - 0.3, head.y + 0.1, head.z);
    r.render(s, cam);
  }
  cell.insertAdjacentHTML('beforeend', `<small>${SL[c][1]}</small>`);
  document.getElementById('sheep').appendChild(cell);
}
