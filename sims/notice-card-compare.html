<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>안내 카드 시안 · calm forest</title>
<style>
  :root{--bg:#f1ede3;--ink:#2c3e4a;--sub:#6b7b86;--card:#fffdf6;--line:#e2dccf;--accent:#3a7aa8;--cream:#f6f0e4;--forest:#24382d;--mint:#bfe3b4}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}
  header{padding:18px 22px 8px;display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center}
  h1{font-size:19px;margin:0}
  .ctl{display:flex;gap:6px;flex-wrap:wrap}
  .ctl button{font:inherit;font-size:13px;padding:5px 11px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer}
  .ctl button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .note{font-size:12.5px;color:var(--sub);padding:0 22px 14px;line-height:1.65;max-width:1180px}
  .row{display:grid;grid-template-columns:200px repeat(3,minmax(0,1fr));gap:12px;padding:0 22px 14px;align-items:start}
  .row .lab h2{font-size:16px;margin:4px 0 6px}
  .row .lab p{font-size:12px;line-height:1.55;color:#4b5a63;margin:0}
  .cell{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
  .stage{position:relative;overflow:hidden;border-radius:8px;margin:0 auto;background:#7fa36c url(notice-card/bg.jpg) center/cover}
  .screen{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden}
  .ti{width:1em;height:1em;vertical-align:-.14em;display:inline-block}
  .dim{position:absolute;inset:0;background:rgba(20,40,30,.55)}
  .center{position:absolute;inset:0;display:grid;place-items:center;padding:18px}

  .k-old .card{width:min(440px,92%);background:#fff;border-radius:24px;box-shadow:0 20px 60px rgba(30,50,40,.4);padding:28px 26px 22px;text-align:center}
  .k-old .ic{font-size:46px;line-height:1}
  .k-old h3{margin:4px 0 16px;font-size:20px;color:var(--ink)}
  .k-old p{font-size:14px;line-height:1.6;opacity:.85;margin:0 0 18px;white-space:pre-line}
  .k-old button{border:0;border-radius:999px;background:var(--mint);color:var(--forest);font:inherit;font-weight:800;font-size:15px;padding:12px 30px;box-shadow:0 6px 16px rgba(60,120,70,.18)}

  .k-a .card{position:relative;width:min(372px,94%);background:var(--cream);border-radius:28px;padding:56px 18px 16px;text-align:center;box-shadow:0 22px 60px rgba(12,30,20,.38),inset 0 0 0 1.5px rgba(255,255,255,.7);animation:popA .5s cubic-bezier(.2,1.35,.4,1) both}
  .k-a .card::before{content:"";position:absolute;inset:0 0 auto 0;height:74px;border-radius:28px 28px 0 0;background:radial-gradient(120% 140% at 50% -20%,color-mix(in oklab,var(--acc) 38%,#fff) 0 55%,transparent 56%)}
  .k-a .badge{position:absolute;left:50%;top:-38px;transform:translateX(-50%);width:84px;height:84px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:48px;box-shadow:0 0 0 6px var(--cream),0 0 0 9px color-mix(in oklab,var(--acc) 55%,#fff),0 10px 22px rgba(0,0,0,.18)}
  .k-a .kick{position:relative;font-size:11px;font-weight:800;letter-spacing:.16em;color:color-mix(in oklab,var(--acc) 70%,#2a3a30);margin-bottom:4px}
  .k-a h3{position:relative;margin:0 0 10px;font-size:21px;letter-spacing:-.015em;color:var(--forest)}
  .k-a p{margin:0 4px 16px;font-size:14.5px;line-height:1.62;color:#44524a;white-space:pre-line}
  .k-a button{width:100%;border:0;border-radius:16px;background:#8fd081;color:#163220;font:inherit;font-weight:800;font-size:15.5px;padding:13px;box-shadow:0 4px 0 #66ad59}

  .k-b .card{position:relative;width:min(380px,94%);padding:12px;border-radius:18px;background:repeating-linear-gradient(92deg,#a8774a 0 7px,#9c6c41 7px 9px,#b0804f 9px 17px,#a27146 17px 21px);box-shadow:0 22px 60px rgba(20,12,4,.45),inset 0 2px 0 rgba(255,255,255,.25),inset 0 -3px 0 rgba(0,0,0,.25);animation:dropB .55s cubic-bezier(.2,1.3,.4,1) both}
  .k-b .nail{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e9e2d0,#7b6a50);top:8px}
  .k-b .nail.l{left:9px}.k-b .nail.r{right:9px}
  .k-b .paper{position:relative;background:#fbf4e2;border-radius:10px;padding:46px 18px 16px;text-align:center;box-shadow:inset 0 0 0 1px #e6d7b5,inset 0 0 26px rgba(160,120,60,.15)}
  .k-b .ribbon{position:absolute;left:50%;top:-14px;transform:translateX(-50%);background:#5f8f4e;color:#fffbea;font-weight:800;font-size:15.5px;padding:7px 22px;border-radius:6px;white-space:nowrap;box-shadow:0 3px 0 #3f6a33}
  .k-b .ic{font-size:50px;line-height:1;margin:2px 0 8px}
  .k-b p{margin:0 4px 16px;font-size:14.5px;line-height:1.62;color:#5a4630;white-space:pre-line}
  .k-b button{width:100%;border:0;border-radius:8px;background:linear-gradient(#c08b55,#a87443);color:#fff8e8;font:inherit;font-weight:800;font-size:15.5px;padding:12px;box-shadow:0 4px 0 #7d5530,inset 0 1px 0 rgba(255,255,255,.3);text-shadow:0 1px 0 rgba(0,0,0,.25)}

  .k-c .dim{background:linear-gradient(rgba(20,40,30,.08),rgba(20,40,30,.5))}
  .k-c .wrap{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;gap:12px;padding:0 18px 22px;justify-content:center}
  .k-c .who{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;animation:slideC .45s ease both}
  .k-c .face{width:92px;height:92px;border-radius:26px;background:linear-gradient(160deg,color-mix(in oklab,var(--acc) 45%,#fff),color-mix(in oklab,var(--acc) 80%,#fff));display:grid;place-items:center;font-size:58px;box-shadow:0 10px 24px rgba(0,0,0,.25),inset 0 0 0 3px rgba(255,255,255,.6)}
  .k-c .tag{background:var(--forest);color:#f6f0e4;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .k-c .bubble{position:relative;flex:1;max-width:460px;background:#fffdf6;border-radius:22px;padding:16px 18px 14px;box-shadow:0 14px 40px rgba(0,0,0,.28);animation:bubC .45s .12s cubic-bezier(.2,1.3,.4,1) both;margin-bottom:26px}
  .k-c .bubble::before{content:"";position:absolute;left:-10px;bottom:22px;width:22px;height:22px;background:#fffdf6;transform:rotate(45deg);border-radius:4px}
  .k-c h3{margin:0 0 6px;font-size:18px;color:var(--forest)}
  .k-c p{margin:0 0 12px;font-size:14.5px;line-height:1.6;color:#44524a;white-space:pre-line}
  .k-c .act{display:flex;justify-content:flex-end}
  .k-c button{border:0;border-radius:14px;background:#8fd081;color:#163220;font:inherit;font-weight:800;font-size:14.5px;padding:10px 18px;box-shadow:0 3px 0 #66ad59}
  .portrait .k-c .wrap{flex-direction:column;align-items:flex-start;padding:0 14px 20px}
  .portrait .k-c .who{flex-direction:row}
  .portrait .k-c .face{width:66px;height:66px;font-size:42px;border-radius:20px}
  .portrait .k-c .bubble{max-width:none;width:100%;margin:0}
  .portrait .k-c .bubble::before{left:30px;top:-9px;bottom:auto}

  @keyframes popA{from{transform:scale(.86) translateY(10px);opacity:0}to{transform:none;opacity:1}}
  @keyframes dropB{from{transform:translateY(-40px) rotate(-3deg);opacity:0}60%{transform:translateY(4px) rotate(.6deg)}to{transform:none;opacity:1}}
  @keyframes slideC{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
  @keyframes bubC{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
  @media (max-width:1100px){.row{grid-template-columns:1fr 1fr}.row .lab{grid-column:1/-1}}
</style>
<header>
  <h1>🪧 안내 카드 시안</h1>
  <div class="ctl" id="devSel"></div>
  <div class="ctl"><button id="replay">↻ 등장 다시 보기</button></div>
</header>
<div class="note">게임 안 "OO이 돌아왔어요!", "무너진 다리", "도감 완성!" 같은 안내 카드는 전부 같은 틀을 씁니다. 그래서 <b>실제 카드 세 종류</b>를 같은 디자인으로 나란히 놓았습니다. 맨 윗줄이 <b>지금</b>, 아래 세 줄이 시안입니다. 문구와 아이콘은 게임에 있는 그대로입니다.</div>
<div id="rows"></div>
<script type="module">
import { ICON_ALL } from '../js/icons/toss-icons-all.js';
const keys = Object.keys(ICON_ALL).sort((a, b) => b.length - a.length);
const ico = (s) => { let out = s; for (const k of keys) if (out.includes(k)) out = out.split(k).join(ICON_ALL[k]); return out; };
const CARDS = [
  { ic: '🧑‍🌾', acc: '#5fbf62', kick: '이웃이 돌아왔어요', who: '농부 삼촌', title: '농부 삼촌이 돌아왔어요!', body: '세계수를 통해서 밭의 길을 보고 따라 돌아왔대요!' },
  { ic: '🌉', acc: '#c98a4b', kick: '안내', who: '무너진 다리', title: '무너진 다리', body: '개울 건너 박물관으로 가는 다리가 무너졌어요.\n먼저 내 집을 완성해요. 그다음에 고칠 수 있어요.' },
  { ic: '📖', acc: '#e3b23c', kick: '축하해요', who: '도감', title: '도감 완성!', body: '마을의 모든 것 120종을 발견했어요! 축하 보상 🪙150을 받았어요.' },
];
const STYLES = [
  { k: 'old', name: '지금', how: '흰 카드, 위에 아이콘, 가운데 정렬, 알약 버튼.' },
  { k: 'a', name: 'A · 크림 배지 카드', how: '출석 카드와 같은 <b>크림색</b>. 아이콘이 카드 위로 걸친 <b>둥근 배지</b>, 카드마다 색 테두리. 버튼은 꾹 눌리는 초록 바.' },
  { k: 'b', name: 'B · 나무 팻말', how: '마을 팻말처럼 <b>나무 테두리</b>와 못, 안쪽은 종이. 제목은 초록 <b>리본</b>, 버튼은 나무 판자.' },
  { k: 'c', name: 'C · 말풍선', how: '화면 아래에 <b>얼굴 칸</b>이 서고 옆에 <b>말풍선</b>이 뜸. 주민이 직접 말하는 느낌이고 마을이 덜 가려짐.' },
];
const OK = '알겠어요 🌱';
const R = {
  old: (c) => `<div class="dim"></div><div class="center"><div class="card"><div class="ic">${ico(c.ic)}</div><h3>${c.title}</h3><p>${ico(c.body)}</p><button>${ico(OK)}</button></div></div>`,
  a: (c) => `<div class="dim"></div><div class="center" style="padding-top:60px"><div class="card"><div class="badge">${ico(c.ic)}</div><div class="kick">${c.kick}</div><h3>${c.title}</h3><p>${ico(c.body)}</p><button>${ico(OK)}</button></div></div>`,
  b: (c) => `<div class="dim"></div><div class="center"><div class="card"><span class="nail l"></span><span class="nail r"></span><div class="paper"><div class="ribbon">${c.title}</div><div class="ic">${ico(c.ic)}</div><p>${ico(c.body)}</p><button>${ico(OK)}</button></div></div></div>`,
  c: (c) => `<div class="dim"></div><div class="wrap"><div class="who"><div class="face">${ico(c.ic)}</div><div class="tag">${c.who}</div></div><div class="bubble"><h3>${c.title}</h3><p>${ico(c.body)}</p><div class="act"><button>${ico(OK)}</button></div></div></div>`,
};
const DEVS = { zoom: { w: 520, h: 470, label: '🔍 카드 크게' }, pc: { w: 1280, h: 720, label: '🖥️ PC' }, mobile: { w: 390, h: 844, label: '📱 폰 세로' } };
let dev = 'zoom';
function draw() {
  const sel = document.getElementById('devSel'); sel.innerHTML = '';
  for (const [k, d] of Object.entries(DEVS)) { const b = document.createElement('button'); b.textContent = d.label; b.className = k === dev ? 'on' : ''; b.onclick = () => { dev = k; draw(); }; sel.appendChild(b); }
  const rows = document.getElementById('rows'); rows.innerHTML = '';
  for (const S of STYLES) {
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<div class="lab"><h2>${S.name}</h2><p>${S.how}</p></div>` + CARDS.map(c => `<div class="cell"><div class="stage ${dev === 'mobile' ? 'portrait' : ''}"><div class="screen k-${S.k}" style="--acc:${c.acc}">${R[S.k](c)}</div></div></div>`).join('');
    rows.appendChild(row);
  }
  fit();
}
function fit() {
  const d = DEVS[dev];
  for (const st of document.querySelectorAll('.stage')) {
    const avail = st.parentElement.clientWidth - 16, s = (dev === 'mobile' ? Math.min(avail, 230) : avail) / d.w;
    st.style.width = `${d.w * s}px`; st.style.height = `${d.h * s}px`;
    const sc = st.querySelector('.screen'); sc.style.width = `${d.w}px`; sc.style.height = `${d.h}px`; sc.style.transform = `scale(${s})`;
  }
}
addEventListener('resize', fit);
document.getElementById('replay').onclick = draw;
draw();
</script>
