<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ── 게임과 같은 문법(js/game.js:2981 clayMat / 3011 mergeGeos) ──
const clayMat = (color, flat = true) => new THREE.MeshStandardMaterial({ color, roughness: .95, metalness: 0, flatShading: flat });
const ni = g => (g.index ? g.toNonIndexed() : g);
const mergeGeos = geos => mergeGeometries(geos.map(ni));

// 🚜 빨간 헛간 팔레트(game.js BARN 그대로) + 시안에서 더한 색
const BARN = { wall:0xb5462f, roof:0x8a8f96, trim:0xf2ece0, dark:0x6f3a2a, base:0x9a9086, wood:0xa9773f, straw:0xe0c05a };
const EXTRA = { stone:0x8d8578, glass:0x9fc6d8, moss:0x7a9a5c, iron:0x5d5b57, lamp:0xffd98a, crate:0xb98a4e };

const lampMats = [];   // 밤에 켜지는 재질
const M = (g, geos, color, { shadow = true, flat = false } = {}) => {
  const m = new THREE.Mesh(geos.length > 1 ? mergeGeos(geos) : ni(geos[0]), clayMat(color, flat));
  m.castShadow = shadow; m.receiveShadow = true; g.add(m); return m;
};
const B  = (w,h,d,x,y,z,rz=0,ry=0) => { const q=new THREE.BoxGeometry(w,h,d); if(rz)q.rotateZ(rz); if(ry)q.rotateY(ry); return q.translate(x,y,z); };
const CY = (rt,rb,h,seg,x,y,z,rot=null) => { const q=new THREE.CylinderGeometry(rt,rb,h,seg); if(rot==='x')q.rotateX(Math.PI/2); if(rot==='z')q.rotateZ(Math.PI/2); return q.translate(x,y,z); };
const SP = (r,x,y,z,sy=1) => { const q=new THREE.SphereGeometry(r,8,7); if(sy!==1)q.scale(1,sy,1); return q.translate(x,y,z); };
const CO = (r,h,seg,x,y,z,ry=Math.PI/4) => new THREE.ConeGeometry(r,h,seg).rotateY(ry).translate(x,y,z);

// 갬브럴 단면 → 입체(게임과 동일)
function gambrelSolid(w,e,k,r,d){
  const hw=w/2, sh=new THREE.Shape();
  sh.moveTo(-hw,0); sh.lineTo(-hw,e); sh.lineTo(-hw*.62,k); sh.lineTo(0,r); sh.lineTo(hw*.62,k); sh.lineTo(hw,e); sh.lineTo(hw,0); sh.closePath();
  return new THREE.ExtrudeGeometry(sh,{depth:d,bevelEnabled:false}).translate(0,0,-d/2);
}
function gambrelRoofSlabs(w,e,k,r,d,t=.14){
  const hw=w/2,out=[];
  for(const sgn of [1,-1]){
    const x0=sgn*(hw+.15),y0=e-.07,x1=sgn*hw*.62,y1=k,x2=0,y2=r+.07;
    for(const [ax,ay,bx,by] of [[x0,y0,x1,y1],[x1,y1,x2,y2]]){
      const len=Math.hypot(bx-ax,by-ay),ang=Math.atan2(by-ay,bx-ax);
      out.push(new THREE.BoxGeometry(len,t,d).rotateZ(ang).translate((ax+bx)/2,(ay+by)/2,0));
    }
  }
  return out;
}
// 한쪽으로 기운 외쪽지붕 널 — 시안 공통 부품
// 갬브럴 박공판 — 보(capY) 위쪽 삼각만 메운다. 아래는 트여 있어야 쉼터가 쉼터로 읽힌다
function gambrelGable(w,capY,k,r,t=.1){
  const hw=w/2, sh=new THREE.Shape();
  sh.moveTo(-hw,capY); sh.lineTo(-hw*.62,k); sh.lineTo(0,r); sh.lineTo(hw*.62,k); sh.lineTo(hw,capY); sh.closePath();
  return new THREE.ExtrudeGeometry(sh,{depth:t,bevelEnabled:false}).translate(0,0,-t/2);
}
function shedSlab(w,d,x,y,z,ang,t=.13){ return new THREE.BoxGeometry(w,t,d).rotateZ(ang).translate(x,y,z); }
// 세로 판자 결 — 벽면에서 살짝 띄운다(면이 겹치면 줄무늬가 생긴다)
function planks(n, spanW, h, y, z, depth=.035, w=.07){
  const out=[]; for(let i=0;i<n;i++){ const x=-spanW/2+spanW*(i/(n-1)); out.push(B(w,h,depth,x,y,z)); } return out;
}

// ═══════════════ 🧺 작물 창고 ═══════════════
// V0 — 지금 게임에 있는 모습(game.js:3969 그대로)
function warehouseV0(g){
  const W=3.5,E=1.85,K=2.7,R=3.2,D=3.4;
  M(g,[gambrelSolid(W,E,K,R,D)],BARN.wall);
  M(g,[...gambrelRoofSlabs(W,E,K,R,D+.3), B(3.9,.28,3.9,0,.14,0)],BARN.roof);
  M(g,[B(1.44,1.62,.06,0,.81,D/2+.02)],BARN.dark,{shadow:false});
  M(g,[B(.12,1.7,.1,-.74,.85,D/2+.05),B(.12,1.7,.1,.74,.85,D/2+.05),B(1.6,.12,.1,0,1.66,D/2+.05),
       B(1.5,.1,.06,0,.81,D/2+.06,.83),B(1.5,.1,.06,0,.81,D/2+.06,-.83),
       B(.14,E,.14,-W/2+.07,E/2,D/2-.07),B(.14,E,.14,W/2-.07,E/2,D/2-.07),
       B(.14,E,.14,-W/2+.07,E/2,-D/2+.07),B(.14,E,.14,W/2-.07,E/2,-D/2+.07),
       B(.62,.62,.08,0,2.62,D/2-.05)],BARN.trim,{shadow:false});
  M(g,[SP(.36,-2.25,.34,1.0,.86),CY(.34,.34,.62,10,-2.25,.34,.1,'z'),CY(.32,.32,.58,10,-2.2,.98,.1,'z')],BARN.straw,{shadow:false});
}

// A안 — 같은 실루엣, 밀도를 올린다: 판자 결 · 다락문 + 도르래 · 환기 큐폴라 · 석축 기초 · 옆창
function warehouseA(g){
  const W=3.5,E=1.85,K=2.7,R=3.2,D=3.4, f=D/2+.02;
  M(g,[gambrelSolid(W,E,K,R,D)],BARN.wall);
  M(g,[...gambrelRoofSlabs(W,E,K,R,D+.3)],BARN.roof);
  M(g,[B(3.86,.34,3.76,0,.17,0)],EXTRA.stone);                                    // 돌 기초(콘크리트 판 → 석축)
  // 판자 결 — 정면·뒷면·양 옆
  const rib=[];
  rib.push(...planks(9,W-.3,E-.12,(E-.12)/2+.06,f));
  rib.push(...planks(9,W-.3,E-.12,(E-.12)/2+.06,-f));
  for(let i=0;i<8;i++){ const z=-D/2+.2+ (D-.4)*(i/7); rib.push(B(.035,E-.12,.07,-W/2-.02,(E-.12)/2+.06,z),B(.035,E-.12,.07,W/2+.02,(E-.12)/2+.06,z)); }
  M(g,rib,BARN.dark,{shadow:false});
  // 큰 문 + 흰 문틀 + ✕브레이스
  M(g,[B(1.5,1.66,.06,0,.83,f-.02)],BARN.dark,{shadow:false});
  M(g,[B(.13,1.74,.1,-.78,.87,f+.04),B(.13,1.74,.1,.78,.87,f+.04),B(1.7,.13,.1,0,1.72,f+.04),
       B(1.56,.1,.06,0,.83,f+.05,.82),B(1.56,.1,.06,0,.83,f+.05,-.82),
       B(.15,E,.15,-W/2+.07,E/2,D/2-.07),B(.15,E,.15,W/2-.07,E/2,D/2-.07),
       B(.15,E,.15,-W/2+.07,E/2,-D/2+.07),B(.15,E,.15,W/2-.07,E/2,-D/2+.07),
       B(.66,.72,.09,0,2.58,D/2-.04)],BARN.trim,{shadow:false});                   // 다락 창틀
  M(g,[B(.28,.62,.05,-.15,2.58,D/2+.02),B(.28,.62,.05,.15,2.58,D/2+.02)],BARN.dark,{shadow:false});  // 다락 양여닫이 문짝
  M(g,[B(.1,.1,.62,0,3.06,D/2+.12),CY(.09,.09,.1,8,0,3.02,D/2+.36,'z')],BARN.wood);                  // 도르래 팔
  M(g,[CY(.012,.012,.5,4,0,2.78,D/2+.36),B(.22,.18,.16,0,2.48,D/2+.36)],EXTRA.iron,{shadow:false});   // 줄 + 매단 상자
  // 옆 창문 2개(흰 틀 + 유리)
  for(const sgn of [1,-1]) for(const z of [-.85,.85]){
    M(g,[B(.05,.56,.52,sgn*(W/2+.01),1.12,z)],EXTRA.glass,{shadow:false});
    M(g,[B(.07,.66,.09,sgn*(W/2+.03),1.12,z-.28),B(.07,.66,.09,sgn*(W/2+.03),1.12,z+.28),
         B(.07,.09,.62,sgn*(W/2+.03),1.42,z),B(.07,.09,.62,sgn*(W/2+.03),.82,z)],BARN.trim,{shadow:false});
  }
  // 용마루 환기 큐폴라 + 풍향계
  M(g,[B(.6,.5,.6,0,3.45,0)],BARN.trim,{shadow:false});
  M(g,[B(.34,.24,.05,0,3.5,.3),B(.05,.24,.34,.3,3.5,0)],BARN.dark,{shadow:false});
  M(g,[CO(.52,.34,4,0,3.86,0)],BARN.roof);
  M(g,[CY(.025,.025,.42,5,0,4.22,0),B(.3,.12,.03,.13,4.36,0),CO(.09,.16,4,-.14,4.36,0,0)],EXTRA.iron,{shadow:false});
  // 문 옆 살림 — 궤짝·바구니·건초
  M(g,[B(.5,.42,.42,1.35,.54,f+.28),B(.44,.38,.38,1.38,.92,f+.3,0,.4)],EXTRA.crate);
  M(g,[SP(.34,-2.2,.36,1.0,.9),CY(.32,.32,.6,10,-2.2,.36,.1,'z')],BARN.straw,{shadow:false});
}

// B안 — 정면 인상을 바꾼다: 미닫이 대문(한 짝 열림) + 앞 차양 + 궤짝 하역장 + 측면 사다리
function warehouseB(g){
  const W=3.6,E=2.05,K=2.9,R=3.35,D=3.0, f=D/2, back=-.35;   // 앞 0.7 은 하역 데크 몫
  M(g,[gambrelSolid(W,E,K,R,D).translate(0,0,back)],BARN.wall);
  M(g,gambrelRoofSlabs(W,E,K,R,D+.3).map(q=>q.translate(0,0,back)),BARN.roof);
  M(g,[B(3.9,.3,3.4,0,.15,back)],EXTRA.stone);
  M(g,[B(1.5,1.9,.12,.72,.98,back+f-.07)],0x33241d,{shadow:false});                  // 열린 쪽 개구부(안쪽 어둠)
  M(g,[SP(.4,.72,.58,back+f-.62,.8),SP(.3,1.05,.46,back+f-.9,.8)],BARN.straw,{shadow:false});
  // 미닫이 문 두 짝 — 벽과 같은 빨강 + 흰 브레이스. 오른쪽 짝이 왼쪽으로 밀려 겹쳐 있다
  const door=x=>B(1.44,1.92,.1,x,.99,back+f+.14);
  const brace=x=>[B(1.34,.09,.05,x,.99,back+f+.21,.95),B(1.34,.09,.05,x,.99,back+f+.21,-.95),
                  B(.09,1.92,.05,x-.68,.99,back+f+.21),B(.09,1.92,.05,x+.68,.99,back+f+.21)];
  M(g,[door(-.76),door(-1.5)],BARN.wall,{shadow:false});
  M(g,[...brace(-.76),...brace(-1.5)],BARN.trim,{shadow:false});
  M(g,[B(4.1,.13,.16,-.1,2.06,back+f+.16),CY(.08,.08,.09,7,-.76,2.0,back+f+.25,'z'),CY(.08,.08,.09,7,-1.5,2.0,back+f+.25,'z'),
       B(3.4,.08,.07,-.3,.07,back+f+.14)],EXTRA.iron,{shadow:false});                 // 레일 + 롤러 + 바닥 가이드
  // 처마 흰 널(바지보드)로 갬브럴 라인을 또렷하게
  M(g,[B(.11,.15,3.3,-W/2-.08,E-.06,back),B(.11,.15,3.3,W/2+.08,E-.06,back)],BARN.trim,{shadow:false});
  // 앞 하역 데크 + 궤짝·자루
  M(g,[B(3.4,.18,1.0,0,.34,1.42)],BARN.wood);
  M(g,[B(.56,.44,.46,-1.15,.65,1.4),B(.56,.44,.46,-1.15,1.09,1.4),B(.52,.42,.42,-.42,.63,1.6,0,.5)],EXTRA.crate);
  M(g,[SP(.26,1.15,.53,1.5,1.15),SP(.24,1.5,.51,1.25,1.15)],BARN.straw,{shadow:false});
  // 측면 사다리 + 다락문
  M(g,[CY(.05,.05,2.2,5,-W/2-.12,1.2,back-.35),CY(.05,.05,2.2,5,-W/2-.12,1.2,back-.85)],BARN.wood,{shadow:false});
  for(let i=0;i<5;i++) M(g,[CY(.04,.04,.5,5,-W/2-.12,.45+i*.4,back-.6,'x')],BARN.wood,{shadow:false});
  M(g,[B(.05,.62,.66,-W/2-.01,2.62,back-.6)],BARN.dark,{shadow:false});
  M(g,[B(.08,.72,.1,-W/2-.03,2.62,back-.96),B(.08,.72,.1,-W/2-.03,2.62,back-.24),B(.08,.1,.76,-W/2-.03,2.96,back-.6)],BARN.trim,{shadow:false});
}

// C안 — 실루엣을 바꾼다: 본채 + 낮은 나무 부속채(ㄱ자) + 앞 데크
function warehouseC(g){
  const W=2.6,E=1.9,K=2.75,R=3.25,D=3.1, f=D/2, bx=-.65;   // 본채는 왼쪽으로, 오른쪽 1.3 은 부속채 몫
  M(g,[gambrelSolid(W,E,K,R,D).translate(bx,0,0)],BARN.wall);
  M(g,gambrelRoofSlabs(W,E,K,R,D+.3).map(q=>q.translate(bx,0,0)),BARN.roof);
  M(g,[B(3.0,.3,3.5,bx,.15,0)],EXTRA.stone);
  M(g,[...planks(7,W-.3,E-.14,(E-.14)/2+.07,f+.02).map(q=>q.translate(bx,0,0))],BARN.dark,{shadow:false});
  // 부속채 — 나무 벽 + 반대로 기운 외쪽지붕(재료도 지붕 방향도 달라 한 덩어리로 안 읽힌다)
  M(g,[B(1.4,1.3,2.5,1.25,.65,-.2)],BARN.wood);
  M(g,[shedSlab(1.66,2.75,1.3,1.62,-.2,-.3)],BARN.roof);   // 본채 쪽이 높아 물이 바깥으로 흐른다
  M(g,[B(.62,1.0,.06,1.25,.5,1.02)],BARN.dark,{shadow:false});
  M(g,[B(.09,1.1,.09,.9,.55,1.06),B(.09,1.1,.09,1.6,.55,1.06),B(.8,.09,.09,1.25,1.1,1.06)],BARN.trim,{shadow:false});
  M(g,[B(.05,.4,.44,1.96,1.0,-.5)],EXTRA.glass,{shadow:false});
  M(g,[B(.07,.5,.08,1.98,1.0,-.74),B(.07,.5,.08,1.98,1.0,-.26),B(.07,.08,.54,1.98,1.22,-.5)],BARN.trim,{shadow:false});
  // 본채 대문
  M(g,[B(1.3,1.62,.06,bx,.81,f-.02)],BARN.dark,{shadow:false});
  M(g,[B(.12,1.7,.1,bx-.69,.85,f+.04),B(.12,1.7,.1,bx+.69,.85,f+.04),B(1.5,.12,.1,bx,1.68,f+.04),
       B(1.36,.1,.06,bx,.81,f+.05,.85),B(1.36,.1,.06,bx,.81,f+.05,-.85),
       B(.14,E,.14,bx-W/2+.07,E/2,f-.07),B(.14,E,.14,bx+W/2-.07,E/2,f-.07),
       B(.14,E,.14,bx-W/2+.07,E/2,-f+.07),B(.14,E,.14,bx+W/2-.07,E/2,-f+.07),
       B(.58,.62,.08,bx,2.6,f-.04)],BARN.trim,{shadow:false});
  M(g,[B(.24,.54,.05,bx-.13,2.6,f+.02),B(.24,.54,.05,bx+.13,2.6,f+.02)],BARN.dark,{shadow:false});
  M(g,[B(.44,.28,.06,bx,3.0,f-.02)],EXTRA.iron,{shadow:false});                     // 지붕 환기창
  M(g,[B(.5,.42,.42,.4,.51,1.72),B(.48,.4,.4,.42,.92,1.74,0,.45)],EXTRA.crate);     // 앞 궤짝
  M(g,[SP(.32,-1.7,.34,1.5,.9),CY(.3,.3,.56,10,-1.7,.34,1.5,'z')],BARN.straw,{shadow:false});
}

// ═══════════════ 🏚️ 일꾼 쉼터 ═══════════════
// V0 — 지금 게임에 있는 모습(game.js:3998 그대로)
function shelterV0(g){
  const W=3.3,D=3.3;
  M(g,[B(3.4,.24,3.4,0,.12,0),B(1.7,.18,.75,0,.6,-.95),B(.14,.36,.14,-.66,.4,-.95),B(.14,.36,.14,.66,.4,-.95)],BARN.wood);
  M(g,[CY(.11,.12,1.95,6,-1.5,1.22,-1.5),CY(.11,.12,1.95,6,1.5,1.22,-1.5),CY(.11,.12,1.95,6,-1.5,1.22,1.5),CY(.11,.12,1.95,6,1.5,1.22,1.5),
       B(3.4,.12,.12,0,2.2,-1.5),B(3.4,.12,.12,0,2.2,1.5)],BARN.trim,{shadow:false});
  M(g,[...gambrelRoofSlabs(W,2.26,2.9,3.25,D+.3)],BARN.roof);
  M(g,[B(.8,.62,.1,0,2.62,-D/2+.06),B(.8,.62,.1,0,2.62,D/2-.06)],BARN.wall,{shadow:false});
  const lm=clayMat(EXTRA.lamp,false); lampMats.push(lm);
  const l=new THREE.Mesh(ni(SP(.15,1.24,1.9,1.24)),lm); g.add(l);
}

// A안 — 반벽 쉼터: 뒤·옆을 허리 높이 빨간 판자벽으로 막고 연장걸이·등불 2개·이끼 지붕
function shelterA(g){
  const W=3.3,D=3.3;
  M(g,[B(3.5,.26,3.5,0,.13,0)],EXTRA.stone);
  M(g,[B(3.3,.16,3.3,0,.3,0),B(1.9,.2,.8,0,.72,-.9),B(.16,.42,.16,-.8,.5,-.9),B(.16,.42,.16,.8,.5,-.9),
       B(1.9,.5,.14,0,1.05,-1.22)],BARN.wood);                                       // 마루 + 등받이 벤치
  // 반벽 — 뒤 전체 + 옆 절반

  g.add(new THREE.Mesh(mergeGeos([SP(.16,0,F+1.72,-.1,1.1)]),lm));
  M(g,[CY(.02,.02,.42,4,0,F+2.06,-.1),B(.26,.1,.26,0,F+1.84,-.1)],EXTRA.iron,{shadow:false});

  for(let i=0;i<6;i++) M(g,[B(.05,1.95,.07,1.63,1.35,-1.6+i*.44)],BARN.dark,{shadow:false});

  M(g,[B(.3,.26,.3,1.33,1.2,-1.2),B(.3,.26,.3,1.33,1.2,-.5),B(.26,.24,.26,1.33,1.8,-.9)],EXTRA.crate,{shadow:false});
  M(g,[SP(.13,1.31,1.78,-.05),SP(.12,1.31,1.78,-.35),SP(.12,1.31,1.16,.05)],0xd9553f,{shadow:false});

  M(g,[CY(.1,.11,1.5,6,-1.5,.75,1.62),CY(.1,.11,1.5,6,1.4,.75,1.62),B(3.1,.11,.11,0,1.52,1.62)],BARN.trim,{shadow:false});
  M(g,[gambrelGable(W-.08,2.4,3.01,3.36).translate(0,0,-D/2-.56),gambrelGable(W-.08,2.4,3.01,3.36).translate(0,0,D/2-.44)],BARN.wall,{shadow:false});
  // 차양 아래 물펌프 + 대야
  M(g,[CY(.11,.13,1.0,7,-.9,.5,1.0),B(.4,.1,.12,-.7,.94,1.0),CY(.07,.07,.3,6,-.64,.78,1.0,'x')],EXTRA.iron);
  M(g,[CY(.32,.28,.2,10,-.9,.1,1.42)],BARN.base,{shadow:false});
  M(g,[CY(.28,.28,.03,10,-.9,.18,1.42)],EXTRA.glass,{shadow:false});
  M(g,[CY(.012,.012,2.8,4,-.6,2.0,.6,'z')],EXTRA.iron,{shadow:false});
  M(g,[B(.3,.4,.03,-1.15,1.78,.6),B(.26,.34,.03,-.3,1.8,.6)],0xdfe9ef,{shadow:false});
  const lm=clayMat(EXTRA.lamp,false); lampMats.push(lm);
  g.add(new THREE.Mesh(mergeGeos([SP(.14,-1.5,2.2,.6),SP(.13,1.35,2.18,-1.5)]),lm));

// ── 씬 ──
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xcfe4ee); scene.fog=new THREE.Fog(0xdce9e2,48,110);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(0xdff0ff,0x9ab07f,.85); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff3d8,1.15); sun.position.set(9,16,8); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.left=-22; sun.shadow.camera.right=22; sun.shadow.camera.top=22; sun.shadow.camera.bottom=-22; sun.shadow.camera.far=60;
scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(120,120),new THREE.MeshStandardMaterial({color:0x89a86a,roughness:1}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
// 밭 느낌 — 고랑 몇 줄
for(let i=0;i<6;i++){ const s=new THREE.Mesh(new THREE.BoxGeometry(46,.06,1.1),new THREE.MeshStandardMaterial({color:0x6b4f36,roughness:1}));
  s.position.set(0,.03,-13+i*5.2); s.receiveShadow=true; scene.add(s); }

// 크기 비교용 캐릭터(게임 곰 대략 키)
function refChar(){
  const g=new THREE.Group();
  M(g,[SP(.5,0,.58,0,1.05)],0xc98f5a); M(g,[SP(.34,0,1.2,.08)],0xd9a066);
  M(g,[SP(.13,-.24,1.44,.02),SP(.13,.24,1.44,.02)],0xc98f5a,{shadow:false});
  M(g,[SP(.11,0,1.16,.34,.8)],0x8a5a3a,{shadow:false});
  return g;
}

const GAPX=8.4, rows={ware:[],shel:[]};
const SPECS=[
  ['ware','현재 (게임에 있는 모습)', warehouseV0],
  ['ware','A안 · 진짜 헛간', warehouseA],
  ['ware','B안 · 미닫이 대문+하역 데크', warehouseB],
  ['ware','C안 · 본채+부속채 ㄱ자', warehouseC],
  ['shel','현재 (게임에 있는 모습)', shelterV0],
  ['shel','A안 · 반벽+연장걸이', shelterA],
  ['shel','B안 · 원두막(마루 올림)', shelterB],
  ['shel','C안 · ㄱ자 수납벽+차양', shelterC],
];
const tags=[], refs=[];
SPECS.forEach(([row,name,fn],i)=>{
  const k=i%4, g=new THREE.Group();
  g.position.set((k-1.5)*GAPX, 0, row==='ware'? -6.2 : 5.2);
  fn(g); scene.add(g); rows[row].push(g);
  const fpMat=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.55});
  const pts=[[-2,0,-2],[2,0,-2],[2,0,2],[-2,0,2],[-2,0,-2]].map(p=>new THREE.Vector3(p[0],.07,p[2]));
  const fpLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),fpMat);
  fpLine.position.copy(g.position); scene.add(fpLine); rows[row].push(fpLine);
  const r=refChar(); r.position.set(g.position.x+2.9, 0, g.position.z+2.4); scene.add(r); refs.push(r); rows[row].push(r);
  const t=document.createElement('div'); t.className='tag';
  t.innerHTML=(row==='ware'?'🧺 ':'🏚️ ')+name+'<small>'+(row==='ware'?'작물 창고 2×2':'일꾼 쉼터 2×2')+'</small>';
  document.getElementById('labels').appendChild(t); tags.push({el:t,g});
});

const el=id=>document.getElementById(id);
const P={dist:24,ang:18,hgt:6,panx:0,panz:0};
for(const k of ['dist','ang','hgt','panx','panz']) el(k).oninput=e=>{P[k]=+e.target.value; el(k+'V').textContent=e.target.value;};
el('night').onchange=e=>{
  const n=e.target.checked;
  hemi.intensity=n?.3:.85; sun.intensity=n?.24:1.15; sun.color.set(n?0x9fb6e0:0xfff3d8);
  scene.background=new THREE.Color(n?0x25324a:0xcfe4ee); scene.fog.color.set(n?0x25324a:0xdce9e2);
  for(const m of lampMats){ m.emissive=new THREE.Color(n?0xffcf72:0x000000); m.emissiveIntensity=n?1.5:0; m.needsUpdate=true; }
};
el('ref').onchange=e=>refs.forEach(r=>r.visible=e.target.checked);
el('row').onchange=e=>{
  const v=e.target.value;
  rows.ware.forEach(g=>g.visible=(v!=='shel')); rows.shel.forEach(g=>g.visible=(v!=='ware'));
  tags.forEach(t=>t.el.style.display=(v==='both'||(v==='ware'&&t.g.position.z<0)||(v==='shel'&&t.g.position.z>0))?'':'none');
};
// URL 파라미터로 뷰 고정(캡처용) — ?dist=&hgt=&ang=&panx=&panz=&row=&night=1&ref=0
{
  const U=new URLSearchParams(location.search);
  for(const k of ['dist','hgt','ang','panx','panz']) if(U.has(k)){ const e=el(k); e.value=U.get(k); e.dispatchEvent(new Event('input')); }
  if(U.has('ref')){ el('ref').checked=U.get('ref')!=='0'; el('ref').dispatchEvent(new Event('change')); }
  if(U.has('row')){ el('row').value=U.get('row'); el('row').dispatchEvent(new Event('change')); }
  if(U.has('night')){ el('night').checked=U.get('night')!=='0'; el('night').dispatchEvent(new Event('change')); }
  if(U.get('ui')==='0') el('ui').style.display='none';
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

const _v=new THREE.Vector3();
function tick(){
  const a=P.ang*Math.PI/180, tx=P.panx, tz=P.panz;
  camera.position.set(tx+Math.sin(a)*P.dist, P.hgt, tz+Math.cos(a)*P.dist);
  camera.lookAt(tx,2.2,tz);
  for(const t of tags){
    if(t.el.style.display==='none') continue;
    _v.set(t.g.position.x, 4.5, t.g.position.z).project(camera);
    t.el.style.left=((_v.x*.5+.5)*innerWidth)+'px'; t.el.style.top=((-_v.y*.5+.5)*innerHeight)+'px';
    t.el.style.opacity=_v.z<1?1:0;
  }
  renderer.render(scene,camera); requestAnimationFrame(tick);
}
tick();
window.__ready=true;
</script>
