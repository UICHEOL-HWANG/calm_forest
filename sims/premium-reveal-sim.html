<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>프리미엄 연출 시뮬</title>
<style>
  :root { --ui:#fffaf0; --ink:#3a3329; --acc:#e9a23b; }
  html,body { margin:0; height:100%; background:#1a1f2b; overflow:hidden; font:14px/1.4 -apple-system,"Apple SD Gothic Neo",sans-serif; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #main { z-index:0; }
  #dim { position:fixed; inset:0; z-index:1; background:radial-gradient(circle at 50% 45%, rgba(20,16,40,.55), rgba(5,4,12,.92)); opacity:0; pointer-events:none; transition:opacity .35s; }
  #flash { position:fixed; inset:0; z-index:3; background:#fff; opacity:0; pointer-events:none; }
  #reveal { z-index:2; pointer-events:none; }
  #bar { position:fixed; left:0; right:0; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:4px 6px; padding:6px 10px; font-size:13px; background:rgba(255,250,240,.92); box-shadow:0 2px 8px rgba(0,0,0,.2); }
  #bar .grp { display:flex; gap:3px; align-items:center; margin-right:8px; }
  #bar .lbl { color:#8a7f6e; font-size:12px; margin-right:2px; }
  button { font:inherit; border:0; border-radius:8px; padding:4px 8px; background:#efe6d4; color:var(--ink); cursor:pointer; }
  button.on { background:var(--acc); color:#fff; }
  #card { position:fixed; left:50%; bottom:4%; transform:translate(-50%,20px); z-index:4; text-align:center; color:#fff; opacity:0; pointer-events:none; transition:opacity .4s, transform .4s; width:min(92vw,360px); }
  #card.show { opacity:1; transform:translate(-50%,0); pointer-events:auto; }
  #card .tag { display:inline-block; font-size:12px; letter-spacing:.08em; padding:3px 10px; border-radius:99px; background:rgba(255,215,120,.18); color:#ffd98a; margin-bottom:8px; }
  #card h2 { margin:0 0 4px; font-size:24px; }
  #card p { margin:0 0 14px; color:#d9d3e8; }
  #card .row { display:flex; gap:8px; justify-content:center; }
  #card .row button { padding:10px 16px; border-radius:12px; }
  #card .go { background:var(--acc); color:#fff; font-weight:600; }
  #card .close { background:rgba(255,255,255,.15); color:#fff; }
  #note { position:fixed; left:12px; bottom:10px; z-index:5; color:#cfd6e4; font-size:12px; background:rgba(0,0,0,.35); padding:4px 8px; border-radius:6px; }
</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
</head>
<body>
<canvas id="main"></canvas>
<div id="dim"></div>
<canvas id="reveal"></canvas>
<div id="flash"></div>
<div id="bar">
  <div class="grp"><span class="lbl">자국</span>
    <button data-trail="firefly" class="on">🌟 반딧불</button>
    <button data-trail="rainbow">🌈 무지개</button>
    <button data-trail="basic">🐾 기본(비교)</button>
  </div>
  <div class="grp"><span class="lbl">스킨</span>
    <button data-skin="basic" class="on">기본</button>
    <button data-skin="spirit">🌿 숲의 정령</button>
    <button data-skin="plush">🧸 플러시 인형</button>
  </div>
  <div class="grp"><span class="lbl">시간</span>
    <button data-time="night" class="on">🌙 밤</button>
    <button data-time="day">☀️ 낮</button>
  </div>
  <div class="grp"><span class="lbl">획득 연출</span>
    <button data-reveal="A">A 스포트라이트</button>
    <button data-reveal="B">B 터지는 빛</button>
    <button data-reveal="C">C 선물 상자</button>
    <button data-reveal="D">B+C 상자 폭발</button>
  </div>
</div>
<div id="card">
  <div class="tag" id="cardTag">PREMIUM · 걷는 자국</div>
  <h2 id="cardName">반딧불 자국</h2>
  <p id="cardDesc">밤이 되면 발자국마다 반딧불이 떠올라요</p>
  <div class="row"><button class="go" id="goBtn">바로 걸어보기</button><button class="close" id="closeBtn">닫기</button></div>
</div>
<div id="note">시뮬 — 실제 게임 모델 아님</div>

<script type="module">
import * as THREE from 'three';

// ---------- 공용 텍스처 ----------
function glowTex(inner = 'rgba(255,255,255,1)', mid = 'rgba(255,255,255,.35)') {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, inner); gr.addColorStop(.35, mid); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
function raysTex() {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d'); g.translate(256, 256);
  for (let i = 0; i < 14; i++) {
    g.rotate(Math.PI * 2 / 14);
    const gr = g.createLinearGradient(0, 0, 0, -256);
    gr.addColorStop(0, 'rgba(255,230,160,.55)'); gr.addColorStop(1, 'rgba(255,230,160,0)');
    g.fillStyle = gr; g.beginPath(); g.moveTo(0, 0); g.lineTo(-22, -256); g.lineTo(22, -256); g.closePath(); g.fill();
  }
  return new THREE.CanvasTexture(c);
}
const GLOW = glowTex();
const SPARK = glowTex('rgba(255,255,255,1)', 'rgba(255,255,255,.15)');

// ---------- 메인 장면 ----------
const mainCanvas = document.getElementById('main');
const renderer = new THREE.WebGLRenderer({ canvas: mainCanvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, .1, 200);

const hemi = new THREE.HemisphereLight(0xffffff, 0x445533, 1);
const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.position.set(5, 10, 4);
scene.add(hemi, sun);

const ground = new THREE.Mesh(new THREE.CircleGeometry(14, 48), new THREE.MeshLambertMaterial({ color: 0x7fb069 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
const treeMat = new THREE.MeshLambertMaterial({ color: 0x4d7c4a, flatShading: true });
const trunkMat = new THREE.MeshLambertMaterial({ color: 0x7a5a3a });
for (let i = 0; i < 9; i++) {
  const a = i / 9 * Math.PI * 2 + .3, r = 9 + (i % 3);
  const t = new THREE.Group();
  const tr = new THREE.Mesh(new THREE.CylinderGeometry(.15, .2, .8, 6), trunkMat); tr.position.y = .4;
  const cr = new THREE.Mesh(new THREE.IcosahedronGeometry(.9, 0), treeMat); cr.position.y = 1.4;
  t.add(tr, cr); t.position.set(Math.cos(a) * r, 0, Math.sin(a) * r); scene.add(t);
}

// 캐릭터(토끼풍 블롭) — 스킨마다 재질·부속이 다르다
function buildHero(skin) {
  const g = new THREE.Group();
  let fur;
  if (skin === 'spirit') fur = new THREE.MeshLambertMaterial({ color: 0x9fe8a8, emissive: 0x2f8a4a, transparent: true, opacity: .8 });
  else if (skin === 'plush') fur = new THREE.MeshLambertMaterial({ color: 0xf6c6cf, flatShading: true });
  else fur = new THREE.MeshLambertMaterial({ color: 0xf3ead9 });
  const body = new THREE.Mesh(new THREE.SphereGeometry(.45, skin === 'plush' ? 10 : 16, skin === 'plush' ? 8 : 12), fur); body.scale.set(1, 1.05, .95); body.position.y = .55;
  const head = new THREE.Mesh(new THREE.SphereGeometry(.42, skin === 'plush' ? 10 : 16, skin === 'plush' ? 8 : 12), fur); head.position.y = 1.25;
  const earG = new THREE.CapsuleGeometry(.09, .35, 4, 8);
  const e1 = new THREE.Mesh(earG, fur), e2 = new THREE.Mesh(earG, fur);
  e1.position.set(-.16, 1.75, 0); e2.position.set(.16, 1.75, 0); e1.rotation.z = .15; e2.rotation.z = -.15;
  const eyeMat = new THREE.MeshBasicMaterial({ color: skin === 'spirit' ? 0xf4fff0 : 0x2b2420 });
  const eyeG = skin === 'plush' ? new THREE.CylinderGeometry(.07, .07, .03, 12) : new THREE.SphereGeometry(.045, 8, 6);
  const eye1 = new THREE.Mesh(eyeG, eyeMat), eye2 = new THREE.Mesh(eyeG, eyeMat);
  eye1.position.set(-.14, 1.3, .39); eye2.position.set(.14, 1.3, .39);
  if (skin === 'plush') { eye1.rotation.x = eye2.rotation.x = Math.PI / 2; }   // 단추 눈
  const footG = new THREE.SphereGeometry(.13, 10, 8);
  const f1 = new THREE.Mesh(footG, fur), f2 = new THREE.Mesh(footG, fur);
  f1.position.set(-.18, .1, .05); f2.position.set(.18, .1, .05);
  g.add(body, head, e1, e2, eye1, eye2, f1, f2);
  if (skin === 'plush') {   // 바느질 선(솔기) + 배 패치
    const seamM = new THREE.MeshBasicMaterial({ color: 0x8a4b5a });
    const seam1 = new THREE.Mesh(new THREE.TorusGeometry(.43, .012, 4, 40), seamM); seam1.position.y = 1.25; seam1.rotation.y = Math.PI / 2;
    const seam2 = new THREE.Mesh(new THREE.TorusGeometry(.46, .012, 4, 40), seamM); seam2.position.y = .55; seam2.rotation.y = Math.PI / 2; seam2.scale.set(1, 1.05, 1);
    const patch = new THREE.Mesh(new THREE.CircleGeometry(.16, 6), new THREE.MeshLambertMaterial({ color: 0xfff1c9 })); patch.position.set(.05, .6, .44);
    g.add(seam1, seam2, patch);
  }
  if (skin === 'spirit') {  // 몸 주변 은은한 빛
    const aura = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: 0x9dffb0, transparent: true, opacity: .55, blending: THREE.AdditiveBlending, depthWrite: false }));
    aura.scale.setScalar(2.6); aura.position.y = 1; g.add(aura); g.userData.aura = aura;
  }
  g.userData.feet = [f1, f2]; g.userData.body = body;
  return g;
}
let hero = buildHero('basic');
scene.add(hero);

// ---------- 상태 ----------
const state = { trail: 'firefly', night: true, skin: 'basic', pick: 'trail' };

function applyTime() {
  if (state.night) {
    scene.background = new THREE.Color(0x141b2d); scene.fog = new THREE.Fog(0x141b2d, 14, 30);
    hemi.intensity = .6; hemi.color.set(0x9aaae0); sun.intensity = .25; sun.color.set(0x9fb2ff);
    ground.material.color.set(0x3f5f42);
  } else {
    scene.background = new THREE.Color(0xbfe3f0); scene.fog = new THREE.Fog(0xbfe3f0, 18, 40);
    hemi.intensity = 1; hemi.color.set(0xffffff); sun.intensity = 1; sun.color.set(0xffffff);
    ground.material.color.set(0x7fb069);
  }
}

// ---------- 자국 ----------
const prints = [];
const flies = [];
const padG = new THREE.CircleGeometry(.12, 14), toeG = new THREE.CircleGeometry(.05, 10);
let stepCount = 0;
let now = 0;

function makePaw(color, opacity) {
  const g = new THREE.Group(); const mats = [];
  const mk = (geo, x, z) => {
    const m = new THREE.MeshBasicMaterial({ color, transparent: true, opacity, depthWrite: false });
    const mesh = new THREE.Mesh(geo, m); mesh.rotation.x = -Math.PI / 2; mesh.position.set(x, .012, z);
    g.add(mesh); mats.push(m);
  };
  mk(padG, 0, 0); mk(toeG, -.1, -.14); mk(toeG, 0, -.18); mk(toeG, .1, -.14);
  return { g, mats };
}

function addSparkle(pos, color, size, life, vy = .4) {
  const m = new THREE.SpriteMaterial({ map: SPARK, color, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
  const s = new THREE.Sprite(m); s.scale.setScalar(size); s.position.copy(pos);
  scene.add(s);
  flies.push({ sprite: s, born: now, life, base: pos.clone(), phase: Math.random() * 6, vy, kind: 'spark', size });
}

function addFirefly(pos) {
  const m = new THREE.SpriteMaterial({ map: GLOW, color: 0xd8ff6a, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
  const s = new THREE.Sprite(m); s.scale.setScalar(.35); s.position.copy(pos);
  scene.add(s);
  flies.push({ sprite: s, born: now, life: 3 + Math.random() * 1.5, base: pos.clone(), phase: Math.random() * 6, vy: .35 + Math.random() * .25, kind: 'fly', size: .35 });
}

function stamp(pos, angle) {
  stepCount++;
  let color = 0x5b4636, opacity = .35;
  if (state.trail === 'rainbow') {
    color = new THREE.Color().setHSL((stepCount * .09) % 1, .85, state.night ? .62 : .55); opacity = .95;
  } else if (state.trail === 'firefly') {
    color = state.night ? 0x9fd86a : 0x6e8f45; opacity = state.night ? .55 : .45;
  }
  const { g, mats } = makePaw(color, opacity);
  g.position.copy(pos); g.rotation.y = angle; scene.add(g);
  prints.push({ group: g, born: now, life: state.trail === 'basic' ? 2.5 : 3.2, mats, base: opacity });

  if (state.skin === 'spirit') addSparkle(pos.clone().add(new THREE.Vector3(0, .05, 0)), new THREE.Color(0x9dffb0), .3, 1.4, .25);
  if (state.trail === 'firefly') {
    const n = state.night ? 2 : (Math.random() < .3 ? 1 : 0);   // 낮엔 거의 안 보인다 — 밤의 희소성
    for (let i = 0; i < n; i++) addFirefly(pos.clone().add(new THREE.Vector3((Math.random() - .5) * .3, .15, (Math.random() - .5) * .3)));
  } else if (state.trail === 'rainbow') {
    g.scale.setScalar(1.25);
    for (let i = 0; i < 3; i++) addSparkle(pos.clone().add(new THREE.Vector3((Math.random() - .5) * .4, .1, (Math.random() - .5) * .4)), new THREE.Color(color), .22, .9, .6);
  }
}

// ---------- 획득 연출 장면 ----------
const revealCanvas = document.getElementById('reveal');
const rr = new THREE.WebGLRenderer({ canvas: revealCanvas, antialias: true, alpha: true });
rr.setPixelRatio(Math.min(devicePixelRatio, 2));
const rs = new THREE.Scene();
const rc = new THREE.PerspectiveCamera(40, 1, .1, 50); rc.position.set(0, .4, 6);
rs.add(new THREE.HemisphereLight(0xffffff, 0x554466, 1.2));
const rl = new THREE.DirectionalLight(0xffffff, 1.2); rl.position.set(2, 3, 4); rs.add(rl);

const rays = new THREE.Mesh(new THREE.PlaneGeometry(5, 5), new THREE.MeshBasicMaterial({ map: raysTex(), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
rays.position.z = -1; rs.add(rays);
const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: 0xffe6a0, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
halo.scale.setScalar(2.6); halo.position.z = -.5; rs.add(halo);
const ring = new THREE.Mesh(new THREE.RingGeometry(.9, 1, 48), new THREE.MeshBasicMaterial({ color: 0xffe6a0, transparent: true, blending: THREE.AdditiveBlending, side: THREE.DoubleSide }));
rs.add(ring);

// 상자(C안)
const box = new THREE.Group();
const boxMat = new THREE.MeshLambertMaterial({ color: 0xc8553d, flatShading: true });
const ribMat = new THREE.MeshLambertMaterial({ color: 0xf2c14e });
const boxBody = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1, 1.3), boxMat); boxBody.position.y = -.9;
const rib1 = new THREE.Mesh(new THREE.BoxGeometry(.22, 1.02, 1.32), ribMat); rib1.position.y = -.9;
const lid = new THREE.Group();
const lidMesh = new THREE.Mesh(new THREE.BoxGeometry(1.45, .3, 1.45), boxMat);
const lidRib = new THREE.Mesh(new THREE.BoxGeometry(.24, .32, 1.47), ribMat);
const bow = new THREE.Mesh(new THREE.TorusGeometry(.2, .07, 6, 12), ribMat); bow.position.y = .25;
lid.add(lidMesh, lidRib, bow); lid.position.y = -.25;
box.add(boxBody, rib1, lid); rs.add(box);

// 아이템 모델: 반딧불 병 / 무지개 발바닥 메달
function buildItem(kind) {
  const g = new THREE.Group();
  if (kind === 'firefly') {
    const glass = new THREE.Mesh(new THREE.CylinderGeometry(.55, .5, 1.2, 20, 1, true),
      new THREE.MeshLambertMaterial({ color: 0xcfeee0, transparent: true, opacity: .3, side: THREE.DoubleSide }));
    const cork = new THREE.Mesh(new THREE.CylinderGeometry(.35, .38, .25, 14), new THREE.MeshLambertMaterial({ color: 0xa47a4f }));
    cork.position.y = .72;
    const bottom = new THREE.Mesh(new THREE.CircleGeometry(.5, 20), new THREE.MeshLambertMaterial({ color: 0x6d9b5a }));
    bottom.rotation.x = -Math.PI / 2; bottom.position.y = -.59;
    g.add(glass, cork, bottom);
    g.userData.bugs = [];
    for (let i = 0; i < 6; i++) {
      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: 0xd8ff6a, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
      s.scale.setScalar(.38); s.userData.p = Math.random() * 6; g.add(s); g.userData.bugs.push(s);
    }
  } else {
    const pads = [[0, 0, .42], [-.36, .5, .17], [0, .64, .17], [.36, .5, .17]];
    pads.forEach(([x, y, r], i) => {
      const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, .16, 24), new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: 0x000000 }));
      m.rotation.x = Math.PI / 2; m.position.set(x, y - .2, 0); m.userData.i = i; g.add(m);
    });
    const back = new THREE.Mesh(new THREE.CylinderGeometry(.95, .95, .1, 40), new THREE.MeshLambertMaterial({ color: 0xf2d38a, emissive: 0x3a2a08 }));
    back.rotation.x = Math.PI / 2; back.position.set(0, .05, -.1); back.userData.fixed = true; g.add(back);
    g.userData.rainbow = true;
  }
  return g;
}
let item = null;

const burst = [];
function spawnBurst(n, colorFn) {
  for (let i = 0; i < n; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: SPARK, color: colorFn(i), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 3;
    s.userData.v = new THREE.Vector3(Math.cos(a) * sp, Math.sin(a) * sp + 1, (Math.random() - .5) * 2);
    s.scale.setScalar(.15 + Math.random() * .15); rs.add(s); burst.push(s);
  }
}
const twinkles = [];
for (let i = 0; i < 18; i++) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: SPARK, color: 0xfff2c0, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  const a = Math.random() * Math.PI * 2, r = 1.3 + Math.random() * 1.2;
  s.position.set(Math.cos(a) * r, Math.sin(a) * r * .8, (Math.random() - .5)); s.userData.p = Math.random() * 6;
  s.scale.setScalar(.18 + Math.random() * .12); s.visible = false; rs.add(s); twinkles.push(s);
}

const ITEMS = {
  firefly: { name: '반딧불 자국', desc: '밤이 되면 발자국마다 반딧불이 떠올라요', ringColor: 0xd8ff6a },
  rainbow: { name: '무지개 자국', desc: '걸음마다 일곱 빛깔이 차례로 남아요', ringColor: 0xffffff },
  spirit: { name: '숲의 정령', desc: '몸이 은은하게 빛나고, 지나간 자리에 초록빛이 남아요', ringColor: 0x9dffb0, skin: true },
  plush: { name: '플러시 인형', desc: '바느질 선과 단추 눈, 걸을 때마다 말랑하게 눌려요', ringColor: 0xffc6d0, skin: true },
};
let rv = null;
const dim = document.getElementById('dim'), flash = document.getElementById('flash'), card = document.getElementById('card');

function startReveal(mode) {
  const kind = state.pick === 'skin' ? state.skin : (state.trail === 'rainbow' ? 'rainbow' : 'firefly');
  if (item) rs.remove(item);
  if (ITEMS[kind].skin) {   // 스킨은 캐릭터 자체가 아이템
    item = new THREE.Group(); const h = buildHero(kind); h.position.y = -1; item.add(h); item.userData.skin = kind;
  } else item = buildItem(kind);
  rs.add(item);
  document.getElementById('cardTag').textContent = ITEMS[kind].skin ? 'PREMIUM · 전신 스킨' : 'PREMIUM · 걷는 자국';
  document.getElementById('goBtn').textContent = ITEMS[kind].skin ? '바로 입어보기' : '바로 걸어보기';
  burst.splice(0).forEach(s => rs.remove(s));
  rv = { mode, t0: now, kind, burstDone: false, openDone: false };
  document.getElementById('cardName').textContent = ITEMS[kind].name;
  document.getElementById('cardDesc').textContent = ITEMS[kind].desc;
  card.classList.remove('show');
  dim.style.opacity = 1;
  document.getElementById('note').style.display = 'none';
  flash.style.opacity = 0;
  ring.material.color.set(ITEMS[kind].ringColor);
}
function endReveal(equip) {
  const wasRainbow = item?.userData.rainbow, wasSkin = item?.userData.skin;
  rv = null;
  dim.style.opacity = 0; flash.style.opacity = 0; card.classList.remove('show');
  document.getElementById('note').style.display = '';
  rr.clear();
  if (equip) {
    if (wasSkin) setSkin(wasSkin);
    else if (wasRainbow) { setTrail('rainbow'); state.pick = 'trail'; } else { setTrail('firefly'); state.pick = 'trail'; setTime(true); }
  }
}
document.getElementById('goBtn').onclick = () => endReveal(true);
document.getElementById('closeBtn').onclick = () => endReveal(false);

const easeOutBack = t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const clamp01 = t => Math.min(1, Math.max(0, t));

function updateReveal(dt) {
  const t = now - rv.t0, kind = rv.kind;
  if (item.userData.bugs) item.userData.bugs.forEach((s, i) => {
    const p = s.userData.p + now * 1.3;
    s.position.set(Math.sin(p * 1.1 + i) * .3, Math.sin(p * .7) * .4, Math.cos(p * .9 + i) * .3);
    s.material.opacity = .55 + .45 * Math.sin(p * 3);
  });
  if (item.userData.rainbow) item.children.filter(m => !m.userData.fixed).forEach(m => {
    const c = new THREE.Color().setHSL((now * .25 + m.userData.i * .17) % 1, .85, .6);
    m.material.color.copy(c); m.material.emissive.copy(c).multiplyScalar(.45);
  });
  rays.visible = halo.visible = ring.visible = false; box.visible = false;
  twinkles.forEach(s => s.visible = false);

  if (rv.mode === 'A') {           // 스포트라이트: 어둡게 → 툭 커지며 등장 → 천천히 회전 + 빛줄기
    const k = clamp01((t - .25) / .7);
    item.scale.setScalar(Math.max(.001, easeOutBack(k) * 1.1)); item.position.set(0, .3 + Math.sin(now * 1.6) * .06, 0);
    item.rotation.y = now * .8;
    rays.visible = halo.visible = k > 0;
    rays.material.opacity = k * .45; rays.rotation.z = now * .15; halo.material.opacity = .7 * k;
    twinkles.forEach(s => { s.visible = k > .5; s.material.opacity = Math.max(0, Math.sin(now * 3 + s.userData.p)); });
    if (t > 1.1) card.classList.add('show');
  } else if (rv.mode === 'B') {    // 터지는 빛: 섬광 → 파티클 폭발 + 충격파 링 → 정착
    flash.style.opacity = t < .12 ? 1 - t / .12 * .2 : Math.max(0, .8 - (t - .12) * 3);
    if (!rv.burstDone && t > .1) {
      rv.burstDone = true;
      spawnBurst(60, i => kind === 'rainbow' ? new THREE.Color().setHSL(i / 60, .9, .65) : new THREE.Color(i % 3 ? 0xd8ff6a : 0xfff2c0));
    }
    const k = clamp01((t - .1) / .35);
    item.scale.setScalar(Math.max(.001, easeOutBack(k) * 1.1)); item.position.set(0, .3 + Math.sin(now * 1.6) * .06, 0);
    item.rotation.y = now * .8 + (1 - k) * 6;
    ring.visible = t < 1.2; ring.scale.setScalar(.5 + t * 4); ring.material.opacity = Math.max(0, 1 - t / 1.1);
    halo.visible = true; halo.material.opacity = .5 + .2 * Math.sin(now * 2);
    burst.forEach(s => {
      s.userData.v.y -= 3.2 * dt; s.userData.v.multiplyScalar(1 - 1.2 * dt);
      s.position.addScaledVector(s.userData.v, dt); s.material.opacity = Math.max(0, 1 - (t - .1) / 1.8);
    });
    if (t > .9) card.classList.add('show');
  } else {                         // 선물 상자: 상자 등장·흔들림 → 뚜껑 날아감 → 빛기둥 + 아이템 솟음
    box.visible = true;
    box.scale.setScalar(Math.max(.001, easeOutBack(clamp01(t / .4))));
    const shake = t > .5 && t < 1.4 ? Math.sin(t * 40) * .08 * (1 - Math.abs(t - .95) / .45) : 0;
    box.rotation.z = shake; box.rotation.y = -.4;
    if (t > 1.4) {
      const o = t - 1.4;
      lid.position.set(o * 1.2, -.25 + o * 3 - o * o * 3, o * .5); lid.rotation.z = -o * 4;
      if (!rv.openDone) {
        rv.openDone = true;
        if (rv.mode === 'D') spawnBurst(70, i => new THREE.Color().setHSL(i / 70, .9, .68));
        else spawnBurst(30, () => new THREE.Color(kind === 'rainbow' ? 0xffffff : 0xd8ff6a));
      }
      if (rv.mode === 'D') {   // 뚜껑이 열리는 순간 섬광 + 충격파
        flash.style.opacity = Math.max(0, .85 - o * 3);
        ring.visible = o < 1.2; ring.scale.setScalar(.5 + o * 4); ring.material.opacity = Math.max(0, 1 - o / 1.1);
      }
      const k = clamp01(o / .8);
      item.scale.setScalar(Math.max(.001, easeOutBack(k) * .95)); item.position.set(0, -.9 + k * 1.6, 0); item.rotation.y = now * .8;
      rays.visible = halo.visible = true; rays.material.opacity = k * .4; rays.rotation.z = now * .15; halo.material.opacity = .6 * k;
      const sp = rv.mode === 'D' ? 1 : .6;
      burst.forEach(s => { s.userData.v.y -= 2.5 * dt; s.position.addScaledVector(s.userData.v, dt * sp); s.material.opacity = Math.max(0, 1 - o / 1.8); });
      if (t > 2.3) card.classList.add('show');
    } else {
      lid.position.set(0, -.25, 0); lid.rotation.set(0, 0, 0);
      item.scale.setScalar(.001);
    }
  }
}

// ---------- UI ----------
function setTrail(tr) {
  state.trail = tr;
  document.querySelectorAll('[data-trail]').forEach(b => b.classList.toggle('on', b.dataset.trail === tr));
}
function setSkin(sk) {
  state.skin = sk; state.pick = sk === 'basic' ? 'trail' : 'skin';
  const p = hero.position.clone(), r = hero.rotation.y;
  scene.remove(hero); hero = buildHero(sk); hero.position.copy(p); hero.rotation.y = r; scene.add(hero);
  document.querySelectorAll('[data-skin]').forEach(b => b.classList.toggle('on', b.dataset.skin === sk));
}
function setTime(night) {
  state.night = night; applyTime();
  document.querySelectorAll('[data-time]').forEach(b => b.classList.toggle('on', (b.dataset.time === 'night') === night));
}
document.querySelectorAll('[data-trail]').forEach(b => b.onclick = () => { if (rv) endReveal(false); setTrail(b.dataset.trail); state.pick = 'trail'; });
document.querySelectorAll('[data-skin]').forEach(b => b.onclick = () => { if (rv) endReveal(false); setSkin(b.dataset.skin); });
document.querySelectorAll('[data-time]').forEach(b => b.onclick = () => setTime(b.dataset.time === 'night'));
document.querySelectorAll('[data-reveal]').forEach(b => b.onclick = () => startReveal(b.dataset.reveal));

function resize() {
  const w = innerWidth, h = innerHeight, tall = w < h;
  renderer.setSize(w, h, false); rr.setSize(w, h, false);
  camera.aspect = rc.aspect = w / h;
  camera.position.set(0, tall ? 12 : 9, tall ? 14 : 11); camera.lookAt(0, 0, 0);
  rc.position.set(0, -.2, tall ? 10 : 8);
  camera.updateProjectionMatrix(); rc.updateProjectionMatrix();
}
addEventListener('resize', resize);

// ---------- 루프 ----------
const clock = new THREE.Clock();
let nextStep = 0, foot = 0;
applyTime(); resize();

function tick() {
  const dt = Math.min(clock.getDelta(), .05); now += dt;
  // 걷기: 8자 경로
  const s = now * .45, R = 4;
  const x = Math.sin(s) * R, z = Math.sin(s * 2) * R * .55;
  const dx = Math.cos(s) * R, dz = Math.cos(s * 2) * 2 * R * .55;
  const ang = Math.atan2(dx, dz);
  hero.position.set(x, Math.abs(Math.sin(now * 9)) * .06, z); hero.rotation.y = ang;
  const [F1, F2] = hero.userData.feet;
  F1.position.z = .05 + Math.sin(now * 9) * .12; F2.position.z = .05 - Math.sin(now * 9) * .12;
  if (state.skin === 'plush') hero.userData.body.scale.y = 1.05 - Math.abs(Math.sin(now * 9)) * .06;   // 말랑하게 눌림
  if (hero.userData.aura) hero.userData.aura.material.opacity = (state.night ? .55 : .3) + .1 * Math.sin(now * 2);
  if (now > nextStep) {
    nextStep = now + .33; foot ^= 1;
    const side = new THREE.Vector3(Math.cos(ang), 0, -Math.sin(ang)).multiplyScalar(foot ? .18 : -.18);
    stamp(new THREE.Vector3(x, 0, z).add(side), ang + Math.PI);
  }
  for (let i = prints.length - 1; i >= 0; i--) {
    const p = prints[i], a = (now - p.born) / p.life;
    if (a >= 1) { scene.remove(p.group); p.mats.forEach(m => m.dispose()); prints.splice(i, 1); continue; }
    p.mats.forEach(m => m.opacity = p.base * (1 - a * a));
  }
  for (let i = flies.length - 1; i >= 0; i--) {
    const f = flies[i], a = (now - f.born) / f.life;
    if (a >= 1) { scene.remove(f.sprite); f.sprite.material.dispose(); flies.splice(i, 1); continue; }
    const age = now - f.born;
    if (f.kind === 'fly') {
      f.sprite.position.set(f.base.x + Math.sin(age * 1.7 + f.phase) * .35, f.base.y + age * f.vy, f.base.z + Math.cos(age * 1.3 + f.phase) * .35);
      const blink = .5 + .5 * Math.sin(age * 5 + f.phase);
      f.sprite.material.opacity = blink * Math.min(1, age * 3) * (1 - a) * (state.night ? 1 : .35);
    } else {
      f.sprite.position.y = f.base.y + age * f.vy;
      f.sprite.material.opacity = (1 - a);
      f.sprite.scale.setScalar(f.size * (1 + Math.sin(age * 12 + f.phase) * .3));
    }
  }
  renderer.render(scene, camera);
  if (rv) { updateReveal(dt); if ((item.userData.rainbow || item.userData.skin) && !(/[CD]/.test(rv.mode) && now - rv.t0 < 1.4)) item.rotation.y = Math.sin(now * 1.2) * .5; rr.render(rs, rc); }
  requestAnimationFrame(tick);
}
tick();
</script>
