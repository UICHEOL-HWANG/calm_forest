<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { buildAnimalHead, plushMat } from '../js/animal-faces.js';
import { ARM_AIM_R, ARM_AIM_L, TOOL_QREST_HOLD, TOOL_GRIP } from '../js/data/character.js';
import { gripForwardZ, pawRadius, ARM_R_K } from '../js/data/grip.js';
import { backAnchor } from '../js/cosmetics/anchors.js';
//  ✅ 확정안(도구 B · 날개 A · 하트핀 B · 아치 B)은 **게임 모듈을 그대로 import** 한다 — 복제본 없음(2026-10-08 이식).
import { buildToolSkin } from '../js/cosmetics/tool-skins.js';
import { buildCosmetic } from '../js/cosmetics/art.js';
import { buildFriendArch } from '../js/spaces/friend-arch-art.js';

// =============================================================
//  🤝 친구 추천 보상 시안 (2026-10-08) — 시안 전용, 게임 코드 미수정
//  ------------------------------------------------------------
//  4종 × A/B/C. 비매품·외형만.
//   ⭐ 도구 세트(테마 'star' 후보) — 9종. 실루엣은 지키고 테마가 날·통 자체가 된다.
//      A 별빛 라벤더 · B 무지개 크리스탈 · C 우주 소풍(달밤 moon 테마와 겹치지 않게 금·은·초승달 배제)
//   🦋 날개(back 앵커) — A 스테인드글라스 나비 · B 깃털 천사 · C 별자리 크리스탈
//   💗 하트핀(head, earSafe 'low' — star_pin 자리: 옆머리 앞쪽 낮게)
//   🌈 아치(집 앞 야외 장식, 걸어서 지나가는 크기)
//  · 캐릭터·쥐는 자리는 게임 모듈 import(animal-faces · data/character · data/grip · cosmetics/anchors).
//  · 블룸 임계 0.85 — 발광은 작은 별·보석·테두리만. 밤 토글에서 블룸을 켜 판정한다.
// =============================================================

const glowMats = [];
const clay = (color, o = {}) => {
  const m = new THREE.MeshStandardMaterial({ color, roughness: 0.95, metalness: 0, flatShading: !o.smooth, side: o.side ?? THREE.FrontSide });
  if (o.glow) { m.emissive = new THREE.Color(o.glow); m.userData.glow = { hex: o.glow, k: o.k ?? 0.8 }; glowMats.push({ m, k: o.k ?? 0.8 }); }
  if (o.opacity != null) { m.transparent = true; m.opacity = o.opacity; }
  return m;
};
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const M = (geo, mat, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); return m; };
const put = (parent, m) => { parent.add(m); return m; };   // add 는 부모를 돌려준다 — 자식에 이어 쓰려면 이걸로
const small = m => { m.userData.small = true; return m; };   // 작은 파츠 — 그림자 안 드리움(지글거림)
const lerp = (a, b, t) => a + (b - a) * t;

// ── 2D 윤곽 ───────────────────────────────────────────────
function starShape(r, k = 0.46, n = 5, cx = 0, cy = 0, path = null) {
  const s = path || new THREE.Shape();
  for (let i = 0; i < n * 2; i++) { const a = Math.PI / 2 + i * Math.PI / n, rr = i % 2 ? r * k : r; const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr; i ? s.lineTo(x, y) : s.moveTo(x, y); }
  s.closePath(); return s;
}
function heartShape(r) {
  const s = new THREE.Shape();
  s.moveTo(0, -r * 0.95);
  s.bezierCurveTo(r * 0.35, -r * 0.6, r * 1.1, -r * 0.2, r * 1.0, r * 0.32);
  s.bezierCurveTo(r * 0.92, r * 0.92, r * 0.2, r * 0.98, 0, r * 0.5);
  s.bezierCurveTo(-r * 0.2, r * 0.98, -r * 0.92, r * 0.92, -r * 1.0, r * 0.32);
  s.bezierCurveTo(-r * 1.1, -r * 0.2, -r * 0.35, -r * 0.6, 0, -r * 0.95);
  return s;
}
function petalShape(w, h) {
  const s = new THREE.Shape();
  s.moveTo(0, 0); s.bezierCurveTo(w * 1.1, h * 0.22, w * 0.95, h * 0.8, 0, h); s.bezierCurveTo(-w * 0.95, h * 0.8, -w * 1.1, h * 0.22, 0, 0);
  return s;
}
function roundBlade(bw, bh) {
  const sh = new THREE.Shape();
  sh.moveTo(-bw, 0); sh.lineTo(-bw, bh); sh.absarc(0, bh, bw, Math.PI, 0, true); sh.lineTo(bw, 0); sh.closePath();
  return sh;
}
function sector(r0, r1, a0, a1) {   // 고리 부채꼴(r0=0 이면 파이)
  const s = new THREE.Shape();
  if (r0 <= 0) { s.moveTo(0, 0); s.absarc(0, 0, r1, a0, a1, false); s.lineTo(0, 0); }
  else { s.absarc(0, 0, r1, a0, a1, false); s.absarc(0, 0, r0, a1, a0, true); }
  s.closePath(); return s;
}
const ext = (shape, depth, bev = 0.01, seg = 12, bevSeg = 2, bevSize = bev) => {
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: bev > 0, bevelThickness: bev, bevelSize: bevSize, bevelSegments: bevSeg, curveSegments: seg });
  g.translate(0, 0, -depth / 2); return g;
};
// 통통한 별·하트(쿠키처럼 부푼 단면) — 테마의 ‘형태’ 단위
const puffStar = (r, k = 0.5) => ext(starShape(r, k), r * 0.3, r * 0.2, 4, 3, r * 0.1);
const puffHeart = r => ext(heartShape(r), r * 0.3, r * 0.22, 10, 3, r * 0.1);
const sparkle = r => ext(starShape(r, 0.32, 4), r * 0.18, r * 0.06, 2, 1);
// 결(로브) 있는 구 — 별 단면 물조리개·주머니(호박 지오메트리와 같은 방식, 로브 n 개)
const lobeCache = new Map();
function lobedGeo(r, n = 5, amp = 0.12, squash = 0.95, seg = 6) {
  const key = [r, n, amp, squash, seg].join(); if (lobeCache.has(key)) return lobeCache.get(key);
  const g = new THREE.SphereGeometry(r, n * seg, 12), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i), phi = Math.atan2(z, x) + Math.PI / 2;
    const f = 1 + amp * Math.cos(n * phi) * Math.sqrt(Math.max(0, 1 - (y / r) ** 2));
    p.setXYZ(i, x * f, y * squash, z * f);
  }
  g.computeVertexNormals(); lobeCache.set(key, g); return g;
}
// 다리 + 반원(아치 경로)
class ArchCurve extends THREE.Curve {
  constructor(r, h, y0 = 0.02) { super(); this.r = r; this.h = h; this.y0 = y0; }
  getPoint(t, out = new THREE.Vector3()) {
    const { r, h, y0 } = this, L = 2 * (h - y0) + Math.PI * r, s = t * L, hl = h - y0;
    if (s < hl) return out.set(-r, y0 + s, 0);
    if (s < hl + Math.PI * r) { const a = Math.PI - (s - hl) / r; return out.set(r * Math.cos(a), h + r * Math.sin(a), 0); }
    return out.set(r, h - (s - hl - Math.PI * r), 0);
  }
}

// ── 자루·공통 부품(halloween-tools-sim 과 같은 규약: 원점 = 쥐는 곳, +y 위) ──
function handle(g, P, l, r = 0.030) {
  g.add(M(new THREE.CylinderGeometry(r * 0.8, r, l, 7), clay(P.wood), 0, l / 2 - 0.08, 0));
  g.add(M(new THREE.CylinderGeometry(r * 1.18, r * 1.18, 0.07, 7), clay(P.grip), 0, -0.02, 0));
  if (P.knobFn) P.knobFn(g, r); else g.add(M(new THREE.SphereGeometry(r * 1.35, 7, 6), clay(P.knob ?? P.grip), 0, -0.08, 0));
  return l - 0.08;
}
function rodFrame(g, { knobFn, rear, pole, line = 0xe8e4d8 }, bob) {
  knobFn(g);
  g.add(M(new THREE.CylinderGeometry(0.026, 0.030, 0.20, 7), rear, 0, -0.01, 0));
  const poleG = new THREE.Group(); poleG.position.y = 0.08; poleG.rotation.z = -0.12; g.add(poleG);
  const RL = 0.92; pole(poleG, RL);
  const lineG = new THREE.Group(); lineG.position.y = RL; lineG.rotation.z = 0.12; poleG.add(lineG);
  lineG.add(M(new THREE.CylinderGeometry(0.006, 0.006, 0.34, 5), clay(line), 0, -0.17, 0));
  const b = new THREE.Group(); b.position.y = -0.38; lineG.add(b); bob(b);
  g.scale.setScalar(1.25);
}
// 곡괭이 양팔 — segMat 은 재질 하나 또는 [안쪽, 바깥] 배열
function pickArms(hd, segMat, tipMat) {
  [-1, 1].forEach(sx => {
    const TH = [0.14, 0.32], LEN = [0.13, 0.12]; let px = sx * 0.042, py = 0.012;
    for (let i = 0; i < 2; i++) {
      const dx = Math.cos(TH[i]) * sx, dy = -Math.sin(TH[i]);
      const seg = M(new THREE.BoxGeometry(LEN[i], 0.048 - i * 0.012, 0.05 - i * 0.012), Array.isArray(segMat) ? segMat[i] : segMat, px + dx * LEN[i] / 2, py + dy * LEN[i] / 2, 0);
      seg.rotation.z = -sx * TH[i]; hd.add(seg); px += dx * LEN[i]; py += dy * LEN[i];
    }
    const t3 = 0.48, dx = Math.cos(t3) * sx, dy = -Math.sin(t3);
    const tip = M(new THREE.ConeGeometry(0.020, 0.085, 6), tipMat, px + dx * 0.042, py + dy * 0.042, 0);
    tip.rotation.z = -sx * (Math.PI / 2 + t3); hd.add(tip);
  });
}
// 낫 날 — segMat 재질 하나 또는 3개 배열. 반환: 날 그룹 + 끝 좌표
function sickleBlade(g, top, segMat, edgeMat, wk = 1) {
  const bl = new THREE.Group(); bl.position.y = top + 0.01; bl.rotation.y = 0.10; g.add(bl);
  const TH = [0.06, 0.28, 0.60], LEN = [0.15, 0.12, 0.10], W = [0.055 * wk, 0.045 * wk, 0.030 * wk]; let px = 0, py = 0;
  for (let i = 0; i < 3; i++) {
    const dx = Math.sin(TH[i]), dy = Math.cos(TH[i]);
    const seg = M(new THREE.BoxGeometry(W[i], LEN[i], 0.016), Array.isArray(segMat) ? segMat[i] : segMat, px + dx * LEN[i] / 2, py + dy * LEN[i] / 2, 0); seg.rotation.z = -TH[i]; bl.add(seg);
    const edge = M(new THREE.BoxGeometry(0.013, LEN[i] * 0.94, 0.012), edgeMat, px + dx * LEN[i] / 2 + dy * (W[i] / 2), py + dy * LEN[i] / 2 - dx * (W[i] / 2), 0); edge.rotation.z = -TH[i]; bl.add(edge);
    px += dx * LEN[i]; py += dy * LEN[i];
  }
  return { bl, tip: V3(px, py, 0) };
}
const netBag = (color, opacity) => clay(color, { opacity, side: THREE.DoubleSide });
const faceX = (m, dir = 1) => { m.rotation.y = dir * Math.PI / 2; return m; };   // 납작한 모양(면 = +z)을 ±x 로 돌린다

// ── 팔레트 ─────────────────────────────────────────────────
const BASE = { wood: 0x8a5a3a, grip: 0x5f3d26, metal: 0x6d757c, edge: 0xd9dfe4, can: 0x8fd0ea, pole: 0x7a4a2a };
const CE = { lav: 0xb7a3ea, lavL: 0xd3c6f6, deep: 0x6c58b4, gold: 0xf2cd5c, gem: 0xfff0a0 };                       // A 별빛 라벤더
const RB = { pearl: 0xf3edf8, pink: 0xf6a6c6, lemon: 0xffe48a, mint: 0xa4e3c4, sky: 0x9ecbf3, lilac: 0xc4acf0, gem: 0xfff6fb };   // B 무지개 크리스탈
const GX = { ind: 0x4b3f98, indD: 0x2f2a6c, aur: 0x7ce0cb, pink: 0xf4a2cd, peri: 0x9a9cf2, white: 0xf6f0ff, glint: 0xfff4c8 };   // C 우주 소풍

// =============================================================
//  도구 조형: BUILD[theme][tool](g)
// =============================================================
const TOOLS = [
  { id: 'water', name: '💧 물조리개' }, { id: 'hoe', name: '⛏️ 괭이' }, { id: 'axe', name: '🪓 도끼' }, { id: 'seed', name: '🌱 씨앗' }, { id: 'sickle', name: '🌾 낫' },
  { id: 'shovel', name: '🪏 삽' }, { id: 'hammer', name: '🔨 망치' }, { id: 'rod', name: '🎣 낚싯대' }, { id: 'net', name: '🦋 포충망' },
];
const BUILD = { base: {}, celest: {}, prism: {}, cosmos: {} };

// ── 기본(게임 0단계 toolMesh 그대로 — halloween-tools-sim 의 base 와 같다) ──
Object.assign(BUILD.base, {
  axe(g) { const top = handle(g, BASE, 0.52);
    g.add(M(new THREE.BoxGeometry(0.17, 0.13, 0.06), clay(BASE.metal), 0.075, top - 0.05, 0));
    const bl = M(new THREE.BoxGeometry(0.07, 0.155, 0.028), clay(BASE.edge), 0.175, top - 0.05, 0); bl.rotation.z = 0.06; g.add(bl);
    g.add(M(new THREE.BoxGeometry(0.05, 0.09, 0.07), clay(BASE.metal), -0.035, top - 0.05, 0)); g.scale.setScalar(1.18); },
  shovel(g) { const top = handle(g, BASE, 0.58);
    g.add(M(new THREE.CylinderGeometry(0.034, 0.042, 0.07, 7), clay(BASE.metal), 0, top + 0.01, 0));
    g.add(M(ext(roundBlade(0.105, 0.13), 0.03, 0.012, 14), clay(BASE.metal, { smooth: true }), 0, top + 0.03, 0)); g.scale.setScalar(1.18); },
  water(g) { g.add(M(new THREE.CylinderGeometry(0.11, 0.12, 0.2, 10), clay(BASE.can), 0, 0.18, 0));
    const sp = M(new THREE.CylinderGeometry(0.02, 0.035, 0.22, 6), clay(BASE.can), 0.15, 0.26, 0); sp.rotation.z = -0.9; g.add(sp); g.scale.setScalar(1.25); },
  rod(g) { rodFrame(g, { knobFn: g => g.add(M(new THREE.SphereGeometry(0.040, 7, 6), clay(BASE.grip), 0, -0.09, 0)), rear: clay(BASE.grip), pole: (p, L) => p.add(M(new THREE.CylinderGeometry(0.013, 0.026, L, 6), clay(BASE.pole), 0, L / 2, 0)) },
    b => { const s = M(new THREE.SphereGeometry(0.042, 8, 7), clay(0xd94f4f)); s.scale.set(1, 1.25, 1); b.add(s); b.add(M(new THREE.CylinderGeometry(0.040, 0.040, 0.022, 9), clay(0xf4efe6))); }); },
  hoe(g) { const top = handle(g, BASE, 0.52), IRON = 0x4d5156; const hd = new THREE.Group(); hd.position.y = top + 0.01; g.add(hd);
    hd.add(M(new THREE.BoxGeometry(0.085, 0.095, 0.075), clay(IRON))); pickArms(hd, clay(IRON), clay(IRON)); g.scale.setScalar(1.18); },
  sickle(g) { const top = handle(g, BASE, 0.30, 0.034); sickleBlade(g, top, clay(BASE.metal), clay(BASE.edge));
    g.add(M(new THREE.CylinderGeometry(0.030, 0.036, 0.06, 7), clay(BASE.metal), 0, top - 0.01, 0)); g.scale.setScalar(1.18); },
  hammer(g) { const top = handle(g, BASE, 0.50);
    const head = M(new THREE.CylinderGeometry(0.055, 0.055, 0.20, 8), clay(BASE.metal), 0, top - 0.04, 0); head.rotation.z = Math.PI / 2; g.add(head);
    [-1, 1].forEach(sx => { const c = M(new THREE.CylinderGeometry(0.062, 0.058, 0.03, 8), clay(BASE.edge), sx * 0.105, top - 0.04, 0); c.rotation.z = Math.PI / 2; g.add(c); });
    g.add(M(new THREE.SphereGeometry(0.022, 6, 5), clay(BASE.grip), 0, top + 0.022, 0)); g.scale.setScalar(1.18); },
  net(g) { g.add(M(new THREE.CylinderGeometry(0.028, 0.028, 0.62, 6), clay(BASE.wood), 0, 0.2, 0));
    const ring = M(new THREE.TorusGeometry(0.17, 0.018, 6, 14), clay(0xdfe6ea), 0, 0.6, 0); ring.rotation.x = Math.PI / 2; g.add(ring);
    g.add(M(new THREE.ConeGeometry(0.16, 0.3, 10, 1, true), netBag(0xfaffff, 0.45), 0, 0.74, 0)); g.scale.setScalar(1.25); },
  seed(g) { const bag = M(new THREE.SphereGeometry(0.12, 8, 8), clay(0xcaa06a), 0, 0.08, 0); bag.scale.set(1, 1.15, 1); g.add(bag); g.scale.setScalar(1.25); },
});

// ─────────────────────────────────────────────────────────────
//  A ⭐ 별빛 라벤더 — 별이 형태가 된다: 별 단면 통 · 별 구멍 날 · 별 테 망 · 별 망치머리
// ─────────────────────────────────────────────────────────────
const ceGem = () => clay(CE.gem, { glow: CE.gem, k: 0.9 });

function planet(parent, r, body, ring, x, y, z, tilt = 0.4, ring2 = null) {
  const gr = new THREE.Group(); gr.position.set(x, y, z); parent.add(gr);
  gr.add(M(new THREE.SphereGeometry(r, 14, 10), clay(body, { smooth: true })));
  const rg = new THREE.Group(); rg.rotation.set(Math.PI / 2 - 0.25, 0, tilt); gr.add(rg);
  rg.add(M(new THREE.TorusGeometry(r * 1.55, r * 0.11, 4, 24), clay(ring)));
  if (ring2) rg.add(M(new THREE.TorusGeometry(r * 1.3, r * 0.08, 4, 24), clay(ring2)));
  return gr;
}

  return s;
}
