<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>썰매 통과 검수</title>
<style>
  html,body{margin:0;background:#1f2a33;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#eef3f6}
  .row{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px;padding:6px}
  figure{margin:0;background:#111a21;border-radius:10px;overflow:hidden}
  figcaption{font-size:13px;padding:6px 10px}
  canvas{display:block;width:100%;height:auto}
  h2{font-size:15px;margin:10px 10px 0}
</style>
<h2>① 점프대 오르막: 고치기 전 / 후</h2>
<div class="row" id="ramp" style="--n:2"></div>
<h2>② 깃발 기둥 옆을 스칠 때: 고치기 전 / 후</h2>
<div class="row" id="gate" style="--n:2"></div>
<h2>③ 카페 코코아 마시기</h2>
<div class="row" id="cafe" style="--n:4"></div>
<script type="module">
import * as THREE from '../vendor/three/three.module.js';
import { COURSE } from '../js/mountain/course.js';
import { slopePoint } from '../js/mountain/terrain.js';
import { buildMountainSpace } from '../js/mountain/interior-art.js';
import { buildSledProps } from '../js/mountain/sled-props.js';
import { sledPose, sledSeat, sledLift } from '../js/mountain/sled-view.js';
import { createSled } from '../js/mountain/sled.js';
import { createGateBend } from '../js/mountain/gate-bend.js';
import { buildCafeRoom } from '../js/mountain/cafe-art.js';
import { SEATS, TABLES, DRINK, drinkPose } from '../js/mountain/cafe-layout.js';

const W = 640, H = 420;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;

function lights(scene) {
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8aa0b4, 1.5));
  const sun = new THREE.DirectionalLight(0xffffff, 1.3);
  sun.position.set(-8, 20, 6);
  scene.add(sun);
}

function rider(seated) {
  const g = new THREE.Group();
  const fur = new THREE.MeshLambertMaterial({ color: 0xd9a066 });
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.5, 20, 14), fur);
  body.scale.set(1, 0.9, 0.9);
  body.position.y = 0.55;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 20, 14), fur);
  head.position.y = 1.25;
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 8), new THREE.MeshLambertMaterial({ color: 0x3a2a20 }));
  nose.position.set(0, 1.18, 0.38);
  g.add(body, head, nose);
  if (seated) g.position.y = -0.3;
  const holder = new THREE.Group();
  holder.add(g);
  holder.userData.anchor = g;
  return holder;
}

function shot(el, caption, scene, camera) {
  renderer.render(scene, camera);
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  c.getContext('2d').drawImage(renderer.domElement, 0, 0);
  const f = document.createElement('figure');
  const cap = document.createElement('figcaption');
  cap.textContent = caption;
  f.append(c, cap);
  document.getElementById(el).append(f);
}

const space = buildMountainSpace(THREE);
const props = buildSledProps(THREE, COURSE);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfe6f3);
lights(scene);
scene.add(space, props.group);
const sledMesh = space.userData.sled;
sledMesh.visible = true;
const who = rider(false);
scene.add(who);
const seat = sledSeat('basic');

function place(s, lift, pitch) {
  const pose = sledPose(s, 0, lift);
  sledMesh.position.set(pose.x, pose.y, pose.z);
  sledMesh.rotation.set(pitch ?? pose.pitch, 0, 0);
  who.position.set(pose.x, pose.y + seat, pose.z);
  return pose;
}

const r = COURSE.ramps[0];
const sRamp = { ...createSled(0), z: r.z - 2.2, x: r.x + 0.4 };
const cam = new THREE.PerspectiveCamera(40, W / H, 0.1, 300);
const sp = slopePoint(sRamp.z, sRamp.x);
cam.position.set(sp.x + 5.5, sp.y + 1.6, sp.z + 0.4);
cam.lookAt(sp.x, sp.y + 0.5, sp.z);
place(sRamp, 0, sledPose({ ...sRamp, z: r.z - 40 }, 0).pitch);
shot('ramp', '전: 오르막인데 썰매가 바닥 높이 그대로 → 판자 속을 지나감', scene, cam);
place(sRamp, sledLift(sRamp));
shot('ramp', `후: 판자 위로 올라탐 (높이 +${sledLift(sRamp).toFixed(2)}, 앞코 들림)`, scene, cam);

const bend = createGateBend(space.userData.gates);
const f1 = COURSE.flags[1];
const xHit = f1.x + f1.half + 0.3;
const gp = place({ ...createSled(0), z: f1.z, x: xHit }, 0);
cam.position.set(gp.x - 0.6, gp.y + 2.6, gp.z - 4.5);
cam.lookAt(gp.x + 0.3, gp.y + 0.9, gp.z);
shot('gate', '전: 기둥이 캐릭터 몸을 그대로 뚫고 지나감', scene, cam);
for (let z = f1.z - 3; z <= f1.z + 0.4; z += 0.33) bend.update(slopePoint(z, xHit), 0, 1 / 60);
shot('gate', '후: 닿는 순간 기둥이 바깥·아래쪽으로 휘었다가 다시 섬', scene, cam);

const cafeScene = new THREE.Scene();
cafeScene.background = new THREE.Color(0x2a2320);
lights(cafeScene);
cafeScene.add(buildCafeRoom(THREE));
const st = SEATS[0], tb = TABLES[st.table];
const sitter = rider(true);
sitter.position.set(st.x, 0, st.z);
sitter.rotation.y = st.ry;
cafeScene.add(sitter);
const mug = new THREE.Group();
mug.rotation.order = 'YXZ';
mug.rotation.y = st.ry;
mug.add(new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.09, 0.2, 12), new THREE.MeshLambertMaterial({ color: 0xf3e6cf })));
const topc = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.085, 0.02, 12), new THREE.MeshLambertMaterial({ color: 0x6b3b24 }));
topc.position.y = 0.1;
mug.add(topc);
cafeScene.add(mug);
const table = { x: tb.x + (st.x - tb.x) * 0.35, y: 0.89, z: tb.z };
const mouth = { x: st.x + Math.sin(st.ry) * DRINK.mouth.fwd, y: DRINK.mouth.y, z: st.z + Math.cos(st.ry) * DRINK.mouth.fwd };
const ccam = new THREE.PerspectiveCamera(38, W / H, 0.1, 100);
ccam.position.set(st.x + 0.4, 1.7, st.z + 3.2);
ccam.lookAt(st.x + 0.3, 0.9, st.z);
[[0.05, '앉자마자: 컵은 탁자 위'], [0.2, '컵을 입가로 들어 올림'], [0.37, '한 모금 (몸이 살짝 뒤로)'], [0.99, '내려놓고 → 주문한 자리로 복귀 + "☕ 몸이 녹았어요~"']].forEach(([k, cap]) => {
  const pose = drinkPose(k, table, mouth);
  mug.position.set(pose.at.x, pose.at.y, pose.at.z);
  mug.rotation.x = -pose.tilt;
  sitter.userData.anchor.rotation.x = -DRINK.lean * pose.sip;
  shot('cafe', cap, cafeScene, ccam);
});
document.body.dataset.ready = '1';
</script>
