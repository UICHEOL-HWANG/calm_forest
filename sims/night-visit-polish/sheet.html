<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Night Visit Compare</title>
<style>
body{margin:0;padding:28px 32px;background:#f3efe4;font-family:'Apple SD Gothic Neo',sans-serif;color:#2f3d33}
h1{font-size:24px;margin:0 0 4px} h2{font-size:18px;margin:28px 0 10px} .lead{opacity:.7;font-size:14px;margin:0 0 6px}
.row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:6px}
.col b{font-size:15px} .col span{font-size:12.5px;opacity:.7}
img{display:block;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.m img{width:210px} .p img{width:400px}
.pair{display:flex;gap:6px}
</style></head><body>
<h1>🐗 밤손님 개선 시안</h1>
<p class="lead">쪽지는 대결에서 졌을 때만 뜹니다. 쪽지 글은 Gemini가 매번 새로 쓰고, 아래는 예시 문구입니다.</p>
<div id="root"></div>
<script>
const dev = new URLSearchParams(location.search).get('dev') || 'mobile';
const cls = dev === 'pc' ? 'p' : 'm';
const sec = (title, items) => `<h2>${title}</h2><div class="row">${items.map(([lab, desc, files]) =>
  `<div class="col ${cls}"><b>${lab}</b><div class="pair">${files.map(f => `<img src="shots/${dev}_${f}.png">`).join('')}</div><span>${desc}</span></div>`).join('')}</div>`;
document.getElementById('root').innerHTML =
  sec('📜 쪽지', [
    ['현재', '안내 카드를 그대로 씀', ['noteNow']],
    ['A 편지지', '줄 노트·마스킹 테이프·밀랍 도장, 고운바탕 글꼴', ['noteA']],
    ['B 결과 카드', '밤하늘 머리띠에 결과, 아래에 삼촌 말과 팁', ['noteB']],
    ['C 대화창', '주민 대화처럼 아래 시트, 탭하면 닫힘', ['noteC']],
  ]) +
  sec('⚔️ 대결 들어갈 때 전환(약 1.8초)', [
    ['A 할퀴기', '발톱 세 줄이 긁고, 어두워지며 제목', ['transA_0.36', 'transA_0.8']],
    ['B 아이리스', '내 캐릭터로 좁혀진 뒤 암전에 제목', ['transB_0.55', 'transB_1']],
    ['C VS 띠', '양쪽에서 띠가 들어와 나 VS 동물', ['transC_0.3', 'transC_0.9']],
  ]) +
  sec('🐾 흔적 찾기·살펴보기', [
    ['살펴보기 버튼 + 길 안내', '가까이 가면 대화하기 자리에 버튼, 알림 뒤엔 흔적 쪽 안내', ['button']],
  ]);
</script></body></html>
