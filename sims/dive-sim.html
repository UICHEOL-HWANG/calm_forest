  carry.length = 0;
  for (let i = 0; i < 8; i++) bubble(player.position.clone().add(new THREE.Vector3(rnd() - .5, 1.2, rnd() - .5)), .08, .6, .6);
  if (dives >= DIVES) endRound(); else hint('🤿 숨 고르고 다시 잠수해요');
}
function outOfAir() {
  if (V === 'B' && carry.length) {
    dropped += carry.length;
    carry.forEach(s => { const m = buildItem(s); const x = player.position.x + (rnd() - .5), z = player.position.z + (rnd() - .5), d = depthAt(x, z); m.position.set(x, -d + .08, z); scene.add(m); items.push({ sp: s, m, x, z, d, ph: 0 }); });
    pop(player.position.clone().add(new THREE.Vector3(0, 1.6, 0)), '💦', true);
    carry.length = 0;
  } else pop(player.position.clone().add(new THREE.Vector3(0, 1.6, 0)), '😮‍💨');
  state = 'ascend';
}
const hintEl = document.getElementById('hint');
function hint(s) { hintEl.textContent = s; hintEl.style.opacity = s ? 1 : 0; }
function endRound() {
  over = true;
  setTimeout(() => showResult({
    design: CARD, mode: 'dive',
    title: '오늘 잠수 끝', sub: `숨 ${DIVES}번으로 ${banked}개를 건졌어요`,
    items: SPECIES.filter(s => bag[s.id]).map(s => ({ ico: s.ico, name: s.name, count: bag[s.id], coin: s.coin, rare: !!s.rare })),
    stats: `${VNAME[V]} · 떨어뜨림 ${dropped}`,
    onAgain: () => { const u = new URLSearchParams(location.search); if (!Q.get('seed')) u.delete('seed'); location.search = u.toString(); },
  }), 700);
}

const keys = new Set();
addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); press(); return; }
  if (e.code === 'KeyE' || e.code === 'ShiftLeft') { ascend(); return; }
  keys.add(e.code);
});
addEventListener('keyup', e => keys.delete(e.code));
const btn = document.getElementById('btn'), upBtn = document.getElementById('up');
btn.addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); press(); });
upBtn.addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); ascend(); });
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', e => {
  if (over) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const h = ray.intersectObject(state === 'surface' ? surf : floor)[0]; if (!h) return;
  moveTarget = h.point.clone(); pendingItem = null;
  if (state === 'swim') {
    let best = null, bd = 1; for (const it of items) { const d = Math.hypot(it.x - h.point.x, it.z - h.point.z); if (d < bd) { bd = d; best = it; } }
    pendingItem = best;
  }
});

document.getElementById('tag').textContent = '잠수 · ' + VNAME[V];
{
  const mk = (q, label, on) => { const u = new URLSearchParams(location.search); Object.entries(q).forEach(([k, v]) => v == null ? u.delete(k) : u.set(k, v)); return `<a href="?${u}" class="${on ? 'on' : ''}">${label}</a>`; };
  document.getElementById('cfg').innerHTML =
    '<div>숨 규칙</div>' + ['A', 'B', 'C'].map(k => mk({ v: k }, VNAME[k], k === V)).join('') +
    '<div>숨 길이</div>' + [15, 20, 30].map(s => mk({ breath: s }, s + '초', s === BREATH)).join('') +
    '<div>결과창</div>' + [1, 2, 3].map(c => mk({ card: c }, CARD_NAMES[c], c === CARD)).join('') +
    '<div>' + mk({ auto: auto ? null : 1 }, '자동 플레이', auto) + '</div>';
}

const camPos = new THREE.Vector3(), camLook = new THREE.Vector3(), mv = new THREE.Vector3(), tmp = new THREE.Vector3();
let camK = 1, t = 0, strokeT = 0, autoTarget = null;
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camK = camera.aspect < .8 ? 1.4 : camera.aspect < 1.2 ? 1.15 : 1; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

function botThink() {
  if (over || grab) return;
  if (state === 'surface') {
    if (!autoTarget) { const cands = items.filter(i => i.d > 3 && i.d < 9); const pick = cands[Math.floor(rnd() * cands.length)] || items[0]; autoTarget = pick ? new THREE.Vector3(pick.x, 0, pick.z) : null; }
    if (autoTarget && Math.hypot(autoTarget.x - player.position.x, autoTarget.z - player.position.z) < .6) { autoTarget = null; press(); }
    else if (autoTarget) mv.set(autoTarget.x - player.position.x, 0, autoTarget.z - player.position.z);
    return;
  }
  if (state !== 'swim') return;
  if (air < needAir() + .04) { ascend(); return; }
  if (V === 'B' && carryKg() >= 6) { ascend(); return; }
  if (V === 'C' && air < .45) {
    const v = vents.filter(v => !v.used).sort((a, b) => Math.hypot(a.x - player.position.x, a.z - player.position.z) - Math.hypot(b.x - player.position.x, b.z - player.position.z))[0];
    if (v && Math.hypot(v.x - player.position.x, v.z - player.position.z) < 7) { mv.set(v.x - player.position.x, 0, v.z - player.position.z); return; }
  }
  const it = nearestItem(99);
  if (!it) return;
  const d = Math.hypot(it.x - player.position.x, it.z - player.position.z);
  if (d < REACH * .8) press(); else mv.set(it.x - player.position.x, 0, it.z - player.position.z);
}
function updateMove(dt) {
  mv.set(0, 0, 0);
  if (over || grab || state === 'descend' || state === 'ascend') return;
  if (keys.has('KeyW') || keys.has('ArrowUp')) mv.z -= 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) mv.z += 1;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) mv.x -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) mv.x += 1;
  if (mv.lengthSq()) { moveTarget = null; pendingItem = null; }
  if (auto && !mv.lengthSq() && !moveTarget) botThink();
  if (moveTarget) {
    mv.set(moveTarget.x - player.position.x, 0, moveTarget.z - player.position.z);
    if (mv.length() < (pendingItem ? REACH * .7 : .2)) { mv.set(0, 0, 0); moveTarget = null; if (pendingItem && items.includes(pendingItem)) press(); pendingItem = null; }
  }
}
function updateBreath(dt) {
  if (over) return;
  if (state === 'surface') { player.position.y = SURF_Y + Math.sin(t * 2) * .06; air = Math.min(1, air + dt * .8); return; }
  air -= dt / BREATH;
  if (state === 'descend') { player.position.y -= 3.2 * dt; if (player.position.y <= swimY()) { player.position.y = swimY(); state = 'swim'; } }
  else if (state === 'swim') player.position.y = THREE.MathUtils.lerp(player.position.y, swimY(), 1 - Math.pow(.02, dt));
  else if (state === 'ascend') { player.position.y += (air <= 0 ? 4.5 : ascendSpeed()) * dt; if (player.position.y >= SURF_Y) { player.position.y = SURF_Y; surfaced(); return; } }
  if (air <= 0 && state !== 'ascend') { air = 0; outOfAir(); }
  air = Math.max(0, air);
  if (rnd() < dt * 3) bubble(player.position.clone().add(tmp.set(.3, 1.5, .3)), .05 + rnd() * .04);
  for (const v of vents) {
    if (!v.used && state === 'swim' && Math.hypot(v.x - player.position.x, v.z - player.position.z) < 1.3) {
      v.used = true; air = Math.min(1, air + .35); pop(player.position.clone().add(tmp.set(0, 1.8, 0)), '🫧+', true);
    }
  }
}
function updateBear(dt, moving) {
  const tilt = state === 'surface' ? 0 : state === 'descend' ? 2.2 : state === 'ascend' ? -.35 : moving || grab ? 1.25 : .55;
  bear.g.rotation.x = THREE.MathUtils.lerp(bear.g.rotation.x, tilt, 1 - Math.pow(.01, dt));
  bear.g.position.y = state === 'swim' || state === 'descend' ? .5 : 0;
  const R = bear.arms.R.pivot, L = bear.arms.L.pivot;
  strokeT += dt * (moving || state === 'ascend' ? 7 : state === 'surface' ? 3 : 2.5);
  if (grab) {
    grab.t += dt; const k = Math.min(1, grab.t / .5);
    R.rotation.x = -2.2 * Math.sin(k * Math.PI); L.rotation.x = -.4;
    const it = grab.it; bear.net.getWorldPosition(tmp);
    if (k < .45) it.m.position.lerpVectors(grab.from, player.position.clone().add(new THREE.Vector3(0, .5, 0)), k / .45);
    else it.m.position.lerp(tmp, .3);
    it.m.scale.setScalar(1 - k * .5);
    if (k >= 1) {
      scene.remove(it.m); carry.push(it.sp); grab = null;
      pop(player.position.clone().add(tmp.set(0, 1.6, 0)), it.sp.rare ? `✨${it.sp.ico}` : it.sp.ico, !!it.sp.rare);
      if (items.length < 22) spawnItem();
    }
  } else if (state === 'surface') { R.rotation.x = -.6 - Math.sin(strokeT) * .5; L.rotation.x = -.6 + Math.sin(strokeT) * .5; }
  else { R.rotation.x = -1.4 - Math.sin(strokeT) * 1.3; L.rotation.x = -1.4 - Math.sin(strokeT + Math.PI) * 1.3; }
  bear.net.scale.setScalar(.4 + Math.min(.9, carry.length * .12));
}
function updateWorld(dt) {
  const p = surf.geometry.attributes.position;
  for (let i = 0; i < p.count; i++) p.setZ(i, surfBase[i * 3 + 2] + .08 * Math.sin(t * 1.6 + surfBase[i * 3] * .5 + surfBase[i * 3 + 1] * .3));
  p.needsUpdate = true;
  for (const s of sway) s.seg.rotation.z = Math.sin(t * 1.2 + s.ph) * s.amp;
  for (const k of kelps) k.visible = !(k.position.z > player.position.z + .6 && Math.abs(k.position.x - camera.position.x) < 2.2 && k.position.z < camera.position.z + 1);
  for (const s of shafts) { s.m.rotation.z = .25 + Math.sin(t * .4 + s.ph) * .06; s.m.material.opacity = .05 + .03 * Math.sin(t * .8 + s.ph); }
  for (const s of schools) { const a = t * s.sp + s.ph; s.g.position.set(s.cx + Math.cos(a) * s.r, s.cy + Math.sin(a * 2) * .3, s.cz + Math.sin(a) * s.r); s.g.rotation.y = -a; }
  for (const it of items) if (it.m.userData.glow) it.m.userData.glow.material.emissiveIntensity = .6 + .4 * Math.sin(t * 3 + it.ph);
  for (const v of vents) {
    v.t += dt;
    if (v.t > (v.used ? .9 : .18)) { v.t = 0; bubble(new THREE.Vector3(v.x + (rnd() - .5) * .4, -v.d + .4, v.z + (rnd() - .5) * .4), v.used ? .04 : .1 + rnd() * .08, 1.6, 2.5); }
  }
  for (const b of [...bubbles]) {
    b.life -= dt; b.m.position.y += b.vy * dt; b.m.position.x += Math.sin(t * 6 + b.m.id) * dt * .2;
    b.m.material.opacity = .8 * Math.min(1, b.life / b.max * 2);
    if (b.life <= 0 || b.m.position.y > .1) { scene.remove(b.m); bubbles.splice(bubbles.indexOf(b), 1); }
  }
}
function updateHud() {
  const near = state === 'swim' ? nearestItem() : null;
  btn.classList.toggle('ready', state === 'surface' || !!near);
  btn.textContent = state === 'surface' ? '잠수' : '줍기';
  btn.style.opacity = state === 'swim' || state === 'surface' ? 1 : .5;
  upBtn.style.display = state === 'swim' || state === 'descend' ? 'block' : 'none';
  const fill = document.getElementById('airFill');
  fill.style.width = (air * 100) + '%';
  const low = state !== 'surface' && air < needAir() + .08;
  fill.classList.toggle('low', low);
  document.getElementById('vig').classList.toggle('low', low && !over);
  document.getElementById('airTxt').textContent = state === 'surface' ? '수면' : Math.ceil(air * BREATH) + '초';
  document.getElementById('cnt').textContent = banked;
  document.getElementById('carry').textContent = carry.length ? `+${carry.length}${V === 'B' ? ` · ${carryKg()}kg` : ''}` : '';
  document.getElementById('dives').textContent = Math.min(DIVES, dives + (state === 'surface' ? 0 : 1));
}
function updateCamera(dt) {
  const under = camera.position.y < 0;
  scene.background = under ? DEEP : SKY; scene.fog = under ? fogSea : fogAir;
  tmp.set(0, state === 'surface' ? 4.2 : 3.4, state === 'surface' ? 7.5 : 7.4).multiplyScalar(camK);
  camPos.copy(player.position).add(tmp);
  if (state !== 'surface') { camPos.z = Math.min(camPos.z, FLOOR_Z1 - 1); camPos.y = THREE.MathUtils.clamp(camPos.y, -depthAt(camPos.x, camPos.z) + 1.6, -.4); }
  camera.position.lerp(camPos, 1 - Math.pow(.003, dt));
  camLook.copy(player.position).add(tmp.set(0, state === 'surface' ? .2 : -.3, -3));
  camera.lookAt(camLook);
}
function step(dt) {
  t += dt;
  updateMove(dt);
  const moving = mv.lengthSq() > 0;
  if (moving) { mv.normalize(); player.position.addScaledVector(mv, (state === 'surface' ? 2.6 : 3) * dt); player.rotation.y = Math.atan2(mv.x, mv.z); }
  player.position.x = THREE.MathUtils.clamp(player.position.x, -18, 18);
  player.position.z = THREE.MathUtils.clamp(player.position.z, FLOOR_Z0 + 3, FLOOR_Z1 - 8);
  updateBreath(dt);
  updateBear(dt, moving);
  updateWorld(dt);
  updateHud();
  updateCamera(dt);
}
const clock = new THREE.Clock();
function loop() { step(Math.min(.05, clock.getDelta())); renderer.render(scene, camera); requestAnimationFrame(loop); }
camera.position.copy(player.position).add(new THREE.Vector3(0, 4.2, 7.5));
window.__dive = { step, press, ascend, get state() { return state; }, get air() { return air; }, bag, get dives() { return dives; } };
loop();
</script>
