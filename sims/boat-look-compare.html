<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>폭포·노 젓기 시안</title>
<style>
body{margin:0;background:#4f6f76;font-family:system-ui,sans-serif;color:#fff}
main{max-width:1200px;margin:0 auto;padding:20px 16px 50px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:18px;margin:26px 0 10px}
.lead{color:#e3eeec;font-size:13px;margin:0 0 10px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
figure{margin:0;background:#2f4a50;border-radius:16px;overflow:hidden}
img{width:100%;display:block}
figcaption{padding:10px 12px;font-size:13px;line-height:1.5}
figcaption b{display:block;font-size:15px;margin-bottom:2px}
</style></head><body><main>
<h1>🌊 급류 점프칸 · 🚣 노 젓기 시안</h1>
<p class="lead">실제 게임 화면(3인칭)에서 찍었어요. 고물 장식(캐릭터를 가리던 나무 기둥)은 노 젓기 시안에서 뺐어요.</p>
<h2>점프칸(작은 폭포)</h2>
<div class="row">
<figure><img src="boat-look/now.jpg"><figcaption><b>지금</b>흰 판 한 장. 노는 배에 붙어 혼자 움직이고, 고물 장식이 캐릭터를 가려요.</figcaption></figure>
<figure><img src="boat-look/fallA.jpg"><figcaption><b>A · 바위 턱</b>강을 가로지르는 바위 턱 + 물이 넘쳐 흐르는 막 + 물거품. 양옆 큰 바위.</figcaption></figure>
<figure><img src="boat-look/fallB.jpg"><figcaption><b>B · 나무 보(둑)</b>마을 나무색 둑 + 기둥, 넘치는 물, 양 끝 빨간 깃발.</figcaption></figure>
<figure><img src="boat-look/fallC.jpg"><figcaption><b>C · 물살 둔덕 + 깃발 줄</b>물이 불룩 솟은 둔덕과 흰 물마루, 위에 알록달록 깃발 줄 "여기서 뛰어요!"</figcaption></figure>
</div>
<h2>노 젓기 (캐릭터가 직접)</h2>
<div class="row">
<figure><img src="boat-look/rowA.jpg"><figcaption><b>A · 노 두 개</b>양손에 노 하나씩. 손이 노 손잡이를 잡고 앞뒤로 저어요.</figcaption></figure>
<figure><img src="boat-look/rowB.jpg"><figcaption><b>B · 카약 양날 노</b>긴 노 하나를 두 손으로 쥐고 좌우로 번갈아 담가요. 몸도 같이 비틀어요.</figcaption></figure>
<figure><img src="boat-look/rowC.jpg"><figcaption><b>C · 물레바퀴 배</b>손잡이를 돌리면 양옆 물레바퀴가 빙글빙글. 스퍼트 때 더 빨리 돌아요.</figcaption></figure>
</div>
</main></body></html>
