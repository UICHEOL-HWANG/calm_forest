<!doctype html>

<style>
  html,body{margin:0;height:100%;background:#cfe4ee;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#3a4a3a;overflow:hidden}
  canvas{display:block}
  #ui{position:fixed;left:0;right:0;bottom:0;padding:8px 12px 12px;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);border-top:1px solid #cfdccf;font-size:13px}
  #ui .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:5px 0}
  button{font:inherit;padding:5px 10px;border-radius:8px;border:1px solid #b8c8b8;background:#fff;cursor:pointer}

  .tab button{font-weight:600;padding:6px 14px}
  label{display:flex;gap:5px;align-items:center;white-space:nowrap}

  .tag{position:absolute;transform:translate(-50%,0);text-align:center;font-size:12px;font-weight:600;
       background:rgba(255,255,255,.85);padding:3px 9px;border-radius:7px;white-space:nowrap;line-height:1.35}
  .tag small{display:block;font-weight:400;opacity:.7;font-size:10.5px}
  .tag.side{transform:translate(-100%,-50%)}
  #hud{position:fixed;top:10px;right:12px;background:rgba(255,255,255,.88);padding:8px 12px;border-radius:9px;font-size:12px;line-height:1.6;max-width:280px;cursor:pointer}
  #hud.min{opacity:.15}
  @media (max-width:700px){ .tag{font-size:10.5px;padding:2px 6px} .tag small{display:none} #hud{max-width:190px;font-size:11px} }

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { buildAnimalHead, plushMat } from '../js/animal-faces.js';

// =============================================================
//  💎 프리미엄 도구 스킨 + ☂️ 날씨 반응 우산 시안 (2026-10-02)
//  ------------------------------------------------------------
//  · 테마 3개를 도구·우산이 공유한다 — A 🍄버섯 숲 · B 🌙달밤 · C 🌸꽃정원 (세트로 팔 수 있게).
//  · 도구 스킨은 **모양만** 바뀐다. 성능·휘두르는 모션은 그대로(스윙 모션 변경 금지 규칙).
//  · '기본' 줄은 js/game.js toolMesh() 0단계를 그대로 옮긴 비교 기준이다.
//  · 테마는 부속을 꽂지 않고 **날·통 자체의 형태**로 만든다(visitor-art-lessons):
//      버섯=날이 반쪽 갓 · 달밤=날이 초승달 · 꽃=날이 꽃잎.
//  · 블룸 임계 0.85 — 넓은 면 색은 그 아래, 발광은 작은 별·테두리만.
//  · 우산: 비 오면 살이 펴지며 머리 위로, 맑으면 접혀서 어깨에 멘다. 빗방울은 갓에 튕긴다.
// =============================================================

const glowMats = [];
const clay = (color, o = {}) => {
  const m = new THREE.MeshStandardMaterial({ color, roughness: 0.95, metalness: 0, flatShading: !o.smooth, side: o.side ?? THREE.FrontSide });
  if (o.glow) { m.emissive = new THREE.Color(o.glow); glowMats.push({ m, k: o.k ?? 0.8 }); }
  if (o.lift) { m.emissive = new THREE.Color(color); m.emissiveIntensity = o.lift; }   // 우산 안쪽 — 아래서 받는 빛이 약해 회색으로 죽는 것 띄우기
  return m;
};
const M = (geo, mat, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); return m; };
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t * t * (3 - 2 * t);

// ── 2D 윤곽 ───────────────────────────────────────────────
function starShape(r, k = 0.46, n = 5) {
  const s = new THREE.Shape();
  for (let i = 0; i < n * 2; i++) {
    const a = Math.PI / 2 + i * Math.PI / n, rr = i % 2 ? r * k : r;
    i ? s.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : s.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  s.closePath(); return s;
}
function petalShape(w, h) {   // 밑동(0,0) → 끝(0,h)
  const s = new THREE.Shape();
  s.moveTo(0, 0); s.bezierCurveTo(w * 1.1, h * 0.22, w * 0.95, h * 0.8, 0, h); s.bezierCurveTo(-w * 0.95, h * 0.8, -w * 1.1, h * 0.22, 0, 0);
  return s;
}
function crescentShape(R = 0.13, cx = -0.08, deg = 84) {   // 볼록면 +x, 뿔은 -x 쪽
  const s = new THREE.Shape(), a0 = deg * Math.PI / 180;
  const ex = R * Math.cos(a0), ey = R * Math.sin(a0);
  const r2 = Math.hypot(ex - cx, ey), ti = Math.atan2(ey, ex - cx);
  for (let i = 0; i <= 16; i++) { const a = -a0 + 2 * a0 * i / 16; i ? s.lineTo(R * Math.cos(a), R * Math.sin(a)) : s.moveTo(R * Math.cos(a), R * Math.sin(a)); }
  for (let i = 0; i <= 16; i++) { const a = ti - 2 * ti * i / 16; s.lineTo(cx + r2 * Math.cos(a), r2 * Math.sin(a)); }
  s.closePath(); return s;
}
function roundBlade(bw, bh) {   // game.js 삽날과 같은 윤곽
  const sh = new THREE.Shape();
  sh.moveTo(-bw, 0); sh.lineTo(-bw, bh); sh.absarc(0, bh, bw, Math.PI, 0, true); sh.lineTo(bw, 0); sh.closePath();
  return sh;
}
const ext = (shape, depth, bev = 0.01, seg = 12) => {
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: bev > 0, bevelThickness: bev, bevelSize: bev, bevelSegments: 2, curveSegments: seg });
  g.translate(0, 0, -depth / 2); return g;
};

// 면에 붙는 점(버섯 흰 점) — 법선 방향으로 납작
function dot(parent, mat, x, y, z, r, normal = new THREE.Vector3(0, 0, 1)) {
  const d = M(new THREE.SphereGeometry(r, 10, 6), mat, x, y, z);
  d.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal.clone().normalize());
  d.scale.set(1, 1, 0.32); parent.add(d); return d;
}

// ── 팔레트 ─────────────────────────────────────────────────
const BASE = { wood: 0x8a5a3a, grip: 0x5f3d26, metal: 0x6d757c, edge: 0xd9dfe4, can: 0x8fd0ea, pole: 0x7a4a2a };
const SH = { stem: 0xeee2c8, stemD: 0xcdb894, cap: 0xd1473a, spot: 0xfff5e6, gill: 0xe6cfa6, birch: 0x5b4636, door: 0x8a5a3a };
const MN = { navy: 0x343a6e, navyD: 0x252a52, silver: 0xc2c7e4, gold: 0xf0cf63, lilac: 0x7b84c8 };
const BL = { stem: 0x79a85a, vine: 0x4e7d3b, leaf: 0x8fc46c, pink: 0xf09bb0, pinkL: 0xf6c6d2, center: 0xf2c64b };

// 자루: 테이퍼 + 그립 밴드 + 끝 혹 (game.js handle 과 같은 조형). 반환: 꼭대기 y
function handle(g, P, l, r = 0.030) {
  g.add(M(new THREE.CylinderGeometry(r * 0.8, r, l, 7), clay(P.wood), 0, l / 2 - 0.08, 0));
  g.add(M(new THREE.CylinderGeometry(r * 1.18, r * 1.18, 0.07, 7), clay(P.grip), 0, -0.02, 0));
  g.add(M(new THREE.SphereGeometry(r * 1.35, 7, 6), P.knobMat ?? clay(P.knob ?? P.grip), 0, -0.08, 0));
  return l - 0.08;
}
// 꽃 자루 — 덩굴이 감아 오르고 잎 두 장
function vineHandle(g, l, r = 0.031) {
  const top = handle(g, { wood: BL.stem, grip: BL.vine, knob: BL.pink }, l, r);
  const pts = [];
  for (let i = 0; i <= 40; i++) { const t = i / 40, a = t * Math.PI * 2 * 2.2; pts.push(new THREE.Vector3(Math.cos(a) * r * 1.02, 0.02 + t * l * 0.62, Math.sin(a) * r * 1.02)); }
  g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 60, 0.0075, 5), clay(BL.vine)));
  [[0.22, 0.6], [0.40, -2.3]].forEach(([f, ay]) => {
    const lf = new THREE.Mesh(ext(petalShape(0.026, 0.075), 0.006, 0.003), clay(BL.leaf));
    lf.position.set(0, l * f, 0); lf.rotation.set(0, ay, -1.0); lf.translateY(0.02); g.add(lf);
  });
  return top;
}
function flower(parent, x, y, z, r, petalMat = clay(BL.pink)) {
  const f = new THREE.Group(); f.position.set(x, y, z); parent.add(f);
  const geo = ext(petalShape(r * 0.42, r), 0.008, 0.004);
  for (let i = 0; i < 5; i++) { const p = new THREE.Mesh(geo, petalMat); p.rotation.z = i * Math.PI * 2 / 5; f.add(p); }
  f.add(M(new THREE.SphereGeometry(r * 0.3, 8, 6), clay(BL.center), 0, 0, 0.01));
  return f;
}

// ── 도구 조형: BUILD[skin][tool](g) → 효과 기준점(로컬) ─────────────
const TOOLS = [
  { id: 'axe', name: '🪓 도끼' }, { id: 'shovel', name: '🪏 삽' }, { id: 'water', name: '💧 물조리개' }, { id: 'rod', name: '🎣 낚싯대' },
  { id: 'hoe', name: '⛏️ 괭이' }, { id: 'sickle', name: '🌾 낫' }, { id: 'hammer', name: '🔨 망치' }, { id: 'net', name: '🦋 포충망' }, { id: 'seed', name: '🌱 씨앗' },
];
// 낚싯대 공용 뼈대(0단계 game.js 수치) — 장대·찌만 테마별로 갈아 끼운다
function rodFrame(g, { knob, rear, pole, line = 0xe8e4d8 }, bob) {
  g.add(M(new THREE.SphereGeometry(0.040, 7, 6), knob, 0, -0.09, 0));
  g.add(M(new THREE.CylinderGeometry(0.026, 0.030, 0.20, 7), rear, 0, -0.01, 0));
  const poleG = new THREE.Group(); poleG.position.y = 0.08; poleG.rotation.z = -0.12; g.add(poleG);
  const RL = 0.92;
  pole(poleG, RL);
  const lineG = new THREE.Group(); lineG.position.y = RL; lineG.rotation.z = 0.12; poleG.add(lineG);
  lineG.add(M(new THREE.CylinderGeometry(0.006, 0.006, 0.34, 5), clay(line), 0, -0.17, 0));
  const b = new THREE.Group(); b.position.y = -0.38; lineG.add(b); bob(b);
  g.scale.setScalar(1.25);
  return new THREE.Vector3(0.1, 0.95, 0);
}

const BUILD = {
  base: {
    axe(g) {
      const top = handle(g, BASE, 0.52);
      g.add(M(new THREE.BoxGeometry(0.17, 0.13, 0.06), clay(BASE.metal), 0.075, top - 0.05, 0));
      const bl = M(new THREE.BoxGeometry(0.07, 0.155, 0.028), clay(BASE.edge), 0.175, top - 0.05, 0); bl.rotation.z = 0.06; g.add(bl);
      g.add(M(new THREE.BoxGeometry(0.05, 0.09, 0.07), clay(BASE.metal), -0.035, top - 0.05, 0));
      g.scale.setScalar(1.18); return new THREE.Vector3(0.1, top, 0);
    },
    shovel(g) {
      const top = handle(g, BASE, 0.58);
      g.add(M(new THREE.CylinderGeometry(0.034, 0.042, 0.07, 7), clay(BASE.metal), 0, top + 0.01, 0));
      g.add(M(ext(roundBlade(0.105, 0.13), 0.03, 0.012, 14), clay(BASE.metal, { smooth: true }), 0, top + 0.03, 0));
      g.scale.setScalar(1.18); return new THREE.Vector3(0, top + 0.2, 0);
    },
    water(g) {
      g.add(M(new THREE.CylinderGeometry(0.11, 0.12, 0.2, 10), clay(BASE.can), 0, 0.18, 0));
      const sp = M(new THREE.CylinderGeometry(0.02, 0.035, 0.22, 6), clay(BASE.can), 0.15, 0.26, 0); sp.rotation.z = -0.9; g.add(sp);
      g.scale.setScalar(1.25); return new THREE.Vector3(0.1, 0.32, 0);
    },
    rod(g) {
      return rodFrame(g, { knob: clay(BASE.grip), rear: clay(BASE.grip), pole: (p, L) => p.add(M(new THREE.CylinderGeometry(0.013, 0.026, L, 6), clay(BASE.pole), 0, L / 2, 0)) },
        b => { const s = M(new THREE.SphereGeometry(0.042, 8, 7), clay(0xd94f4f)); s.scale.set(1, 1.25, 1); b.add(s); b.add(M(new THREE.CylinderGeometry(0.040, 0.040, 0.022, 9), clay(0xf4efe6))); });
    },
  },

  // 🍄 A 버섯 숲 — 날이 '반쪽 갓'. 크림 줄기 자루 + 빨간 갓 + 흰 점(면당 3개까지만 — 촘촘하면 환공포)
  shroom: {
    axe(g) {
      const top = handle(g, { wood: SH.stem, grip: SH.stemD, knob: SH.cap }, 0.52, 0.032);
      g.add(M(new THREE.BoxGeometry(0.06, 0.12, 0.07), clay(SH.stemD), 0.0, top - 0.05, 0));
      const s = new THREE.Shape(), R = 0.12; s.moveTo(0, -R); s.absarc(0, 0, R, -Math.PI / 2, Math.PI / 2, false); s.closePath();
      g.add(M(ext(s, 0.05, 0.022, 16), clay(SH.cap, { smooth: true }), 0.035, top - 0.05, 0));
      g.add(M(new THREE.BoxGeometry(0.022, 0.25, 0.075), clay(SH.gill), 0.035, top - 0.05, 0));   // 갓 밑면(주름)
      const sp = clay(SH.spot);
      [[0.075, 0.045, 0.024], [0.055, -0.055, 0.019], [0.115, -0.005, 0.015]].forEach(([x, y, r]) => [-1, 1].forEach(sz =>
        dot(g, sp, 0.035 + x, top - 0.05 + y, sz * 0.048, r, new THREE.Vector3(0, 0, sz))));
      g.scale.setScalar(1.18); return new THREE.Vector3(0.12, top, 0);
    },
    shovel(g) {
      const top = handle(g, { wood: SH.stem, grip: SH.stemD, knob: SH.cap }, 0.58, 0.032);
      g.add(M(new THREE.CylinderGeometry(0.036, 0.044, 0.07, 8), clay(SH.stemD), 0, top + 0.01, 0));
      g.add(M(ext(roundBlade(0.105, 0.13), 0.035, 0.014, 14), clay(SH.cap, { smooth: true }), 0, top + 0.03, 0));
      const sp = clay(SH.spot);
      [[-0.045, 0.08, 0.022], [0.042, 0.14, 0.026], [-0.012, 0.205, 0.016]].forEach(([x, y, r]) => [-1, 1].forEach(sz =>
        dot(g, sp, sz * x, top + 0.03 + y, sz * 0.033, r, new THREE.Vector3(0, 0, sz))));
      // 목에 돋은 꼬마 버섯 하나 — 세트 표식
      const mini = new THREE.Group(); mini.position.set(0.045, top - 0.02, 0.01); mini.rotation.z = -0.5; g.add(mini);
      mini.add(M(new THREE.CylinderGeometry(0.010, 0.013, 0.04, 6), clay(SH.stem), 0, 0.02, 0));
      const c = M(new THREE.SphereGeometry(0.03, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2), clay(SH.cap), 0, 0.035, 0); c.scale.y = 0.75; mini.add(c);
      g.scale.setScalar(1.18); return new THREE.Vector3(0, top + 0.2, 0);
    },
    water(g) {   // 버섯집 물조리개 — 갓 지붕 + 작은 문
      g.add(M(new THREE.CylinderGeometry(0.10, 0.118, 0.19, 12), clay(SH.stem), 0, 0.17, 0));
      g.add(M(new THREE.CylinderGeometry(0.122, 0.122, 0.02, 12), clay(SH.stemD), 0, 0.08, 0));
      const capR = 0.16;
      const cap = M(new THREE.SphereGeometry(capR, 14, 8, 0, Math.PI * 2, 0, Math.PI / 2), clay(SH.cap, { smooth: true }), 0, 0.262, 0); cap.scale.y = 0.72; g.add(cap);
      g.add(M(new THREE.CylinderGeometry(capR * 0.98, 0.10, 0.025, 14), clay(SH.gill), 0, 0.255, 0));
      const sp = clay(SH.spot);
      [[0.55, 2.2, 0.026], [0.95, 1.2, 0.022], [0.85, 3.4, 0.024], [0.3, 4.6, 0.018]].forEach(([th, ph, r]) => {
        const n = new THREE.Vector3(Math.sin(th) * Math.cos(ph), Math.cos(th) / 0.72, Math.sin(th) * Math.sin(ph));
        dot(g, sp, Math.sin(th) * Math.cos(ph) * capR, 0.262 + Math.cos(th) * capR * 0.72, Math.sin(th) * Math.sin(ph) * capR, r, n);
      });
      const door = new THREE.Shape(); door.moveTo(-0.03, 0); door.lineTo(-0.03, 0.05); door.absarc(0, 0.05, 0.03, Math.PI, 0, true); door.lineTo(0.03, 0); door.closePath();
      g.add(M(ext(door, 0.012, 0.003), clay(SH.door), 0, 0.09, 0.104));
      g.add(M(new THREE.SphereGeometry(0.006, 6, 4), clay(0xf2c64b), 0.015, 0.12, 0.113));   // 문고리
      const spt = M(new THREE.CylinderGeometry(0.02, 0.034, 0.22, 8), clay(SH.stem), 0.15, 0.22, 0); spt.rotation.z = -0.9; g.add(spt);
      const rose = M(new THREE.SphereGeometry(0.042, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2), clay(SH.cap), 0.24, 0.29, 0); rose.rotation.z = -0.9; rose.scale.y = 0.7; g.add(rose);
      g.scale.setScalar(1.25); return new THREE.Vector3(0, 0.36, 0);
    },
    rod(g) {
      return rodFrame(g, { knob: clay(SH.cap), rear: clay(SH.stemD), pole: (p, L) => {
        p.add(M(new THREE.CylinderGeometry(0.014, 0.027, L, 7), clay(SH.stem), 0, L / 2, 0));
        [0.22, 0.47, 0.7].forEach(f => p.add(M(new THREE.CylinderGeometry(0.024 - f * 0.011, 0.024 - f * 0.011, 0.014, 7), clay(SH.birch), 0, L * f, 0)));
      } }, b => {
        b.add(M(new THREE.CylinderGeometry(0.022, 0.028, 0.07, 8), clay(SH.stem), 0, -0.03, 0));
        const c = M(new THREE.SphereGeometry(0.07, 12, 6, 0, Math.PI * 2, 0, Math.PI / 2), clay(SH.cap, { smooth: true }), 0, 0.0, 0); c.scale.y = 0.8; b.add(c);
        b.add(M(new THREE.CylinderGeometry(0.068, 0.03, 0.012, 12), clay(SH.gill), 0, -0.004, 0));
        dot(b, clay(SH.spot), 0, 0.056, 0.0, 0.018, new THREE.Vector3(0, 1, 0));
        dot(b, clay(SH.spot), 0.0, 0.03, 0.058, 0.014, new THREE.Vector3(0, 0.6, 1));
      });
    },
  },

  // 🌙 B 달밤 — 날이 '초승달'. 남색 자루 + 은빛 + 금별(밤에만 은은히)
  moon: {
    axe(g) {
      const top = handle(g, { wood: MN.navy, grip: MN.navyD, knobMat: clay(MN.gold, { glow: MN.gold, k: 0.6 }) }, 0.52);
      g.add(M(new THREE.BoxGeometry(0.06, 0.12, 0.072), clay(MN.navyD), 0, top - 0.05, 0));
      const cr = M(ext(crescentShape(0.135, -0.08, 86), 0.034, 0.01, 18), clay(MN.silver, { glow: MN.lilac, k: 0.35 }), 0.135, top - 0.05, 0);
      cr.rotation.z = Math.PI; g.add(cr);   // 볼록면이 자루에 붙고 뿔이 바깥으로
      g.add(M(ext(starShape(0.03), 0.014, 0.005), clay(MN.gold, { glow: MN.gold, k: 0.9 }), 0.088, top - 0.05, 0));

function scallopBlade(bw, bh, depth = 0.3) {   // 둥근 날 끝에 작은 홈 두 개 → 꽃잎 세 장
  const sh = new THREE.Shape();
  sh.moveTo(-bw, 0); sh.lineTo(-bw, bh);
  const notch = a => Math.exp(-(((a - Math.PI / 3) / 0.09) ** 2)) + Math.exp(-(((a - 2 * Math.PI / 3) / 0.09) ** 2));
  for (let i = 0; i <= 64; i++) {
    const a = Math.PI - Math.PI * i / 64, rr = bw * (1 - depth * notch(a));
    sh.lineTo(Math.cos(a) * rr, bh + Math.sin(a) * rr);
  }
  sh.lineTo(bw, 0); sh.closePath(); return sh;
}
function calyx(g, y) {   // 목을 받친 꽃받침 5장
  for (let i = 0; i < 5; i++) {
    const a = i * Math.PI * 2 / 5, s = M(new THREE.ConeGeometry(0.022, 0.075, 4), clay(BL.leaf), Math.cos(a) * 0.032, y, Math.sin(a) * 0.032);
    s.rotation.set(Math.sin(a) * 0.55, 0, -Math.cos(a) * 0.55); g.add(s);
  }
}

function pickArms(hd, segMat, tipMat) {
  [-1, 1].forEach(sx => {
    const TH = [0.14, 0.32], LEN = [0.13, 0.12];
    let px = sx * 0.042, py = 0.012;
    for (let i = 0; i < 2; i++) {
      const dx = Math.cos(TH[i]) * sx, dy = -Math.sin(TH[i]);
      const seg = M(new THREE.BoxGeometry(LEN[i], 0.048 - i * 0.012, 0.05 - i * 0.012), segMat, px + dx * LEN[i] / 2, py + dy * LEN[i] / 2, 0);
      seg.rotation.z = -sx * TH[i]; hd.add(seg);
      px += dx * LEN[i]; py += dy * LEN[i];
    }
    const t3 = 0.48, dx = Math.cos(t3) * sx, dy = -Math.sin(t3);
    const tip = M(new THREE.ConeGeometry(0.020, 0.085, 6), tipMat, px + dx * 0.042, py + dy * 0.042, 0);
    tip.rotation.z = -sx * (Math.PI / 2 + t3); hd.add(tip);
  });
}
// 낫 날(조금씩 더 휘는 3마디) — game.js sickle 과 같은 뼈대
function sickleBlade(g, top, segMat, edgeMat, wk = 1, deco) {
  const bl = new THREE.Group(); bl.position.y = top + 0.01; bl.rotation.y = 0.10; g.add(bl);
  const TH = [0.06, 0.28, 0.60], LEN = [0.15, 0.12, 0.10], W = [0.055 * wk, 0.045 * wk, 0.030 * wk];
  let px = 0, py = 0;
  for (let i = 0; i < 3; i++) {
    const dx = Math.sin(TH[i]), dy = Math.cos(TH[i]);
    const seg = M(new THREE.BoxGeometry(W[i], LEN[i], 0.016), segMat, px + dx * LEN[i] / 2, py + dy * LEN[i] / 2, 0); seg.rotation.z = -TH[i]; bl.add(seg);
    const edge = M(new THREE.BoxGeometry(0.013, LEN[i] * 0.94, 0.012), edgeMat, px + dx * LEN[i] / 2 + dy * (W[i] / 2), py + dy * LEN[i] / 2 - dx * (W[i] / 2), 0); edge.rotation.z = -TH[i]; bl.add(edge);
    deco?.(bl, i, px + dx * LEN[i] / 2, py + dy * LEN[i] / 2);
    px += dx * LEN[i]; py += dy * LEN[i];
  }
  return bl;
}
// 초승달 가운데 두께의 중심(볼록면 R 과 안쪽 호 사이) — 소켓에 걸칠 위치를 잡는다
function crescentMid(R, cx, deg) {
  const a0 = deg * Math.PI / 180, ex = R * Math.cos(a0), ey = R * Math.sin(a0);
  return (R + cx + Math.hypot(ex - cx, ey)) / 2;
}
// 반구 갓 위의 흰 점(타원 갓 배율 sc 반영)
function capDots(parent, cy, r, sc, list) {
  list.forEach(([th, ph, rr]) => {
    const x = Math.sin(th) * Math.cos(ph) * r * sc[0], y = Math.cos(th) * r * sc[1], z = Math.sin(th) * Math.sin(ph) * r * sc[2];
    dot(parent, clay(SH.spot), x, cy + y, z, rr, new THREE.Vector3(x / sc[0] ** 2, y / sc[1] ** 2, z / sc[2] ** 2));
  });
}

function taperedTube(pts, radiusFn, segs = 24, radial = 8) {
  const curve = new THREE.CatmullRomCurve3(pts);
  const frames = curve.computeFrenetFrames(segs, false);
  const pos = [], idx = [];
  for (let i = 0; i <= segs; i++) {
    const P = curve.getPointAt(i / segs), N = frames.normals[i], B = frames.binormals[i], r = radiusFn(i / segs);
    for (let j = 0; j < radial; j++) { const A = j / radial * Math.PI * 2, ca = Math.cos(A), sa = Math.sin(A); pos.push(P.x + (N.x * ca + B.x * sa) * r, P.y + (N.y * ca + B.y * sa) * r, P.z + (N.z * ca + B.z * sa) * r); }
  }
  for (let i = 0; i < segs; i++) for (let j = 0; j < radial; j++) { const a = i * radial + j, b = i * radial + (j + 1) % radial, c = (i + 1) * radial + j, d = (i + 1) * radial + (j + 1) % radial; idx.push(a, c, b, b, c, d); }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.setIndex(idx); geo.computeVertexNormals();
  return { geo, end: curve.getPointAt(1) };
}

// ── ☂️ 우산: 살(gore) N장이 꼭짓점 경첩에 달려 접히고 펴진다 ──
function goreGeo(R, thMax, halfW, shape) {
  const W = 8, H = 9, pos = [], idx = [];
  for (let j = 0; j <= H; j++) {
    const v = j / H;
    for (let i = 0; i <= W; i++) {
      const u = i / W * 2 - 1, phi = u * halfW * shape.w(v), th = thMax * v * (1 + shape.tip * (1 - u * u));
      pos.push(-Math.cos(phi) * Math.sin(th) * R, (Math.cos(th) - 1) * R, Math.sin(phi) * Math.sin(th) * R);
    }
  }
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) { const a = j * (W + 1) + i, b = a + 1, c = a + W + 1, d = c + 1; idx.push(a, c, b, b, c, d); }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.setIndex(idx); geo.computeVertexNormals();
  return geo;
}
// 살 위의 점(경첩 기준) + 바깥 법선
function surf(R, th, phi) {
  const p = new THREE.Vector3(-Math.cos(phi) * Math.sin(th) * R, (Math.cos(th) - 1) * R, Math.sin(phi) * Math.sin(th) * R);
  return { p, n: p.clone().add(new THREE.Vector3(0, R, 0)).normalize() };
}

const fx = (() => {
  const live = [];
  const geos = {
    spore: new THREE.SphereGeometry(0.014, 6, 4),
    twinkle: new THREE.OctahedronGeometry(0.022, 0),
    petal: new THREE.ShapeGeometry(petalShape(0.022, 0.05)),
    splash: new THREE.SphereGeometry(0.018, 5, 4),
    drip: new THREE.SphereGeometry(0.02, 6, 5),
  };
  const mats = {
    spore: new THREE.MeshBasicMaterial({ color: 0xf6eeb8, transparent: true }),
    twinkle: new THREE.MeshBasicMaterial({ color: 0xffe9a0, transparent: true }),
    petal: new THREE.MeshStandardMaterial({ color: BL.pink, side: THREE.DoubleSide, transparent: true, roughness: 1 }),
    splash: new THREE.MeshBasicMaterial({ color: 0xdcecf6, transparent: true }),
    drip: new THREE.MeshBasicMaterial({ color: 0xcfe4f2, transparent: true, opacity: 0.85 }),
  };
  return {
    spawn(type, p) {
      if (live.length > 260) return;
      const m = new THREE.Mesh(geos[type], mats[type].clone()); m.position.copy(p); scene.add(m);
      const v = new THREE.Vector3();
      let life = 1.6;
      if (type === 'spore') { v.set((Math.random() - 0.5) * 0.12, 0.18 + Math.random() * 0.12, (Math.random() - 0.5) * 0.12); life = 2.2; }
      if (type === 'twinkle') { m.position.add(new THREE.Vector3((Math.random() - 0.5) * 0.35, (Math.random() - 0.3) * 0.3, (Math.random() - 0.5) * 0.2)); life = 1.0; }
      if (type === 'petal') { v.set((Math.random() - 0.5) * 0.3, -0.15, (Math.random() - 0.5) * 0.3); life = 2.6; m.rotation.set(Math.random() * 6, Math.random() * 6, 0); }
      if (type === 'splash') { const a = Math.random() * 6.28, s = 0.4 + Math.random() * 0.5; v.set(Math.cos(a) * s, 0.9 + Math.random() * 0.7, Math.sin(a) * s); life = 0.32; }
      if (type === 'drip') { v.set(0, -0.2, 0); life = 1.4; }
      live.push({ m, v, life, max: life, type, seed: Math.random() * 10 });
    },
    update(dt, t) {
      for (let i = live.length - 1; i >= 0; i--) {
        const p = live[i]; p.life -= dt;
        if (p.life <= 0 || p.m.position.y < -1.5 || (p.type === 'drip' && p.m.position.y < 0.02)) {
          if (p.type === 'drip' && p.m.position.y < 0.05) for (let k = 0; k < 3; k++) this.spawn('splash', p.m.position.clone().setY(0.02));
          scene.remove(p.m); p.m.material.dispose(); live.splice(i, 1); continue;
        }
        const f = p.life / p.max;
        if (p.type === 'spore') { p.m.position.addScaledVector(p.v, dt); p.m.position.x += Math.sin(t * 2 + p.seed) * 0.002; p.m.material.opacity = Math.min(1, f * 2) * 0.9; }
        if (p.type === 'twinkle') { const s = Math.sin(Math.PI * (1 - f)); p.m.scale.setScalar(0.2 + s); p.m.rotation.y += dt * 3; p.m.material.opacity = s * (state.night ? 1 : 0.55); }
        if (p.type === 'petal') { p.m.position.addScaledVector(p.v, dt); p.m.position.x += Math.sin(t * 2.4 + p.seed) * 0.004; p.m.rotation.x += dt * 2; p.m.rotation.z += dt * 1.3; p.m.material.opacity = Math.min(1, f * 3); }
        if (p.type === 'splash') { p.v.y -= 6 * dt; p.m.position.addScaledVector(p.v, dt); p.m.material.opacity = f * 2; }
        if (p.type === 'drip') { p.v.y -= 9 * dt; p.m.position.addScaledVector(p.v, dt); }
      }
    },
    clear() { live.forEach(p => scene.remove(p.m)); live.length = 0; },
  };
})();

const resetDrop = (d, top = false) => { d.x = (Math.random() - 0.5) * 9; d.z = (Math.random() - 0.5) * 5; d.y = top ? 5 + Math.random() : Math.random() * 6; };

function updateRain(dt) {
  const on = state.tab === 'umb' && state.rain;
  rain.visible = on; if (!on) return;
  const caps = umbs.filter(o => o.u.userData.open > 0.85).map(o => { o.u.userData.canopy.getWorldPosition(_a); return { x: _a.x, y: _a.y, z: _a.z, r: o.u.userData.R, d: o.u.userData.depth }; });
  drops.forEach((d, i) => {

    for (const c of caps) {

    rainPos.set([d.x, d.y, d.z, d.x + 0.03, d.y + 0.22, d.z], i * 6);
  });
  rainGeo.attributes.position.needsUpdate = true;
}

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
function syncUI() {
  $$('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
  $$('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === state.mode));
  $$('[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === state.tool));
  $$('[data-wx]').forEach(b => b.classList.toggle('on', (b.dataset.wx === 'rain') === state.rain));
  $$('[data-animal]').forEach(b => b.classList.toggle('on', b.dataset.animal === state.animal));
  $('#gameCam').classList.toggle('on', gameCam);
  $('#toolRow').classList.toggle('hide', state.tab !== 'tool');
  $('#umbRow').classList.toggle('hide', state.tab !== 'umb');
  $('#toolPick').classList.toggle('hide', state.mode === 'grid' || state.mode === 'flower');
  $('#night').checked = state.night;
}
function rebuild() { (state.tab === 'tool' ? buildToolScene : buildUmbScene)(); applyLight(); setHud(); syncUI(); }
$('#toolPick').innerHTML = TOOLS.map(t => `<button data-tool="${t.id}">${t.name}</button>`).join('');
$('#animals').innerHTML = ANIMALS.map(a => `<button data-animal="${a.id}">${a.ico}</button>`).join('');
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tab) { state.tab = b.dataset.tab; rebuild(); }
  else if (b.dataset.mode) { state.mode = b.dataset.mode; rebuild(); }
  else if (b.dataset.tool) { state.tool = b.dataset.tool; rebuild(); }
  else if (b.dataset.animal) { state.animal = b.dataset.animal; rebuild(); }
  else if (b.dataset.wx) { state.rain = b.dataset.wx === 'rain'; applyLight(); syncUI(); }
  else if (b.id === 'gameCam') { gameCam = !gameCam; rebuild(); }
});
$('#night').onchange = e => { state.night = e.target.checked; applyLight(); };
$('#spin').onchange = e => { state.spin = e.target.checked; };

// ── 루프 ───────────────────────────────────────────────────
// 캔버스는 아래 조작판 위까지만 — 라벨·물체가 판 뒤로 숨지 않게
const viewH = () => Math.max(200, innerHeight - document.getElementById('ui').offsetHeight);
function resize() { renderer.setSize(innerWidth, viewH()); camera.aspect = innerWidth / viewH(); camera.updateProjectionMatrix(); }
addEventListener('resize', () => { resize(); rebuild(); });
resize(); rebuild();

const clock = new THREE.Clock(); const acc = {};
const _p = new THREE.Vector3();
function step(dt, t) {
  items.forEach((it, i) => {
    if (it.spin && state.spin) it.holder.rotation.y = 0.3 + Math.sin(t * 0.5 + i * 0.4) * 0.9;
    if (!it.fx) return;
    acc[i] = (acc[i] ?? Math.random()) + dt * FX_RATE[it.fx];
    if (acc[i] >= 1) { acc[i] -= 1; it.obj.localToWorld(_p.copy(it.anchor)); fx.spawn(it.fx, _p); }
  });
  umbs.forEach((o, i) => {
    const ud = o.u.userData, target = state.rain ? 1 : 0;
    const t1 = THREE.MathUtils.clamp(ud.open + Math.sign(target - ud.open) * dt * 1.6, 0, 1);
    if (t1 !== ud.open) ud.setOpen(t1);
    poseUmb(o, t, i);
    o.ch.position.y = Math.abs(Math.sin(t * 2 + i)) * 0.015;
    if (state.rain && ud.open > 0.95 && Math.random() < dt * 2.2) {   // 살 끝 물방울
      const tip = ud.tips[(Math.random() * ud.tips.length) | 0];
      fx.spawn('drip', tip.h.localToWorld(_p.copy(tip.p)));
    }
  });
  updateRain(dt);
  fx.update(dt, t);
}
function render() {
  controls.update();
  renderer.render(scene, camera);
  labels.forEach(l => {
    l.obj.getWorldPosition(_p); _p.add(l.off).project(camera);
    l.el.style.left = (_p.x + 1) / 2 * innerWidth + 'px'; l.el.style.top = (1 - _p.y) / 2 * viewH() + 'px';
    l.el.style.display = _p.z < 1 ? '' : 'none';
  });
}
let simT = 0;
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, clock.getDelta()); simT += dt;
  step(dt, simT); render();
}
loop();
// 검증 훅 — 가려진 패널에서 rAF 가 안 돌아도 고정 스텝으로 진행시켜 찍는다(game-capture-pitfall)
window.__sim = { state, rebuild, advance(sec) { for (let s = 0; s < sec; s += 1 / 60) { simT += 1 / 60; step(1 / 60, simT); } render(); } };
</script>
