function buildItem(sp) {

  if (sp.kind === 'shell') {
    const geo = new THREE.SphereGeometry(sp.s, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2);

  if (!firstDig) { firstDig = true; document.getElementById('hint').style.opacity = 0; }
}

const keys = new Set();
addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); press(); return; }
  keys.add(e.code);
});
addEventListener('keyup', e => keys.delete(e.code));
const btn = document.getElementById('btn');
btn.addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); press(); });
const ray = new THREE.Raycaster(), ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), ndc = new THREE.Vector2(), hit = new THREE.Vector3();
renderer.domElement.addEventListener('pointerdown', e => {
  if (over) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (!ray.ray.intersectPlane(ground, hit)) return;
  moveTarget = hit.clone(); pendingHole = null;
  let best = null, bd = .9;
  for (const h of holes) { if (h.state !== 'idle') continue; const d = Math.hypot(h.g.position.x - hit.x, h.g.position.z - hit.z); if (d < bd) { bd = d; best = h; } }
  if (best && V !== 'C') pendingHole = best;
});

const tideFill = document.getElementById('tideFill'), tideSec = document.getElementById('tideSec');
const cntEl = document.getElementById('cnt');
document.getElementById('tag').textContent = '갯벌 캐기 · ' + VNAME[V];
{
  const mk = (q, label, on) => { const u = new URLSearchParams(location.search); Object.entries(q).forEach(([k, v]) => v == null ? u.delete(k) : u.set(k, v)); return `<a href="?${u}" class="${on ? 'on' : ''}">${label}</a>`; };
  document.getElementById('cfg').innerHTML =
    '<div>캐기 방식</div>' + ['A', 'B', 'C'].map(k => mk({ v: k }, VNAME[k], k === V)).join('') +
    '<div>한 판 길이</div>' + [45, 60, 90].map(s => mk({ tide: s }, s + '초', s === TIDE)).join('') +
    '<div>결과창</div>' + [1, 2, 3].map(c => mk({ card: c }, CARD_NAMES[c], c === CARD)).join('') +
    '<div>' + mk({ auto: auto ? null : 1 }, '자동 플레이', auto) + '</div>';
}
function endRound() {
  over = true; moveTarget = null;
  setTimeout(() => showResult({
    design: CARD, mode: 'mudflat',
    title: '밀물이 들어왔어요', sub: count ? `바구니에 ${count}개를 담았어요` : '다음엔 꼭 담아 와요',
    items: SPECIES.filter(s => bag[s.id]).map(s => ({ ico: s.ico, name: s.name, count: bag[s.id], coin: s.coin, rare: !!s.rare })),
    stats: `${VNAME[V]} · 누른 횟수 ${presses} · 헛손질 ${misses}`,
    onAgain: () => { const u = new URLSearchParams(location.search); if (!Q.get('seed')) u.delete('seed'); location.search = u.toString(); },
  }), 900);
}

function trySpawn(front) {
  for (let k = 0; k < 12; k++) {
    const x = -11 + rnd() * 22, z = front + 1.5 + rnd() * (MUD_Z1 - 4 - front - 1.5);
    if (z > MUD_Z1 - 4) continue;
    if (holes.some(h => Math.hypot(h.g.position.x - x, h.g.position.z - z) < 1.6)) continue;
    if (Math.hypot(player.position.x - x, player.position.z - z) < 1.2) continue;
    return spawnHole(x, z);
  }
  return null;
}
for (let i = 0; i < 16; i++) trySpawn(FRONT0);

const camOff = new THREE.Vector3(), camLook = new THREE.Vector3(), camPos = new THREE.Vector3(), bpos = new THREE.Vector3();
let camK = 1, spawnT = 0, walkT = 0, splashT = 0;
function resize() {
  renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight;
  camK = camera.aspect < .8 ? 1.45 : camera.aspect < 1.2 ? 1.2 : 1; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const ease = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const lerp = (a, b, k) => a + (b - a) * k;
const mv = new THREE.Vector3();
function updateMove(front, dt) {
  mv.set(0, 0, 0);
  if (over || dig) return;
  if (keys.has('KeyW') || keys.has('ArrowUp')) mv.z -= 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) mv.z += 1;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) mv.x -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) mv.x += 1;
  if (mv.lengthSq()) { moveTarget = null; pendingHole = null; }
  if (auto && !moveTarget && !mv.lengthSq()) {
    const h = nearestHole(99);
    if (h) {
      const d = Math.hypot(h.g.position.x - player.position.x, h.g.position.z - player.position.z);
      if (d < REACH * .8) { face(h); if (V !== 'C' || breath(h) < .12) press(); }
      else mv.set(h.g.position.x - player.position.x, 0, h.g.position.z - player.position.z);
    }
  }
  if (moveTarget) {
    mv.set(moveTarget.x - player.position.x, 0, moveTarget.z - player.position.z);
    const stopD = pendingHole ? REACH * .7 : .15;
    if (mv.length() < stopD) { mv.set(0, 0, 0); moveTarget = null; if (pendingHole && pendingHole.state === 'idle') press(); pendingHole = null; }
  }
}
function updateBear(dt) {
  const R = bear.arms.R.pivot, L = bear.arms.L.pivot;
  bear.g.position.y = walkT ? Math.abs(Math.sin(walkT * 10)) * .05 : 0;
  L.rotation.x = walkT ? Math.sin(walkT * 10) * .45 : 0;
  if (dig) {
    dig.t += dt; const k = Math.min(1, dig.t / dig.dur);
    if (k < .5) { R.rotation.x = lerp(-.35, -2.6, ease(k / .5)); bear.g.rotation.x = lerp(0, -.08, k / .5); }
    else if (k < .62) { R.rotation.x = lerp(-2.6, -.25, (k - .5) / .12); bear.g.rotation.x = lerp(-.08, .32, (k - .5) / .12); }
    else { R.rotation.x = lerp(-.25, -.35, (k - .62) / .38); bear.g.rotation.x = lerp(.32, 0, (k - .62) / .38); }
    if (!dig.done && k >= .6) { dig.done = true; impact(dig); }
    if (k >= 1) dig = null;
  } else { R.rotation.x = walkT ? -.35 - Math.sin(walkT * 10) * .2 : -.35; bear.g.rotation.x = 0; }
}
function updateHoles(front, dt, near) {
  for (const h of [...holes]) {
    h.phase += dt / h.period;
    if (h.state === 'idle' && h.g.position.z < front + .2) { h.state = 'gone'; h.life = 0; }
    if (h.state !== 'idle') {
      h.life += dt; const k = Math.min(1, h.life / (h.state === 'done' ? 3 : .6));
      h.g.scale.setScalar(Math.max(.01, 1 - k)); h.ring.visible = false;
      if (k >= 1) removeHole(h);
      continue;
    }
    const b = breath(h);
    if (b < .3 && t - h.lastBub > .11) {
      h.lastBub = t;
      const m = new THREE.Mesh(bubbleGeo, new THREE.MeshStandardMaterial({ color: 0xf2f8ff, transparent: true, opacity: .85, roughness: .2 }));
      m.scale.setScalar(.05 + rnd() * .035 + h.depth * .012);
      m.position.set(h.g.position.x + (rnd() - .5) * h.r, .08, h.g.position.z + (rnd() - .5) * h.r); scene.add(m);
      h.bubbles.push({ m, life: 0 });
    }
    const showRing = V === 'C' && h === near;
    h.ring.visible = showRing;
    if (showRing) {
      const lead = b > .55 ? (1 - b) / .45 : b < .3 ? 0 : 1;
      h.ring.scale.setScalar(h.r * 1.9 + lead * 1.1);
      h.ring.material.color.set(b < .3 ? 0xb6ff9e : 0xffffff);
      h.ring.material.opacity = b >= .3 && b <= .55 ? .25 : .95;
    }
    h.rim.material = h === near ? rimHot : rimMat;
  }
  for (const h of holes) for (const bb of [...h.bubbles]) {
    bb.life += dt; bb.m.position.y += dt * .7; bb.m.material.opacity = .85 * (1 - bb.life / .7);
    if (bb.life > .7) { scene.remove(bb.m); h.bubbles.splice(h.bubbles.indexOf(bb), 1); }
  }
}
function updateFx(dt) {
  for (const p of [...parts]) {
    p.life -= dt; p.v.y -= 9 * dt; p.m.position.addScaledVector(p.v, dt);
    if (p.m.position.y < .05) { p.m.position.y = .05; p.v.set(0, 0, 0); }
    if (p.life <= 0) { scene.remove(p.m); parts.splice(parts.indexOf(p), 1); }
  }
  basket.getWorldPosition(bpos);
  for (const f of [...flying]) {
    f.t += dt; const m = f.m;
    if (f.t < .55) {
      const k = f.t / .55; m.position.set(f.from.x, .05 + Math.sin(k * Math.PI * .5) * 1.1, f.from.z); m.rotation.y += dt * 9;
      if (!f.popped && k > .6) { f.popped = true; pop(m.position.clone().add(new THREE.Vector3(0, .35, 0)), f.sp.rare ? `✨${f.sp.ico}+1` : `${f.sp.ico}+1`, !!f.sp.rare); }
    } else {
      const k = Math.min(1, (f.t - .55) / .35); m.position.lerpVectors(new THREE.Vector3(f.from.x, 1.15, f.from.z), bpos, ease(k)); m.scale.setScalar(1 - k * .6);
      if (k >= 1) {
        scene.remove(m); flying.splice(flying.indexOf(f), 1);
        bag[f.sp.id] = (bag[f.sp.id] || 0) + 1; count++; cntEl.textContent = count;
        basket.userData.heap.scale.set(1, Math.min(.75, .1 + count * .05), 1);
      }
    }
  }
}
function step(dt) {
  if (!over) t += dt;
  const front = frontAt(t);
  water.position.z = front - 30; foam.position.z = front + Math.sin(t * 2.2) * .12; foam.material.opacity = .55 + .25 * Math.sin(t * 3);
  if (!over && t >= TIDE) endRound();
  const left = Math.max(0, TIDE - t);
  tideFill.style.width = (left / TIDE * 100) + '%'; tideFill.classList.toggle('late', left < 15);
  tideSec.textContent = Math.ceil(left) + '초';

  updateMove(front, dt);
  const inWater = player.position.z < front + .6;
  if (mv.lengthSq()) {
    mv.normalize();
    player.position.addScaledVector(mv, (inWater ? 2.2 : 4.2) * dt);
    player.rotation.y = Math.atan2(mv.x, mv.z);
    walkT += dt;
  } else walkT = 0;
  player.position.x = THREE.MathUtils.clamp(player.position.x, -14, 14);
  player.position.z = THREE.MathUtils.clamp(player.position.z, front + .45, MUD_Z1 + 3);
  if (inWater && (splashT += dt) > .35) { splashT = 0; splash(player.position, 3, 0xdff2f8, 2.4); }
  updateBear(dt);

  const near = over ? null : nearestHole();
  updateHoles(front, dt, near);
  btn.classList.toggle('ready', !!near && !(V === 'C' && inWindow(near)));
  btn.classList.toggle('hot', !!near && V === 'C' && inWindow(near));
  btn.innerHTML = V === 'B' && near ? `파기<small>${near.dug}/${near.depth}</small>` : '캐기';

  if (!over && (spawnT += dt) > .9) {
    spawnT = 0;
    const active = holes.filter(h => h.state === 'idle').length;
    const target = 6 + Math.round(10 * THREE.MathUtils.clamp((MUD_Z1 - 4 - front) / (MUD_Z1 - 4 - FRONT0), 0, 1));
    if (active < target) trySpawn(front);
  }
  updateFx(dt);

  camOff.set(0, 6.4 * camK, 8.6 * camK);
  camPos.copy(player.position).add(camOff);
  camera.position.lerp(camPos, 1 - Math.pow(.001, dt));
  camLook.copy(player.position).add(new THREE.Vector3(0, .3, -4.2));
  camera.lookAt(camLook);
  key.position.copy(player.position).add(new THREE.Vector3(6, 12, 6)); key.target.position.copy(player.position);
}
const clock = new THREE.Clock();
function loop() { step(Math.min(.05, clock.getDelta())); renderer.render(scene, camera); requestAnimationFrame(loop); }
camera.position.copy(player.position).add(new THREE.Vector3(0, 6.4, 8.6));
window.__mud = { holes, get t() { return t; }, set t(v) { t = v; }, player, press, bag, step };
loop();
</script>
