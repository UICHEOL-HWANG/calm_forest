<script type="module">
import * as THREE from 'three';
// 🎭 머리는 게임과 **같은 소스**를 쓴다 — 그래야 모자가 진짜 귀·볏을 뚫는지 여기서 드러난다.
//    (animal-faces.js 는 THREE 만 의존하는 독립 모듈이라 시뮬이 그대로 import 할 수 있다.)
import { buildAnimalHead, plushMat } from '../js/animal-faces.js';

// =============================================================
//  🎀 꾸미기 슬롯 시안 — 머리 · 목 · 등 · 발자국
//  스펙: docs/superpowers/specs/2026-09-21-cosmetics-pet-design.md §3·§4
//  ------------------------------------------------------------
//  ▶ 이 시뮬의 목적은 "예쁜가"만이 아니다. 스펙 §3-3 의 함정 두 개를 **눈으로 잡는 것**이다:
//      ① 🐰토끼 귀 · 🐤병아리 볏이 머리 장식을 뚫는가
//      ② 🦊여우 꼬리(위로 솟는 bushy)가 등 장식과 겹치는가
//    그래서 "동물 호환" 보기에서 장식 하나를 7종에 걸쳐 세운다.
//
//  ▶ 앵커 3개는 스펙 §3-2 의 값을 그대로 쓴다. 여기서 어긋나면 스펙을 고친다:
//      head (0, HY + HR*0.82, 0)
//      neck (0, HY - HR*0.55, 0)  반지름 HR*0.92   ← 🐶목줄이 이미 쓰는 좌표
//      back (0, bodyY + R*0.30, -R*bs[2]*0.55)
//
//  ▶ ⚠️ 머리는 게임과 같은 소스지만 **몸·꼬리는 이 파일의 근사**다.
//    ANIMALS 체형 수치(bodyR·bodyScale·headR·headY)는 js/game.js 에서 옮겨 적었고,
//    꼬리는 실루엣만 흉내 낸다. 클리어런스 최종 확인은 인게임에서 한 번 더 한다.
//    (tool-tier-sim 에서 복제본과 게임이 갈려 역이식된 사고가 있었다.)
//
//  ▶ ⚠️ 블룸 임계 0.85 — 넓은 면에 쓰는 색은 전부 그 아래. 부팅 시 검산해 HUD 에 띄운다.
// =============================================================

const BLOOM_LUMA = 0.85;
const luma = h => (0.2126 * ((h >> 16) & 255) + 0.7152 * ((h >> 8) & 255) + 0.0722 * (h & 255)) / 255;

// ── 팔레트 ───────────────────────────────────────────────────
const P = {
  straw: 0xd9bd7e, strawDark: 0xb99a5c,
  petal: 0xf0b8c8, petalB: 0xc9d4ee, pollen: 0xe8c85e,
  leaf: 0x7fb857, leafLit: 0xa8d478, stem: 0x6e9b4a,
  wool: 0xd97b6c, woolDark: 0xb85f52,           // 목도리
  rope: 0xb08a5e,
  bell: 0xc9a227, bellLit: 0xd9bc5c, bellDark: 0x9c7a1c,   // 놋쇠 — tool-tiers 2단계 금색과 같은 값
  bow: 0xa8505f, bowDark: 0x7e3a48,             // 나비 넥타이
  canvas: 0xc2a882, canvasDark: 0x9c8462,       // 배낭
  cape: 0x7a8fc0, capeLine: 0xdcd0bc,
  star: 0xe8d06a, starLit: 0xe6ce78,
  spark: 0xd8c4f0, sparkLit: 0xdcccee,          // ✨ 반짝이
  drop: 0x9fd0e0, dropLit: 0xb4d8e6,
  paw: 0xb5895f,                                // 🐾 발바닥 자국
  wood: 0xbf9a68,                               // 바구니
  shroomCap: 0xc4634f, shroomDot: 0xdccfb8,     // 버섯 모자
};

// ── 재질 ─────────────────────────────────────────────────────
const clay = (c, flat = true) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.95, metalness: 0, flatShading: flat });
const soft = c => new THREE.MeshStandardMaterial({ color: c, roughness: 1.0, metalness: 0 });
const film = (c, o) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.5, metalness: 0, transparent: true, opacity: o, depthWrite: false });

// ── 🎒 어깨끈 ────────────────────────────────────────────────
//  몸통을 대각선으로 감는 링 하나. **가방은 이 링의 가장 낮은 점에 매달린다** —
//  가방 자리를 끈과 따로 정하면 둘이 안 닿아서 각자 떠 있는 두 물체가 된다(1차 실측).
//  링을 눕힌(Rx π/2) 뒤 기울이면(Rz tilt), 가장 낮은 점은 (−cos·r, −sin·r, 0) 이다.
//  ▶ 여기까지 세 번 틀렸고, 전부 원인이 같았다 — **몸이 타원체인데 원으로 계산했다.**
//     ① 원형 링 → 배 앞뒤로 튀어나와 훌라후프
//     ② 방향벡터를 그냥 씀 → 반지름 1 미만이라 끈이 몸 속에 묻혀 사라짐
//     ③ 방향벡터에 체형 배율만 곱함 → 그래도 표면 안쪽
//     타원체 표면까지의 거리는 t = 1/‖(x/a, y/b, z/c)‖ 로 풀어야 한다. onSurf() 가 그 일을 한다.
const SURF = 1.06;                                   // 표면보다 얼마나 밖에 띄울지
//  ⚠️ 정옆(z=0)에 매면 끈의 끝이 몸 뒤로 돌아가 **가방에 닿기 전에 가려진다**(4차 실측).
//     왼쪽 **앞**옆구리로 돌려야 끈과 가방이 같은 면에 놓여 이어진 게 보인다.
const BAG_DIR = new THREE.Vector3(-0.80, -0.22, 0.48).normalize();

/** 몸(타원체) 표면 **밖**의 점 — 방향만 주면 길이를 풀어 준다. 결과는 월드 좌표 */
function onSurf(k, x, y, z, out = SURF) {
  const b = k.bs, R = k.R;
  const t = 1 / Math.hypot(x / b[0], y / b[1], z / b[2]);
  return new THREE.Vector3(x * t * out * R, k.bodyY + y * t * out * R, z * t * out * R);
}

const put = (p, m, x, y, z, shadow = true) => { m.position.set(x, y, z); m.castShadow = shadow; p.add(m); return m; };
/** 납작한 잎/꽃잎 한 장 — 구를 눌러 만든다(전용 지오메트리 없이 실루엣이 잎으로 읽히게) */
const petalMesh = (len, wide, mat) => {
  const m = new THREE.Mesh(new THREE.SphereGeometry(len, 7, 5), mat);
  m.scale.set(wide, 0.14, 1.0);
  return m;
};

// =============================================================
//  동물 — 체형은 js/game.js ANIMALS 에서 옮겨 적음. 머리는 animal-faces.js 원본.
// =============================================================
const ANIMALS = [
  { id: 'fox',    name: '여우',   ico: '🦊', body: 0xf0883a, belly: 0xf9ecd8, bodyR: 0.52, bodyScale: [0.90, 1.08, 0.90], headR: 0.37, headY: 1.26, tail: 'bushy' },
  { id: 'dog',    name: '강아지', ico: '🐶', body: 0xf0913a, belly: 0xfaf3e8, bodyR: 0.56, bodyScale: [1.03, 0.99, 1.00], headR: 0.40, headY: 1.24, tail: 'curl' },
  { id: 'rabbit', name: '토끼',   ico: '🐰', body: 0xf3eeea, belly: 0xffffff, bodyR: 0.46, bodyScale: [1.00, 0.96, 1.00], headR: 0.39, headY: 1.12, tail: 'puff' },
  { id: 'cat',    name: '고양이', ico: '🐱', body: 0x9fa0c2, belly: 0xf2f2f8, bodyR: 0.50, bodyScale: [0.88, 1.10, 0.88], headR: 0.36, headY: 1.25, tail: 'long' },
  { id: 'bear',   name: '곰',     ico: '🐻', body: 0x936a44, belly: 0xd2b38a, bodyR: 0.63, bodyScale: [1.08, 1.00, 1.06], headR: 0.44, headY: 1.34, tail: 'stub' },
  { id: 'panda',  name: '판다',   ico: '🐼', body: 0xf6f6f6, belly: 0xffffff, bodyR: 0.63, bodyScale: [1.08, 1.00, 1.06], headR: 0.45, headY: 1.34, tail: 'stub' },
  { id: 'chick',  name: '병아리', ico: '🐤', body: 0xffe05a, belly: 0xfff0a0, bodyR: 0.50, bodyScale: [1.02, 0.94, 1.02], headR: 0.35, headY: 1.06, tail: 'feather' },
];

/** 테이퍼 튜브 — 곡선을 따라 굵기가 변하는 관.
 *  ⚠️ 처음엔 꼬리를 **구슬 몇 개로 근사**했다가 🦊여우 꼬리가 포도송이처럼 울퉁불퉁하게 나왔다.
 *     게임(js/game.js buildAnimalMesh)은 taperedTube 로 매끈하게 뽑는다 — 근사가 아니라
 *     같은 방식으로 만들어야 "꼬리 옆에 장식을 둬도 되는가"를 제대로 판정할 수 있다.
 *  colorFn 이 있으면 정점색을 굽는다(🦊 끝 1/3 이 흰색).
 */
function taperedTube(pts, radiusFn, colorFn = null, segs = 40, radial = 9) {
  const curve = new THREE.CatmullRomCurve3(pts);
  const frames = curve.computeFrenetFrames(segs, false);
  const pos = [], col = [], idx = [];
  for (let i = 0; i <= segs; i++) {
    const u = i / segs;
    const P = curve.getPointAt(u), N = frames.normals[i], B = frames.binormals[i];
    const r = radiusFn(u), c = colorFn && colorFn(u);
    for (let j = 0; j < radial; j++) {
      const A = (j / radial) * Math.PI * 2, ca = Math.cos(A), sa = Math.sin(A);
      pos.push(P.x + (N.x * ca + B.x * sa) * r, P.y + (N.y * ca + B.y * sa) * r, P.z + (N.z * ca + B.z * sa) * r);
      if (c) col.push(c.r, c.g, c.b);
    }
  }
  for (let i = 0; i < segs; i++) for (let j = 0; j < radial; j++) {
    const a = i * radial + j, b = i * radial + (j + 1) % radial;
    const c2 = (i + 1) * radial + j, d = (i + 1) * radial + (j + 1) % radial;
    idx.push(a, c2, b, b, c2, d);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  if (col.length) geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.setIndex(idx); geo.computeVertexNormals();
  return { geo, end: curve.getPointAt(1) };
}

/** 앵커 3개 — 스펙 §3-2.
 *  ⚠️ 1차 실측으로 스펙의 값 두 개가 틀린 게 드러나 고쳤다:
 *
 *  ① head 를 `HY + HR*0.82` 라는 **고정 높이**로 잡았더니 🐱고양이에서 챙이 얼굴
 *     한가운데를 가로질렀다. 동물마다 얼굴을 그리는 높이가 달라(animal-faces.js)
 *     "머리 위"가 한 값으로 안 떨어진다. 그래서 앵커는 **머리 중심(HY)** 에 두고,
 *     높이는 아이템이 저마다 HR 비례로 정한다 — 모자는 위, 머리띠는 이마.
 *
 *  ② back 의 z 계수 0.55 는 몸 표면(bs[2] 배)의 절반, 즉 **몸 속**이었다.
 *     등 뒤에서 찍었는데 배낭이 통째로 파묻혀 안 보였다. 표면에 밀착하도록 0.98 로.
 */
function anchorsOf(a) {
  const R = a.bodyR, bs = a.bodyScale, HR = a.headR, HY = a.headY;
  const bodyY = R * bs[1] + 0.02;
  return {
    R, HR, HY, bs, bodyY,
    head: new THREE.Vector3(0, HY, 0),                       // 머리 중심
    neck: new THREE.Vector3(0, HY - HR * 0.55, 0),
    neckR: HR * 0.92,
    back: new THREE.Vector3(0, bodyY + R * 0.30, -R * bs[2] * 0.98),
    // 🎒 옆구리 — 등 한가운데는 🦊여우 꼬리가 차지하고 있어 가방이 먹힌다(실측).
    //   옆으로 매면 충돌 자체가 없고 동물별 예외도 필요 없다.
    //   ⚠️ **왼쪽(−x)** 이다. 도구 든 손이 오른쪽(game.js heldGroup.x = 0.78)이라 오른쪽에 매면 부딪힌다.
    //   ⚠️ 좌표를 손으로 정하지 않는다 — 방향(BAG_DIR)만 정하고 **타원체 표면까지의 거리**를 푼다.
    //      어깨끈도 같은 점에서 출발하므로 가방과 끈이 저절로 맞물린다.
    side: (() => {
      const d = BAG_DIR;
      const t = 1 / Math.hypot(d.x / bs[0], d.y / bs[1], d.z / bs[2]);
      return new THREE.Vector3(d.x * t * SURF * R, bodyY + d.y * t * SURF * R, d.z * t * SURF * R);
    })(),
  };
}

function buildAnimal(a) {
  const g = new THREE.Group();
  const { R, bs, bodyY } = anchorsOf(a);

  const body = put(g, new THREE.Mesh(new THREE.SphereGeometry(R, 28, 20), plushMat(a.body)), 0, bodyY, 0);
  body.scale.set(bs[0], bs[1], bs[2]);
  const belly = put(g, new THREE.Mesh(new THREE.SphereGeometry(R * 0.62, 20, 14), plushMat(a.belly)), 0, bodyY - R * 0.16, R * 0.55, false);
  belly.scale.set(1, 1.1, 0.6);

  // 머리 — 게임과 같은 소스(귀·볏 포함)
  g.add(buildAnimalHead(a.id, { HR: a.headR, HY: a.headY, body: a.body, belly: a.belly }));

  // 꼬리 — 곡선점·굵기식·색 경계 모두 js/game.js buildAnimalMesh 에서 그대로 옮겨 왔다.
  //   🦊bushy 는 등 장식과 부딪히는 유일한 꼬리라 특히 실물과 같아야 한다.
  const tm = plushMat(a.body);
  const tail = new THREE.Group();
  tail.position.set(0, bodyY + R * 0.10, -R * bs[2] * 0.86);
  g.add(tail);
  const base = tail.position;
  const V = (x, y, z) => new THREE.Vector3(R * x, R * y, R * z);
  const tube = (pts, radFn, colFn) => {
    const { geo, end } = taperedTube(pts, radFn, colFn);
    const m = new THREE.Mesh(geo, colFn
      ? new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95 })
      : tm);
    m.castShadow = true; tail.add(m);
    return end;
  };

  if (a.tail === 'bushy') {   // 🦊 짧고 통통하게 위로 솟고 끝 1/3 이 흰색(정점색)
    const pts = [V(0, -0.05, 0.10), V(0, 0.06, -0.30), V(0, 0.30, -0.50), V(0, 0.60, -0.58), V(0, 0.88, -0.54)];
    const rad = u => R * (0.29 + 0.05 * Math.sin(Math.PI * u)) * (1 - 0.38 * Math.max(0, u - 0.70) / 0.30);
    const c0 = new THREE.Color(a.body), c1 = new THREE.Color(a.belly);
    const end = tube(pts, rad, u => u < 0.60 ? c0 : u < 0.68 ? c0.clone().lerp(c1, (u - 0.60) / 0.08) : c1);
    put(tail, new THREE.Mesh(new THREE.SphereGeometry(rad(1) * 0.98, 12, 9), plushMat(a.belly)), end.x, end.y, end.z);
  } else if (a.tail === 'long') {   // 🐱 밑동 굵게 위로 쭉, 끝이 살짝 뒤로 휜다
    const pts = [V(0, -0.05, 0.10), V(0, 0.08, -0.36), V(0, 0.45, -0.60), V(0, 0.90, -0.58), V(0, 1.22, -0.36)];
    const rad = u => R * (0.17 * (1 - u * 0.62) + 0.02) * (1 - 0.30 * Math.max(0, u - 0.85) / 0.15);
    const end = tube(pts, rad);
    put(tail, new THREE.Mesh(new THREE.SphereGeometry(rad(1) * 0.98, 10, 8), tm), end.x, end.y, end.z);
  } else if (a.tail === 'curl') {   // 🐶 짧게 위로 말린 곡선
    const pts = [V(0, -0.05, 0.10), V(0, 0.05, -0.22), V(0, 0.30, -0.40), V(0, 0.58, -0.36), V(0, 0.72, -0.14)];
    const rad = u => R * (0.15 * (1 - u) + 0.05);
    const end = tube(pts, rad);
    put(tail, new THREE.Mesh(new THREE.SphereGeometry(rad(1) * 0.98, 10, 8), tm), end.x, end.y, end.z);
  } else if (a.tail === 'puff') {
    put(g, new THREE.Mesh(new THREE.SphereGeometry(R * 0.30, 12, 10), plushMat(a.belly)), 0, base.y + R * 0.04, base.z - R * 0.06);
  } else if (a.tail === 'feather') {
    [-1, 0, 1].forEach(s => {
      const f = put(g, new THREE.Mesh(new THREE.ConeGeometry(R * 0.10, R * 0.44, 3), tm), s * R * 0.09, base.y + R * 0.34, base.z - R * 0.12);
      f.rotation.set(Math.PI / 2 - 0.85, 0, s * 0.24);
    });
  } else {   // stub
    put(g, new THREE.Mesh(new THREE.SphereGeometry(R * 0.16, 10, 8), tm), 0, base.y, base.z);
  }
  return g;
}

// =============================================================
//  🎩 머리 — 1차는 전부 earSafe:'low' (위가 트여 귀가 지나간다)
//     ⚠️ 'dome'(머리를 덮는 것)은 이번에 만들지 않는다 — 귀 처리 규칙이 선 뒤에.
// =============================================================
//  ▶ 높이는 아이템이 정한다(앵커는 머리 중심). 반지름 HR 의 구에서 높이 h 에 걸치는
//    둘레 반지름은 √(HR²−h²) 다 — 띠가 머리에 닿으려면 그 값을 써야 뜨지도 묻히지도 않는다.
const ringR = (HR, h) => Math.sqrt(Math.max(0.04, 1 - h * h)) * HR;   // h 는 HR 배수

//  ▶ earSafe: 'dome' — 머리를 덮는 모자.
//    귀에 구멍을 뚫거나 귀를 눕힐 필요가 없다. **아래 테두리를 귀 밑동보다 위에서 끝내면**
//    귀가 저절로 모자 옆으로 빠져나온다. animal-faces.js 의 귀 밑동(×HR):
//      🐱0.46 · 🐶0.51 · 🦊0.52 · 🐰0.80   → 가장 낮은 고양이보다 위인 0.50 을 테두리로 잡는다.
//    🐤병아리 볏은 낮고 뒤쪽이라 모자 안에 눌린다 — 모자를 쓰면 볏이 눌리는 게 자연스럽다.
const DOME_BOT = 0.50;   // × HR — 모자 아래 테두리 높이
/** 머리 위쪽만 덮는 캡. thetaLength 를 풀어 아래 테두리를 DOME_BOT 에 맞춘다 */
function domeCap(HR, rk, mat, seg = 20) {
  const r = HR * rk;
  const th = Math.acos(Math.min(0.995, DOME_BOT * HR / r));
  return new THREE.Mesh(new THREE.SphereGeometry(r, seg, 14, 0, Math.PI * 2, 0, th), mat);
}
/** 캡 아래 테두리를 덮는 띠 — 열린 단면이 보이지 않게 막고, 모자에 윤곽을 준다 */
function domeRim(HR, rk, tube, mat) {
  const r = HR * rk, y = DOME_BOT * HR;
  const rim = new THREE.Mesh(new THREE.TorusGeometry(Math.sqrt(Math.max(0.01, r * r - y * y)), tube, 5, 22), mat);
  rim.rotation.x = Math.PI / 2; rim.position.y = y;
  return rim;
}

//  🎒 등 — ⚠️ 🦊여우 꼬리(위로 솟는 bushy)와 겹치는지가 이 슬롯의 관문이다
// =============================================================
//  ⚠️ 크로스 스트랩의 회전 순서 — THREE.Euler 기본값 'XYZ' 는 **Rz 를 먼저** 적용한다.
//     `rotation.set(π/2, 0, tilt)` 로 주면 tilt 는 링 자기 축 회전이라 아무 일도 안 일어나고,
//     그 뒤 Rx(π/2) 가 링을 눕혀 **허리를 수평으로 감은 띠**가 된다(1차 실측).
//     대각선으로 매려면 "눕힌 다음 기울여야" 하므로 order 를 'ZYX' 로 바꾼다.
//  ⚠️ 회전 순서 — THREE.Euler 기본값 'XYZ' 는 **Rz 를 먼저** 적용한다.
//     `rotation.set(π/2, 0, tilt)` 로 주면 tilt 는 링 자기 축 회전이라 아무 일도 안 일어나고,
//     그 뒤 Rx(π/2) 가 링을 눕혀 **허리를 수평으로 감은 띠**가 된다(1차 실측).
//     대각선으로 매려면 "눕힌 다음 기울여야" 하므로 order 를 'ZYX' 로 바꾼다.
//
//  ▶ 끈은 앵커(= 링의 가장 낮은 점)를 **반드시 지나간다**. 가방은 그 점에 매달리므로
//    둘이 저절로 맞물린다 — 좌표를 따로 정하면 안 닿는다.
//  ⚠️ 원형 링 하나로는 크로스백이 안 된다. 몸은 타원인데 링은 원이라 **배 앞뒤로 튀어나와
//     훌라후프처럼 보인다**(2차 실측). 실제 크로스백은 가방에서 어깨로 가는 **끈 두 가닥**이다 —
//     앞으로 한 줄, 뒤로 한 줄. 꼬리에 쓴 taperedTube 로 몸 표면을 따라 휘게 만든다.
const strapOf = (g, k, tube, mat) => {
  const R = k.R, bs = k.bs;
  // 월드 표면점 → 홀더 로컬
  const L = (x, y, z) => onSurf(k, x, y, z).sub(k.side);
  const shoulder = L(0.55, 0.80, 0.20);
  [1, -1].forEach(front => {                                     // +1 앞 가닥 · −1 뒤 가닥
    const pts = [
      new THREE.Vector3(0, 0, 0),                                // 가방 고리(앵커)에서 출발
      L(-0.58, -0.08, front * 0.80),
      L(0.04, 0.46, front * 0.86),
      shoulder.clone(),
    ];
    const { geo } = taperedTube(pts, () => tube, null, 26, 6);
    const m = new THREE.Mesh(geo, mat); m.castShadow = true; g.add(m);
  });
  // 어깨에서 두 가닥이 만나는 지점 — 이음매가 벌어져 보이지 않게 덮는다
  put(g, new THREE.Mesh(new THREE.SphereGeometry(tube * 1.5, 8, 6), mat), shoulder.x, shoulder.y, shoulder.z, false);
};

/** 끈이 꿰이는 고리 — 앵커(로컬 원점)에 둔다. 끈이 그 점을 z 방향으로 지나므로
 *  구멍 축이 z 인 토러스(회전 없음)면 끈이 고리를 통과한다. */
const strapLoop = (g, r, tube, mat) =>
  put(g, new THREE.Mesh(new THREE.TorusGeometry(r, tube, 4, 14), mat), 0, 0, 0, false);

const BACK = {
  //  ▶ 가방류는 **옆구리(side 앵커)** 에 맨다. 등 한가운데는 🦊여우 꼬리 자리다.
  //    앵커는 어깨끈 링의 가장 낮은 점이라, 가방을 거기서 **아래로 매달면** 끈과 붙는다.
  pack: (g, k) => {           // 메신저 가방 — 왼쪽 옆구리에 걸치고 끈이 오른쪽 어깨를 넘어간다
    const R = k.R, w = R * 0.76;
    const out = 0;
    const hang = -w * 0.26;                   // 고리 아래로 매달린다
    const body = put(g, new THREE.Mesh(new THREE.BoxGeometry(w * 0.56, w * 0.88, w * 1.02), clay(P.canvas)), out, hang, 0);
    body.rotation.z = 0.12;
    const flap = put(g, new THREE.Mesh(new THREE.BoxGeometry(w * 0.60, w * 0.38, w * 1.08), clay(P.canvasDark)), out - w * 0.02, hang + w * 0.33, 0, false);
    flap.rotation.z = 0.12;
    const buckle = put(g, new THREE.Mesh(new THREE.BoxGeometry(w * 0.10, w * 0.15, w * 0.20), clay(P.strawDark)), out - w * 0.29, hang + w * 0.12, 0, false);
    buckle.rotation.z = 0.12;
    // 고리 ↔ 가방을 잇는 짧은 목끈 — 이게 없으면 가방이 끈 아래 떠 있는 상자로 보인다
    const neck = put(g, new THREE.Mesh(new THREE.BoxGeometry(w * 0.13, w * 0.30, w * 0.34), clay(P.canvasDark)), out, hang + w * 0.52, 0, false);
    neck.rotation.z = 0.12;
    strapLoop(g, w * 0.17, w * 0.055, clay(P.canvasDark));
    strapOf(g, k, R * 0.078, clay(P.canvasDark));
  },
  basket: (g, k) => {         // 바구니 — 옆구리에 낀 열린 통 + 어깨끈
    const R = k.R, r = R * 0.44;
    const out = 0, hang = -r * 0.48;
    put(g, new THREE.Mesh(new THREE.CylinderGeometry(r, r * 0.80, r * 1.4, 10, 1, true), clay(P.wood)), out, hang, 0);
    const rim = put(g, new THREE.Mesh(new THREE.TorusGeometry(r, r * 0.09, 4, 16), clay(P.strawDark)), out, hang + r * 0.70, 0, false);
    rim.rotation.x = Math.PI / 2;
    // 테두리에서 고리까지 끈 두 가닥
    [-1, 1].forEach(s => {
      const c = put(g, new THREE.Mesh(new THREE.BoxGeometry(r * 0.09, r * 0.52, r * 0.09), clay(P.strawDark)), out + s * r * 0.30, hang + r * 0.96, 0, false);
      c.rotation.z = -s * 0.42;
    });
    strapLoop(g, r * 0.19, r * 0.065, clay(P.strawDark));
    strapOf(g, k, R * 0.070, clay(P.strawDark));
  },
  cape: (g, k) => {           // 망토 — 등을 덮어 내려온다. 실루엣이 제일 크게 바뀐다
    const R = k.R;
    const c = put(g, new THREE.Mesh(new THREE.SphereGeometry(R * 0.92, 18, 14, 0, Math.PI), soft(P.cape)), 0, -R * 0.22, R * 0.10);
    c.scale.set(1.02, 1.16, 0.42); c.rotation.y = Math.PI / 2;
    const col = put(g, new THREE.Mesh(new THREE.TorusGeometry(R * 0.44, R * 0.07, 4, 16, Math.PI * 1.25), clay(P.capeLine)), 0, R * 0.52, R * 0.06, false);
    col.rotation.set(Math.PI / 2, 0, -Math.PI * 0.62);
  },
};

// =============================================================
//  👣 발자국 — 앵커가 아니라 월드 이펙트. 걸어온 자취를 흐려지며 남긴다
//     스펙 §4-4: 0.6 이동마다 1개 · 1.2초 페이드 · 동시 12개 상한 · 풀 재사용
// =============================================================
//  ⚠️ 1차 자국은 **캐릭터 몸통만 했다**(꽃 하나가 0.34 폭 — 플레이어 몸 반지름이 0.52).
//     발자국은 작아야 발자국이다. s 는 자국 하나의 반지름 기준(≈0.10 월드 단위).
const TRAIL = {
  //  ▶ 🐾 발바닥은 **동물마다 다르다**. 같은 자국을 7종이 공유하면 "내 캐릭터가 남긴 것"이
  //    아니라 그냥 스티커가 된다. 상품은 하나지만 조형은 캐릭터를 따라간다.
  //    ⚠️ a 가 없으면(카탈로그 미리보기 등) 포유류 기본형으로 그린다.
  paw: (g, s, o, a) => {
    const m = film(P.paw, o);
    const id = a && a.id;
    const oval = (r, sx, sz, x, z) => {
      const t = put(g, new THREE.Mesh(new THREE.SphereGeometry(r, 9, 6), m), x, 0.006, z, false);
      t.scale.set(sx, 0.10, sz); return t;
    };

    if (id === 'chick') {                    // 🐤 새발자국 — 앞 3갈래 + 뒤 1갈래. 패드가 없다
      [-0.62, 0, 0.62].forEach(A => {
        const t = put(g, new THREE.Mesh(new THREE.BoxGeometry(s * 0.14, s * 0.02, s * 0.92), m),
                      Math.sin(A) * s * 0.34, 0.006, s * 0.30 + Math.cos(A) * s * 0.14, false);
        t.rotation.y = -A;
      });
      put(g, new THREE.Mesh(new THREE.BoxGeometry(s * 0.12, s * 0.02, s * 0.42), m), 0, 0.006, -s * 0.34, false);
      return;
    }
    if (id === 'rabbit') {                   // 🐰 뒷발이 길다 — 발가락은 작고 패드가 길쭉하다
      oval(s * 0.64, 0.76, 1.55, 0, -s * 0.10);
      [-0.30, -0.10, 0.10, 0.30].forEach(x =>
        oval(s * 0.17, 1, 1.25, x * s * 1.6, s * 0.86));
      return;
    }
    // 🦊🐶🐱🐻🐼 포유류 — 패드 하나 + 발가락 4개. 곰·판다는 크고 뭉툭하다
    const big = id === 'bear' || id === 'panda';
    oval(s * (big ? 0.74 : 0.62), 1, 0.86, 0, -s * 0.12);
    [-1.02, -0.36, 0.36, 1.02].forEach(A =>
      oval(s * (big ? 0.31 : 0.26), 1, 1.15, Math.sin(A) * s * (big ? 0.82 : 0.72), s * 0.56 + Math.cos(A) * s * 0.20));
  },
  flower: (g, s, o) => {      // 🌸 꽃 — 꽃잎이 겹치면 덩어리가 된다. 간격을 벌리고 작게
    for (let i = 0; i < 5; i++) {
      const A = (i / 5) * Math.PI * 2;
      const pt = petalMesh(s * 0.46, 0.60, film(i % 2 ? P.petal : P.petalB, o));
      put(g, pt, Math.cos(A) * s * 0.52, 0.004, Math.sin(A) * s * 0.52, false);
      pt.rotation.set(0, -A, 0);
    }
    put(g, new THREE.Mesh(new THREE.IcosahedronGeometry(s * 0.24, 0), film(P.pollen, o)), 0, 0.008, 0, false);
  },
  star: (g, s, o) => {        // ⭐ 별 — 바닥 별 + 떠오르는 작은 별. 특별 등급
    //  ⚠️ 팔면체를 누르면 **마름모**다. 삼각 둘을 엇갈려야 6각 별로 읽힌다.
    const sixStar = (size, mat, y) => [0, Math.PI / 3].forEach(rot => {
      const t = put(g, new THREE.Mesh(new THREE.ConeGeometry(size, size * 0.24, 3), mat), 0, y, 0, false);
      t.rotation.set(Math.PI / 2, 0, rot); t.scale.set(1, 1, 0.5);
    });
    sixStar(s * 0.92, film(P.star, o), 0.006);
    // 떠오르는 별 — 위로 갈수록 작고 옅게. 이게 "특별" 등급의 값어치다
    [[0.20, 0.55, 0.7], [0.34, 0.38, 0.45], [0.46, 0.26, 0.25]].forEach(([y, k, a]) => {
      const t = put(g, new THREE.Mesh(new THREE.ConeGeometry(s * k, s * k * 0.24, 3), film(P.starLit, o * a)),
                    s * (y * 1.4 - 0.3), y, s * 0.3, false);
      t.rotation.set(Math.PI / 2, 0, y * 5); t.scale.set(1, 1, 0.5);
    });
  },
  sparkle: (g, s, o) => {     // ✨ 반짝이 — 바닥 자국 없이 **빛 알갱이만 떠오른다**. 가장 비싼 등급
    //  ⚠️ 블룸 임계(0.85)를 넘는 색을 넓게 칠하면 후광이 형태를 삼킨다.
    //     알갱이는 작아서 살짝 밝아도 반짝임으로 읽힌다 — 그래도 임계 아래로 맞춘다.
    put(g, new THREE.Mesh(new THREE.CircleGeometry(s * 0.70, 14), film(P.sparkLit, o * 0.20)), 0, 0.004, 0, false)
      .rotation.x = -Math.PI / 2;
    // 알갱이 6개 — 그 이상은 촘촘해져 환공포증으로 읽힌다
    [[-0.5, 0.10, 0.3, 0.30], [0.4, 0.22, -0.2, 0.26], [-0.2, 0.36, -0.4, 0.22],
     [0.6, 0.48, 0.3, 0.18], [-0.6, 0.60, 0.1, 0.14], [0.2, 0.74, -0.3, 0.11]]
      .forEach(([x, y, z, k], i) => {
        const m = put(g, new THREE.Mesh(new THREE.OctahedronGeometry(s * k, 0), film(i % 2 ? P.spark : P.sparkLit, o * (1 - y * 0.8))),
                      s * x, s * y * 3.4, s * z, false);
        m.rotation.set(0.4 * i, 0.7 * i, 0.2 * i); m.scale.set(1, 1.5, 1);
      });
  },
  drop: (g, s, o) => {        // 💧 물방울 — 젖은 자국 + 퍼지는 파문 한 겹
    const wet = put(g, new THREE.Mesh(new THREE.SphereGeometry(s * 0.52, 12, 8), film(P.drop, o)), 0, 0.005, 0, false);
    wet.scale.set(1, 0.09, 1.12);
    const ring = put(g, new THREE.Mesh(new THREE.TorusGeometry(s * 0.88, s * 0.07, 4, 18), film(P.dropLit, o * 0.7)), 0, 0.004, 0, false);
    ring.rotation.x = Math.PI / 2;
  },
};

  { id: 'back', ico: '🎒', name: '가방', build: BACK, items: [

    { id: 'paw',     name: '발바닥',  price: 700,  tier: '기본' },

/** 동물 + 장식 하나 = 한 덩어리 */
function dressed(a, slot, itemId) {
  const g = new THREE.Group();
  g.add(buildAnimal(a));
  if (!itemId || slot.id === 'trail') return g;
  const k = anchorsOf(a);
  const it = slot.items.find(i => i.id === itemId);
  const holder = new THREE.Group();
  holder.position.copy(k[(it && it.anchor) || slot.id]);   // 아이템이 붙을 면을 고른다
  slot.build[itemId](holder, k);
  g.add(holder);
  return g;
}

/** 👣 발자국 한 줄 — 걸어온 자취(뒤로 갈수록 옅어진다) */
function trailRow(itemId, a = null) {
  const g = new THREE.Group();
  const N = 7, S = 0.10;                // S = 자국 하나의 기준 반지름(월드 단위)
  for (let i = 0; i < N; i++) {
    const o = 1.0 - 0.82 * (i / N);      // 뒤로 갈수록 옅어진다(첫 자국은 또렷하게)
    const step = new THREE.Group();
    // 좌우로 번갈아 — 실제 걸음처럼 보이게. 한 줄로 찍으면 자국이 아니라 점선이다
    step.position.set((i % 2 ? 1 : -1) * 0.075, 0, -i * 0.30);
    step.rotation.y = (i % 2 ? 1 : -1) * 0.20;
    TRAIL[itemId](step, S, o, a);
    g.add(step);
  }
  return g;
}

Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 0.5, far: 26 });
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun);
const rim = new THREE.DirectionalLight(0xbfd8e8, 0.34); rim.position.set(-5, 3, -4); scene.add(rim);

const ground = new THREE.Mesh(new THREE.CircleGeometry(16, 48), new THREE.MeshStandardMaterial({ color: 0x9fc08a, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

const root = new THREE.Group(); scene.add(root);
const labels = document.getElementById('labels');
let tags = [];

// ── 배치 ─────────────────────────────────────────────────────
let slotId = 'head', mode = 'items', pickIdx = 0;
const GX = 1.45;

function slot() { return SLOTS.find(s => s.id === slotId); }

function layout() {
  [...root.children].forEach(c => root.remove(c));
  labels.innerHTML = ''; tags = [];
  const S = slot();
  const addTag = (x, z, y, html, warn) => {
    const el = document.createElement('div'); el.className = 'tag' + (warn ? ' warn' : '');
    el.innerHTML = html; labels.appendChild(el); tags.push({ el, x, z, y });
  };

  if (S.id === 'trail') {
    if (mode === 'animals') {
      // 🐾 발바닥은 동물마다 다르다 — 7종을 나란히 놓고 본다
      const it = S.items[Math.min(pickIdx, S.items.length - 1)];
      ANIMALS.forEach((a, i) => {
        const x = (i - (ANIMALS.length - 1) / 2) * 0.86;
        const row = trailRow(it.id, a); row.position.set(x, 0, 0.6); root.add(row);
        addTag(x, 1.35, 0.30, `${a.ico} <b>${a.name}</b>`);
      });
      return;
    }
    // 자취로 본다 — 등급 순으로 나란히
    S.items.forEach((it, i) => {
      const x = (i - (S.items.length - 1) / 2) * 1.05;
      const row = trailRow(it.id); row.position.set(x, 0, 0.6); root.add(row);
      addTag(x, 1.35, 0.30, `👣 <b>${it.name}</b><small>${it.tier} · ${it.price.toLocaleString()}🪙</small>`);
    });
    return;
  }

  if (mode === 'items') {
    // 아이템 비교 — 한 동물(🦊여우)에 이 슬롯의 아이템을 전부 얹는다
    const a = ANIMALS[0];
    S.items.forEach((it, i) => {
      const x = (i - (S.items.length - 1) / 2) * GX;
      const d = dressed(a, S, it.id); d.position.set(x, 0, 0); root.add(d);
      addTag(x, 0, 1.98, `${S.ico} <b>${it.name}</b><small>${it.price.toLocaleString()}🪙${it.earSafe ? ' · earSafe ' + it.earSafe : ''}</small>`);
    });
  } else {
    // 동물 호환 — 아이템 하나를 7종에 걸쳐 세운다. 여기서 귀·꼬리 함정이 드러난다
    const it = S.items[Math.min(pickIdx, S.items.length - 1)];
    ANIMALS.forEach((a, i) => {
      const x = (i - (ANIMALS.length - 1) / 2) * 1.28;
      const d = dressed(a, S, it.id); d.position.set(x, 0, 0); root.add(d);
      // 옆구리 가방으로 옮긴 뒤로 🦊꼬리 충돌은 망토(back 앵커)에만 남는다
      const usesBack = (S.items[Math.min(pickIdx, S.items.length - 1)].anchor || S.id) === 'back';
      const risky = (S.id === 'head' && (a.id === 'rabbit' || a.id === 'chick'))
                 || (S.id === 'back' && usesBack && a.tail === 'bushy');
      addTag(x, 0, 2.20, `${a.ico} <b>${a.name}</b>${risky ? '<small>⚠️ 함정 지점</small>' : ''}`, risky);
    });
  }
}

const v = new THREE.Vector3();
function placeTags() {
  tags.forEach(t => {
    v.set(t.x, t.y, t.z); root.localToWorld(v); v.project(camera);
    t.el.style.left = ((v.x * 0.5 + 0.5) * innerWidth) + 'px';
    t.el.style.top = ((-v.y * 0.5 + 0.5) * innerHeight) + 'px';
    t.el.style.display = v.z > 1 ? 'none' : '';
  });
}

const $ = id => document.getElementById(id);
let dist = 5.0, angle = 24, elev = 12;
const setDist = d => { dist = d; $('dist').value = d; $('distV').textContent = d.toFixed(1); };

function renderBtns() {
  const mk = (box, label, on, fn) => {
    const b = document.createElement('button'); b.textContent = label; if (on) b.className = 'on';
    b.onclick = () => { fn(); renderBtns(); layout(); }; box.appendChild(b);
  };
  const sb = $('slots'); sb.innerHTML = '';
  SLOTS.forEach(s => mk(sb, `${s.ico} ${s.name}`, slotId === s.id, () => {
    slotId = s.id; pickIdx = 0;
    setDist(s.id === 'trail' ? (mode === 'animals' ? 5.4 : 4.6) : mode === 'animals' ? 7.4 : 5.0);
  }));

  const mb = $('modes'); mb.innerHTML = '';
  const pb = $('picks'); pb.innerHTML = '';
  mk(mb, '아이템 비교', mode === 'items', () => { mode = 'items'; setDist(slotId === 'trail' ? 4.6 : 5.0); });
  mk(mb, '동물 호환', mode === 'animals', () => { mode = 'animals'; setDist(slotId === 'trail' ? 5.4 : 7.4); });
  if (mode === 'animals') slot().items.forEach((it, i) => mk(pb, it.name, pickIdx === i, () => { pickIdx = i; }));
}

$('dist').oninput = e => { dist = +e.target.value; $('distV').textContent = dist.toFixed(1); };
$('ang').oninput = e => { angle = +e.target.value; $('angV').textContent = angle + '°'; };
$('elev').oninput = e => { elev = +e.target.value; $('elevV').textContent = elev + '°'; };
$('night').onchange = e => {
  const n = e.target.checked;
  hemi.intensity = n ? 0.32 : 0.88; sun.intensity = n ? 0.22 : 1.12;
  hemi.color.set(n ? 0x9fb4d8 : 0xdfefff); rim.intensity = n ? 0.16 : 0.34;
  ground.material.color.set(n ? 0x4a6350 : 0x9fc08a);
  scene.fog.color.set(n ? 0x36485c : 0xdbe9ee); scene.background.set(n ? 0x36485c : 0xdbe9ee);
  document.body.style.background = n ? 'linear-gradient(#2b3a52,#3d4f52)' : 'linear-gradient(#cfe4ee,#eaf2e6)';
};

// ── HUD — 블룸 검산 ──
{
  const nums = Object.entries(P).filter(([, c]) => typeof c === 'number');
  const over = nums.filter(([, c]) => luma(c) > BLOOM_LUMA);
  $('hud').innerHTML =
    `🎀 <b>꾸미기 슬롯 시안</b><br><span style="opacity:.62">머리·목·등 = 앵커 · 발자국 = 월드 이펙트</span><br>` +
    `<span style="opacity:.62">머리 조형은 게임과 같은 소스</span><br>` +
    (over.length
      ? `<span class="warn">⚠️ 블룸 초과 ${over.length}색: ${over.map(([k]) => k).join(', ')}</span>`
      : `<span style="color:#3f7a4a">✓ 블룸 임계 0.85 — ${nums.length}색 전부 통과</span>`);
  console.log('[cosmetic-sim] 블룸 검산', Object.fromEntries(nums.map(([k, c]) => [k, +luma(c).toFixed(3)])));
}

renderBtns(); layout();
function tick() {
  requestAnimationFrame(tick);
  if ($('spin').checked) { angle = (angle + 0.28) % 360; $('ang').value = angle > 180 ? angle - 360 : angle; $('angV').textContent = Math.round(angle) + '°'; }
  const r = THREE.MathUtils.degToRad(angle), e = THREE.MathUtils.degToRad(elev);
  camera.position.set(Math.sin(r) * Math.cos(e) * dist, Math.sin(e) * dist + 0.85, Math.cos(r) * Math.cos(e) * dist);
  camera.lookAt(0, 0.85, 0);
  placeTags();
  renderer.render(scene, camera);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// 헤드리스 캡처용
window.__cosSim = {
  SLOTS: SLOTS.map(s => ({ id: s.id, name: s.name, items: s.items.map(i => i.id) })),
  set: (sid, m, pi = 0) => { slotId = sid; mode = m; pickIdx = pi; setDist(sid === 'trail' ? 3.6 : m === 'animals' ? 7.4 : 5.0); renderBtns(); layout(); },
};
