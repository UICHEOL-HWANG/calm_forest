<!doctype html>
<meta charset="utf-8">
<title>house concepts</title>
<style>html,body{margin:0;height:100%;background:#cfe6dc}canvas{display:block}#lbl{position:fixed;left:12px;top:10px;font:600 14px sans-serif;color:#3b4a40;background:rgba(255,255,255,.7);padding:6px 10px;border-radius:10px}</style>
<div id="lbl"></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
// 집 컨셉 뷰어 — ?house=cottage|loft|penthouse|villa|apartment  ·  ?all=1 나란히  ·  ?cam=game(게임 카메라 각도 41°) | orbit
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const q = new URLSearchParams(location.search);
const NAMES = ['cottage', 'loft', 'penthouse', 'villa', 'apartment'];
const list = q.get('all') ? NAMES : [q.get('house') || 'cottage'];
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xcfe6dc); scene.fog = new THREE.Fog(0xcfe6dc, 30, 80);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
scene.add(new THREE.HemisphereLight(0xfff4e0, 0x88a878, 0.9));
const sun = new THREE.DirectionalLight(0xffe8c8, 1.6); sun.position.set(8, 14, 6); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20 }); scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(60, 48), new THREE.MeshStandardMaterial({ color: 0x9fd08a, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
// 게임과 같은 도우미 — 각 컨셉 모듈은 build(THREE, H) 로 그룹을 돌려준다
const H = {
  clay: (hex, opts = {}) => new THREE.MeshStandardMaterial({ color: hex, roughness: 0.85, metalness: 0, flatShading: true, ...opts }),
  glass: (hex = 0x7fb3d5) => new THREE.MeshStandardMaterial({ color: hex, roughness: 0.15, metalness: 0.1, transparent: true, opacity: 0.55 }),
  box: (w, h, d, mat, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; return m; },
  role: (mesh, role) => { mesh.userData.role = role; return mesh; },   // 'roof' | 'wall' | 'door' — 게임의 색 스와치가 바꾸는 부위
};
const label = [];
for (let i = 0; i < list.length; i++) {
  const name = list[i];
  try {
    // 게임 본체와 같은 파일(js/house/*.js) — apartment 는 채택 안 된 후보라 여기만 남아 있다
    const mod = await import(`${name === 'apartment' ? './' : '../../js/house/'}${name}.js?v=${Date.now()}`);
    const g = mod.build(THREE, H);
    g.position.x = (i - (list.length - 1) / 2) * 9;
    scene.add(g); label.push(name);
  } catch (e) { console.error(name, e); label.push(name + ' ✗'); }
}
document.getElementById('lbl').textContent = label.join('  ·  ');
// 카메라: 게임 추적 오프셋 (0,14,16)·시선 (0,1.2,0) 과 같은 41°. 나란히 볼 땐 뒤로 뺀다
const spread = list.length > 1 ? 2.6 : 1;
const camMode = q.get('cam') || 'game';
if (camMode === 'line') { scene.fog = null; camera.position.set(0, 7, 24); camera.lookAt(0, 1.6, 0); }   // 나란히 비교용(안개 없음)
else if (camMode === 'game') { camera.position.set(0, 14 * spread, 16 * spread); camera.lookAt(0, 1.2, 0); }
else { camera.position.set(9, 8, 12); camera.lookAt(0, 1.5, 0); }
const ctl = new OrbitControls(camera, renderer.domElement); ctl.target.set(0, 1.2, 0); ctl.update();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
window.__ready = true;
renderer.setAnimationLoop(() => renderer.render(scene, camera));
</script>
