<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>할로윈 실제 모듈 확인 — calm forest</title>
<style>
  html,body{margin:0;height:100%;background:#dfe9ee;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#3a3a4a;overflow:hidden}
  canvas{display:block}
  #bar{position:fixed;left:0;right:0;bottom:0;padding:6px 10px 8px;background:rgba(255,255,255,.92);border-top:1px solid #d6d2e2;font-size:12.5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  #bar a{padding:4px 9px;border-radius:8px;border:1px solid #c4bdd8;background:#fff;color:inherit;text-decoration:none}
  #bar a.on{background:#7a5ab8;color:#fff;border-color:#5f428f}
  #labels{position:fixed;inset:0;pointer-events:none}
  .tag{position:absolute;transform:translate(-50%,-100%);font-size:12px;font-weight:700;background:rgba(255,255,255,.88);padding:2px 8px;border-radius:7px;white-space:nowrap}
  .tag small{display:block;font-weight:400;opacity:.72;font-size:10.5px}
  @media (max-width:700px){ .tag{font-size:10px;padding:1px 5px} .tag small{display:none} #bar{font-size:11px} }
</style>
<div id="labels"></div>
<div id="bar"></div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
// =============================================================
//  🎃 할로윈 프리미엄 — **실제 모듈** 확인 페이지 (Task 13, 2026-10-06)
//  ------------------------------------------------------------
//  시안(sims/halloween-{trail,tools}-sim.html)의 인라인 조형 대신 게임이 쓰는 모듈을 그대로 import 한다.
//    자국  : buildTrailMark + createTrailFx(onStamp/update) — js/game.js updateTrail 과 같은 순서
//    도구  : buildToolSkin(theme, toolId) 9종 + buildUmbrella(theme) + setToolSkinNight
//    망토  : buildCosmetic('bat_wing'|'bat_cape', k) — k 는 sims/cosmetic-sim.html anchorsOf 와 같은 모양
//  캐릭터 몸은 시안과 같은 근사(buildAnimalHead·plushMat 는 실제 모듈). 블룸은 게임 값(임계 0.85·반경 0.9,
//  세기 낮 0.5 / 밤 1.0)과 ACES 1.05 를 그대로 건다 — 밤 블룸 번짐을 여기서 미리 본다.
//  쿼리: ?scene=trail|tools|cape · ?mode=day|night · ?t=3.1(자국 시간, 고정 스텝) · ?bloom=0
// =============================================================
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { buildAnimalHead, plushMat } from '../js/animal-faces.js';
import { ARM_AIM_R, ARM_AIM_L, TOOL_QREST_HOLD, TOOL_GRIP } from '../js/data/character.js';
import { gripForwardZ, pawRadius, ARM_R_K } from '../js/data/grip.js';
import { backAnchor, sideAnchor, headAnchor, neckAnchor, neckR } from '../js/cosmetics/anchors.js';
import { buildCosmetic } from '../js/cosmetics/art.js';
import { buildTrailMark, TRAIL_STEP, TRAIL_FADE, TRAIL_SIDE, TRAIL_CAP } from '../js/cosmetics/trail.js';
import { createTrailFx } from '../js/cosmetics/trail-fx.js';
import { buildToolSkin, buildUmbrella, setToolSkinNight } from '../js/cosmetics/tool-skins.js';
import { SKIN_TOOLS } from '../js/cosmetics/tool-skin-rules.js';

const q = new URLSearchParams(location.search);
const SCENE = q.get('scene') || 'trail', NIGHT = q.get('mode') === 'night', T_END = +(q.get('t') ?? 3.1), BLOOM = q.get('bloom') !== '0';
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const M = (geo, mat, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); return m; };
const portrait = () => innerWidth < innerHeight * 0.95;

document.getElementById('bar').innerHTML = ['trail', 'tools', 'cape'].flatMap(s => ['day', 'night'].map(md =>
  `<a class="${s === SCENE && (md === 'night') === NIGHT ? 'on' : ''}" href="?scene=${s}&mode=${md}&t=${T_END}">${s} · ${md === 'night' ? '🌙' : '☀️'}</a>`)).join('');

// ── 캐릭터(시안과 같은 근사 몸 + 실제 머리) ────────────────────
const ANIMALS = {
  fox:    { id: 'fox',    body: 0xf0883a, belly: 0xf9ecd8, ear: 0x8a4a24, R: 0.52, bs: [0.90, 1.08, 0.90], HR: 0.37, HY: 1.26, tail: 'bushy' },
  rabbit: { id: 'rabbit', body: 0xf3eeea, belly: 0xffffff, ear: 0xf0c0c8, R: 0.46, bs: [1.00, 0.96, 1.00], HR: 0.39, HY: 1.12, tail: 'puff' },
  cat:    { id: 'cat',    body: 0x9fa0c2, belly: 0xf2f2f8, ear: 0xf0b0b8, R: 0.50, bs: [0.88, 1.10, 0.88], HR: 0.36, HY: 1.25, tail: 'long' },
  bear:   { id: 'bear',   body: 0x936a44, belly: 0xd2b38a, ear: 0x6a4828, R: 0.63, bs: [1.08, 1.00, 1.06], HR: 0.44, HY: 1.34, tail: 'stub' },
};
const clay = (color) => new THREE.MeshStandardMaterial({ color, roughness: 0.95, metalness: 0 });
function taperedTube(pts, radiusFn, segs = 24, radial = 8) {
  const curve = new THREE.CatmullRomCurve3(pts), frames = curve.computeFrenetFrames(segs, false), pos = [], idx = [];
  for (let i = 0; i <= segs; i++) {
    const P = curve.getPointAt(i / segs), N = frames.normals[i], B = frames.binormals[i], r = radiusFn(i / segs);
    for (let j = 0; j < radial; j++) { const A = j / radial * Math.PI * 2, ca = Math.cos(A), sa = Math.sin(A); pos.push(P.x + (N.x * ca + B.x * sa) * r, P.y + (N.y * ca + B.y * sa) * r, P.z + (N.z * ca + B.z * sa) * r); }
  }
  for (let i = 0; i < segs; i++) for (let j = 0; j < radial; j++) { const a = i * radial + j, b = i * radial + (j + 1) % radial, c = (i + 1) * radial + j, d = (i + 1) * radial + (j + 1) % radial; idx.push(a, c, b, b, c, d); }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.setIndex(idx); geo.computeVertexNormals();
  return { geo, end: curve.getPointAt(1) };
}
function buildAnimal(a) {
  const g = new THREE.Group(), R = a.R, bs = a.bs, bodyY = R * bs[1] + 0.02;
  const body = M(new THREE.SphereGeometry(R, 32, 24), plushMat(a.body), 0, bodyY, 0); body.scale.set(...bs); g.add(body);
  const belly = M(new THREE.SphereGeometry(R * 0.62, 24, 18), plushMat(a.belly), 0, bodyY - R * 0.16, R * 0.55); belly.scale.set(1, 1.1, 0.6); g.add(belly);
  g.add(buildAnimalHead(a.id, { HR: a.HR, HY: a.HY, body: a.body, belly: a.belly }));
  [-1, 1].forEach(s => g.add(M(new THREE.CapsuleGeometry(R * 0.17, R * 0.34, 4, 8), plushMat(a.body), s * R * 0.36, bodyY - R * 0.92, R * 0.10)));
  const tail = new THREE.Group(); tail.position.set(0, bodyY + R * 0.10, -R * bs[2] * 0.86); g.add(tail);
  const tm = plushMat(a.body), V = (x, y, z) => V3(R * x, R * y, R * z);
  const tube = (pts, rad) => { const { geo, end } = taperedTube(pts, rad); tail.add(new THREE.Mesh(geo, tm)); return end; };
  if (a.tail === 'bushy') {
    const rad = u => R * (0.29 + 0.05 * Math.sin(Math.PI * u)) * (1 - 0.38 * Math.max(0, u - 0.70) / 0.30);
    const e = tube([V(0, -0.05, 0.10), V(0, 0.06, -0.30), V(0, 0.30, -0.50), V(0, 0.60, -0.58), V(0, 0.88, -0.54)], rad);
    tail.add(M(new THREE.SphereGeometry(rad(1) * 0.98, 12, 9), plushMat(a.belly), e.x, e.y, e.z));
  } else if (a.tail === 'long') {
    const rad = u => R * (0.17 * (1 - u * 0.62) + 0.02);
    const e = tube([V(0, -0.05, 0.10), V(0, 0.08, -0.36), V(0, 0.45, -0.60), V(0, 0.90, -0.58), V(0, 1.22, -0.36)], rad);
    tail.add(M(new THREE.SphereGeometry(rad(1), 10, 8), tm, e.x, e.y, e.z));
  } else if (a.tail === 'puff') tail.add(M(new THREE.SphereGeometry(R * 0.30, 12, 10), plushMat(a.belly), 0, R * 0.04, -R * 0.06));
  else tail.add(M(new THREE.SphereGeometry(R * 0.17, 10, 8), tm, 0, R * 0.06, -R * 0.02));
  const arms = {}, ar = R * ARM_R_K, al = R * 0.32;
  [1, -1].forEach(side => {
    const pivot = new THREE.Group(); pivot.rotation.order = 'YXZ'; pivot.position.set(side * R * 0.85 * bs[0], bodyY + R * 0.54, R * 0.20); g.add(pivot);
    const aim = new THREE.Group(); aim.quaternion.copy(side > 0 ? ARM_AIM_R : ARM_AIM_L); pivot.add(aim);
    aim.add(M(new THREE.CapsuleGeometry(ar, al, 4, 8), plushMat(a.body), 0, -(al / 2 + ar * 0.4), 0));
    aim.add(M(new THREE.SphereGeometry(pawRadius(R), 10, 8), clay(a.ear), 0, -(al + ar * 0.9), 0));
    const hand = new THREE.Group(); hand.position.y = -(al + ar * 0.9); aim.add(hand);
    arms[side > 0 ? 'R' : 'L'] = { pivot, hand };
  });
  g.userData = { a, R, bs, bodyY, arms };
  return g;
}
// cosmetic-sim anchorsOf 와 같은 모양
function anchorsOf(a) {
  const R = a.R, bs = a.bs, HR = a.HR, HY = a.HY, bodyY = R * bs[1] + 0.02;
  return { R, HR, HY, bs, bodyY, tail: a.tail, head: headAnchor(HY), neck: neckAnchor(HR, HY), neckR: neckR(HR),
    back: backAnchor(bs, R, bodyY), side: sideAnchor(bs, R, bodyY) };
}
// 게임 poseHeldTool 평상시 자세 — TOOL_GRIP · TOOL_QREST_HOLD
function mountTool(ch, tool, toolId) {
  const grip = TOOL_GRIP[toolId], p = grip.p.clone();
  if (grip.pawRel) p.z = gripForwardZ(ch.userData.R);
  tool.quaternion.copy(TOOL_QREST_HOLD).multiply(grip.q);
  tool.position.copy(p).applyQuaternion(TOOL_QREST_HOLD);
  ch.userData.arms.R.hand.add(tool);
}

// ── 렌더러·조명(게임 톤매핑 + 블룸) ─────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(NIGHT ? 0x232a52 : 0xdfe9ee);
document.body.style.background = NIGHT ? '#232a52' : '#dfe9ee';
const camera = new THREE.PerspectiveCamera(24, 1, 0.05, 200);
scene.add(new THREE.HemisphereLight(NIGHT ? 0x6a78b0 : 0xe6f2ff, NIGHT ? 0x3a4466 : 0x8a9a7a, NIGHT ? 1.6 : 1.6));
const sun = new THREE.DirectionalLight(NIGHT ? 0x9fb0ff : 0xfff1dc, NIGHT ? 0.8 : 1.6); sun.position.set(3, 7, 6); scene.add(sun);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
if (BLOOM) composer.addPass(new UnrealBloomPass(new THREE.Vector2(256, 256), NIGHT ? 1.0 : 0.5, 0.9, 0.85));
composer.addPass(new OutputPass());
const viewH = () => innerHeight - document.getElementById('bar').offsetHeight;

const world = new THREE.Group(); scene.add(world);
const labels = [];
function addLabel(pos, html) { const pin = new THREE.Object3D(); pin.position.copy(pos); world.add(pin); const el = document.createElement('div'); el.className = 'tag'; el.innerHTML = html; document.getElementById('labels').appendChild(el); labels.push({ el, pos }); }
const _box = new THREE.Box3(), _s = new THREE.Vector3(), _c = new THREE.Vector3();
function fit(elev, pad = 1.08) {
  world.updateMatrixWorld(true); _box.setFromObject(world); _box.getSize(_s); _box.getCenter(_c);
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), aspect = innerWidth / viewH();
  const d = Math.max(_s.y / (2 * t), _s.x / (2 * t * aspect)) * pad + _s.z / 2;
  camera.position.set(_c.x, _c.y + Math.sin(elev) * d, _c.z + Math.cos(elev) * d); camera.lookAt(_c);
}
const placeAt = (cols, i, gx, gy) => ({ x: ((i % cols) - (cols - 1) / 2) * gx, y: -Math.floor(i / cols) * gy });
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ── 🎃🦇 자국: game.js updateTrail 과 같은 순서로 고정 스텝 진행 ──────────
const lanes = [];
function buildTrailScene() {
  const ids = [['pumpkin_glow', '🎃 호박등'], ['bat_swirl', '🦇 박쥐 회오리']], P = portrait();
  ids.forEach(([id, name], i) => {
    const lane = new THREE.Group(); lane.position.set(P ? (i - 0.5) * 1.3 : (i - 0.5) * 3.2, 0, 0); world.add(lane);
    const ground = M(new THREE.PlaneGeometry(P ? 1.2 : 2.6, 7), new THREE.MeshStandardMaterial({ color: NIGHT ? 0x5d7d68 : 0x9cc58a, roughness: 1 }), 0, 0, -0.6);
    ground.rotation.x = -Math.PI / 2; lane.add(ground);
    const fx = createTrailFx(THREE, { cap: 64, rnd: mulberry(7 + i) }); lane.add(fx.points);
    const ch = buildAnimal(ANIMALS.fox); ch.scale.setScalar(P ? 0.5 : 0.7); ch.rotation.y = Math.PI; lane.add(ch);
    lanes.push({ id, name, lane, fx, ch, live: [], last: null, side: 1, z: 2.4 });
  });
}
function stepTrail(dt) {
  const nightLevel = NIGHT ? 1 : 0, SPEED = 1.5;
  lanes.forEach(L => {
    L.z -= SPEED * dt; L.ch.position.set(0, 0, L.z);
    const pos = V3(0, 0, L.z);
    if (!L.last || pos.distanceTo(L.last) >= TRAIL_STEP) {
      L.last = pos.clone(); L.side = -L.side;
      const m = buildTrailMark(THREE, L.id, 1, 'fox');
      m.position.set(L.side * TRAIL_SIDE, 0, L.z); m.rotation.y = L.side * 0.2; L.lane.add(m); L.live.push({ m, t: 0 });
      L.fx.onStamp(L.id, m.position, { nightLevel });
      while (L.live.length > TRAIL_CAP) L.lane.remove(L.live.shift().m);
    }
    for (let i = L.live.length - 1; i >= 0; i--) {
      const e = L.live[i]; e.t += dt; const k = Math.max(0, 1 - e.t / TRAIL_FADE);
      e.m.traverse(o => { if (o.material) o.material.opacity = k; });
      if (k <= 0) { L.lane.remove(e.m); L.live.splice(i, 1); }
    }
    L.fx.update(dt, { nightLevel });
  });
}

// ── 🌙🌽 도구 9종 + 쥔 모습 + 우산 ─────────────────────────────
const THEMES = [['batnight', '🦇 달밤 보라'], ['harvest', '🌽 수확제']];
function buildToolsScene() {
  const P = portrait(), cols = P ? 5 : 9, rowH = P ? 6.2 : 4.7;
  THEMES.forEach(([theme, name], ti) => {
    const row = new THREE.Group(); row.position.y = -ti * rowH; world.add(row);
    SKIN_TOOLS.forEach((toolId, j) => {
      const t = buildToolSkin(THREE, theme, toolId); if (!t) { console.error('no skin', theme, toolId); return; }
      setToolSkinNight(t, NIGHT ? 1 : 0);
      const holder = new THREE.Group(); holder.add(t);
      t.updateMatrixWorld(true); _box.setFromObject(t); _box.getSize(_s); _box.getCenter(_c); t.position.sub(_c);
      holder.scale.setScalar(Math.min(1.5, 0.9 / Math.max(_s.y, _s.x * 0.9, 0.2)));
      const p = placeAt(cols, j, P ? 0.95 : 1.0, 1.1); holder.position.set(p.x, p.y, 0); holder.rotation.y = 0.5; row.add(holder);
    });
    const baseY = -Math.ceil(9 / cols) * 1.1 - 0.4;
    [['fox', 'axe'], ['bear', 'water']].forEach(([an, tool], k) => {   // 쥔 모습
      const ch = buildAnimal(ANIMALS[an]), t = buildToolSkin(THREE, theme, tool); setToolSkinNight(t, NIGHT ? 1 : 0); mountTool(ch, t, tool);
      ch.position.set((k - 1) * 1.6 - 0.3, baseY - 1.4, 0); ch.rotation.y = 0.55; row.add(ch);
    });
    const u = buildUmbrella(THREE, theme);   // 우산은 따로 세워 모양만 본다(쥐는 자세·높이는 게임 스모크에서)
    setToolSkinNight(u, NIGHT ? 1 : 0); u.scale.setScalar(0.85); u.rotation.x = 0.35; u.position.set(P ? 1.5 : 2.2, baseY - 1.5, 0); row.add(u);
    addLabel(row.localToWorld(V3(0, 0.75, 0)), `${name}<small>tools_${theme} · 9종 + 쥔 모습 + 우산</small>`);
  });
}

// ── 🦇 망토 2종 × 4동물 (뒤 3/4) ───────────────────────────────
function buildCapeScene() {
  const P = portrait(), ids = [['bat_wing', '🦇 펼친 박쥐 날개'], ['bat_cape', '🦇 박쥐 망토']], an = ['fox', 'rabbit', 'cat', 'bear'];
  ids.forEach(([id, name], i) => an.forEach((a, j) => {
    const A = ANIMALS[a], k = anchorsOf(A), ch = buildAnimal(A), c = buildCosmetic(THREE, id, k);
    if (!c) { console.error('no cosmetic', id); return; }
    c.position.set(k.back.x, k.back.y, k.back.z); ch.add(c);
    const gr = new THREE.Group(); gr.add(ch); gr.rotation.y = Math.PI * 0.82;
    const x = P ? (j % 2 - 0.5) * 2.3 : (j - 1.5) * 2.3, y = P ? -(i * 2 + Math.floor(j / 2)) * 2.45 : -i * 2.6;
    gr.position.set(x, y, 0); world.add(gr);
    if (j === 0) addLabel(V3(0, y + 2.05, 0), `${name}<small>${id} · buildCosmetic</small>`);
  }));
}

function layout() {
  renderer.setSize(innerWidth, viewH()); composer.setSize(innerWidth, viewH());
  camera.aspect = innerWidth / viewH(); camera.updateProjectionMatrix();
}
layout();
if (SCENE === 'trail') {
  buildTrailScene();
  for (let s = 0; s < T_END; s += 1 / 60) stepTrail(1 / 60);
  // 게임처럼 비스듬히(약 41°) 뒤에서 — 걸어온 자국을 담는다
  const P = portrait(), cz = lanes[0].z + 1.1;
  camera.fov = 26; camera.updateProjectionMatrix();
  camera.position.set(0, P ? 8.4 : 5.6, cz + (P ? 6.2 : 4.9)); camera.lookAt(0, 0.1, P ? cz + 0.2 : cz);
  lanes.forEach(L => addLabel(L.lane.localToWorld(V3(0, 1.5, L.z - 0.2)), `${L.name}<small>${L.id} · nightLevel ${NIGHT ? 1 : 0} · t=${T_END}s</small>`));
} else if (SCENE === 'tools') { buildToolsScene(); fit(0.08, 1.06); }
else { buildCapeScene(); fit(0.12, 1.06); }

const _p = V3();
function render() {
  if (BLOOM) composer.render(); else renderer.render(scene, camera);
  labels.forEach(l => { _p.copy(l.pos).project(camera); l.el.style.left = (_p.x + 1) / 2 * innerWidth + 'px'; l.el.style.top = (1 - _p.y) / 2 * viewH() + 'px'; });
}
render();
window.__verify = { render, scene, camera };
window.__ready = true;
</script>
