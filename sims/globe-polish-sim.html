<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>지구본 대륙 시안</title>
<style>
body { margin:0; padding:20px; background:#2a221c; color:#f3e9d8; font-family:'Apple SD Gothic Neo',system-ui,sans-serif; }
h1 { margin:0 0 14px; font-size:20px; }
.row { display:flex; gap:14px; }
.cell { background:#3a3028; border-radius:14px; overflow:hidden; width:360px; }
.cell b { display:block; padding:10px 12px 2px; font-size:15px; color:#ffd27a; }
.cell small { display:block; padding:0 12px 12px; font-size:12px; opacity:.8; line-height:1.45; }
canvas { display:block; }
</style>
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.js"}}</script>
</head>
<body>
<h1>지구본 · bk_globe · 대륙 모양 시안</h1>
<div class="row" id="row"></div>
<script type="module">
import * as THREE from 'three';
import { bakeGroup, part } from '../js/dream/art.js';
import { landmasses, landmasses2, gridLines, poles, facetLand, facetGlobe } from './globe-polish/globe-art.mjs';
const C = { walnut: 0x6e4a32, walnutDk: 0x4e3424, green: 0x3f6a4e, greenDk: 0x2c4c38, wine: 0x8e2f3c, cream: 0xe2d4b6, creamDk: 0xc8b48e, brass: 0xc99a48 };
const TAU = Math.PI * 2;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const tube = (pts, r) => new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(p => V(...p))), 30, r, 8, false);
function oldDots(g, R) {
  const spots = [[0.5, 0.3, 0.35], [0.2, 1.2, 0.28], [-0.4, 0.8, 0.3], [0.9, 2.4, 0.22], [-0.2, 2.9, 0.33], [0.3, 4.0, 0.3], [-0.7, 4.6, 0.2], [0.6, 5.4, 0.25], [-0.1, 5.9, 0.18]];
  const cols = [C.green, C.wine, C.greenDk];
  spots.forEach(([lat, lon, s], i) => {
    const d = V(Math.cos(lat) * Math.cos(lon), Math.sin(lat), Math.cos(lat) * Math.sin(lon));
    const m = part(g, new THREE.SphereGeometry(R * 1.012, 18, 6, 0, TAU, 0, s * 0.9), cols[i % 3]);
    m.quaternion.setFromUnitVectors(V(0, 1, 0), d); m.scale.set(1.25, 1, 0.8);
  });
}
const VARIANTS = [
  ['B 지금', '짙은 초록 바다 · 크림 대륙 다섯 덩어리 · 놋쇠 경위선', C.greenDk, g => { landmasses(g, 0.25, [C.cream]); gridLines(g, 0.25, C.brass); }],
  ['B+ 해안·섬', '큰 원 대신 작은 원을 촘촘히 겹쳐 해안선을 매끈하게 · 그린란드·영국·일본·마다가스카르·뉴질랜드·동남아 섬 추가', C.greenDk, g => { landmasses2(g, 0.25, [C.cream]); gridLines(g, 0.25, C.brass); }],
  ['C 각진 해안선', '잘게 나눈 구에서 땅 삼각형만 남겨 저폴리 해안선 · 섬 포함 · 놋쇠 경위선', null, g => { facetGlobe(g, 0.25, C.greenDk, C.cream); gridLines(g, 0.25, C.brass); }],
  ['B+ 해안·섬·극지', 'B+ 에 크림 극지 모자를 더해 위에서 볼 때도 지구본으로 읽히게', C.greenDk, g => { landmasses2(g, 0.25, [C.cream]); gridLines(g, 0.25, C.brass); poles(g, 0.25, C.cream); }],
];
function build(ocean, lands) {
  const s = new THREE.Group(), R = 0.25, cy = 0.56 + R;
  [0, 1, 2].forEach(i => {
    const a = i / 3 * TAU + Math.PI / 2, ca = Math.cos(a), sa = Math.sin(a);
    part(s, tube([[ca * R * 1.18, cy, sa * R * 1.18], [ca * 0.24, 0.45, sa * 0.24], [ca * 0.22, 0.2, sa * 0.22], [ca * 0.29, 0.02, sa * 0.29]], 0.022), C.walnut);
  });
  part(s, new THREE.TorusGeometry(0.215, 0.012, 6, 30), C.walnutDk, 0, 0.2, 0).rotation.x = Math.PI / 2;
  const g = new THREE.Group(); g.position.set(0, cy, 0); g.rotation.z = 0.41; s.add(g);
  if (ocean != null) part(g, new THREE.SphereGeometry(R, 32, 24), ocean);
  lands(g);
  part(g, new THREE.TorusGeometry(R * 1.08, R * 0.035, 8, 48, Math.PI * 1.25), C.brass).rotation.set(0, Math.PI / 2, -Math.PI * 0.125);
  part(s, new THREE.TorusGeometry(R * 1.18, 0.02, 6, 48), C.brass, 0, cy, 0).rotation.x = Math.PI / 2;
  const m = new THREE.Mesh(bakeGroup(s), new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9 }));
  m.castShadow = true; return m;
}
for (const [name, desc, ocean, lands] of VARIANTS) {
  const cell = document.createElement('div'); cell.className = 'cell';
  const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setPixelRatio(2); r.setSize(360, 420);
  r.shadowMap.enabled = true; r.outputColorSpace = THREE.SRGBColorSpace;
  const sc = new THREE.Scene(); sc.background = new THREE.Color(0xb59a78);
  sc.add(new THREE.HemisphereLight(0xfff4e0, 0x6b5440, 1.6));
  const sun = new THREE.DirectionalLight(0xfff0d8, 2.2); sun.position.set(2, 4, 3); sun.castShadow = true; sc.add(sun);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), new THREE.MeshStandardMaterial({ color: 0x8a5a38 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; sc.add(floor);
  const near = build(ocean, lands); near.position.set(0, 0, 0.3); near.rotation.y = 0.5; sc.add(near);
  const cam = new THREE.PerspectiveCamera(32, 360 / 420, 0.1, 50); cam.position.set(0.6, 1.5, 1.6); cam.lookAt(0, 0.6, 0);
  r.render(sc, cam);
  const r2 = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r2.setPixelRatio(2); r2.setSize(360, 200); r2.outputColorSpace = THREE.SRGBColorSpace;
  const cam2 = new THREE.PerspectiveCamera(30, 360 / 200, 0.1, 50); cam2.position.set(0.4, 3.2, 2.2); cam2.lookAt(0, 0.6, 0.3);
  r2.render(sc, cam2);
  cell.append(r.domElement, r2.domElement);
  cell.insertAdjacentHTML('beforeend', `<b>${name}</b><small>${desc}<br>위: 가까이 · 아래: 실제 실내 카메라 거리</small>`);
  document.getElementById('row').append(cell);
}
document.title = 'ready';
</script>
</body>
</html>
