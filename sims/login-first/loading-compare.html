<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로딩 화면 시안</title>
<style>
  :root { --ink: #4a5a4f; }
  body { margin: 0; padding: 24px; background: #1d2420; color: #e8efe9; font-family: 'Segoe UI', system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 16px; }
  .row { display: grid; grid-template-columns: 640px 220px; gap: 20px; align-items: start; margin-bottom: 36px; }
  .label { grid-column: 1 / -1; font-size: 15px; font-weight: 700; margin-bottom: -8px; }
  .label span { font-weight: 400; opacity: .7; margin-left: 8px; font-size: 13px; }
  .frame { position: relative; overflow: hidden; border-radius: 10px; background: #cfd8c4 url("../../assets/social/login-bg.webp") center / cover no-repeat; display: grid; place-items: center; }
  .pc { width: 640px; height: 400px; }
  .mo { width: 220px; height: 476px; }
  .frame::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(20,35,28,.05), rgba(20,35,28,.38)); }
  .frame > * { position: relative; }
  .mo .scale { transform: scale(.82); }

  .a { display: inline-flex; align-items: center; gap: 12px; padding: 13px 22px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.16); backdrop-filter: blur(16px) saturate(1.2);
    box-shadow: 0 20px 60px rgba(30,50,40,.35); color: #fff; font-size: 15px; font-weight: 600; letter-spacing: -.02em; text-shadow: 0 1px 8px rgba(0,0,0,.25); white-space: nowrap; }
  .dots { display: inline-flex; gap: 5px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: #fff; opacity: .35; animation: blink 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 40% { opacity: 1; transform: translateY(-2px); } }

  .b { display: grid; justify-items: center; gap: 10px; color: #fff; text-shadow: 0 2px 14px rgba(0,0,0,.3); align-self: end; margin-bottom: 18%; }
  .b strong { font-size: 30px; font-weight: 800; letter-spacing: -.05em; }
  .b small { font-size: 13px; opacity: .88; letter-spacing: -.01em; }
  .bar { width: 150px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.28); overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; border-radius: 3px; background: #fff; animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }

  .c { display: grid; justify-items: center; gap: 12px; padding: 22px 30px 20px; border-radius: 24px; min-width: 210px;
    border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.16); backdrop-filter: blur(16px) saturate(1.2);
    box-shadow: 0 20px 60px rgba(30,50,40,.35); color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,.25); }
  .leaf { font-size: 30px; animation: sway 2.4s ease-in-out infinite; transform-origin: 50% 90%; }
  @keyframes sway { 50% { transform: rotate(-10deg); } }
  .c strong { font-size: 16px; font-weight: 700; letter-spacing: -.03em; }
  .c .bar { width: 120px; }
  .frame:has(.b) { place-items: end center; }
  .b { margin-bottom: 0; padding-bottom: 16%; }
  .pc .b { padding-bottom: 9%; }
  .mo .c { min-width: 0; padding: 18px 20px 16px; }
  .mo .c strong { font-size: 14px; }
</style>
</head>
<body>
<h1>로딩 화면 시안 (왼쪽 PC, 오른쪽 모바일)</h1>

<div class="row">
  <div class="label">A. 유리 알약<span>로그인 카드와 같은 유리, 한 줄 + 점 세 개</span></div>
  <div class="frame pc"><div class="a">고요한 숲 불러오는 중 <span class="dots"><i></i><i></i><i></i></span></div></div>
  <div class="frame mo"><div class="scale"><div class="a">고요한 숲 불러오는 중 <span class="dots"><i></i><i></i><i></i></span></div></div></div>
</div>

<div class="row">
  <div class="label">B. 이름 + 가는 막대<span>장면 위에 큰 이름, 아래쪽 1/3 자리</span></div>
  <div class="frame pc"><div class="b"><strong>고요한 숲</strong><div class="bar"><i></i></div><small>불러오는 중…</small></div></div>
  <div class="frame mo"><div class="b"><strong>고요한 숲</strong><div class="bar"><i></i></div><small>불러오는 중…</small></div></div>
</div>

<div class="row">
  <div class="label">C. 유리 카드<span>로그인 카드 축소판, 흔들리는 잎 + 막대</span></div>
  <div class="frame pc"><div class="c"><span class="leaf">🌿</span><strong>고요한 숲 불러오는 중</strong><div class="bar"><i></i></div></div></div>
  <div class="frame mo"><div class="scale"><div class="c"><span class="leaf">🌿</span><strong>고요한 숲 불러오는 중</strong><div class="bar"><i></i></div></div></div></div>
</div>
</body>
</html>
