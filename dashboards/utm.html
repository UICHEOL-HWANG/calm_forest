<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>고요한 숲 · UTM 링크</title>
<meta name="description" content="UTM 링크 생성기 — 시트 허용값으로 만들고 링크내역에 자동 기록, 짧은 링크와 클릭 수" />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<link rel="stylesheet" href="_dash.css" />
<link rel="stylesheet" href="_admin.css" />
<style>
  #msg .msg-char { display: block; width: 72px; height: 72px; object-fit: contain; margin: 0 auto 8px; }
  .uwrap { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 22px; margin-top: 18px; align-items: start; }
  .card { background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
  .card h2 { margin: 0 0 12px; font-size: 14px; font-weight: 800; }
  .f { display: grid; gap: 5px; margin-bottom: 12px; }
  .f label { font-size: 12px; font-weight: 700; color: var(--ink-2); }
  .f small { font-size: 11px; color: var(--ink-3); }
  .f select, .f input { font: inherit; font-size: 14px; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-0); color: var(--ink); width: 100%; box-sizing: border-box; }
  .f select:focus, .f input:focus { outline: 2px solid color-mix(in srgb, var(--s1) 45%, transparent); outline-offset: 1px; }
  .two-f { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .lands { display: flex; flex-wrap: wrap; gap: 6px; }
  .lands label { white-space: nowrap; flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; cursor: pointer; background: var(--surface-0); user-select: none; }
  .lands input { accent-color: var(--s1); margin: 0; }
  .lands label:has(input:checked) { border-color: var(--s1); background: color-mix(in srgb, var(--s1) 12%, transparent); }
  .btn { font: inherit; font-size: 13px; font-weight: 700; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-1); color: var(--ink); cursor: pointer; }
  .btn:hover { background: var(--surface-2); }
  .btn.pri { background: var(--s1); border-color: var(--s1); color: #fff; width: 100%; padding: 11px; font-size: 14px; }
  .btn.pri:disabled { opacity: .55; cursor: default; }
  .btn.sm { font-size: 12px; padding: 5px 9px; }
  .err { color: var(--down); font-size: 12.5px; font-weight: 700; min-height: 18px; margin-top: 8px; }
  .res { display: grid; gap: 10px; }
  .res:empty::before { content: '만든 링크가 여기에 나와요.'; color: var(--ink-3); font-size: 13px; }
  .lk { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 6px; background: var(--surface-0); }
  .lk-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; }
  .lk-s { display: flex; gap: 8px; align-items: center; }
  .lk-s code { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--s1); overflow-wrap: anywhere; flex: 1; }
  .lk-f { font-family: var(--mono); font-size: 11px; color: var(--ink-3); overflow-wrap: anywhere; }
  .lk-q { display: none; justify-self: start; background: #fff; padding: 8px; border-radius: 8px; }
  .lk-q.on { display: block; }
  .lk-q img { display: block; width: 156px; height: 156px; image-rendering: pixelated; }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .recent { margin-top: 22px; }
  table.rt { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .rt th { text-align: left; font-size: 11px; color: var(--ink-3); font-weight: 700; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .rt td { padding: 8px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
  .rt td.n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 800; }
  .rt .mut { color: var(--ink-3); }
  .rt code { font-family: var(--mono); font-size: 11.5px; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--surface-0); padding: 9px 14px; border-radius: 10px; font-size: 13px; font-weight: 700; opacity: 0; transition: .2s; pointer-events: none; }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 860px) {
    .uwrap { grid-template-columns: minmax(0, 1fr); }
    .rt .hide-m { display: none; }
  }
</style>
</head>
<body>
  <div class="ah">
    <a class="crumb" href="index.html">← 관리자 홈</a>
  </div>
  <div class="ah" style="margin-top:6px">
    <img class="brand" src="img/chars/fox.png" alt="" />
    <h1>UTM 링크</h1>
    <div class="meta" id="who">관리자 계정을 확인하는 중…</div>
  </div>

  <div id="msg"></div>

  <div id="dash" hidden>
    <div class="uwrap">
      <form class="card" id="form" autocomplete="off">
        <h2>새 링크 만들기</h2>
        <div class="two-f">
          <div class="f">
            <label for="source">utm_source · 어디서</label>
            <select id="source" required></select>
          </div>
          <div class="f">
            <label for="medium">utm_medium · 어떤 형태</label>
            <select id="medium" required></select>
          </div>
        </div>
        <div class="f">
          <label for="campaign">utm_campaign · 무슨 홍보</label>
          <input id="campaign" list="campaignList" placeholder="예: halloween_event" required maxlength="40" />
          <datalist id="campaignList"></datalist>
          <small>소문자·숫자·밑줄만. 대문자와 띄어쓰기는 자동으로 바뀌어요.</small>
        </div>
        <div class="f">
          <label for="content">utm_content · 어느 게시물 (선택)</label>
          <input id="content" list="contentList" placeholder="예: post · story · profile_bio" maxlength="40" />
          <datalist id="contentList"></datalist>
        </div>
        <div class="f">
          <label>어디로 보낼까요</label>
          <div class="lands" id="lands"></div>
        </div>
        <div class="f">
          <label for="memo">메모 (시트 H열)</label>
          <input id="memo" placeholder="예: 스레드 할로윈 게시물" maxlength="300" />
        </div>
        <button class="btn pri" id="submit" type="submit">링크 만들고 시트에 기록</button>
        <div class="err" id="err" aria-live="polite"></div>
      </form>

      <section class="card">
        <h2>방금 만든 링크</h2>
        <div class="res" id="res"></div>
      </section>
    </div>

    <section class="card recent">
      <h2>최근 링크 <span class="mut" style="font-weight:600;font-size:12px">· 시트 링크내역 최근 30줄 · 클릭은 짧은 링크로 들어온 수(봇 제외)</span></h2>
      <div class="scroll-x">
        <table class="rt">
          <thead><tr><th>날짜</th><th>source / medium</th><th>campaign · content</th><th class="hide-m">메모</th><th>링크</th><th>클릭</th></tr></thead>
          <tbody id="recent"></tbody>
        </table>
      </div>
    </section>
  </div>
  <div class="toast" id="toast"></div>

  <script type="module" src="js/admin-utm.js"></script>
</body>
</html>
