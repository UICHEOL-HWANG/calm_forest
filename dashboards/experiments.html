<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>고요한 숲 · 실험 (A/B)</title>
<meta name="description" content="고요한 숲 실험 레지스트리. 사전 기준 · 배정 비율 검사 · 효과 크기와 신뢰구간 · 판정" />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="_dash.css" />
<link rel="stylesheet" href="_admin.css" />
<style>
  #msg .msg-char { display: block; width: 72px; height: 72px; object-fit: contain; margin: 0 auto 8px; }
  code { font-family: var(--mono); font-size: 12px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
  .ok { color: var(--up); font-weight: 800; } .bad { color: var(--down); font-weight: 800; }
  #view { display: grid; gap: 20px; margin-top: 20px; }
  .ci, .forest, .gantt { display: block; width: 100%; height: auto; }
  .gantt { min-width: 780px; }
  .gantt a { cursor: pointer; }

  .lead { display: grid; gap: 12px; }
  .lead-h { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; }
  .lead-h .seg { margin-left: auto; }
  details.rules { border-top: 1px solid var(--line-soft); padding-top: 12px; font-size: 13px; color: var(--ink-2); }
  details.rules summary { cursor: pointer; font-weight: 800; }
  details.rules ol { margin: 10px 0 0; padding-left: 20px; display: grid; gap: 5px; }

  .bd-h { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  .bd-h h2 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -.3px; }
  .bd-h .seg { margin-left: auto; }
  .bd { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px; }
  .xc { display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 18px; background: var(--surface-1); border: 1px solid var(--line); box-shadow: var(--shadow);
        color: inherit; text-decoration: none; transition: transform .18s cubic-bezier(.16, 1, .3, 1), border-color .18s; }
  .xc:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--s1) 45%, var(--line)); }
  .xc:active { transform: translateY(0) scale(.99); }
  .xc .q { font-size: 12.5px; color: var(--ink-3); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .xc .big { display: flex; align-items: baseline; gap: 8px; }
  .xc .big b { font-size: 26px; font-weight: 800; letter-spacing: -.8px; }
  .xc .big span { font-size: 12px; color: var(--ink-3); }
  .xc .ft { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line-soft); margin-top: auto; }

  .to-board { font-size: 13.5px; font-weight: 700; color: var(--ink-2); text-decoration: none; justify-self: start; padding: 7px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-1); }
  .to-board:hover { color: var(--ink); border-color: var(--ink-3); }
  .fc { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 26px; align-items: start; }
  .fl { position: sticky; top: calc(var(--nav-h, 56px) + 16px); display: grid; gap: 2px; max-height: calc(100dvh - var(--nav-h, 56px) - 32px); overflow: auto; padding-right: 4px; }
  .fl .eyebrow { padding: 12px 10px 4px; }
  .fi { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; padding: 9px 10px; border-radius: 12px; border: 1px solid transparent; color: inherit; text-decoration: none; align-items: center; }
  .fi > span:last-child { min-width: 0; }
  .fi:hover { background: var(--surface-2); }
  .fi.on { background: var(--surface-1); border-color: var(--line); box-shadow: var(--shadow); }
  .fi b { display: block; font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }

  .dt { display: grid; gap: 20px; min-width: 0; }
  .dt-h { display: grid; gap: 8px; }
  .dt-h h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.6px; }
  .dt-h .q { margin: 0; font-size: 14.5px; color: var(--ink-2); line-height: 1.6; max-width: 72ch; text-wrap: pretty; }
  .warn { margin: 0; font-size: 13px; color: var(--down); background: color-mix(in srgb, var(--down) 8%, transparent); border-radius: 10px; padding: 9px 12px; }
  .hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 28px; padding: 22px 24px; border-radius: 18px; background: var(--surface-1); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .hero > div { display: grid; gap: 8px; align-content: start; min-width: 0; }
  .hero .bn { font-size: 46px; font-weight: 800; letter-spacing: -1.8px; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .hero.win .bn { color: var(--up); }
  .hero.lose .bn { color: var(--down); }
  .hero .rg { font-size: 13px; color: var(--ink-3); }
  .say { margin: 0; font-size: 13.5px; color: var(--ink-2); line-height: 1.65; text-wrap: pretty; }
  .ck { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .ck > div { padding: 14px 16px; border-radius: 14px; background: var(--surface-1); border: 1px solid var(--line); display: grid; gap: 5px; align-content: start; min-width: 0; }
  .ck .n { font-size: 20px; font-weight: 800; letter-spacing: -.5px; }
  .xtwo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
  .sec { display: grid; gap: 8px; align-content: start; min-width: 0; }
  .sec h3 { margin: 0; font-size: 14.5px; font-weight: 800; }
  .sec ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
  .tb td.cic, .tb th.cic { width: 150px; }

  @media (max-width: 860px) {
    .fc, .hero, .xtwo { grid-template-columns: 1fr; }
    .fl { position: static; display: flex; overflow-x: auto; max-height: none; gap: 6px; }
    .fl .eyebrow { display: none; }
    .fi { min-width: 230px; background: var(--surface-1); border-color: var(--line); }
    .fi.on { border-color: var(--s1); }
    .hero { padding: 18px; gap: 18px; }
    .hero .bn { font-size: 38px; }
    .ck { grid-template-columns: 1fr; }
    .tb td.cic, .tb th.cic { display: none; }
    .gantt { min-width: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .xc { transition: none; } }
</style>
</head>
<body data-nav="exp">
  <div id="page" class="is-loading is-first">
    <div class="ah">
      <h1>실험 (A/B)</h1>
      <div class="meta skel" id="meta">실험 레지스트리를 불러오는 중</div>
    </div>
    <div class="loader" id="loader" role="status" aria-live="polite">
      <img src="img/chars/chick.png" alt="" /><span class="t">분석 중</span><span class="dots"><i></i><i></i><i></i></span><span class="step"></span><span class="bar"><i></i></span>
    </div>
    <div id="msg"></div>

    <main class="dash" id="dash">
      <div id="view"></div>
    </main>
  </div>
  <script type="module" src="js/admin-nav.js"></script>
  <script type="module" src="js/admin-experiments.js"></script>
</body>
</html>
