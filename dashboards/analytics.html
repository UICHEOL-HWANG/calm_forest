<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>calm forest · 데이터 분석 대시보드 📊</title>
<!-- 차트 라이브러리(CDN) — 에셋 파일 아님 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{ --cream:#fff7ec; --mint:#bfe8c9; --ink:#4a5a4f; --card:#ffffff; --shadow:0 6px 18px rgba(90,120,100,.15); }
  *{box-sizing:border-box;}
  body{margin:0;background:linear-gradient(160deg,#eafaf0,#fff7ec);color:var(--ink);font-family:'Segoe UI',system-ui,sans-serif;padding:24px;}
  h1{font-size:22px;margin:0 0 4px;}
  .sub{opacity:.7;font-size:13px;margin-bottom:18px;}
  #banner{display:none;background:#fff2c9;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:16px;box-shadow:var(--shadow);}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;}
  .card{background:var(--card);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);}
  .card h2{font-size:14px;margin:0 0 12px;opacity:.85;}
  .stat{display:flex;flex-direction:column;gap:2px;}
  .stat .num{font-size:26px;font-weight:700;}
  .stat .lbl{font-size:12px;opacity:.65;}
  .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:16px;}
  canvas{max-width:100%;}
  #heatmap{background:#f3faf5;border-radius:12px;width:100%;height:auto;image-rendering:pixelated;}
  .legend{font-size:11px;opacity:.6;margin-top:6px;}
  a.back{display:inline-block;margin-bottom:12px;color:#4a5a4f;font-size:13px;}
</style>
</head>
<body>
  <a class="back" href="../index.html">← 게임으로</a>
  <h1>🌿 calm forest · 데이터 분석</h1>
  <div class="sub">Supabase <code>game_logs</code> 기반 · 이동 히트맵 · 세션 지표 · 시선/활동 분포</div>
  <div id="banner"></div>

  <div class="stats-row" id="stats"></div>

  <div class="grid">
    <div class="card" style="grid-column:span 2;min-width:280px;">
      <h2>🗺️ 이동 히트맵 (캐릭터 체류 빈도)</h2>
      <canvas id="heatmap" width="300" height="300"></canvas>
      <div class="legend">밝을수록 오래 머문 구역 · 필드 반경 ±42 기준 격자 집계</div>
    </div>
    <div class="card"><h2>🧭 카메라 시선(yaw) 분포</h2><canvas id="yawChart" height="220"></canvas></div>
    <div class="card"><h2>⏱️ 분당 활동량(샘플 수)</h2><canvas id="timeChart" height="220"></canvas></div>
    <div class="card"><h2>🎮 세션별 지속시간(초)</h2><canvas id="sessionChart" height="220"></canvas></div>
  </div>

  <script type="module">
    import { CONFIG, isSupabaseConfigured } from '../js/config.js';

    const $ = (id) => document.getElementById(id);

    // ── 1) 데이터 로드: Supabase 본인 로그 → 없으면 데모 데이터 ──
    async function loadLogs() {
      if (!isSupabaseConfigured()) return { rows: demoData(), demo: '설정 미완료' };
      try {
        const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
        const sb = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
        // 게임과 같은 브라우저면 익명 세션이 재사용됨(본인 로그 접근)
        let { data: s } = await sb.auth.getSession();
        if (!s?.session) await sb.auth.signInAnonymously();
        const { data, error } = await sb.from('game_logs')
          .select('*').order('created_at', { ascending: true }).limit(20000);
        if (error) throw error;
        if (!data || data.length === 0) return { rows: demoData(), demo: '로그가 아직 없어요 (데모 표시)' };
        return { rows: data, demo: null };
      } catch (e) {
        return { rows: demoData(), demo: '연동 실패 — 데모 데이터 (' + (e.message||e) + ')' };
      }
    }

    // 데모용 합성 데이터: 랜덤 워크 3세션
    function demoData() {
      const rows = []; const now = Date.now();
      for (let s = 0; s < 3; s++) {
        let x = (Math.random()-.5)*10, z = (Math.random()-.5)*10;
        const sid = 'demo-' + s;
        const n = 400 + Math.floor(Math.random()*400);
        for (let i = 0; i < n; i++) {
          x += (Math.random()-.5)*2; z += (Math.random()-.5)*2;
          x = Math.max(-42, Math.min(42, x)); z = Math.max(-42, Math.min(42, z));
          rows.push({
            session_id: sid,
            char_x: x, char_z: z,
            cam_yaw: Math.sin(i/30)*Math.PI,
            created_at: new Date(now - (3-s)*3600000 + i*1500).toISOString(),
          });
        }
      }
      return rows;
    }

    // ── 2) 렌더 ──
    function render(rows) {
      renderStats(rows);
      renderHeatmap(rows);
      renderYaw(rows);
      renderTime(rows);
      renderSessions(rows);
    }

    function renderStats(rows) {
      const sessions = new Set(rows.map(r => r.session_id));
      // 이동 거리 누적
      let dist = 0, prev = null;
      for (const r of rows) { if (prev && r.session_id===prev.session_id) dist += Math.hypot(r.char_x-prev.char_x, r.char_z-prev.char_z); prev = r; }
      // 세션 평균 지속시간
      const byS = {};
      rows.forEach(r => { (byS[r.session_id] ||= []).push(+new Date(r.created_at)); });
      const durs = Object.values(byS).map(a => (Math.max(...a)-Math.min(...a))/1000);
      const avgDur = durs.length ? durs.reduce((a,b)=>a+b,0)/durs.length : 0;

      const cards = [
        ['세션 수', sessions.size],
        ['총 샘플', rows.length.toLocaleString()],
        ['평균 세션(초)', Math.round(avgDur)],
        ['총 이동거리', Math.round(dist)],
      ];
      $('stats').innerHTML = cards.map(([l,n]) =>
        `<div class="card stat"><span class="num">${n}</span><span class="lbl">${l}</span></div>`).join('');
    }

    // 이동 히트맵: 격자 빈도 → 캔버스 픽셀
    function renderHeatmap(rows) {
      const c = $('heatmap'), ctx = c.getContext('2d');
      const N = 60, R = 44; // 60x60 격자, 필드 반경 44
      const grid = new Float32Array(N*N);
      let max = 0;
      for (const r of rows) {
        const gx = Math.floor(((r.char_x + R) / (2*R)) * N);
        const gz = Math.floor(((r.char_z + R) / (2*R)) * N);
        if (gx<0||gx>=N||gz<0||gz>=N) continue;
        const idx = gz*N+gx; grid[idx]++; if (grid[idx]>max) max = grid[idx];
      }
      c.width = N; c.height = N;
      const img = ctx.createImageData(N, N);
      for (let i = 0; i < N*N; i++) {
        const v = max ? Math.pow(grid[i]/max, 0.5) : 0; // 감마로 저빈도도 보이게
        // 민트→노랑→살구 그라데이션
        const col = heat(v);
        img.data[i*4]=col[0]; img.data[i*4+1]=col[1]; img.data[i*4+2]=col[2]; img.data[i*4+3]=255;
      }
      ctx.putImageData(img, 0, 0);
    }
    function heat(v){
      if (v<=0) return [235,250,240];
      const stops=[[168,220,182],[255,245,160],[255,158,94]];
      const t=v*(stops.length-1), i=Math.min(stops.length-2,Math.floor(t)), f=t-i;
      return stops[i].map((a,k)=>Math.round(a+(stops[i+1][k]-a)*f));
    }

    const palette = ['#8fd6a0','#ffd28a','#ff9e9e','#8ad2ff','#c08aff'];
    function renderYaw(rows) {
      const bins = new Array(12).fill(0);
      rows.forEach(r => { const a=((r.cam_yaw%(2*Math.PI))+2*Math.PI)%(2*Math.PI); bins[Math.floor(a/(2*Math.PI)*12)]++; });
      new Chart($('yawChart'), { type:'bar',
        data:{ labels:bins.map((_,i)=>`${Math.round(i*30)}°`), datasets:[{ data:bins, backgroundColor:'#8ad2ff' }] },
        options:{ plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}} } });
    }
    function renderTime(rows) {
      const byMin = {};
      rows.forEach(r => { const m = new Date(r.created_at); m.setSeconds(0,0); const k=m.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); byMin[k]=(byMin[k]||0)+1; });
      const labels = Object.keys(byMin);
      new Chart($('timeChart'), { type:'line',
        data:{ labels, datasets:[{ data:Object.values(byMin), borderColor:'#8fd6a0', backgroundColor:'rgba(143,214,160,.2)', fill:true, tension:.3, pointRadius:0 }] },
        options:{ plugins:{legend:{display:false}}, scales:{x:{ticks:{maxTicksLimit:8}}} } });
    }
    function renderSessions(rows) {
      const byS = {};
      rows.forEach(r => { (byS[r.session_id] ||= []).push(+new Date(r.created_at)); });
      const labels = Object.keys(byS).map((s,i)=>`#${i+1}`);
      const durs = Object.values(byS).map(a => Math.round((Math.max(...a)-Math.min(...a))/1000));
      new Chart($('sessionChart'), { type:'bar',
        data:{ labels, datasets:[{ data:durs, backgroundColor: labels.map((_,i)=>palette[i%palette.length]) }] },
        options:{ plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}} } });
    }

    // ── 실행 ──
    (async () => {
      const { rows, demo } = await loadLogs();
      if (demo) { const b=$('banner'); b.style.display='block'; b.textContent = 'ℹ️ ' + demo + ' — config.js에 Supabase 키를 넣고 게임을 플레이하면 실제 데이터가 표시됩니다.'; }
      render(rows);
    })();
  </script>
</body>
</html>
