<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>calm forest · 로그인 연결 중</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, sans-serif; background: #2f4f3a; color: #fff; text-align: center; }
  p { font-size: 15px; line-height: 1.6; padding: 0 24px; }
  small { opacity: .7; }
</style>
</head>
<body>
<p id="msg">로그인 연결 중… 🌿<br><small>이 창은 자동으로 닫혀요.</small></p>
<script>
// =============================================================
//  🎮 구글 팝업 로그인 복귀 페이지
// =============================================================
(function () {
  var hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  var query = new URLSearchParams(location.search);
  var msg;
  var err = hash.get('error_description') || hash.get('error') || query.get('error_description') || query.get('error');
  if (err) msg = { type: 'calmforest-auth', error: err };
  else if (hash.get('access_token') && hash.get('refresh_token')) {
    msg = { type: 'calmforest-auth', access_token: hash.get('access_token'), refresh_token: hash.get('refresh_token') };
  } else msg = { type: 'calmforest-auth', error: 'no token in callback' };

  if (window.opener) {
    try { window.opener.postMessage(msg, location.origin); } catch (e) {}
    document.getElementById('msg').innerHTML = msg.error ? '로그인에 실패했어요 😢<br><small>' + msg.error.replace(/</g, '&lt;') + '</small>' : '연결 완료 🌿<br><small>창을 닫아도 돼요.</small>';
    history.replaceState(null, '', location.pathname);   // 주소창의 토큰 흔적 제거
    setTimeout(function () { window.close(); }, 800);
  } else {
    document.getElementById('msg').innerHTML = '게임 창에서 열린 팝업이 아니에요.<br><small>게임으로 돌아가 다시 로그인해주세요.</small>';
  }
})();
</script>
</body>
</html>
