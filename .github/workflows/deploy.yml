# =============================================================
#  calm forest · GitHub Pages 자동 배포 (GitHub Actions)
#  ------------------------------------------------------------
#  main 브랜치에 push하면 정적 사이트를 그대로 Pages에 배포합니다.
#  빌드 단계가 없는 순수 정적 사이트라 파일을 업로드만 하면 끝.
#
#  ★ 사전 설정(한 번): 저장소 Settings → Pages → Build and deployment
#     → Source 를 "GitHub Actions" 로 변경.
#
#  ★ 비밀값 주의: .env(DB 비밀번호)는 .gitignore로 제외되어 커밋되지
#     않으므로 배포물에 포함되지 않습니다. config.js의 Supabase URL /
#     publishable key / GA4 ID는 공개돼도 되는 값이라 그대로 배포됩니다.
# =============================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]     # main에 push할 때마다 배포
  workflow_dispatch:      # 수동 실행 버튼도 제공

# Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 방지(마지막 것만 반영)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # (선택) config 값을 커밋하지 않고 저장소 Variables에서 주입하고 싶다면
      # 아래 주석을 해제하고 Settings → Secrets and variables → Actions →
      # Variables 에 SUPABASE_URL / SUPABASE_ANON_KEY / GA4_ID 를 등록하세요.
      # - name: Inject config (optional)
      #   run: |
      #     sed -i "s#YOUR_SUPABASE_URL#${{ vars.SUPABASE_URL }}#g; \
      #             s#YOUR_SUPABASE_ANON_KEY#${{ vars.SUPABASE_ANON_KEY }}#g; \
      #             s#YOUR_GA4_ID#${{ vars.GA4_ID }}#g" js/config.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .          # 저장소 루트를 그대로 사이트로 업로드

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
