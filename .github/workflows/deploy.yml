# =============================================================
#  calm forest · GitHub Pages 배포 (⚠️ 사용 안 함 — Cloudflare로 이전)
#  ------------------------------------------------------------
#  호스팅을 Cloudflare Pages/Workers 로 옮겨서 이 워크플로우는 더 이상
#  자동 실행하지 않습니다(수동 실행만). github.io 백업 미러가 필요할 때만
#  Actions 탭에서 "Run workflow" 로 수동 배포하세요.
#  완전히 안 쓸 거면 이 파일을 삭제해도 됩니다: git rm .github/workflows/deploy.yml
# =============================================================

name: Deploy to GitHub Pages (deprecated)

on:
  workflow_dispatch:      # 수동 실행만 (자동 배포 중단 — Cloudflare가 담당)

# Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 방지(마지막 것만 반영)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true   # Pages가 아직 활성화 안 됐으면 자동 활성화

      # (선택) config 값을 커밋하지 않고 저장소 Variables에서 주입하고 싶다면
      # 아래 주석을 해제하고 Settings → Secrets and variables → Actions →
      # Variables 에 SUPABASE_URL / SUPABASE_ANON_KEY / GA4_ID 를 등록하세요.
      # - name: Inject config (optional)
      #   run: |
      #     sed -i "s#YOUR_SUPABASE_URL#${{ vars.SUPABASE_URL }}#g; \
      #             s#YOUR_SUPABASE_ANON_KEY#${{ vars.SUPABASE_ANON_KEY }}#g; \
      #             s#YOUR_GA4_ID#${{ vars.GA4_ID }}#g" js/config.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .          # 저장소 루트를 그대로 사이트로 업로드

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
