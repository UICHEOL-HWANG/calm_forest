# =============================================================
#  calm forest · CI (구문 검사만, 배포 없음)
#  ------------------------------------------------------------
#  dev 브랜치 push / main으로의 PR에서 JS·Python 구문을 빠르게 점검.
#  배포(deploy.yml)는 main push에서만 → 여기선 "머지 전 안전장치"만 담당.
# =============================================================
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS 모듈 구문 검사
        run: |
          for f in js/*.js; do echo "check $f"; node --check "$f"; done

      - name: index.html 인라인 모듈 구문 검사
        run: |
          node <<'EOF'
          const fs = require('fs');
          const h = fs.readFileSync('index.html', 'utf8');
          const m = h.match(/<script type="module">([\s\S]*?)<\/script>/);
          if (!m) { console.error('module script not found'); process.exit(1); }
          fs.writeFileSync('/tmp/mod.mjs', m[1]);
          EOF
          node --check /tmp/mod.mjs

      - name: 파이프라인(Python) 구문 검사
        run: python3 -m py_compile scripts/export_to_bq.py
