<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apple 버튼 시안</title>
<style>
  body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif; background: linear-gradient(160deg,#5f8f6e,#2d4a3a); min-height: 100vh; color: #fff; }
  h2 { text-align: center; font-size: 15px; margin: 18px 0 4px; }
  .row { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; padding: 16px; }
  .card { text-align: center; padding: 34px 28px 26px; width: 300px; box-sizing: border-box;
    background: rgba(255,255,255,0.16); backdrop-filter: blur(16px) saturate(1.2);
    border: 1px solid rgba(255,255,255,0.35); border-radius: 28px; box-shadow: 0 20px 60px rgba(30,50,40,0.35); }
  .tag { font-size: 13px; font-weight: 800; background: rgba(0,0,0,.25); border-radius: 99px; padding: 4px 12px; display: inline-block; margin-bottom: 10px; }
  .leaf { font-size: 34px; } h1 { margin: 4px 0 2px; font-size: 32px; font-weight: 800; }
  .tagline { margin: 0 0 22px; font-size: 13px; color: rgba(255,255,255,.85); letter-spacing: 2px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; max-width: 260px; margin: 0 auto;
    border-radius: 16px; padding: 13px 26px; font-size: 15px; font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,.2); box-sizing: border-box; border: none; font-family: inherit; }
  .btn svg { width: 16px; height: 19px; fill: currentColor; margin-top: -2px; }
  .google { background: #fff; color: #3a4a40; margin-top: 12px; }
  .google .g { font-weight: 800; font-size: 19px; background: conic-gradient(from -45deg,#ea4335,#fbbc05,#34a853,#4285f4,#ea4335); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .a-black { background: #000; color: #fff; }
  .a-white { background: #fff; color: #000; }
  .a-outline { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.75); box-shadow: none; }
  .guest { display: block; margin: 18px auto 0; font-size: 13px; text-decoration: underline; color: rgba(255,255,255,.85); }
  .note { font-size: 12px; color: rgba(255,255,255,.85); margin-top: 14px; line-height: 1.5; word-break: keep-all; }
</style></head><body>
<h2>🍎 iOS 로그인 화면 — Apple 버튼 시안 (구글 iOS 클라이언트 등록 후 모습)</h2>
<div class="row" id="row"></div>
<template id="tpl">
  <div class="card">
    <div class="tag"></div>
    <div class="leaf">🌿</div><h1>calm forest</h1><div class="tagline">a cozy little forest</div>
    <button class="btn apple"><svg viewBox="0 0 384 512"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg> Apple로 계속하기</button>
    <button class="btn google"><span class="g">G</span> Google로 시작하기</button>
    <span class="guest">게스트로 둘러보기</span>
    <div class="note"></div>
  </div>
</template>
<script>
  const opts = [
    ['A · 검정(현재 구현)', 'a-black', 'Apple 공식 검정. 흰 구글 버튼과 대비가 커서 두 선택지가 확실히 갈린다.'],
    ['B · 흰색', 'a-white', 'Apple 공식 흰색. 구글 버튼과 같은 톤 — 카드가 차분하지만 둘이 비슷해 보인다.'],
    ['C · 반투명 테두리', 'a-outline', '게임 카드 톤(이메일 버튼 스타일). HIG 의 흰 테두리 변형 — 가장 덜 튄다.'],
  ];
  const row = document.getElementById('row'), tpl = document.getElementById('tpl');
  for (const [tag, cls, note] of opts) {
    const n = tpl.content.cloneNode(true);
    n.querySelector('.tag').textContent = tag;
    n.querySelector('.apple').classList.add(cls);
    n.querySelector('.note').textContent = note;
    row.appendChild(n);
  }
</script>
</body></html>
