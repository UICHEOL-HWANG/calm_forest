<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guide Preview</title>
<link rel="stylesheet" href="/guide/guide.css">
<style>body{margin:0;background:#f6f4ec}</style>
</head><body>
<!-- 안내서 fragment 를 index.html loadGuide() 와 같은 방식(fetch 주입 + img 절대경로)으로 띄우는 검증용 페이지. 배포 대상 아님 -->
<div id="root">loading…</div>
<script>
  const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'guide-en.html' : 'guide.html';
  fetch('/guide/' + lang).then(r => r.text()).then(t => {
    const wrap = document.createElement('div'); wrap.className = 'gd'; wrap.innerHTML = t;
    wrap.querySelectorAll('img[src]').forEach(img => { img.src = '/guide/' + img.getAttribute('src'); });
    // ?from=21&to=23 — 그 범위 섹션만 남겨 캡처를 짧게
    const q = new URLSearchParams(location.search), from = +q.get('from') || 1, to = +q.get('to') || 99;
    wrap.querySelectorAll('section.gd-sec').forEach(s => { const n = +s.id.slice(4); if (n < from || n > to) s.remove(); });
    document.getElementById('root').replaceChildren(wrap);
  });
</script>
</body></html>
