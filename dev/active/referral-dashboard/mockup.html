<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>친구 초대 섹션 시안</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="../../../dashboards/_dash.css" />
<style>
  /* 시안 전용 — 실제 반영 때 _dash.css 로 옮길 것만 남긴다 */
  .tag { display: inline-block; font-size: 10.5px; font-weight: 700; color: var(--ink-3); background: var(--surface-2); border-radius: 6px; padding: 2px 7px; margin-left: 6px; vertical-align: middle; }
  .src { font-size: 10.5px; color: var(--ink-3); }
  .src b { font-weight: 700; color: var(--s1); }
  /* B: 단계 카드 흐름 */
  .flow { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; align-items: stretch; }
  .flow .st { background: var(--surface-2); border-radius: 12px; padding: 10px 10px 9px; }
  .flow .st .n { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.4px; }
  .flow .st .l { font-size: 11px; color: var(--ink-3); font-weight: 600; }
  .flow .st .c { font-size: 11px; font-weight: 700; color: var(--ink-2); margin-top: 4px; }
  .flow .st .c.worst { color: var(--down); }
  .flow .st.srv { box-shadow: inset 0 0 0 1.5px var(--s1); }
  @media (max-width: 640px) { .flow { grid-template-columns: repeat(2, 1fr); } }
  /* C: 한 장 요약 */
  .one { display: grid; grid-template-columns: 200px 1fr; gap: 18px; }
  .one .stack { display: grid; gap: 10px; align-content: start; }
  @media (max-width: 640px) { .one { grid-template-columns: 1fr; } .one .stack { grid-template-columns: 1fr 1fr; } }
  .bars .row { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 6px; }
  .bars .row .k { width: 110px; color: var(--ink-3); flex: none; }
  .bars .row .b { flex: 1; height: 14px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
  .bars .row .b i { display: block; height: 100%; background: var(--s2); }
  .bars .row .v { width: 30px; text-align: right; font-variant-numeric: tabular-nums; }
  .tiers { display: flex; gap: 8px; }
  .tiers .t { flex: 1; background: var(--surface-2); border-radius: 10px; padding: 9px 6px; text-align: center; }
  .tiers .t .ico { font-size: 20px; }
  .tiers .t .n { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .tiers .t .l { font-size: 10.5px; color: var(--ink-3); }
  .warn { color: var(--down); font-weight: 700; }
  .funnel-row .fl { width: 104px; }
  @media (max-width: 520px) {
    body { padding: 14px 16px 40px; }
    .funnel-row .fl { width: 74px; font-size: 11px; } .funnel-row .fv { width: 100px; font-size: 11px; }
    .grid { grid-template-columns: 1fr; } .grid > .card { grid-column: auto !important; min-width: 0 !important; }
  }
</style>
</head>
<body>
<header><h1>calm forest 관리자 대시보드</h1></header>
<p class="sub">… 기존 섹션들 아래 · <b id="vname"></b> · 숫자는 예시 데이터</p>
<div id="root"></div>

<script>
const V = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $ = (id) => document.getElementById(id);
// ── 예시 데이터(30일) — 실제 반영 때 관리자 RPC 가 같은 모양을 돌려준다
const D = {
  sheet: 64, share: 42, land: 31, bound: 18, active: 9, granted: 7,
  inviters: 23,
  fails: [['이미 가입한 계정', 6], ['내 링크', 2], ['잘못된 코드', 1], ['네트워크 실패', 1]],
  tiers: [['💎', '1명 · 크리스탈', 5], ['🌈', '3명 · 아치', 2], ['🦋', '5명 · 날개', 0]],
  top: [['a3f…91c', 5, 3, 'web'], ['7be…02d', 4, 2, 'toss'], ['c19…e44', 3, 2, 'android'], ['f02…7aa', 2, 1, 'web'], ['91d…3b0', 2, 0, 'toss']],
  daily: { d: Array.from({ length: 14 }, (_, i) => `10/${i + 1}`), bound: [0,1,2,1,0,3,2,1,1,2,0,2,1,2], active: [0,0,0,1,1,0,2,1,0,1,1,0,1,1] },
};
const nf = (n) => Number(n || 0).toLocaleString('ko-KR');
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const STEPS = [['시트 열기', D.sheet, 'ga'], ['링크 공유', D.share, 'ga'], ['링크로 도착', D.land, 'ga'], ['연결 성공', D.bound, 'srv'], ['2일 플레이', D.active, 'srv'], ['보상 지급', D.granted, 'srv']];
const kfac = (D.active / D.inviters).toFixed(2);

function funnelRows(steps) {
  const top = steps[0][1] || 1;
  const drops = steps.map(([, v], i) => i ? Math.round((1 - v / (steps[i-1][1] || 1)) * 100) : 0);
  const worst = Math.max(...drops.slice(1));
  return steps.map(([l, v, s], i) => `<div class="funnel-row"><span class="fl">${l}${s === 'srv' ? ' <span class="src"><b>●</b></span>' : ''}</span>
    <span class="fbar"><i style="width:${v / top * 100}%"></i></span>
    <span class="fv">${nf(v)} <small>(${pct(v, top)}%)</small> ${i ? `<span class="drop${drops[i] === worst ? ' worst' : ''}">−${drops[i]}%</span>` : ''}</span></div>`).join('');
}
const kpiTiles = () => [
  ['초대한 사람', D.inviters, '링크를 1번 이상 공유'],
  ['연결된 친구', D.bound, `도착의 ${pct(D.bound, D.land)}%`],
  ['활성 친구', D.active, '7일 안에 2일 플레이'],
  ['K-factor', kfac, '초대자 1명당 활성 친구'],
].map(([l, n, f]) => `<div class="card kpi"><div class="lbl">${l}</div><div class="num">${n}</div><div class="foot">${f}</div></div>`).join('');
const failBars = () => { const m = Math.max(...D.fails.map(f => f[1])); return `<div class="bars">${D.fails.map(([k, v]) => `<div class="row"><span class="k">${k}</span><span class="b"><i style="width:${v / m * 100}%"></i></span><span class="v">${v}</span></div>`).join('')}</div>`; };
const tierBox = () => `<div class="tiers">${D.tiers.map(([ico, l, n]) => `<div class="t"><div class="ico">${ico}</div><div class="n">${n}</div><div class="l">${l}</div></div>`).join('')}</div>`;
const topTable = (flag) => `<table class="mini"><tr><th>초대자</th><th>연결</th><th>활성</th><th>플랫폼</th></tr>${D.top.map(([u, b, a, p], i) => `<tr><td style="font-family:var(--mono)"${flag && i === 0 ? ' class="warn"' : ''}>${u}</td><td class="n">${b}</td><td class="n">${a}</td><td>${p}</td></tr>`).join('')}</table>`;
const SRC = `<p class="src" style="margin:8px 0 0"><b>●</b> 서버 테이블(referrals·purchases) — 정확한 값 · 나머지는 GA4(BQ, 하루 늦음)</p>`;

const VARIANTS = {
  A: ['A · 퍼널 중심', () => `
    <h2 class="sec">🤝 친구 초대</h2>
    <div class="kpis">${kpiTiles()}</div>
    <div class="grid" style="margin-top:14px">
      <div class="card" style="grid-column:1/-1"><h3>초대 퍼널<span class="tag">30일</span></h3><p class="hint">어느 단계에서 가장 많이 빠지는지(빨간 표시).</p>${funnelRows(STEPS)}${SRC}</div>
      <div class="card"><h3>연결 실패 사유</h3><p class="hint">초대 링크로 왔는데 연결이 안 된 이유.</p>${failBars()}</div>
      <div class="card"><h3>단계 보상 받은 사람</h3><p class="hint">초대자가 도달한 단계.</p>${tierBox()}</div>
    </div>`],
  B: ['B · 단계 카드 + 추이', () => {
    const conv = STEPS.map((s, i) => i ? pct(s[1], STEPS[i-1][1]) : null);
    const low = Math.min(...conv.slice(1));
    return `
    <h2 class="sec">🤝 친구 초대</h2>
    <div class="card"><h3>초대 흐름<span class="tag">30일</span><span class="tag">K-factor ${kfac}</span></h3><p class="hint">다음 단계로 넘어간 비율 · 초록 테두리는 서버 값.</p>
      <div class="flow">${STEPS.map(([l, v, s], i) => `<div class="st${s === 'srv' ? ' srv' : ''}"><div class="l">${l}</div><div class="n">${nf(v)}</div><div class="c${conv[i] === low ? ' worst' : ''}">${conv[i] == null ? '시작' : `→ ${conv[i]}%`}</div></div>`).join('')}</div></div>
    <div class="grid" style="margin-top:14px">
      <div class="card" style="grid-column:span 2;min-width:300px"><h3>날짜별 연결·활성</h3><p class="hint">연결된 날 기준 · 활성은 2일 플레이를 채운 날.</p><div style="position:relative;height:200px"><canvas id="cDaily"></canvas></div></div>
      <div class="card"><h3>상위 초대자</h3><p class="hint">uid 앞뒤만 · 하루 몰림은 부계정 의심.</p>${topTable(false)}</div>
    </div>`; }],
  C: ['C · 한 장 요약', () => `
    <h2 class="sec">🤝 친구 초대</h2>
    <div class="card"><h3>친구 초대 한눈에<span class="tag">30일</span></h3><p class="hint">왼쪽 숫자 · 오른쪽 퍼널.</p>
      <div class="one">
        <div class="stack">${[['K-factor', kfac], ['초대한 사람', D.inviters], ['활성 친구', D.active], ['보상 지급', D.granted]].map(([l, n]) => `<div class="kpi"><div class="lbl">${l}</div><div class="num">${n}</div></div>`).join('')}</div>
        <div>${funnelRows(STEPS)}${SRC}</div>
      </div></div>
    <div class="grid" style="margin-top:14px">
      <div class="card"><h3>연결 실패 사유</h3><p class="hint">초대 링크로 왔는데 연결이 안 된 이유.</p>${failBars()}</div>
      <div class="card"><h3>단계 보상 · 감시</h3><p class="hint">하루 3명 넘게 연결된 초대자는 <span class="warn">빨간색</span>.</p>${tierBox()}<div style="margin-top:10px">${topTable(true)}</div></div>
    </div>`],
};
const v = new URLSearchParams(location.search).get('v') || 'A';
const [name, html] = VARIANTS[v] || VARIANTS.A;
$('vname').textContent = name;
$('root').innerHTML = html();
if ($('cDaily')) new Chart($('cDaily'), {
  type: 'bar',
  data: { labels: D.daily.d, datasets: [
    { label: '연결', data: D.daily.bound, backgroundColor: V('--s1'), borderRadius: 3 },
    { label: '활성', data: D.daily.active, backgroundColor: V('--s2'), borderRadius: 3 },
  ] },
  options: { animation: false, maintainAspectRatio: false, plugins: { legend: { labels: { color: V('--ink-2'), boxWidth: 10 } } },
    scales: { x: { ticks: { color: V('--ink-3') }, grid: { display: false } }, y: { ticks: { color: V('--ink-3'), stepSize: 1 }, grid: { color: V('--line-soft') } } } },
});
</script>
</body>
</html>
