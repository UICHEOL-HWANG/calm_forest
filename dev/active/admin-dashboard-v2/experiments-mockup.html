<title>실험 페이지 시안</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Layout: 실험 페이지 시안 A(레지스트리+상세)·B(상태 보드)·C(판정표) 를 같은 예시 데이터로 갈아 끼우는 비교 무대.
   색 토큰은 실제 dashboards/_dash.css 와 같은 값(검증 팔레트). */
:root {
  --surface-0:#f3f6f4; --surface-1:#fbfcfb; --surface-2:#eef2ef; --line:#dde5e0; --line-soft:#e9efeb;
  --ink:#16241d; --ink-2:#4e5f56; --ink-3:#7d8d84;
  --s1:#1baf7a; --s2:#eb6834; --s3:#2a78d6; --s4:#eda100; --s5:#4a3aa7;
  --tint-rgb:27,175,122; --up:#217a4e; --down:#c14f3a;
  --shadow:0 1px 2px rgba(22,36,29,.05),0 6px 20px rgba(22,36,29,.06);
  --font:"Apple SD Gothic Neo",Pretendard,"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --warn-bg:color-mix(in srgb,var(--down) 12%,transparent);
  --amber-bg:color-mix(in srgb,var(--s4) 16%,transparent);
  --blue-bg:color-mix(in srgb,var(--s3) 13%,transparent);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme:dark; --surface-0:#121714; --surface-1:#1a201d; --surface-2:#222a26; --line:#313b35; --line-soft:#272f2b;
  --ink:#eef3f0; --ink-2:#b0bdb6; --ink-3:#839589;
  --s1:#199e70; --s2:#d95926; --s3:#3987e5; --s4:#c98500; --s5:#9085e9;
  --tint-rgb:25,158,112; --up:#57c28d; --down:#e58a74;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
} }
:root[data-theme="dark"] {
  color-scheme:dark; --surface-0:#121714; --surface-1:#1a201d; --surface-2:#222a26; --line:#313b35; --line-soft:#272f2b;
  --ink:#eef3f0; --ink-2:#b0bdb6; --ink-3:#839589;
  --s1:#199e70; --s2:#d95926; --s3:#3987e5; --s4:#c98500; --s5:#9085e9;
  --tint-rgb:25,158,112; --up:#57c28d; --down:#e58a74;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
* { box-sizing:border-box; }
body { background:var(--surface-0); color:var(--ink); font-family:var(--font); margin:0; padding-block:0 60px; padding-inline:16px; -webkit-font-smoothing:antialiased; }
button { font-family:inherit; }
:focus-visible { outline:2px solid var(--s3); outline-offset:2px; border-radius:4px; }

/* 비교 컨트롤 */
.compare { max-width:1320px; margin:0 auto; padding:18px 0 14px; display:flex; flex-wrap:wrap; gap:12px 18px; align-items:center; border-bottom:1px dashed var(--line); }
.compare h1 { font-size:15px; margin:0; font-weight:800; }
.compare p { margin:0; font-size:12px; color:var(--ink-3); flex-basis:100%; }
.seg { display:inline-flex; background:var(--surface-2); border-radius:10px; padding:3px; gap:2px; flex-wrap:wrap; }
.seg button { border:0; background:transparent; padding:7px 12px; border-radius:8px; font-size:12.5px; font-weight:700; color:var(--ink-3); cursor:pointer; }
.seg button.on { background:var(--surface-1); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }
.vdesc { font-size:12.5px; color:var(--ink-2); max-width:720px; }
.vdesc b { color:var(--ink); }
.sample { font-size:11px; font-weight:700; color:var(--down); background:var(--warn-bg); padding:3px 8px; border-radius:6px; }
#stage { max-width:1320px; margin:18px auto 0; }
#stage.phone { max-width:390px; border:1px solid var(--line); border-radius:28px; padding:14px 12px 24px; box-shadow:var(--shadow); }

/* 공통 */
.ah { display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; }
.ah img { width:38px; height:38px; object-fit:contain; margin-right:-4px; }
.ah h2 { font-size:19px; margin:0; font-weight:800; letter-spacing:-.3px; }
.ah .meta { font-size:12px; color:var(--ink-3); flex-basis:100%; }
.crumb { font-size:12.5px; color:var(--ink-3); }
.eyebrow { font-size:10.5px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:var(--ink-3); }
.def { font-size:11px; color:var(--ink-3); line-height:1.5; margin:0; }
.num { font-variant-numeric:tabular-nums; font-weight:800; }
.chip { display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:20px; background:var(--surface-2); color:var(--ink-2); white-space:nowrap; }
.chip.win { background:rgba(var(--tint-rgb),.15); color:var(--up); }
.chip.lose { background:var(--warn-bg); color:var(--down); }
.chip.na { background:var(--surface-2); color:var(--ink-2); }
.chip.small { background:var(--amber-bg); color:color-mix(in srgb,var(--s4) 70%,var(--ink)); }
.chip.obs { background:var(--blue-bg); color:var(--s3); }
.chip.conf { background:var(--warn-bg); color:var(--down); }
.chip.st { background:transparent; border:1px solid var(--line); color:var(--ink-3); }
.lock { font-size:10.5px; color:var(--ink-3); font-weight:700; }
.bar { display:block; height:6px; background:var(--surface-2); border-radius:4px; overflow:hidden; }
.bar i { display:block; height:100%; background:var(--s1); border-radius:4px; }
.av { width:34px; height:34px; flex:none; border-radius:50%; overflow:hidden; display:grid; place-items:center;
  background:radial-gradient(circle at 50% 60%,rgba(var(--tint-rgb),.18),rgba(var(--tint-rgb),.04) 70%); }
.av img { width:122%; height:122%; object-fit:contain; transform:translateY(9%); }
table.t { width:100%; border-collapse:collapse; font-size:12px; }
.t th { text-align:left; font-size:10.5px; color:var(--ink-3); font-weight:700; padding:6px; border-bottom:1px solid var(--line); white-space:nowrap; }
.t td { padding:8px 6px; border-bottom:1px solid var(--line-soft); vertical-align:middle; }
.t .r { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.scroll-x { overflow-x:auto; }
.ok { color:var(--up); font-weight:800; } .bad { color:var(--down); font-weight:800; }
svg text { font-family:var(--font); }
.forest { width:100%; height:auto; display:block; }

/* ═════ A · 레지스트리 + 상세 ═════ */
.vA .wrap { display:grid; grid-template-columns:330px minmax(0,1fr); gap:24px; margin-top:18px; align-items:start; }
.vA .list { display:grid; gap:6px; position:sticky; top:12px; }
.vA .grp-t { margin:10px 0 2px; }
.vA .item { display:grid; grid-template-columns:34px minmax(0,1fr); gap:10px; padding:10px 12px; border-radius:12px; cursor:pointer; border:1px solid transparent; text-align:left; background:transparent; width:100%; color:inherit; }
.vA .item:hover { background:var(--surface-2); }
.vA .item.on { background:var(--surface-1); border-color:var(--line); box-shadow:var(--shadow); }
.vA .item b { font-size:13px; display:block; }
.vA .item .row { display:flex; flex-wrap:wrap; gap:4px 6px; margin-top:4px; align-items:center; }
.vA .detail { display:grid; gap:18px; min-width:0; }
.vA .dh { display:grid; gap:6px; padding-bottom:14px; border-bottom:1px solid var(--line); }
.vA .dh h3 { margin:0; font-size:20px; font-weight:800; letter-spacing:-.4px; }
.vA .hyp { font-size:13.5px; line-height:1.6; color:var(--ink-2); margin:0; max-width:80ch; }
.vA .checks { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); border:1px solid var(--line); border-radius:14px; background:var(--surface-1); overflow:hidden; }
.vA .checks > div { padding:13px 15px; border-left:1px solid var(--line-soft); display:grid; gap:4px; align-content:start; }
.vA .checks > div:first-child { border-left:0; }
.vA .checks .num { font-size:22px; letter-spacing:-.5px; }
.vA .two { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:24px; }
.vA .panel { display:grid; gap:8px; align-content:start; min-width:0; }
.vA .panel h4 { margin:0; font-size:13px; font-weight:800; }
.vA .log { display:grid; gap:8px; font-size:12.5px; }
.vA .log div { display:grid; grid-template-columns:52px 1fr; gap:10px; color:var(--ink-2); }
.vA .log span { color:var(--ink-3); font-variant-numeric:tabular-nums; }

/* ═════ B · 상태 보드 ═════ */
.vB .board { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-top:18px; align-items:start; }
.vB .col { display:grid; gap:10px; }
.vB .col-h { display:flex; align-items:center; gap:8px; padding:4px 2px 6px; border-bottom:2px solid var(--line); }
.vB .col-h img { width:28px; height:28px; object-fit:contain; }
.vB .col-h b { font-size:13px; }
.vB .col-h span { margin-left:auto; font-size:11px; color:var(--ink-3); font-weight:700; }
.vB .card { background:var(--surface-1); border:1px solid var(--line); border-radius:14px; padding:13px 14px; box-shadow:var(--shadow); display:grid; gap:9px; cursor:pointer; text-align:left; color:inherit; width:100%; font:inherit; transition:transform .16s cubic-bezier(.16,1,.3,1); }
.vB .card:hover { transform:translateY(-2px); }
.vB .card h4 { margin:0; font-size:13.5px; font-weight:800; }
.vB .card .meta { font-size:11px; color:var(--ink-3); }
.vB .card .row { display:flex; flex-wrap:wrap; gap:4px; }
.vB .drawer { grid-column:1 / -1; background:var(--surface-1); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:var(--shadow); display:grid; gap:14px; }
.vB .drawer h3 { margin:0; font-size:17px; }
.vB .dgrid { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:22px; }
.vB .close { margin-left:auto; border:1px solid var(--line); background:var(--surface-2); border-radius:8px; padding:6px 10px; cursor:pointer; font-weight:700; color:var(--ink-2); }

/* ═════ C · 판정표 ═════ */
.vC .lead { display:grid; grid-template-columns:minmax(0,1fr) 260px; gap:22px; margin-top:16px; align-items:start; }
.vC .fp { background:var(--surface-1); border:1px solid var(--line); border-radius:14px; padding:14px 16px 8px; min-width:0; }
.vC .fp h3 { margin:0 0 2px; font-size:14px; font-weight:800; }
.vC .rules { border:1px solid var(--line); border-radius:14px; padding:14px; background:var(--surface-1); display:grid; gap:8px; font-size:12px; color:var(--ink-2); }
.vC .rules h4 { margin:0; font-size:12.5px; display:flex; gap:8px; align-items:center; }
.vC .rules h4 img { width:30px; height:30px; object-fit:contain; }
.vC .rules ol { margin:0; padding-left:18px; display:grid; gap:4px; }
.vC table.t td.r { font-family:var(--mono); font-size:11.5px; }
.vC tr.row { cursor:pointer; }
.vC tr.row:hover td { background:var(--surface-2); }
.vC tr.exp td { background:var(--surface-1); padding:14px; }
.vC .expgrid { display:grid; grid-template-columns:minmax(0,1fr) 280px; gap:20px; }

/* 좁은 화면 */
@media (max-width: 860px) {
  .vA .wrap, .vB .dgrid, .vC .lead, .vC .expgrid { grid-template-columns:1fr; }
  .vA .list { position:static; }
  .vA .two { grid-template-columns:1fr; }
  .vA .checks { grid-template-columns:1fr; }
  .vA .checks > div { border-left:0; border-top:1px solid var(--line-soft); }
  .vB .board { grid-template-columns:1fr; }
}
#stage.phone .vA .wrap, #stage.phone .vB .dgrid, #stage.phone .vC .lead, #stage.phone .vC .expgrid { grid-template-columns:1fr; }
#stage.phone .vA .list { position:static; }
#stage.phone .vA .two { grid-template-columns:1fr; }
#stage.phone .vA .checks { grid-template-columns:1fr; }
#stage.phone .vA .checks > div { border-left:0; border-top:1px solid var(--line-soft); }
#stage.phone .vB .board { grid-template-columns:1fr; }
@media (prefers-reduced-motion: reduce) { .vB .card { transition:none; } }
</style>

// ── 통계(예시 숫자로 실제 계산) ──
function phi(z) { const t = 1 / (1 + .2316419 * Math.abs(z)); const d = .3989423 * Math.exp(-z * z / 2);
  const p = d * t * (.3193815 + t * (-.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return z > 0 ? 1 - p : p; }
function twoProp(x1, n1, x2, n2) {             // 처치 − 대조 (%p) · Wald CI · 합동 z 검정
  const p1 = x1 / n1, p2 = x2 / n2, d = p1 - p2;
  const se = Math.sqrt(p1 * (1 - p1) / n1 + p2 * (1 - p2) / n2);
  const pp = (x1 + x2) / (n1 + n2), se0 = Math.sqrt(pp * (1 - pp) * (1 / n1 + 1 / n2));
  const z = se0 ? d / se0 : 0;
  return { p1, p2, d: d * 100, lo: (d - 1.96 * se) * 100, hi: (d + 1.96 * se) * 100, p: 2 * (1 - phi(Math.abs(z))) };
}
function srm(ns, ratio) {                       // 배정 비율 카이제곱 검사(자유도 1·2)
  const N = ns.reduce((a, b) => a + b, 0);
  const chi = ns.reduce((s, n, i) => s + (n - N * ratio[i]) ** 2 / (N * ratio[i]), 0);
  return ns.length === 2 ? 2 * (1 - phi(Math.sqrt(chi))) : Math.exp(-chi / 2);
}

  { id: 'meta', name: '메타 광고 경로', kind: 'ab', status: 'plan', char: 'rabbit',
    q: '웹 배너 경유 vs 스토어 직행 — 어느 경로가 설치 후 D7 까지 더 남나?',
    unit: '광고 클릭 (OS별 층화)', period: '안드로이드·iOS 입점 후', prereg: '작성 예정',
    arms: [], ratio: null, metric: '설치자 D7 리텐션', test: '층화 두 비율 차이', need: 900, sec: [],
    log: [['10/7', '계획: 두 스토어 입점 후 집행']] },
];
const STATUS = { plan: ['설계·대기', 'rabbit'], run: ['진행 중', 'chick'], obs: ['관측·분석 대기', 'panda'], done: ['결론·보관', 'bear'] };

function analyze(e) {
  if (!e.arms.length) return { verdict: ['st', '시작 전'] };
  const [t, c] = e.kind === 'multi' ? [e.arms[2], e.arms[1]] : e.arms;
  const r = twoProp(t[3], t[2], c[3], c[2]);
  const n = e.arms.reduce((a, x) => a + x[2], 0);
  const s = e.ratio ? srm(e.arms.map(a => a[2]), e.ratio) : null;
  const m = mde(r.p2, Math.min(...e.arms.map(a => a[2])));
  let verdict;
  if (e.kind === 'policy') verdict = ['obs', '인과 판정 안 함'];
  else if (e.confound) verdict = ['conf', '교란 주의'];
  else if (e.status === 'obs') verdict = ['obs', '관측 대기 · 10/13'];
  else if (e.need && n < e.need && e.status === 'run') verdict = ['small', '표본 모으는 중'];
  else if (r.p < .05) verdict = r.d > 0 ? ['win', '효과 있음 ▲'] : ['lose', '효과 있음 ▼'];
  else verdict = ['na', '판정 불가'];
  return { ...r, n, srm: s, mde: m, verdict, t, c };
}
const pct = (v) => (v * 100).toFixed(1) + '%';
const pp = (v) => (v > 0 ? '+' : '') + v.toFixed(1) + '%p';
const chip = ([c, t]) => `<span class="chip ${c}">${t}</span>`;
const srmTxt = (s) => s == null ? '<span class="def">해당 없음</span>' : s < .01 ? `<span class="bad">어긋남 p=${s.toFixed(3)}</span>` : `<span class="ok">정상 p=${s.toFixed(2)}</span>`;

// 포리스트 플롯: rows = [{label, d, lo, hi, kind, dash}] · 0 기준선 · 같은 축
function forest(rows, { w = 560, rowH = 30, labelW = 150 } = {}) {
  const vals = rows.flatMap(r => [r.lo, r.hi]).filter(Number.isFinite);
  const span = Math.max(10, Math.ceil(Math.max(...vals.map(Math.abs)) / 5) * 5);
  const x0 = labelW + 10, x1 = w - 62, X = (v) => x0 + (v + span) / (2 * span) * (x1 - x0);
  const h = rows.length * rowH + 30;
  const col = (k) => k === 'win' ? V('--up') : k === 'lose' ? V('--down') : k === 'obs' || k === 'conf' ? V('--ink-3') : V('--s3');
  let s = `<svg class="forest" viewBox="0 0 ${w} ${h}" role="img" aria-label="효과 크기와 95% 신뢰구간">`;
  for (const t of [-span, -span / 2, 0, span / 2, span]) {
    s += `<line x1="${X(t)}" x2="${X(t)}" y1="6" y2="${h - 22}" stroke="${t === 0 ? V('--ink-3') : V('--line-soft')}" stroke-width="${t === 0 ? 1.2 : 1}"/>`;
    s += `<text x="${X(t)}" y="${h - 6}" font-size="10" text-anchor="middle" fill="${V('--ink-3')}">${t > 0 ? '+' : ''}${t}%p</text>`;
  }
  rows.forEach((r, i) => {
    const y = 18 + i * rowH, c = col(r.kind);
    s += `<text x="0" y="${y + 4}" font-size="11.5" fill="${V('--ink-2')}">${r.label}</text>`;
    if (!Number.isFinite(r.d)) { s += `<text x="${x0}" y="${y + 4}" font-size="11" fill="${V('--ink-3')}">${r.note || '—'}</text>`; return; }
    const lo = Math.max(-span, r.lo), hi = Math.min(span, r.hi);
    s += `<line x1="${X(lo)}" x2="${X(hi)}" y1="${y}" y2="${y}" stroke="${c}" stroke-width="2.5" stroke-linecap="round" ${r.dash ? 'stroke-dasharray="4 4"' : ''}/>`;
    s += `<rect x="${X(r.d) - 5}" y="${y - 5}" width="10" height="10" rx="2" fill="${c}"/>`;
    s += `<text x="${x1 + 8}" y="${y + 4}" font-size="11" font-weight="700" fill="${V('--ink')}">${pp(r.d)}</text>`;
  });
  return s + '</svg>';
}

// 누적 효과 차트(예시): 날마다 쌓인 표본으로 다시 계산한 차이와 CI 띠
function cumulative(id, e, ratio = 2.2) {
  const a = analyze(e); if (!a.t) return;
  const days = 24, rows = [];
  for (let k = 1; k <= days; k++) {
    const f = k / days, n1 = Math.max(4, Math.round(a.t[2] * f)), n2 = Math.max(4, Math.round(a.c[2] * f));
    const wob = Math.sin(k * 1.7) * (1 - f) * .08;
    const x1 = Math.round(n1 * (a.p1 + wob)), x2 = Math.round(n2 * a.p2);
    rows.push(twoProp(Math.min(n1, Math.max(0, x1)), n1, Math.min(n2, Math.max(0, x2)), n2));
  }
  charts[id]?.destroy();
  const el = document.getElementById(id); if (!el) return;
  charts[id] = new Chart(el, { type: 'line', data: { labels: rows.map((_, i) => `D${i + 1}`), datasets: [
    { label: '상한', data: rows.map(r => +r.hi.toFixed(1)), borderWidth: 0, pointRadius: 0, fill: '+1', backgroundColor: `rgba(${V('--tint-rgb')},.14)` },
    { label: '하한', data: rows.map(r => +r.lo.toFixed(1)), borderWidth: 0, pointRadius: 0, fill: false },
    { label: '차이', data: rows.map(r => +r.d.toFixed(1)), borderColor: V('--s1'), borderWidth: 2.2, pointRadius: 0, tension: .3, fill: false },
    { label: '0', data: rows.map(() => 0), borderColor: V('--ink-3'), borderDash: [4, 4], borderWidth: 1, pointRadius: 0 },
  ] }, options: { responsive: true, aspectRatio: ratio, interaction: { mode: 'index', intersect: false },
    plugins: { legend: { display: false }, tooltip: { filter: (x) => x.dataset.label === '차이', callbacks: { label: (x) => ` 차이 ${pp(x.parsed.y)}` } } },
    scales: { x: { grid: { display: false }, ticks: { color: V('--ink-3'), maxRotation: 0, autoSkipPadding: 14 } },
      y: { grid: { color: V('--line-soft') }, border: { display: false }, ticks: { color: V('--ink-3'), callback: (v) => v + '%p' } } } } });
}

function armsTable(e) {
  if (!e.arms.length) return '<p class="def">아직 배정 전입니다.</p>';
  return `<div class="scroll-x"><table class="t"><tr><th>군</th><th class="r">표본</th><th class="r">${e.metric}</th></tr>` +
    e.arms.map(([k, l, n, x]) => `<tr><td><b>${k}</b> <span class="def" style="display:inline">${l}</span></td><td class="r">${n.toLocaleString()}</td><td class="r">${x} (${pct(x / n)})</td></tr>`).join('') + '</table></div>';
}
function header() {
  return `<div class="ah"><span class="crumb">← 관리자 홈</span></div>
    <div class="ah" style="margin-top:6px"><img src="${CH('chick')}" alt=""><h2>실험 (A/B)</h2>
    <span class="meta">진행 ${EXPS.filter(e => e.status === 'run').length} · 관측 대기 ${EXPS.filter(e => e.status === 'obs').length} · 결론 ${EXPS.filter(e => e.status === 'done').length} · 매일 03:00 BigQuery 에서 요약 · 마지막 갱신 10/10 03:12</span></div>`;
}
function secForest(e) {
  const a = analyze(e);
  const rows = [{ label: e.metric, d: a.d, lo: a.lo, hi: a.hi, kind: a.verdict[0], dash: e.kind === 'policy' || !!e.confound }]
    .concat(e.sec.map(([l, x1, n1, x2, n2]) => ({ label: l + ' (보조)', ...twoProp(x1, n1, x2, n2), kind: 'na' })));
  return forest(rows, { w: 520, labelW: 150 });
}

    </div>`;
  return `<div class="vA">${header()}<div class="wrap"><div class="list">${list}</div><div class="detail">${detail}</div></div></div>`;
}

// ── 시안 B ──
function miniCI(a) {
  if (!a.t) return '';
  const span = 30, X = (v) => Math.max(0, Math.min(100, (v + span) / (2 * span) * 100));
  const c = a.verdict[0] === 'win' ? V('--up') : a.verdict[0] === 'lose' ? V('--down') : V('--s3');
  return `<svg viewBox="0 0 100 14" style="width:100%;height:16px" aria-hidden="true"><line x1="50" x2="50" y1="0" y2="14" stroke="${V('--ink-3')}" stroke-width=".6"/>
    <line x1="${X(a.lo)}" x2="${X(a.hi)}" y1="7" y2="7" stroke="${c}" stroke-width="2" stroke-linecap="round"/><rect x="${X(a.d) - 2}" y="5" width="4" height="4" fill="${c}"/></svg>`;
}
function renderB() {
  let s = `<div class="vB">${header()}<div class="board">` + ['plan', 'run', 'obs', 'done'].map(g => {

      items.map(x => {
        const a = analyze(x), prog = x.need ? Math.min(100, Math.round((a.n || 0) / x.need * 100)) : null;
        return `<button class="card" data-open="${x.id}"><h4>${x.name}</h4><span class="meta">${x.unit} · ${x.period}</span>
          <span class="row">${chip(a.verdict)}${x.confound ? '<span class="chip conf">플랫폼 섞임</span>' : ''}</span>
          ${a.t ? `<span class="def">${x.metric} <b class="num" style="color:var(--ink)">${pp(a.d)}</b> [${a.lo.toFixed(1)}, ${a.hi.toFixed(1)}]</span>${miniCI(a)}` : `<span class="def">${x.q}</span>`}
          ${prog != null ? `<span class="def">표본 ${a.n || 0} / ${x.need}</span><span class="bar"><i style="width:${prog}%"></i></span>` : ''}
          ${a.srm != null ? `<span class="def">SRM ${srmTxt(a.srm)}</span>` : ''}</button>`;

  }).join('');
  if (openB) {

}

      <li>목표 표본 전에는 "모으는 중" — 중간에 멈추지 않음</li><li>CI 가 0을 걸치면 "판정 불가" + 최소 검출 효과 보고</li><li>무작위 배정이 없으면 효과 판정 안 함</li></ol></div></div>

}

const DESC = {

function render() {
