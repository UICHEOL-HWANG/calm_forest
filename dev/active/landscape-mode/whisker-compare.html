<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>고양이 수염 비교</title>
<script type="importmap">{"imports":{"three":"../../../vendor/three/three.module.js"}}</script>
<style>
  body { margin: 0; background: #f5f1e8; font: 14px/1.4 -apple-system, sans-serif; color: #2b3a30; }
  .grid { display: grid; grid-template-columns: repeat(3, 260px); gap: 10px; padding: 14px; }
  .cell { background: #e6efe6; border-radius: 12px; overflow: hidden; }
  .cell b { display: block; padding: 6px 10px; }
  canvas { display: block; }
  h2 { margin: 10px 14px 0; font-size: 16px; }
</style>
</head>
<body>
<h2>현재</h2><div class="grid" id="now"></div>
<h2>A — 위아래 벌어짐만 뒤집기</h2><div class="grid" id="fixA"></div>
<h2>B — A + 앞으로 꺾인 각도 0.55→0.30</h2><div class="grid" id="fixB"></div>
<script type="module">
import * as THREE from 'three';
import { buildAnimalHead } from '../../../js/animal-faces.js';
const views = [['정면', [0, 0, 4]], ['옆(오른쪽)', [4, 0, 0.6]], ['위', [0, 4, 0.8]]];
function fixWhiskers(head, mode) {
  head.traverse(o => {
    if (o.isGroup && o !== head && o.children.length === 1 && o.children[0].geometry?.type === 'CylinderGeometry') {
      const s = Math.sign(o.position.x);
      o.rotation.set(0, mode === 'B' ? -s * 0.30 : o.rotation.y, -o.rotation.z);
    }
  });
}
function cell(root, label, fix, cam) {
  const box = document.createElement('div'); box.className = 'cell';
  const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(260, 220); r.setPixelRatio(2); r.setClearColor(0xe6efe6);
  const sc = new THREE.Scene(); sc.add(new THREE.HemisphereLight(0xffffff, 0x99aa99, 2.2));
  const d = new THREE.DirectionalLight(0xffffff, 1.2); d.position.set(2, 3, 4); sc.add(d);
  const head = buildAnimalHead('cat', { HR: 1, HY: 0, body: 0xc9c9d6, belly: 0xf3eef0 });
  if (fix) fixWhiskers(head, fix);
  sc.add(head);
  const c = new THREE.PerspectiveCamera(32, 260 / 220, 0.1, 50); c.position.set(...cam); c.lookAt(0, -0.1, 0.3);
  r.render(sc, c);
  box.appendChild(r.domElement);
  const b = document.createElement('b'); b.textContent = label; box.appendChild(b);
  root.appendChild(box);
}
for (const [label, cam] of views) { cell(document.getElementById('now'), label, false, cam); cell(document.getElementById('fixA'), label, 'A', cam); cell(document.getElementById('fixB'), label, 'B', cam); }
window.__ready = true;
</script>
</body>
</html>
