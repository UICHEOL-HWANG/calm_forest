<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>능력치 시안</title>
<style>
html,body{margin:0;background:#3b3230;font-family:-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif}
#wrap{display:flex;justify-content:center;padding:14px 12px}
.hc-sheet{width:min(520px,100%);display:flex;flex-direction:column;background:#fffaf2;border-radius:22px;box-shadow:0 -8px 40px rgba(30,25,20,.35);padding:16px 16px 12px;color:#2b2b30}
.hc-head{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:17px;margin-bottom:10px}
.hc-tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.hc-tab{border:0;border-radius:999px;padding:7px 12px;background:#efe6d8;font-weight:700;font-size:13px}
.hc-tab.on{background:#2f6fd6;color:#fff}
.hc-list{display:flex;flex-direction:column;gap:8px}
.hc-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:10px 12px;font-size:14px}
.hc-row button{border:0;border-radius:12px;padding:8px 12px;background:#e2b23c;font-weight:800;white-space:nowrap;flex:none}
.hc-row button.ride{background:#e6e1d8;color:#8a8f99}
.hc-info{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.hc-line{font-size:11px;color:#6b6f78;line-height:1.3}
.tag{position:fixed;left:10px;top:8px;background:#fff;border-radius:8px;padding:4px 10px;font-weight:800;font-size:13px}

.a-stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.a-stat{display:flex;align-items:center;gap:6px;font-size:11px;color:#4a4e57;white-space:nowrap}
.a-stat b{font-weight:700;width:34px}
.a-seg{display:flex;gap:2px}
.a-seg i{width:9px;height:6px;border-radius:2px;background:#ece6dc}
.a-seg i.on{background:var(--c)}

.b-tags{display:flex;flex-wrap:wrap;gap:4px}
.b-tag{font-size:11px;font-weight:800;border-radius:999px;padding:3px 8px;white-space:nowrap}
.b-up{background:#e3f4e6;color:#2f7a3e}
.b-down{background:#fbe6e3;color:#b0473a}
.b-even{background:#eef0f4;color:#5b6170}

.c-gauges{display:flex;gap:8px}
.c-g{flex:1;display:flex;align-items:center;gap:4px;min-width:0}
.c-g span{font-size:13px;line-height:1}
.c-bar{flex:1;height:7px;border-radius:999px;background:#ece6dc;overflow:hidden}
.c-fill{height:100%;border-radius:999px;background:var(--c)}
</style>
</head>
<body>
<div class="tag" id="tag"></div>
<div id="wrap"></div>
<script type="module">
import { SLED_LINEUP, STAT_NAMES } from '/js/mountain/sled-lineup.js';
const OPT = new URLSearchParams(location.search).get('opt') || 'a';
const NAMES = { a: 'A 칸 막대', b: 'B 장단점 태그', c: 'C 아이콘 게이지' };
const COLORS = ['#e8774a', '#3f8fd8', '#4fa86a', '#c8902f'];
const ICONS = ['💨', '🌀', '🛡️', '🌰'];
const ids = ['basic', 'toboggan', 'wind', 'acorn', 'skiff'];
const btn = { basic: ['타기', 'ride'], toboggan: ['타기', 'ride'], wind: ['1,500🪙', ''], acorn: ['1,500🪙', ''], skiff: ['1,500🪙', ''] };

const statsA = st => `<div class="a-stats">${st.map((n, i) => `<div class="a-stat" style="--c:${COLORS[i]}"><b>${STAT_NAMES[i]}</b><span class="a-seg">${[0, 1, 2, 3, 4].map(k => `<i class="${k < n ? 'on' : ''}"></i>`).join('')}</span></div>`).join('')}</div>`;
const statsB = st => {
  const up = st.map((n, i) => n > 3 ? `<span class="b-tag b-up">▲ ${STAT_NAMES[i]}</span>` : '').join('');
  const down = st.map((n, i) => n < 3 ? `<span class="b-tag b-down">▼ ${STAT_NAMES[i]}</span>` : '').join('');
  return `<div class="b-tags">${up || down ? up + down : '<span class="b-tag b-even">⚖️ 고른 능력</span>'}</div>`;
};
const statsC = st => `<div class="c-gauges">${st.map((n, i) => `<div class="c-g" title="${STAT_NAMES[i]}"><span>${ICONS[i]}</span><span class="c-bar"><span class="c-fill" style="--c:${COLORS[i]};width:${n * 20}%;display:block"></span></span></div>`).join('')}</div>`;
const STATS = { a: statsA, b: statsB, c: statsC };

const rows = ids.map(id => {
  const s = SLED_LINEUP[id];
  return `<div class="hc-row"><div class="hc-info"><span>${s.ico} ${s.name}</span><span class="hc-line">${s.line}</span>${STATS[OPT](s.stats)}</div><button class="${btn[id][1]}">${btn[id][0]}</button></div>`;
}).join('');
document.getElementById('tag').textContent = NAMES[OPT];
document.getElementById('wrap').innerHTML = `<div class="hc-sheet"><div class="hc-head"><span>☕ 산장 카페</span><span>🪙 5,000</span></div><div class="hc-tabs"><button class="hc-tab">☕ 음료</button><button class="hc-tab on">🛷 썰매</button><button class="hc-tab">🧣 꾸미기</button><button class="hc-tab">🏔️ 기념품</button></div><div class="hc-list">${rows}</div></div>`;
</script>
</body>
</html>
