<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Interior Compare</title>
<style>body{margin:0;padding:18px;background:#f4f1ea;font-family:system-ui,sans-serif;color:#2a2a28}

<div><h2>C. 눈 오는 아침</h2><p>옅은 하늘 · 내리는 눈 · 부드러운 빛</p><div class="stack"><img class="pc" src="shots/pc-c-plaza.png"><div class="pair"><img class="half" src="shots/pc-c-sled.png"><img class="m" src="shots/m-c-sled.png"></div></div></div>
</div></body></html>
