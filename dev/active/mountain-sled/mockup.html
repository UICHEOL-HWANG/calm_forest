<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snow Mountain Mockup</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#bfe0f5;font-family:system-ui,sans-serif}
#tag{position:fixed;left:12px;top:12px;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.85);color:#223;font-size:14px;line-height:1.5}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="tag"></div>
<script type="module">
import * as THREE from 'three';

const params = new URLSearchParams(location.search);
const variant = (params.get('v') || 'a').toLowerCase();
const LABELS = { a: 'A. 중턱 구름 띠', b: 'B. 정상 삿갓구름', c: 'C. 산 아래 운해' };

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe0f5);
scene.fog = new THREE.Fog(0xbfe0f5, 280, 1100);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.5, 1200);
camera.position.set(0, 7, 48);
camera.lookAt(0, 38, -200);

scene.add(new THREE.HemisphereLight(0xeaf4ff, 0x6b7f4a, 0.9));
const sun = new THREE.DirectionalLight(0xfff3e0, 1.6);
sun.position.set(-120, 160, 80);
scene.add(sun);

const MTN = { x: 0, z: -230, R: 190, H: 105 };

function rand(seed) {
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

function ridge(a) {
  return Math.sin(a * 7) * 0.5 + Math.sin(a * 13 + 1.3) * 0.3 + Math.sin(a * 23 + 0.4) * 0.2;
}

function heightAt(r, a) {
  const t = Math.min(r / MTN.R, 1);
  if (t < 0.045) return MTN.H * Math.pow(1 - 0.045, 1.55) - 1.2;
  const base = MTN.H * Math.pow(1 - t, 1.55);
  const gully = ridge(a) * 2.6 * Math.sin(Math.PI * Math.min(t * 1.4, 1));
  return Math.max(0, base + gully);
}

const SNOW = new THREE.Color(0xf6f8fb);
const SNOW_SHADE = new THREE.Color(0xdfe6ef);
const ROCK = new THREE.Color(0x4a4440);
const ROCK_LIGHT = new THREE.Color(0x6b625a);
const FOREST = new THREE.Color(0x3f6b34);
const FOREST_DARK = new THREE.Color(0x2f5329);
const MEADOW = new THREE.Color(0xa7924f);

function colorAt(h, a) {
  const k = h / MTN.H;
  const gully = Math.max(0, Math.sin(a * 31 + 0.7)) * 0.14 + Math.max(0, Math.sin(a * 19 + 2.1)) * 0.08;
  const snowLine = 0.5 + ridge(a * 1.3 + 2) * 0.06 - gully;
  if (k > snowLine) return Math.sin(a * 17) > 0.35 ? SNOW_SHADE : SNOW;
  if (k > 0.22) return Math.sin(a * 23 + k * 9) > 0 ? ROCK : ROCK_LIGHT;
  const patch = Math.sin(a * 5 + k * 31) * Math.sin(a * 11 - k * 17);
  if (patch > 0.55) return MEADOW;
  return patch < -0.2 ? FOREST_DARK : FOREST;
}

function buildMountain() {
  const SEG = 112, RINGS = 34;
  const pos = [], col = [];

  const pt = (i, j) => {
    const r = MTN.R * Math.pow(i / RINGS, 1.15);
    const a = (j / SEG) * Math.PI * 2;
    return [MTN.x + Math.cos(a) * r, heightAt(r, a), MTN.z + Math.sin(a) * r, a];
  };
  for (let i = 0; i < RINGS; i++) {
    for (let j = 0; j < SEG; j++) {
      const p00 = pt(i, j), p01 = pt(i, j + 1), p10 = pt(i + 1, j), p11 = pt(i + 1, j + 1);
      for (const tri of [[p00, p11, p10], [p00, p01, p11]]) {
        const h = (tri[0][1] + tri[1][1] + tri[2][1]) / 3;
        const c = colorAt(h, (tri[0][3] + tri[1][3] + tri[2][3]) / 3);
        for (const p of tri) { pos.push(p[0], p[1], p[2]); col.push(c.r, c.g, c.b); }
      }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  return new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }));
}
scene.add(buildMountain());

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(1400, 1400),
  new THREE.MeshLambertMaterial({ color: 0x8fbf6a })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.05;
scene.add(ground);

function addTrees() {
  const rnd = rand(3);
  const spots = [];
  for (let i = 0; i < 46; i++) {
    const x = (rnd() - 0.5) * 120;
    const z = 10 - rnd() * 90;
    if (Math.abs(x) < 9 && z > -40) continue;
    spots.push([x, z, 0.8 + rnd() * 0.9]);
  }
  const crown = new THREE.InstancedMesh(new THREE.ConeGeometry(1.6, 4.2, 7), new THREE.MeshLambertMaterial({ color: 0x3e7a3a, flatShading: true }), spots.length);
  const trunk = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.25, 0.3, 1.4, 6), new THREE.MeshLambertMaterial({ color: 0x7a5534 }), spots.length);
  const m = new THREE.Matrix4();
  spots.forEach(([x, z, s], i) => {
    m.compose(new THREE.Vector3(x, 1.4 * s + 2.1 * s - 0.2, z), new THREE.Quaternion(), new THREE.Vector3(s, s, s));
    crown.setMatrixAt(i, m);
    m.compose(new THREE.Vector3(x, 0.7 * s, z), new THREE.Quaternion(), new THREE.Vector3(s, s, s));
    trunk.setMatrixAt(i, m);
  });
  scene.add(crown, trunk);
}
addTrees();

function cloudMesh(puffs) {
  const mesh = new THREE.InstancedMesh(
    new THREE.IcosahedronGeometry(1, 1),
    new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true, emissive: 0xd4dce6, emissiveIntensity: 0.55 }),
    puffs.length
  );
  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion();
  puffs.forEach((p, i) => {
    m.compose(new THREE.Vector3(p.x, p.y, p.z), q, new THREE.Vector3(p.sx, p.sy, p.sz));
    mesh.setMatrixAt(i, m);
  });
  return mesh;
}

function clump(out, cx, cy, cz, size, rnd, n = 6) {
  for (let k = 0; k < n; k++) {
    const s = size * (0.55 + rnd() * 0.6);
    out.push({
      x: cx + (rnd() - 0.5) * size * 2.4,
      y: cy + (rnd() - 0.3) * size * 0.5,
      z: cz + (rnd() - 0.5) * size * 1.2,
      sx: s * 1.3, sy: s * 0.7, sz: s,
    });
  }
}

function radiusAtHeight(y) {
  return MTN.R * (1 - Math.pow(y / MTN.H, 1 / 1.55));
}

function cloudsA() {
  const rnd = rand(11), out = [];
  const y = MTN.H * 0.38;
  const r = radiusAtHeight(y) + 6;
  for (let i = 0; i < 26; i++) {
    const a = (i / 26) * Math.PI * 2 + rnd() * 0.15;
    if (Math.abs(a - Math.PI / 2) < 0.38) continue;
    clump(out, MTN.x + Math.cos(a) * r, y + (rnd() - 0.5) * 6, MTN.z + Math.sin(a) * r, 7 + rnd() * 4, rnd, 4);
  }
  return out;
}

function cloudsB() {
  const rnd = rand(21), out = [];
  const top = MTN.H * Math.pow(1 - 0.045, 1.55);
  for (let layer = 0; layer < 3; layer++) {
    const y = top + 9 + layer * 3.4;
    const r = 24 - layer * 6;
    const n = 7 - layer * 2;
    out.push({ x: MTN.x, y: y + 0.6, z: MTN.z, sx: r * 0.7, sy: 1.8, sz: r * 0.55 });
    for (let k = 0; k < n; k++) {
      const a = (k / n) * Math.PI * 2 + layer * 0.5;
      out.push({ x: MTN.x + Math.cos(a) * r * 0.75, y: y + (rnd() - 0.5), z: MTN.z + Math.sin(a) * r * 0.5, sx: r * 0.45, sy: 1.7, sz: r * 0.35 });
    }
  }
  for (let i = 0; i < 4; i++) {
    clump(out, MTN.x - 110 + i * 70, MTN.H * (0.55 + rnd() * 0.25), MTN.z + 60 + rnd() * 40, 6 + rnd() * 3, rnd, 5);
  }
  return out;
}

function cloudsC() {
  const rnd = rand(31), out = [];
  for (let i = 0; i < 150; i++) {
    const a = rnd() * Math.PI * 2;
    const y = 16 + rnd() * 7;
    const r = radiusAtHeight(y) + rnd() * 34;
    const s2 = 9 + rnd() * 7;
    out.push({ x: MTN.x + Math.cos(a) * r, y, z: MTN.z + Math.sin(a) * r, sx: s2 * 1.6, sy: s2 * 0.42, sz: s2 });
  }
  return out;
}

const clouds = cloudMesh({ a: cloudsA, b: cloudsB, c: cloudsC }[variant]?.() || cloudsA());
const cloudPivot = new THREE.Group();
cloudPivot.position.set(MTN.x, 0, MTN.z);
clouds.position.set(-MTN.x, 0, -MTN.z);
cloudPivot.add(clouds);
scene.add(cloudPivot);

const tag = document.getElementById('tag');
const clock = new THREE.Clock();
function frame() {
  const dt = clock.getDelta();
  if (variant !== 'c') cloudPivot.rotation.y += dt * 0.01;
  renderer.render(scene, camera);
  tag.textContent = `${LABELS[variant] || LABELS.a} · 드로우콜 ${renderer.info.render.calls} · 삼각형 ${renderer.info.render.triangles.toLocaleString()}`;
  requestAnimationFrame(frame);
}
frame();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.fov = innerWidth < innerHeight ? 68 : 50;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
dispatchEvent(new Event('resize'));
</script>
</body>
</html>
