<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Mountain Compare</title>

<div class="col"><h2>C. 산 아래 운해</h2><p>구름 바다 위로 솟은 산 · 드로우콜 5</p><div class="pair"><img class="pc" src="shots/pc-c.png"><img class="m" src="shots/m-c.png"></div></div>
