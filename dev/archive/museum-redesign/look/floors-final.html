<!doctype html><meta charset="utf-8"><title>박물관 층별 최종</title>
<style>
  body{margin:0;background:#f6f2e8;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;color:#2f3f2f;padding:14px 16px;width:1868px}
  h2{margin:4px 0 6px;font-size:20px;color:#2f5e2f}
  .pc{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .mo{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
  .cell{position:relative}.cell b{position:absolute;left:10px;top:8px;background:rgba(255,255,255,.92);padding:3px 10px;border-radius:8px;font-size:16px}
  img{width:100%;display:block;border-radius:10px}
  .mo img{width:100%;height:560px;object-fit:cover;object-position:center 60%}
</style>
<h2>PC</h2>
<div class="pc">
  <div class="cell"><b>1층 · 정문(남쪽) + 벽 유리장 17칸 + 가운데 특별 진열대</b><img src="v3-f1-pc.png"></div>
  <div class="cell"><b>2층 · 문 없음(난간) + 벽 유리장 17칸</b><img src="v3-f2-pc.png"></div>
  <div class="cell"><b>3층 · 회랑 20×14 — 벽 15 + 탁자 2줄 16</b><img src="v3-f3-pc.png"></div>
  <div class="cell"><b>특별전 · 회랑 16×14 — 벽 6 + 탁자 1줄 5</b><img src="v3-f4-pc.png"></div>
</div>
<h2>모바일 (390×844)</h2>
<div class="mo">
  <div class="cell"><b>1층</b><img src="v3-f1-mo.png"></div>
  <div class="cell"><b>2층</b><img src="v3-f2-mo.png"></div>
  <div class="cell"><b>3층</b><img src="v3-f3-mo.png"></div>
  <div class="cell"><b>특별전</b><img src="v3-f4-mo.png"></div>
</div>
