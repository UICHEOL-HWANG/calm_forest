<script type="module">
import * as THREE from 'three';

const v = new URLSearchParams(location.search).get('v') || 'a';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2320);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);

const mats = new Map();
const mat = (c, glow = false) => {
  const k = c + (glow ? 'g' : '');
  if (!mats.has(k)) mats.set(k, glow ? new THREE.MeshBasicMaterial({ color: c }) : new THREE.MeshStandardMaterial({ color: c, roughness: 0.88, metalness: 0, flatShading: true }));
  return mats.get(k);
};
const G = {
  box: new THREE.BoxGeometry(1, 1, 1), cyl: new THREE.CylinderGeometry(0.5, 0.5, 1, 12), log: new THREE.CylinderGeometry(0.5, 0.5, 1, 8),
  cone: new THREE.ConeGeometry(0.5, 1, 10), sph: new THREE.IcosahedronGeometry(0.5, 1), ball: new THREE.IcosahedronGeometry(0.5, 2),
  tor: new THREE.TorusGeometry(0.5, 0.12, 8, 16), tri: new THREE.CylinderGeometry(0.5, 0.5, 1, 3),
};
const root = new THREE.Group();
scene.add(root);
function add(geo, c, p, s = [1, 1, 1], r = [0, 0, 0], o = {}) {
  const m = new THREE.Mesh(geo, mat(c, o.glow));
  m.position.set(...p); m.scale.set(...s); m.rotation.set(r[0], r[1], r[2], 'YXZ');
  m.castShadow = !o.glow && !o.noShadow; m.receiveShadow = true;

}
let seed = 11;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const jit = (hex, a = 0.07) => new THREE.Color(hex).offsetHSL(0, 0, (rnd() - 0.5) * a).getHex();

const W = 11, D = 8.5, WALL_H = 3.2;
const WOOD = 0x8a5a36, WOOD_D = 0x5e3b22, PLANK = 0xa9764a, SNOW = 0xf7fafd, LAMP = 0xffd27a, IRON = 0x34363c, CREAM = 0xf3e6cf, RED = 0xd2463a, BLUE = 0x2f6fd6, GREEN = 0x3f7b4f, MUSTARD = 0xe2b23c;

function floor(tone = PLANK) {
  for (let x = -W / 2 + 0.3; x < W / 2; x += 0.6) add(G.box, jit(tone, 0.1), [x, -0.05, 0], [0.58, 0.1, D]);
}
function logWall(x0, z0, x1, z1, tone = WOOD, h = WALL_H) {
  const len = Math.hypot(x1 - x0, z1 - z0), ry = Math.atan2(x1 - x0, z1 - z0);

}

function lantern(x, y, z, k = 1) {

}
