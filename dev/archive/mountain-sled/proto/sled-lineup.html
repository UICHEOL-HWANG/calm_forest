const W = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true });

function col(geo, hex) {
  const g = geo.index ? geo.toNonIndexed() : geo;
  const c = new THREE.Color(hex);
  const n = g.attributes.position.count;
  const arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { arr[i * 3] = c.r; arr[i * 3 + 1] = c.g; arr[i * 3 + 2] = c.b; }
  g.setAttribute('color', new THREE.BufferAttribute(arr, 3));
  for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'color'].includes(k)) g.deleteAttribute(k);
  return g;
}
function place(g, [x, y, z], [rx, ry, rz] = [0, 0, 0], s = [1, 1, 1]) {
  return g.applyMatrix4(new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)), new THREE.Vector3(...s)));
}
const box = (w, h, d, hex, at, rot) => place(col(new THREE.BoxGeometry(w, h, d), hex), at, rot);
const cyl = (r1, r2, h, hex, at, rot, seg = 10) => place(col(new THREE.CylinderGeometry(r1, r2, h, seg), hex), at, rot);
const sph = (r, hex, at, s) => place(col(new THREE.SphereGeometry(r, 12, 8), hex), at, [0, 0, 0], s);
const tor = (r, t, arc, hex, at, rot) => place(col(new THREE.TorusGeometry(r, t, 6, 12, arc), hex), at, rot);
const cone = (r, h, hex, at, rot, seg = 10) => place(col(new THREE.ConeGeometry(r, h, seg), hex), at, rot);

function merge(parts) {
  let n = 0;
  for (const p of parts) n += p.attributes.position.count;
  const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), cl = new Float32Array(n * 3);
  let o = 0;
  for (const p of parts) {
    pos.set(p.attributes.position.array, o * 3);
    nor.set(p.attributes.normal.array, o * 3);
    cl.set(p.attributes.color.array, o * 3);
    o += p.attributes.position.count;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  g.setAttribute('color', new THREE.BufferAttribute(cl, 3));
  return g;
}

const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const tube = (pts, r, hex, closed = false, seg = 48) =>
  col(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(p => V3(...p)), closed, 'catmullrom', 0.5), seg, r, 6, closed), hex);
const side = (x, zy) => zy.map(([z, y]) => [x, y, z]);
function latheZ(profile, hex, at = [0, 0, 0], sx = 1, sy = 1, seg = 16) {
  const g = col(new THREE.LatheGeometry(profile.map(([r, z]) => new THREE.Vector2(r, z)), seg), hex);
  g.applyMatrix4(new THREE.Matrix4().makeRotationX(Math.PI / 2));
  g.applyMatrix4(new THREE.Matrix4().makeScale(sx, sy, 1));
  g.applyMatrix4(new THREE.Matrix4().makeTranslation(...at));
  g.computeVertexNormals();
  return g;
}
function rbox(w, h, d, hex, at, rot = [0, 0, 0], r = 0.015) {
  const s = new THREE.Shape();
  const x = w / 2 - r, y = h / 2 - r;
  s.moveTo(-x, -h / 2); s.lineTo(x, -h / 2); s.quadraticCurveTo(w / 2, -h / 2, w / 2, -y);
  s.lineTo(w / 2, y); s.quadraticCurveTo(w / 2, h / 2, x, h / 2); s.lineTo(-x, h / 2);
  s.quadraticCurveTo(-w / 2, h / 2, -w / 2, y); s.lineTo(-w / 2, -y); s.quadraticCurveTo(-w / 2, -h / 2, -x, -h / 2);
  const g = new THREE.ExtrudeGeometry(s, { depth: Math.max(0.001, d - 2 * r), bevelEnabled: true, bevelThickness: r, bevelSize: r * 0.6, bevelSegments: 2, curveSegments: 3 });
  g.translate(0, 0, -(d - 2 * r) / 2);
  return place(col(g, hex), at, rot);
}
function bend(geo, z0, R) {
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i), z = p.getZ(i);
    if (z <= z0) continue;
    const t = (z - z0) / R, d = R - y;
    p.setY(i, R - d * Math.cos(t));
    p.setZ(i, z0 + d * Math.sin(t));
  }
  geo.computeVertexNormals();
  return geo;
}
const slab = (w, h, d, hex, at, segs = 32) => place(col(new THREE.BoxGeometry(w, h, d, 1, 1, segs), hex), at);

    return out;

};

document.getElementById('cards').innerHTML = SLEDS.map(sl => `<div class="c"><div class="v"></div><b>${sl.name}</b><i>${sl.price}</i><br>${sl.line}<br>${sl.st.map((v, k) => `<div class="row"><span>${STAT_NAMES[k]}</span><span class="bar">${dots(v)}</span></div>`).join('')}</div>`).join('');


const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setScissorTest(true);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x9fb3c8, 1.15));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.5);
sun.position.set(3, 6, 4);
scene.add(sun);
const views = [...document.querySelectorAll('.v')];
const bg = new THREE.Color(S.bg);
const meshes = SLEDS.map((sl, i) => {
  const m = new THREE.Mesh(merge(BUILD[sl.id](S[sl.id])), W);
  m.position.set(i * 20, 0, 0);
  m.rotation.y = 0.75;
  scene.add(m);
  const g = new THREE.Mesh(new THREE.CircleGeometry(1.6, 32), new THREE.MeshLambertMaterial({ color: S.snow }));
  g.rotation.x = -Math.PI / 2;
  g.position.set(i * 20, -0.001, 0);
  scene.add(g);
  return m;
});
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
const still = q.has('still');
function loop(t) {
  renderer.setSize(innerWidth, innerHeight, false);
  renderer.setScissorTest(false);
  renderer.setClearColor(0x000000, 0);
  renderer.clear();
  renderer.setScissorTest(true);
  views.forEach((el, i) => {
    const r = el.getBoundingClientRect();
    if (r.bottom < 0 || r.top > innerHeight) return;
    const y = innerHeight - r.bottom;
    renderer.setViewport(r.left, y, r.width, r.height);
    renderer.setScissor(r.left, y, r.width, r.height);
    renderer.setClearColor(bg, 1);
    renderer.clear();
    camera.aspect = r.width / r.height;
    camera.fov = r.width / r.height < 1.3 ? 36 : 28;
    camera.updateProjectionMatrix();
    camera.position.set(i * 20 + 0.1, 1.75, 3.3);
    camera.lookAt(i * 20, 0.28, 0);
    if (!still) meshes[i].rotation.y = 0.75 + t / 2200;
    renderer.render(scene, camera);
  });
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
