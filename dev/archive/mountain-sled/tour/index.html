<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>설산 둘러보기</title>
<style>
  :root { --bg: #f4f1ea; --ink: #2b2b30; --sub: #6c7380; --card: #ffffff; --accent: #2f6fd6; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1d1c1a; --ink: #f1ede6; --sub: #a9a39a; --card: #2a2825; } }
  :root[data-theme="dark"] { --bg: #1d1c1a; --ink: #f1ede6; --sub: #a9a39a; --card: #2a2825; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 56px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.lead { color: var(--sub); margin: 0 0 22px; font-size: 14px; }
  h2 { font-size: 17px; margin: 28px 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  figure { margin: 0; background: var(--card); border-radius: 14px; padding: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  figure img { width: 100%; border-radius: 8px; display: block; }
  figcaption { font-size: 13px; line-height: 1.5; margin-top: 8px; }
  figcaption b { color: var(--accent); margin-right: 4px; }
</style>
</head>
<body>
<main>
  <h1>🏔️ 설산 지금까지 완성본 둘러보기</h1>
  <p class="lead">마을에서 산에 들어가 등산, 썰매, 결승, 산장 카페까지 실제 게임 화면을 순서대로 찍었습니다. (휴대폰 세로 화면)</p>

  <h2>1. 마을에서 산으로</h2>
  <div class="grid">
    <figure><img src="01.jpg" alt=""><figcaption><b>1</b>마을에서 보이는 설산 랜드마크. 중턱 구름 띠, 앞 사면은 썰매 코스</figcaption></figure>
    <figure><img src="02.jpg" alt=""><figcaption><b>2</b>산 앞에서 🏔️ 설산 오르기</figcaption></figure>
    <figure><img src="03.jpg" alt=""><figcaption><b>3</b>산 아래 광장. 모닥불·벤치·결승선·눈 둔덕, 위쪽 🌡️ 추위 막대</figcaption></figure>
  </div>

  <h2>2. 등산과 정상 산장</h2>
  <div class="grid">
    <figure><img src="04.jpg" alt=""><figcaption><b>4</b>등산로(통나무 계단·밧줄 울타리·돌탑)에서 🌰 도토리 줍는 순간</figcaption></figure>
    <figure><img src="05.jpg" alt=""><figcaption><b>5</b>정상 도착 안내, 썰매지기 말풍선 ☕ → 🛷</figcaption></figure>
    <figure><img src="06.jpg" alt=""><figcaption><b>6</b>출발대 🛷 썰매 타고 내려가기</figcaption></figure>
  </div>

  <h2>3. 썰매와 결승</h2>
  <div class="grid">
    <figure><img src="07.jpg" alt=""><figcaption><b>7</b>카운트다운. 코스 전경, 가운데 🌰 부스터 버튼</figcaption></figure>
    <figure><img src="08.jpg" alt=""><figcaption><b>8</b>장애물에 부딪히면 터짐(💥·눈보라)</figcaption></figure>
    <figure><img src="09.jpg" alt=""><figcaption><b>9</b>결승 후 옆으로 돌며 눈보라를 튀기는 정지, 색종이</figcaption></figure>
    <figure><img src="10.jpg" alt=""><figcaption><b>10</b>결과 창(완주·새 기록·코인·오늘 남은 보상)</figcaption></figure>
  </div>

  <h2>4. 산장 카페</h2>
  <div class="grid">
    <figure><img src="11.jpg" alt=""><figcaption><b>11</b>정상 마당의 산장 문 ☕ 산장 카페 들어가기</figcaption></figure>
    <figure><img src="12.jpg" alt=""><figcaption><b>12</b>카페 안. 북극여우 솜눈, 다락, 유리 박공 너머 설산</figcaption></figure>
    <figure><img src="13.jpg" alt=""><figcaption><b>13</b>주문 창 🧣 꾸미기 탭</figcaption></figure>
    <figure><img src="14.jpg" alt=""><figcaption><b>14</b>🛷 썰매 탭(기본·하늘·숲·별밤, 별밤은 깃발 12개 완주 후)</figcaption></figure>
    <figure><img src="15.jpg" alt=""><figcaption><b>15</b>🏔️ 기념품 탭, 캐릭터는 방금 산 털 귀마개를 착용</figcaption></figure>
    <figure><img src="16.jpg" alt=""><figcaption><b>16</b>코코아 구매 → 의자에 앉기, ☕ 몸이 따뜻해졌어요, 사진 버튼 반짝</figcaption></figure>
  </div>

  <h2>5. 추위와 기념품</h2>
  <div class="grid">
    <figure><img src="17.jpg" alt=""><figcaption><b>17</b>눈 오는 밤 정상. 🌡️ 추위 막대가 차고, 80 이상이면 걸음이 느려짐</figcaption></figure>
    <figure><img src="18.png" alt=""><figcaption><b>18</b>기념품 미니 등불 산장 모형(눈 덮인 A자 지붕·불 켜진 박공)</figcaption></figure>
  </div>
</main>
</body>
</html>
