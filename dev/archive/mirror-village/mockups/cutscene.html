<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mirror Ride Storyboard</title><link rel="stylesheet" href="style.css">
<style>.cap{position:fixed;left:50%;top:22px;transform:translateX(-50%);background:rgba(20,16,40,.72);color:#fff;padding:8px 16px;border-radius:12px;font-weight:800;font-size:16px;white-space:nowrap}
.skip{position:fixed;right:16px;top:22px;background:rgba(255,255,255,.85);color:#26324a;font-size:13px;font-weight:800;padding:6px 12px;border-radius:999px}
.wipe{position:fixed;inset:0;pointer-events:none}</style>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>
</head><body><div class="wipe" id="wipe"></div><div class="cap" id="cap"></div><div class="skip">건너뛰기 ⏭</div><div class="title" id="title"></div>
<script type="module">
import { THREE, sky, mat, glow, mesh, halo, P3, tree, bush, rock, labeler, loop } from './lib.js';
import { makeMoonCarriage } from '/js/dream/art.js';   // 실제 꿈의 숲 초승달 마차
const F = new URLSearchParams(location.search).get('f') || '1';
const W = innerWidth, H = innerHeight, portrait = H > W;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.2;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(portrait ? 60 : 45, W / H, 0.1, 400);
const lab = labeler(camera), anims = [];

function bear(parent, x, y, z, ry = 0, tint = 0x9a6a45) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = ry; parent.add(g);
  const fur = mat(tint, { roughness: 0.95 }), light = mat(0xd9b48a);
  mesh(g, new THREE.SphereGeometry(0.62, 16, 12), fur, 0, 0.62, 0).scale.set(1, 1.05, 0.92);
  mesh(g, new THREE.SphereGeometry(0.46, 16, 12), fur, 0, 1.42, 0.02);
  [-1, 1].forEach(s => { mesh(g, new THREE.SphereGeometry(0.15, 10, 8), fur, s * 0.33, 1.8, -0.02); mesh(g, new THREE.SphereGeometry(0.055, 8, 6), mat(0x1d1410), s * 0.16, 1.5, 0.41); });
  mesh(g, new THREE.SphereGeometry(0.16, 12, 8), light, 0, 1.33, 0.4).scale.set(1.2, 0.85, 0.8);
  return g;
}
function shelter(parent, x, z, roof, wood) {
  for (const s of [-1.1, 1.1]) mesh(parent, new THREE.CylinderGeometry(0.09, 0.11, 2.3, 6), mat(wood), x + s, 1.15, z - 0.4);
  mesh(parent, new THREE.BoxGeometry(2.8, 0.16, 1.3), mat(roof), x, 2.36, z - 0.25).rotation.x = 0.12;
  mesh(parent, new THREE.BoxGeometry(1.8, 0.12, 0.45), mat(wood), x, 0.48, z - 0.55);
  mesh(parent, new THREE.CylinderGeometry(0.06, 0.06, 2.6, 6), mat(0x8a8f99), x + 1.7, 1.3, z + 0.2);
  mesh(parent, new THREE.BoxGeometry(1.0, 0.4, 0.06), mat(0xfff8ea), x + 1.7, 2.4, z + 0.2);
}
function house(parent, x, z, ry, wall, roof) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = ry; parent.add(g);
  mesh(g, new THREE.BoxGeometry(3, 2.2, 2.6), mat(wall), 0, 1.1, 0);
  const r = mesh(g, new THREE.ConeGeometry(2.4, 1.5, 4), mat(roof), 0, 2.95, 0); r.rotation.y = Math.PI / 4; r.scale.set(1, 1, 0.85);
}
function lowTree(parent, x, z, s, leaf, trunk) {
  mesh(parent, new THREE.CylinderGeometry(0.16 * s, 0.22 * s, 1.4 * s, 6), mat(trunk), x, 0.7 * s, z);
  mesh(parent, new THREE.IcosahedronGeometry(1.0 * s, 0), mat(leaf), x, 1.9 * s, z);
}
// ── 낮 마을(정류장 A · 호수 남쪽) ──
function dayVillage(root) {
  scene.background = sky('#8fd0ff', '#e6f6ff'); scene.fog = new THREE.Fog(0xd8eeff, 30, 120);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x9ac88a, 1.2));
  const d = new THREE.DirectionalLight(0xfff4e0, 1.6); d.position.set(10, 22, 12); d.castShadow = true; d.shadow.mapSize.set(2048, 2048);
  const sc = d.shadow.camera; sc.left = sc.bottom = -25; sc.right = sc.top = 25; scene.add(d);
  const g = mesh(root, new THREE.CircleGeometry(60, 48), mat(0xa8d88a)); g.rotation.x = -Math.PI / 2;
  const lake = mesh(root, new THREE.CircleGeometry(6, 40), new THREE.MeshStandardMaterial({ color: 0x7ec8e8, roughness: 0.15, metalness: 0.2 }), 0, 0.03, -8); lake.rotation.x = -Math.PI / 2;
  shelter(root, 0, 0, 0x6f8fc9, 0xb98a5e);
  house(root, -9, -4, 0.4, 0xffe3c4, 0xff9e9e); house(root, 9, 3, -0.5, 0xfff2d6, 0x9ecbff);
  [[-6, 4], [6, -2], [-11, -12], [12, -12], [-4, -17], [8, 9]].forEach(([x, z]) => lowTree(root, x, z, 1.2, 0x8fd6a0, 0xd8a679));
  return lake;
}
// ── 거울 마을(3안 색 반전 숲) ──
function mirrorVillage(root) {
  scene.background = sky('#120f2e', '#3a2f68'); scene.fog = new THREE.Fog(0x2e2858, 26, 90);
  scene.add(new THREE.HemisphereLight(0xe0d4ff, 0x3a3270, 1.35));
  const d = new THREE.DirectionalLight(0xe8dcff, 1.0); d.position.set(10, 22, 8); d.castShadow = true; d.shadow.mapSize.set(2048, 2048);
  const sc = d.shadow.camera; sc.left = sc.bottom = -25; sc.right = sc.top = 25; scene.add(d);
  const g = mesh(root, new THREE.CircleGeometry(60, 48), mat(P3.ground, { roughness: 0.7 })); g.rotation.x = -Math.PI / 2;
  const pond = mesh(root, new THREE.CircleGeometry(4, 32), new THREE.MeshStandardMaterial({ color: P3.pond, emissive: P3.pondGlow, emissiveIntensity: 0.9 }), 0, 0.03, -10); pond.rotation.x = -Math.PI / 2;
  halo(root, P3.pondGlow, 10, 0, 1, -10, 0.4);
  shelter(root, 0, 0, 0x7ad6c0, 0xc8c0e0);
  house(root, -9, -5, 0.4, 0xc8a0d8, 0x6ad6b0); house(root, 9, 2, -0.5, 0xa8c0e8, 0xe0d06a);
  [[-6, 4], [6, -3], [-12, -13], [12, -12], [-4, -18], [8, 9]].forEach(([x, z], i) => lowTree(root, x, z, 1.25, P3.leaf[i % 3], P3.trunk));
  for (let i = 0; i < 4; i++) { const a = new THREE.Mesh(new THREE.PlaneGeometry(120, 12), new THREE.MeshBasicMaterial({ color: [0x7affc8, 0x9ec8ff, 0xd89eff, 0x7affc8][i], transparent: true, opacity: 0.15, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending, fog: false })); a.position.set(0, 28 + i * 4, -70); a.rotation.z = 0.1 - i * 0.08; scene.add(a); }
}
function seat(car, tint) { const b = bear(car, 0, car.userData.seatY, -0.1, 0, tint); b.scale.setScalar(0.9); return b; }
function ripples(root, x, z, n, col = 0xffffff) { for (let i = 0; i < n; i++) { const r = mesh(root, new THREE.RingGeometry(1, 1.12, 40), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.6, side: THREE.DoubleSide }), x, 0.06, z); r.rotation.x = -Math.PI / 2; r.scale.setScalar(0.8 + i * 1.3); r.material.opacity = 0.65 - i * 0.12; } }

const root = new THREE.Group(); scene.add(root);
const car = makeMoonCarriage();
const STEPS = {
  1: () => { dayVillage(root); car.position.set(2.2, 0.15, 1.2); car.rotation.y = -Math.PI / 2 + 0.3; root.add(car);
    bear(root, -0.3, 0, 2.2, Math.PI * 0.62);
    for (let i = 0; i < 4; i++) mesh(root, new THREE.CircleGeometry(0.12, 10), new THREE.MeshBasicMaterial({ color: 0x8a6a4a, transparent: true, opacity: 0.45 }), -1.6 + i * 0.4, 0.04, 3.3 - i * 0.3).rotation.x = -Math.PI / 2;
    camera.position.set(portrait ? 4 : 6, portrait ? 6 : 5, portrait ? 13 : 10); camera.lookAt(0.8, 1, 0.5);
    return ['① 탑승 (≈1.2s)', '조작 잠금 → 캐릭터가 정류장 앞 승차 지점까지 걸어가 초승달 마차에 올라앉음', '🚏 거울 마을행 · 탑승 중…']; },
  2: () => { const lake = dayVillage(root); car.position.set(0, 4.5, -3.5); car.rotation.set(0.25, Math.PI, 0); root.add(car); seat(car);
    for (let i = 0; i < 14; i++) halo(root, 0xfff2c8, 0.35, Math.sin(i) * 0.6, 4.2 - i * 0.28, -3.5 + i * 0.35, 0.8 - i * 0.05);
    camera.position.set(portrait ? 5 : 8, portrait ? 7 : 6, portrait ? 10 : 7); camera.lookAt(0, 3, -5);
    return ['② 출발 (≈1.2s)', '마차가 떠올라 호수 위로 — 양들이 날갯짓, 반짝 꼬리', '🌙 날아오르는 중…']; },
  '3a': () => { dayVillage(root); car.position.set(0, 1.2, -8); car.rotation.set(0.9, Math.PI, 0); root.add(car); seat(car);
    ripples(root, 0, -8, 5);
    const under = mesh(root, new THREE.CircleGeometry(5.6, 40), new THREE.MeshBasicMaterial({ color: 0x3a2f68, transparent: true, opacity: 0.75 }), 0, 0.05, -8); under.rotation.x = -Math.PI / 2;
    halo(root, 0xd89eff, 9, 0, 0.4, -8, 0.7);
    document.getElementById('wipe').style.background = 'linear-gradient(180deg, rgba(255,255,255,0) 52%, rgba(40,30,90,.55) 64%, rgba(18,15,46,.92) 100%)';
    camera.position.set(portrait ? 4 : 6, portrait ? 7 : 5.5, portrait ? 4 : 2); camera.lookAt(0, 0.5, -8);
    return ['③-A 💧 연못 다이브 (≈1.5s)', '수면에 코를 박는 순간 물결이 퍼지고, 화면 아래서부터 보랏빛 물결 와이프가 차오르며 위아래가 뒤집힘', '💧 첨벙!']; },
  '3b': () => { dayVillage(root); car.position.set(0, 3, -4); car.rotation.set(0.05, Math.PI, 0); root.add(car); seat(car);
    const ring = mesh(root, new THREE.TorusGeometry(3.4, 0.28, 10, 48), mat(0xe6ebf5, { metalness: 0.4, roughness: 0.25, emissive: 0x9ec8ff, emissiveIntensity: 0.4 }), 0, 3.6, -9.5);
    const face = mesh(root, new THREE.CircleGeometry(3.3, 48), new THREE.MeshBasicMaterial({ color: 0x3a2f68 }), 0, 3.6, -9.52);
    for (let i = 0; i < 3; i++) { lowTree(root, -1.8 + i * 1.8, -9.6, 0.6, P3.leaf[i], P3.trunk); }
    halo(root, 0xc89eff, 12, 0, 3.6, -9.3, 0.45);
    ripples(root, 0, -8, 3, 0xd8f0ff);
    camera.position.set(portrait ? 3 : 4, portrait ? 5 : 4.2, portrait ? 8 : 6); camera.lookAt(0, 3.2, -7);
    return ['③-B 🪞 거울 문 (≈1.5s)', '호수 위에 둥근 거울이 일어서고, 거울 속엔 색 반전 마을이 비침 → 마차가 그대로 통과', '🪞 거울 속으로…']; },
  '3c': () => { mirrorVillage(root); root.rotation.z = Math.PI; root.position.y = 22;   // 위에 거꾸로 매달린 거울 마을
    const day = new THREE.Group(); scene.add(day);
    const g = mesh(day, new THREE.CircleGeometry(60, 48), mat(0xa8d88a)); g.rotation.x = -Math.PI / 2;
    car.position.set(0, 9, -2); car.rotation.set(-0.9, Math.PI, 0); day.add(car); seat(car);
    for (let i = 0; i < 12; i++) halo(day, 0xfff2c8, 0.35, 0, 8.6 - i * 0.5, -2 + i * 0.25, 0.85 - i * 0.06);
    camera.position.set(portrait ? 6 : 9, portrait ? 6 : 5, portrait ? 13 : 11); camera.lookAt(0, 10, -4);
    return ['③-C 🙃 하늘 뒤집기 (≈1.5s)', '마차가 하늘로 솟구치면 위에 거꾸로 매달린 거울 마을이 보이고, 카메라가 180° 돌며 그쪽이 땅이 됨', '🙃 빙글—']; },
  4: () => { mirrorVillage(root); car.position.set(2.2, 0.15, 1.2); car.rotation.y = -Math.PI / 2 + 0.3; root.add(car);
    bear(root, 0.2, 0, 2.6, Math.PI * 0.8);
    for (let i = 0; i < 18; i++) halo(root, 0xd8c8ff, 0.4, 2.2 + Math.cos(i) * 1.6, 0.3 + (i % 4) * 0.3, 1.2 + Math.sin(i) * 1.6, 0.7);
    camera.position.set(portrait ? 4 : 6, portrait ? 6 : 5, portrait ? 13 : 10); camera.lookAt(0.8, 1, 0.5);
    return ['④ 도착·하차 (≈1.2s)', '거울 정류장에 내려앉아 구름 같은 반짝이 → 캐릭터가 내려서 섬 · 조작 복귀 · 첫 회는 안내 카드', '🪞 거울 마을 도착']; },
};
const [t, s, cap] = STEPS[F]();
anims.push(tt => { for (const sh of car.userData.sheep) sh.position.y = 1.0 + Math.sin(tt * 2.2 + sh.position.x * 3) * 0.12; });
document.getElementById('cap').textContent = cap;
document.getElementById('title').innerHTML = `<b>${t}</b><span>${s}</span>`;
loop(renderer, scene, camera, anims, lab);
</script></body></html>
