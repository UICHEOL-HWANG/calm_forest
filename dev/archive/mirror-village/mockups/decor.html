<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mirror Decor</title><link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>
</head><body><div class="title" id="title"></div>
<script type="module">
import { THREE, sky, mat, glow, mesh, halo, labeler, loop } from './lib.js';
import { buildDreamDecor } from '/js/dream/decor-art.js';   // 비교 기준: 이미 출시된 꿈 장식(달 램프)
const V = new URLSearchParams(location.search).get('v') || '1';
const W = innerWidth, H = innerHeight, portrait = H > W;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a2230);
const camera = new THREE.PerspectiveCamera(portrait ? 62 : 42, W / H, 0.1, 100);
scene.add(new THREE.HemisphereLight(0xfff4e6, 0x8a6a50, 1.1));
const d = new THREE.DirectionalLight(0xfff0d8, 1.2); d.position.set(4, 9, 6); d.castShadow = true; d.shadow.mapSize.set(2048, 2048);
const sc = d.shadow.camera; sc.left = sc.bottom = -8; sc.right = sc.top = 8; scene.add(d);
const lab = labeler(camera), anims = [];
// 방(실내 6×5) — 따뜻한 나무 바닥·크림 벽: 마을 집 실내 톤
const floor = mesh(scene, new THREE.BoxGeometry(7, 0.2, 5.6), mat(0xc89a6a), 0, -0.1, 0);
mesh(scene, new THREE.BoxGeometry(7, 3, 0.2), mat(0xf2e4cc), 0, 1.5, -2.9);
mesh(scene, new THREE.BoxGeometry(0.2, 3, 5.6), mat(0xeadbc0), -3.6, 1.5, 0);
mesh(scene, new THREE.BoxGeometry(2.2, 0.06, 1.6), mat(0xd9b48a), 0.6, 0.02, 0.6);   // 러그
// 탁자(거꾸로 화분 올릴 자리)
mesh(scene, new THREE.BoxGeometry(1.3, 0.1, 0.8), mat(0xa8774f), -1.6, 0.78, -2.1);
[[-2.15, -2.4], [-1.05, -2.4], [-2.15, -1.8], [-1.05, -1.8]].forEach(([x, z]) => mesh(scene, new THREE.BoxGeometry(0.08, 0.76, 0.08), mat(0x8a5f3c), x, 0.38, z));
// 기존 침대(크기 비교)
mesh(scene, new THREE.BoxGeometry(1.6, 0.45, 2.2), mat(0xb98a5e), 2.4, 0.22, -1.6);
mesh(scene, new THREE.BoxGeometry(1.5, 0.2, 2.0), mat(0xfff6ee), 2.4, 0.55, -1.55);
mesh(scene, new THREE.BoxGeometry(1.5, 0.12, 1.1), mat(0x9ec8e8), 2.4, 0.68, -1.1);

// ── 스타일 ──
const S = {
  1: { t: '1. 🪞 은빛 거울', s: '크롬 은색 + 물빛 발광 포인트 · "거울"을 가장 직접적으로 보여 줌',
       base: c => new THREE.MeshStandardMaterial({ color: 0xe6ebf5, metalness: 0.35, roughness: 0.25, emissive: 0x8aa0c0, emissiveIntensity: 0.18, flatShading: true }),
       acc: c => glow(0x9ee8ff, 0.9), soft: c => mat(0xc8d0e0, { metalness: 0.4, roughness: 0.4 }) },
  2: { t: '2. 🌗 보색 반전', s: '거울 마을·주민과 같은 보색 팔레트 · 집 안에 "그쪽 마을"의 조각이 들어온 느낌',
       base: c => mat(c), acc: c => glow(c, 0.9), soft: c => mat(c) },
  3: { t: '3. 💧 물빛 유리', s: '반투명 유리 + 안에서 은은히 빛남 · 밤에 가장 예쁨, 낮엔 존재감 약함',
       base: c => new THREE.MeshPhysicalMaterial({ color: 0xbfe8ff, transparent: true, opacity: 0.7, roughness: 0.08, emissive: 0x6fbfff, emissiveIntensity: 0.35, flatShading: true }),
       acc: c => glow(0xc89eff, 1.1), soft: c => new THREE.MeshPhysicalMaterial({ color: 0xd8c8ff, transparent: true, opacity: 0.75, roughness: 0.2, emissive: 0x9e8eff, emissiveIntensity: 0.3 }) },
}[V];

// 🪴 거꾸로 화분 — 탁자 위 30cm 떠서 뒤집힌 화분, 잎이 아래로 자람
{ const g = new THREE.Group(); g.position.set(-1.6, 1.35, -2.1); scene.add(g);
  const pot = mesh(g, new THREE.CylinderGeometry(0.18, 0.24, 0.32, 10), S.base(0x3fb8a8), 0, 0.1, 0); pot.rotation.x = Math.PI;
  mesh(g, new THREE.TorusGeometry(0.24, 0.035, 6, 14), S.acc(0xff9ee0), 0, -0.06, 0).rotation.x = Math.PI / 2;
  [0, 1, 2, 3, 4].forEach(i => { const a = i / 5 * Math.PI * 2; const l = mesh(g, new THREE.SphereGeometry(0.11, 6, 4), S.soft(0xc85fc8), Math.cos(a) * 0.12, -0.24 - (i % 2) * 0.08, Math.sin(a) * 0.12); l.scale.set(0.6, 1.6, 0.4); l.rotation.z = Math.cos(a) * 0.5; });
  anims.push(t => { g.position.y = 1.35 + Math.sin(t * 1.5) * 0.04; g.rotation.y = t * 0.3; });
  halo(scene, 0x9ee8ff, 0.9, -1.6, 0.95, -2.1, 0.5);
  lab.add('🪴 거꾸로 화분 · 6🪞', -1.6, 1.85, -2.1); }
// 🪞 물빛 거울 — 뒷벽 걸이, 표면 일렁임
{ const g = new THREE.Group(); g.position.set(0.4, 1.7, -2.78); scene.add(g);
  const fr = mesh(g, new THREE.TorusGeometry(0.55, 0.07, 6, 28), S.base(0x5a7ad6), 0, 0, 0); fr.scale.set(0.8, 1, 1);
  const face = mesh(g, new THREE.CircleGeometry(0.53, 28), new THREE.MeshStandardMaterial({ color: 0xe6fbff, emissive: 0x7fd6ff, emissiveIntensity: 0.6, metalness: 0.6, roughness: 0.05 }), 0, 0, 0.01); face.scale.set(0.8, 1, 1);
  for (let i = 0; i < 2; i++) { const r = mesh(g, new THREE.RingGeometry(0.1, 0.12, 24), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 }), 0, -0.1, 0.02); anims.push(t => { const k = (t * 0.4 + i / 2) % 1; r.scale.set(0.8 * (1 + k * 3), 1 + k * 3, 1); r.material.opacity = 0.5 * (1 - k); }); }
  mesh(g, new THREE.SphereGeometry(0.06, 8, 6), S.acc(0xffe08a), 0, 0.62, 0.03);
  lab.add('🪞 물빛 거울 · 10🪞', 0.4, 2.55, -2.78); }
// 🧸 그림자(거울) 곰 인형 — 바닥
{ const g = new THREE.Group(); g.position.set(-0.6, 0, 0.5); g.rotation.y = 0.4; scene.add(g);
  const F = V === '2' ? mat(0x5f9ac8) : S.soft(0x5f9ac8), L = V === '2' ? mat(0x2a4a7a) : S.soft(0x9ec8e8);
  mesh(g, new THREE.SphereGeometry(0.32, 12, 10), F, 0, 0.3, 0).scale.set(1, 0.95, 0.9);
  mesh(g, new THREE.SphereGeometry(0.25, 12, 10), F, 0, 0.72, 0.02);
  [-1, 1].forEach(s => { mesh(g, new THREE.SphereGeometry(0.09, 8, 6), F, s * 0.18, 0.93, 0); mesh(g, new THREE.SphereGeometry(0.1, 8, 6), F, s * 0.3, 0.32, 0.14).scale.set(1, 1.2, 1); mesh(g, new THREE.SphereGeometry(0.12, 8, 6), F, s * 0.17, 0.08, 0.2).scale.set(1, 0.7, 1.3); mesh(g, new THREE.SphereGeometry(0.035, 6, 4), glow(0xbff6ff, 2.2), s * 0.09, 0.76, 0.22); });
  mesh(g, new THREE.SphereGeometry(0.09, 8, 6), L, 0, 0.68, 0.22).scale.set(1.2, 0.8, 0.8);
  lab.add('🧸 거울 곰 인형 · 14🪞', -0.6, 1.25, 0.5); }
// 🏮 거울 등불 기둥 — 구석 스탠드
{ const x = -3.0, z = -0.4;
  mesh(scene, new THREE.CylinderGeometry(0.22, 0.28, 0.12, 10), S.base(0x7a5ad6), x, 0.06, z);
  mesh(scene, new THREE.CylinderGeometry(0.05, 0.06, 1.5, 8), S.base(0x7a5ad6), x, 0.8, z);
  mesh(scene, new THREE.OctahedronGeometry(0.22, 0), glow(V === '2' ? 0x9ef6d0 : 0x9ee8ff, 0.9), x, 1.75, z).scale.set(1, 1.4, 1);
  halo(scene, V === '2' ? 0x9ef6d0 : 0x9ee8ff, 1.2, x, 1.75, z, 0.5);
  const pl = new THREE.PointLight(V === '2' ? 0x9ef6d0 : 0x9ee8ff, 2.2, 3); pl.position.set(x, 1.7, z); scene.add(pl);
  lab.add('🏮 거울 등불 · 22🪞', x, 2.3, z); }
// 비교 기준: 출시된 🌙 달 램프(꿈 장식)
{ const m = buildDreamDecor('moonLamp'); if (m) { m.position.set(1.4, 0, 0.9); scene.add(m); lab.add('(비교) 🌙 달 램프', 1.4, 1.0, 0.9); } }

document.getElementById('title').innerHTML = `<b>${S.t}</b><span>${S.s}</span>`;
camera.position.set(portrait ? -0.4 : 0, portrait ? 10.5 : 7.2, portrait ? 10.5 : 6.4); camera.lookAt(portrait ? -0.5 : -0.3, 0.6, -0.8);
loop(renderer, scene, camera, anims, lab);
</script></body></html>
