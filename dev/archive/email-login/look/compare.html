<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>Email login mockups</title>
<style>
  body { margin: 0; padding: 28px; background: #1d2621; color: #e8efe9; font-family: -apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif; }
  h2 { margin: 34px 0 6px; font-size: 22px; } h2:first-child { margin-top: 0; }
  .desc { margin: 0 0 14px; font-size: 14px; color: #b9c8bd; }
  .row { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
  .cap { font-size: 12px; color: #9fb1a5; margin: 6px 0 0; text-align: center; }
  .frame { overflow: hidden; border-radius: 14px; border: 2px solid #3a4a40; position: relative; }
  .scene { position: absolute; top: 0; left: 0; transform-origin: 0 0;
    background: url(../../../../assets/social/title-source.jpg) center 88%/cover;
    display: grid; place-items: center; font-family: 'Segoe UI', system-ui, sans-serif; }
  .scene::before { content: ''; position: absolute; inset: 0;
    background: radial-gradient(120% 90% at 50% 40%, rgba(20,40,30,0) 40%, rgba(20,40,30,0.35) 100%); }
  .pc .scene { width: 1280px; height: 800px; transform: scale(.42); }
  .pc { width: 538px; height: 336px; }
  .ph .scene { width: 390px; height: 844px; transform: scale(.52); }
  .ph { width: 203px; height: 439px; }

  /* ── copied from index.html login card ── */
  .card { position: relative; text-align: center; padding: 40px 40px 34px; width: 380px; box-sizing: border-box;
    background: rgba(255,255,255,0.16); backdrop-filter: blur(16px) saturate(1.2);
    border: 1px solid rgba(255,255,255,0.35); border-radius: 28px;
    box-shadow: 0 20px 60px rgba(30,50,40,0.35); color: #fff; }
  .ph .card { padding: 32px 26px 28px; width: 350px; }
  .leaf { font-size: 40px; filter: drop-shadow(0 2px 8px rgba(0,0,0,.25)); }
  .card h1 { margin: 6px 0 2px; font-size: 40px; font-weight: 800; letter-spacing: -0.5px; text-shadow: 0 2px 16px rgba(0,0,0,.3); }
  .ph .card h1 { font-size: 34px; }
  .tagline { margin: 0 0 26px; font-size: 14px; color: rgba(255,255,255,0.85); letter-spacing: 2px; }
  .gbtn { display: inline-flex; align-items: center; gap: 10px; border: none; background: #fff; border-radius: 16px; padding: 13px 26px; font-size: 15px; font-weight: 700; color: #3a4a40; box-shadow: 0 8px 24px rgba(0,0,0,.2); font-family: inherit; }
  .gbtn .g { font-weight: 800; font-size: 19px; background: conic-gradient(from -45deg,#ea4335,#fbbc05,#34a853,#4285f4,#ea4335); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .guest { display: block; margin: 18px auto 0; background: none; border: none; color: rgba(255,255,255,0.85); font-size: 13px; text-decoration: underline; font-family: inherit; }
  .lang { margin-top: 14px; font-size: 13px; color: rgba(255,255,255,.85); text-decoration: underline; }

  /* ── new pieces ── */
  .ebtn { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 12px auto 0; width: max-content;
    border: 1px solid rgba(255,255,255,.7); background: rgba(255,255,255,.12); border-radius: 16px; padding: 12px 24px;
    font-size: 15px; font-weight: 700; color: #fff; font-family: inherit; }
  .step-title { font-size: 19px; font-weight: 800; margin: 4px 0 6px; text-shadow: 0 2px 10px rgba(0,0,0,.25); }
  .hint { word-break: keep-all; font-size: 13px; line-height: 1.5; color: rgba(255,255,255,.9); margin: 0 0 14px; }
  .field { display: block; width: 100%; box-sizing: border-box; border: 1px solid rgba(255,255,255,.55); background: rgba(255,255,255,.92);
    border-radius: 14px; padding: 12px 14px; font-size: 15px; color: #3a4a40; text-align: left; }
  .field.ph-txt { color: #8a978e; }
  .field.code { text-align: center; letter-spacing: 10px; font-size: 22px; font-weight: 800; padding: 10px 14px; }
  .primary { display: block; width: 100%; margin-top: 10px; border: none; background: #fff; border-radius: 14px; padding: 12px; font-size: 15px; font-weight: 800; color: #3a4a40; box-shadow: 0 8px 24px rgba(0,0,0,.2); font-family: inherit; }
  .link { display: inline-block; margin-top: 14px; font-size: 13px; color: rgba(255,255,255,.85); text-decoration: underline; }
  .links { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; font-size: 12px; }
  .links span { color: rgba(255,255,255,.85); text-decoration: underline; }
  .links span.dim { text-decoration: none; opacity: .75; }
  .or { display: flex; align-items: center; gap: 10px; margin: 16px 0 12px; font-size: 12px; color: rgba(255,255,255,.8); }
  .or::before, .or::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,.4); }
  .inline-row { display: flex; gap: 8px; }
  .inline-row .field { flex: 1; min-width: 0; }
  .inline-row .primary { width: auto; margin: 0; padding: 0 14px; white-space: nowrap; }
  .expand { margin-top: 12px; padding: 14px; border-radius: 18px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3); }
  .expand .hint { margin-bottom: 10px; }
</style></head><body>

<h2>A · 카드 전환</h2>
<p class="desc">첫 화면엔 버튼만 하나 늘고, 누르면 카드 내용이 이메일 단계로 통째로 바뀜. 첫 화면이 가장 깔끔하고 구조가 단순함.</p>
<div class="row" id="rowA"></div>

<h2>B · 카드 안에서 펼침</h2>
<p class="desc">누르면 구글 버튼 아래로 입력 영역이 펼쳐짐. 구글 버튼이 계속 보여서 되돌아가기 쉬움, 대신 카드가 길어짐.</p>
<div class="row" id="rowB"></div>

<h2>C · 바로 입력</h2>
<p class="desc">첫 화면에 '또는' 구분선 + 이메일 입력칸이 바로 있음. 탭 한 번 절약, 대신 첫 화면이 가장 복잡하고 구글 버튼 존재감이 줄어듦.</p>
<div class="row" id="rowC"></div>

<script>
const head = `<div class="leaf">🌿</div><h1>calm forest</h1><div class="tagline">a cozy little forest</div>`;
const G = `<button class="gbtn"><span class="g">G</span> Google로 시작하기</button>`;
const E = `<button class="ebtn">✉️ 이메일로 시작하기</button>`;
const tail = `<button class="guest">게스트로 둘러보기</button><div class="lang">🌐 English</div>`;
const emailStep = `
  <div class="step-title">이메일로 시작하기</div>
  <p class="hint">메일로 6자리 코드를 보내 드려요. 비밀번호는 필요 없어요.</p>
  <div class="field">forest@example.com</div>
  <button class="primary">코드 받기</button>`;
const codeStep = `
  <p class="hint"><b>forest@example.com</b> 로 코드를 보냈어요.<br>메일함에 없으면 스팸함도 확인해 주세요.</p>
  <div class="field code">4821··</div>
  <button class="primary">시작하기</button>
  <div class="links"><span>← 이메일 바꾸기</span><span class="dim">42초 후 다시 받을 수 있어요</span></div>`;
const inlineHint = `<p class="hint" style="margin:8px 0 0;font-size:12px">6자리 코드를 보내 드려요. 비밀번호는 필요 없어요.</p>`;

const V = {
  A: [
    ['시작', head + G + E + tail],
    ['이메일', head + emailStep + `<div class="link">← 다른 방법으로 시작하기</div>`],
    ['코드', head + `<div class="step-title">코드 입력</div>` + codeStep],
  ],
  B: [
    ['시작', head + G + E + tail],
    ['이메일', head + G + `<div class="expand"><p class="hint">메일로 6자리 코드를 보내 드려요. 비밀번호는 필요 없어요.</p><div class="field">forest@example.com</div><button class="primary">코드 받기</button></div>` + tail],
    ['코드', head + G + `<div class="expand">${codeStep}</div>` + tail],
  ],
  C: [
    ['시작', head + G + `<div class="or">또는 이메일로</div><div class="inline-row"><div class="field ph-txt">이메일 주소</div><button class="primary">코드 받기</button></div>` + inlineHint + tail],
    ['이메일', head + G + `<div class="or">또는 이메일로</div><div class="inline-row"><div class="field">forest@example.com</div><button class="primary">코드 받기</button></div>` + inlineHint + tail],
    ['코드', head + G + `<div class="or">또는 이메일로</div>` + codeStep + tail],
  ],
};

for (const [k, states] of Object.entries(V)) {
  const row = document.getElementById('row' + k);
  const pc = states[1];
  row.insertAdjacentHTML('beforeend',
    `<div><div class="frame pc"><div class="scene"><div class="card">${pc[1]}</div></div></div><p class="cap">PC · ${pc[0]} 단계</p></div>`);
  for (const [label, html] of states) {
    row.insertAdjacentHTML('beforeend',
      `<div><div class="frame ph"><div class="scene"><div class="card">${html}</div></div></div><p class="cap">모바일 · ${label}</p></div>`);
  }
}
</script>
</body></html>
