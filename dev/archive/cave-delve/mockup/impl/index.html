<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cave Delve Implementation Captures</title>
<style>
  :root { --bg: #f4efe6; --ink: #2b2118; --muted: #6b5b4a; --line: #e2d6c4; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif; }
  header { padding: 16px 20px 6px; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  header p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
  .row { display: grid; grid-template-columns: 2.4fr 1fr 1fr; gap: 12px; align-items: start; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  .row h2 { grid-column: 1 / -1; margin: 0; font-size: 16px; }
  .row h2 small { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
  img { width: 100%; display: block; border-radius: 10px; border: 1px solid var(--line); }
  @media (max-width: 760px) { .row { grid-template-columns: 1fr; padding: 12px 16px; } header { padding: 14px 16px 6px; } }
</style>
</head>
<body>
<header>
  <h1>Cave delve · 실제 구현 장면</h1>
  <p>PC 1280×800 · 폰 375×812 · 폰 320×640 · 오프라인 게스트 · measurements in results.json</p>
</header>
<div id="rows"></div>
<script>
const S = [
  ['s1-floor0-miner', '0층 광부 아저씨 · 퀘스트 카드', '⛏️ 광부 아저씨'],
  ['s1b-floor0-lift', '0층 승강기', '🛗 승강기 타기'],
  ['s2-floor1-arrival', '1층 도착 · 방해꾼 · 조각 도둑 배너', '🪜 올라가기'],
  ['s3-floor1-ladder', '1층 내려가는 곳 드러남(반대편)', '🪜 내려가기'],
  ['s4-axolotl-tap', '4층 도롱뇽', '❗ 톡 치기'],
  ['s4b-crab-bait', '4층 수정집게', '🍄 미끼 던지기'],
  ['s5-floor12-bat', '12층 박쥐 · 조각 노란 원', '배너 잎귀박쥐'],
  ['s6-floor10-chest', '10층 상자', '🧰 상자 열기'],
];
document.getElementById('rows').innerHTML = S.map(([id, t, sub]) =>
  `<div class="row"><h2>${t}<small>${sub}</small></h2><img src="pc-${id}.png" alt=""><img src="phone375-${id}.png" alt=""><img src="phone320-${id}.png" alt=""></div>`).join('');
</script>
</body>
</html>
